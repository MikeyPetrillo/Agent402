name = "agent402-status-probe"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Every 5 minutes. The /status staleness threshold for these components is 45
# minutes, so this tolerates eight consecutive misses before the page reports
# "unknown" — and unlike the GitHub schedule, Cloudflare actually honours it.
[triggers]
crons = ["*/5 * * * *"]

[vars]
PROD = "https://agent402.tools"

# Worker secrets (set with `wrangler secret put <NAME>`, never as plain vars):
#   STATUS_PROBE_TOKEN   - presented to POST /api/status/probe; must match the
#                          server's STATUS_PROBE_TOKEN.
#   GITHUB_ISSUES_TOKEN  - optional; lets the cron open and close status issues.
#                          Use a fine-grained token scoped to this repository
#                          with Issues: Read and write only.
# Without GITHUB_ISSUES_TOKEN the issue alarms are a no-op.
