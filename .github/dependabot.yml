# Dependabot (audit N-02) — configured for SIGNAL, not noise. The point is to
# surface a genuine security update, not to churn cosmetic version bumps. So:
# everything is GROUPED into at most a couple of PRs, the payment libraries and
# known-incompatible packages are IGNORED (they're bumped deliberately, never
# auto), and open-PR limits are low.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # A version update proposes only releases at least 7 days old (#1823
    # carried releases published hours earlier, one on the signing path).
    # Security updates are not delayed by a cooldown.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      # One PR for all safe (minor+patch) npm updates instead of one per package.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Payment libraries — the settlement path is audit-locked to a coordinated
      # @x402 version set. NEVER auto-bump these; adopt a new line deliberately
      # (express+core+evm+fetch+svm+stellar+avm together) with a paid-canary run.
      - dependency-name: "@x402/*"
      # @solana-program/token and compute-budget are imported by our Solana buyer
      # but their versions are dictated by @x402/svm (^0.9.0 / ^0.11.0) and by
      # the @solana/kit line they compile against. Declared 2026-09-04 so a tree
      # change cannot drop them; the first grouped PR after that (#1218) bumped
      # them to 0.16 / 0.18 and npm install died on ERESOLVE against
      # @solana/kit 5. They move with the @x402 set, never on their own. No
      # update-types qualifier on purpose: for 0.x packages Dependabot reads the
      # middle digit as minor, so a "semver-major" ignore would never match
      # (the @zxing note below).
      # ox is pinned to the exact version mppx declares (scripts/
      # test-ox-single-copy.js reads it from the lockfile): our Tempo sender
      # imports it directly and must agree with the copy mppx signs with. It
      # moves only when an mppx release declares a new ox, never on its own
      # (#1561 proposed 1.8 and failed two lanes). Not every mppx release does:
      # 0.13.6 through 0.17.0 all declare 0.14.45.
      - dependency-name: "ox"
      - dependency-name: "@solana-program/*"
      # @solana/kit itself: the root pins kit 8 and overrides the program
      # packages @x402/svm nests to their kit-8-peered releases
      # (scripts/test-solana-kit-deps.js), so a kit major moves with the @x402
      # set and those overrides, deliberately, with a paid-canary run; a weekly
      # red PR proves nothing.
      - dependency-name: "@solana/kit"
        update-types: ["version-update:semver-major"]
      # better-sqlite3 major: native module, and REFUSED TWICE by the real image.
      # 13.0.1 (2026-07-24) and 13.0.3 (2026-09-18) each broke the Railway build
      # the same way: inside node:22-slim `npm ci --omit=dev` runs `node-gyp
      # rebuild` in node_modules/better-sqlite3 and the image has no Python, so
      # the build dies in about 30 seconds. 13.0.3 declares `"gypfile": false`
      # and ships linux-x64 among its prebuilds, and a local `npm ci` on the same
      # npm (10.9.8) builds nothing at all - so whatever makes the image decide to
      # compile is NOT visible from a local install, which is exactly why
      # docker-build-check.yml exists. Do not take a 13.x again until that
      # dispatch is green on a branch.
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      # tesseract.js major: v6+ REMOVED top-level `data.lines` and moved lines
      # inside `blocks`, which are off by default. src/tools/ocr-kit.js calls
      # worker.recognize(buf) and reads data.lines, so on v7 the image-ocr tool
      # still returns correct `text` and `confidence` but `lineCount: 0` and
      # `lines: []` — silently dropping the per-line bounding boxes its own
      # description advertises (measured 2026-07-25: v5.1.1 = 8 lines with
      # bboxes, v7.0.0 = 0, same image). CI CANNOT CATCH THIS: the full suite
      # passes 210/0 under v7 and the shape check reports "all clean", because
      # it verifies documented keys are PRESENT and `lines` is present, just
      # empty. A green Dependabot PR is not evidence here.
      # To adopt v7 deliberately: recognize(buf, {}, { blocks: true }), then
      # data.blocks.flatMap(b => b.paragraphs || []).flatMap(p => p.lines || []),
      # and .trim() each line (v7 adds a trailing newline v5 did not). Ship it
      # with a regression test asserting lineCount > 0 and a real bbox.
      # 5.x is NOT 0.x, so the semver-major qualifier matches correctly here and
      # still lets 5.x patches through (unlike the @zxing case below).
      - dependency-name: "tesseract.js"
        update-types: ["version-update:semver-major"]
      # @zxing/library >=0.23 declares engines node >=24 (the deploy image is
      # node:22-slim) and ships CJS only, which broke the named ESM imports in
      # barcode-kit until they moved to the default export. Revisit after a Node
      # upgrade. NOTE: no update-types qualifier on purpose — for a 0.x package
      # Dependabot reads the MIDDLE digit as minor, so 0.21 -> 0.23 is a
      # semver-MINOR update and a "semver-major" ignore silently never matches.
      # That is exactly how 0.23 landed in the grouped minor/patch PR (#531) and
      # failed it.
      - dependency-name: "@zxing/library"
      # undici major: src/tools/fetch-guard.js hands an undici Agent to Node's
      # built-in fetch as its dispatcher, and Node 22's fetch (bundled undici
      # 6.x) refuses an undici 8 Agent with UND_ERR_INVALID_ARG (checked
      # 2026-11-01 for #1824), so every guarded fetch would fail. It moves with
      # a Node upgrade; scripts/test-undici-dispatcher.js is the check.
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]
      # mppx is the MPP wire (Tempo and Stripe charges). Each minor moves
      # deliberately, with the MPP paid suites and a paid-canary run, and ox
      # above moves in the same change only when the new mppx declares another
      # ox. A version range, not update-types: for a 0.x package the middle
      # digit is read as minor (0.13 -> 0.16 arrived in the grouped minor/patch
      # PR #1823). Ignore rules also apply to security PRs, so only the next
      # lines are held and a 0.17.x patch still comes in.
      - dependency-name: "mppx"
        versions: [">=0.18.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # One PR for all GitHub Actions updates.
      github-actions:
        patterns:
          - "*"
