name: Burner recover (ALGO -> revenue wallet)

# One-off / occasional: sweep ALGO off the CI Algorand burner back to OUR
# revenue wallet. The destination is HARDCODED in scripts/burner-recover.js
# (the revenue payTo, C7II...2XIE) — it is NOT an input here, so a dispatched
# run can only ever move funds TO us. The only input is the ALGO amount.
# USDC on the burner is left untouched; the account keeps its min balance.
on:
  workflow_dispatch:
    inputs:
      amount:
        description: "ALGO to sweep to the revenue wallet (max 700; account keeps 0.3 for min-balance + fees)"
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  recover:
    # Money moves out of a spending wallet on dispatch: the `spending` GitHub
    # environment requires the operator's approval click before this job runs
    # (write access alone used to be enough). Scheduled canaries stay ungated.
    environment: spending
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install algosdk
        run: npm ci --ignore-scripts
      - name: Sweep ALGO to the revenue wallet
        env:
          ALGORAND_BURNER_MNEMONIC: ${{ secrets.ALGORAND_BURNER_MNEMONIC }}
          RECOVER_AMOUNT: ${{ inputs.amount }}
        run: |
          [ -n "$ALGORAND_BURNER_MNEMONIC" ] && echo "::add-mask::$ALGORAND_BURNER_MNEMONIC"
          node scripts/burner-recover.js "$RECOVER_AMOUNT"
