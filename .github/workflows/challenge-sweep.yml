name: Challenge sweep (register tools on Algorand)

# x402 Global Challenge: buy each of our tools once on Algorand mainnet so every
# endpoint appears as a resource in the GoPlausible Bazaar catalog. Self-buys
# (burner -> our revenue payTo), idempotent (skips already-registered), hard
# spend cap. See scripts/challenge-sweep.js. Costs recycle to us; the only true
# cost is per-tool upstream spend (a few dollars).
on:
  workflow_dispatch:
    inputs:
      max_usd:
        description: "Hard total-spend cap in USDC (aborts before exceeding)"
        required: false
        default: "25"
      dry:
        description: "Set to 'true' to preview (report only, no payments)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARGET_URL: https://agent402.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install x402 client
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/core@2.22.0 @x402/avm@2.22.0
      - name: Run the sweep
        env:
          ALGORAND_BURNER_MNEMONIC: ${{ secrets.ALGORAND_BURNER_MNEMONIC }}
          SWEEP_MAX_USD: ${{ inputs.max_usd }}
          SWEEP_DRY: ${{ inputs.dry == 'true' && '1' || '0' }}
        run: |
          [ -n "$ALGORAND_BURNER_MNEMONIC" ] && echo "::add-mask::$ALGORAND_BURNER_MNEMONIC"
          node scripts/challenge-sweep.js --out sweep-report.json --max-usd "$SWEEP_MAX_USD"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sweep-report
          path: sweep-report.json
          if-no-files-found: ignore
