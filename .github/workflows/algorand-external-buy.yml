name: Algorand external buy

# Spend a capped amount of real USDC buying from OTHER sellers on the Algorand
# x402 rail, discovered through the GoPlausible facilitator catalog. Makes us a
# buyer on the rail rather than only a seller. See
# scripts/algorand-external-buy.js.
#
# THIS MONEY DOES NOT COME BACK. Unlike the canaries (self-buys that recycle to
# our own payTo), these payments go to third parties with no refund path. That
# is why this is dispatch-only, defaults to a $1 cap, and defaults to a dry run:
# you have to consciously ask for the spend.
on:
  workflow_dispatch:
    inputs:
      max_usd:
        description: "Hard total-spend cap in USDC (never exceeded)"
        required: false
        default: "1.00"
      per_buy_usd:
        description: "Per-buy cap in USDC"
        required: false
        default: "0.10"
      dry:
        description: "Preview the buy plan without paying (default true — set to 'false' to spend)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  buy:
    # Money moves out of a spending wallet on dispatch: the `spending` GitHub
    # environment requires the operator's approval click before this job runs
    # (write access alone used to be enough). Scheduled canaries stay ungated.
    environment: spending
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_URL: https://agent402.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install x402 client
        # No wallet secrets are in scope for this step (audit R-07), and
        # --ignore-scripts blocks dependency lifecycle scripts entirely.
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/core@2.22.0 @x402/avm@2.22.0

      - name: Buy from external Algorand sellers
        # Wallet secret scoped to THIS step only (audit R-07).
        env:
          ALGORAND_BURNER_MNEMONIC: ${{ secrets.ALGORAND_BURNER_MNEMONIC }}
          EXT_MAX_USD: ${{ inputs.max_usd || '1.00' }}
          EXT_PER_BUY_USD: ${{ inputs.per_buy_usd || '0.10' }}
          EXT_DRY: ${{ inputs.dry != 'false' && '1' || '0' }}
        run: |
          if [ "$EXT_DRY" != "1" ] && [ -z "$ALGORAND_BURNER_MNEMONIC" ]; then
            echo "No ALGORAND_BURNER_MNEMONIC secret — cannot pay external sellers."; exit 1
          fi
          [ -n "$ALGORAND_BURNER_MNEMONIC" ] && echo "::add-mask::$ALGORAND_BURNER_MNEMONIC"
          node scripts/algorand-external-buy.js --out external-buys.json --max-usd "$EXT_MAX_USD"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algorand-external-buys
          path: external-buys.json
          if-no-files-found: ignore
