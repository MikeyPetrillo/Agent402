name: Announce

# Post a release note to X via scripts/tweet.js — reconciled superset of the
# dev-branch (generic media) and main (live card + replace) flows.
#
# Media, three mutually exclusive ways:
#   media    — an image to attach: a URL (e.g. a live /tools/<slug>/card.png,
#              fetched with curl) or a repo path. tweet.js uploads it via the
#              v1.1 media endpoint.
#   card     — a demo card rendered LIVE at post time: 'bestsellers' buys one
#              /api/bestsellers response with the canary burner (x402,
#              internal-marked via POW_SECRET) and renders the terminal-style
#              card from it; 'robinhood' renders the Robinhood Chain
#              marketplace card from the free /api/revenue rail (no buy);
#              'proof' renders the metered-tier receipt card from the free
#              /api/proof feed (latest external settlement, else our own
#              canary row labelled as such) - the weekly proof post.
#              Real numbers only, never a fixture.
#   (neither) — text-only post.
#
# text — inline tweet copy for dispatch-only posting: no announcement file,
# no commit. Mutually exclusive with file. Rides an env var (never shell
# interpolation) so arbitrary copy can't break or inject into the run step.
#
# quote — optional id of a post to quote-tweet (passed through as
# tweet.js --quote). Dispatch-only; the push trigger posts text-only.
#
# delete_id — optional id of a previous post to delete BEFORE posting (the
# replace-a-bad-post flow); deleting an already-gone id is a no-op. The delete
# runs only after any card/media is ready, so a failed render can never leave
# no post at all.
#
# Push trigger (.github/trigger-announce): line 1 is the repo path of the
# announcement text, an optional line 2 is a media URL/repo path — bump the
# file to announce on push from the dev branch. Credentials are Actions
# secrets (X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_SECRET); the
# script exits 1 without posting if any are missing, and enforces the
# 280-char limit itself.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Repo path of the announcement text file (or pass text instead)"
        required: false
        default: ""
      text:
        description: "Inline tweet text - mutually exclusive with file; posts without any repo commit"
        required: false
        default: ""
      media:
        description: "Optional image to attach (URL or repo path). Mutually exclusive with card."
        required: false
        default: ""
      card:
        description: "Optional demo card to render live and attach: 'bestsellers', 'robinhood' or 'proof'. Mutually exclusive with media."
        required: false
        default: ""
      delete_id:
        description: "Optional id of a previous post to delete BEFORE posting (replace-a-bad-post flow)."
        required: false
        default: ""
      quote:
        description: "Optional id of a post to quote (tweet.js --quote). Free-tier X API only allows quoting your own or mentioning posts; otherwise embed the post URL in the text and pass force."
        required: false
        default: ""
      reply_to:
        description: "Optional id of a post to reply to (tweet.js --reply-to) - threads the new post under it. Own posts only on the free tier."
        required: false
        default: ""
      force:
        description: "Pass tweet.js --force to skip the local 280-char guard (raw length overcounts URLs, which X weights at 23 chars)."
        required: false
        default: ""
  push:
    branches: ["claude/sweet-brown-i99jl3"]
    paths: [".github/trigger-announce"]

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Refuse ambiguous media (card AND media both set)
        if: github.event.inputs.card != '' && github.event.inputs.media != ''
        run: |
          echo "Pass card OR media, not both — card renders its own image live."
          exit 1
      # Card path only (dispatch input card=bestsellers): the REAL-numbers
      # doctrine — the attached card renders from a live paid response, never
      # from fixture data. The buy is marked internal via POW_SECRET so an
      # operational render never records as external demand in the very
      # ledger it pictures. Text-only and media-path posts (and every
      # push-triggered post) skip all of this — tweet.js is dependency-free.
      - name: Set up node deps for the card render
        if: github.event.inputs.card != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install deps + Chromium (card render)
        if: github.event.inputs.card != ''
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Buy the live bestsellers response (internal-marked)
        if: github.event.inputs.card == 'bestsellers'
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
        run: node scripts/capture-bestsellers.js --out /tmp/bestsellers.json
      - name: Render the demo card from the live response
        if: github.event.inputs.card == 'bestsellers'
        run: node scripts/bestsellers-card.js --from /tmp/bestsellers.json --out /tmp/announce-card.png
      # card=robinhood: same REAL-numbers doctrine, cheaper capture — the
      # /api/revenue endpoint is free and unpaywalled, so the card renders
      # straight from the live rail with no burner buy.
      - name: Render the Robinhood marketplace card from live /api/revenue
        if: github.event.inputs.card == 'robinhood'
        run: |
          curl -fsSL --max-time 30 https://agent402.tools/api/revenue -o /tmp/revenue.json
          node scripts/robinhood-card.js --from /tmp/revenue.json --out /tmp/announce-card.png
      # card=proof: the weekly receipt. /api/proof is free and unpaywalled;
      # the card picks the latest external settlement and falls back to the
      # canary's, labelled as ours on the card itself.
      - name: Render the proof receipt card from live /api/proof
        if: github.event.inputs.card == 'proof'
        run: |
          curl -fsSL --max-time 30 https://agent402.tools/api/proof -o /tmp/proof.json
          node scripts/proof-card.js --from /tmp/proof.json --out /tmp/announce-card.png
      - name: Delete the previous post (replace flow)
        if: github.event.inputs.delete_id != ''
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # Dispatch inputs ride env vars, never shell interpolation (N-03):
          # a crafted id must never reach the shell as source while X
          # credentials are in this step's env.
          DELETE_ID: ${{ github.event.inputs.delete_id }}
        run: node scripts/tweet.js --delete "$DELETE_ID"
      - name: Post the announcement
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # Every dispatch input rides an env var, not shell interpolation
          # (N-03) — quotes, backticks, and $(...) in any input must never
          # reach the script as source while X credentials are in env.
          ANNOUNCE_TEXT: ${{ github.event.inputs.text }}
          IN_FILE: ${{ github.event.inputs.file }}
          IN_MEDIA: ${{ github.event.inputs.media }}
          IN_QUOTE: ${{ github.event.inputs.quote }}
          IN_REPLY_TO: ${{ github.event.inputs.reply_to }}
          IN_FORCE: ${{ github.event.inputs.force }}
        run: |
          FILE="$IN_FILE"
          MEDIA="$IN_MEDIA"
          if [ -n "$ANNOUNCE_TEXT" ]; then
            [ -n "$FILE" ] && { echo "Pass text OR file, not both."; exit 1; }
            printf '%s' "$ANNOUNCE_TEXT" > /tmp/announce-text.txt
            FILE=/tmp/announce-text.txt
          fi
          if [ -z "$FILE" ]; then
            # The trigger-announce fallback is for the PUSH path only. A bare
            # dispatch (neither text nor file) must refuse, not silently
            # repost whatever stale announcement the trigger file points at.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Dispatch needs text or file."; exit 1
            fi
            FILE=$(sed -n 1p .github/trigger-announce)
            MEDIA=$(sed -n 2p .github/trigger-announce)
          fi
          # A live-rendered card wins the media slot (mutual exclusion with a
          # user-supplied media input is enforced above).
          [ -f /tmp/announce-card.png ] && MEDIA=/tmp/announce-card.png
          echo "Posting: $FILE${MEDIA:+ (media: $MEDIA)}"
          [ -f "$FILE" ] || { echo "announcement file not found: $FILE"; exit 1; }
          ARGS=(--file "$FILE")
          [ -n "$IN_QUOTE" ] && ARGS+=(--quote "$IN_QUOTE")
          [ -n "$IN_REPLY_TO" ] && ARGS+=(--reply-to "$IN_REPLY_TO")
          [ -n "$IN_FORCE" ] && ARGS+=(--force)
          if [ -n "$MEDIA" ]; then
            case "$MEDIA" in
              http*) curl -fsSL --max-time 30 -o /tmp/announce-media.png "$MEDIA" && MEDIA=/tmp/announce-media.png ;;
            esac
            [ -f "$MEDIA" ] || { echo "media not found: $MEDIA"; exit 1; }
            ARGS+=(--media "$MEDIA")
          fi
          node scripts/tweet.js "${ARGS[@]}"
