name: External seller probe (one paid call)

# Pays ONE outside x402 seller endpoint once with the CI burner and prints the
# status, the settle receipt and the body, so a kit that relays a seller's
# response is written from a real one, not from its OpenAPI. Bounded by
# `max_usd` (refused before signing when the seller's live quote is above it).
# Dispatch-only, in the `spending` environment (operator approval per run).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Seller endpoint (https)"
        required: true
      method:
        description: "HTTP method"
        default: "POST"
        required: false
      body:
        description: "JSON body (POST)"
        default: ""
        required: false
      headers:
        description: "Extra request headers as a JSON object (seller-side keys; never the payment header)"
        default: ""
        required: false
      max_usd:
        description: "Refuse to pay above this quote (USD)"
        default: "0.01"
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: spending
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the PINNED proof tree (x402 client + viem)
        run: |
          mkdir -p /tmp/probe && cp "$GITHUB_WORKSPACE"/scripts/agentkit-live/package.json "$GITHUB_WORKSPACE"/scripts/agentkit-live/package-lock.json /tmp/probe/
          cp "$GITHUB_WORKSPACE"/scripts/external-seller-probe.js /tmp/probe/
          cd /tmp/probe && npm ci --ignore-scripts --no-audit --no-fund
      - name: Pay the seller once and print what came back
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          PROBE_URL: ${{ inputs.url }}
          PROBE_METHOD: ${{ inputs.method }}
          PROBE_BODY: ${{ inputs.body }}
          PROBE_HEADERS: ${{ inputs.headers }}
          PROBE_MAX_USD: ${{ inputs.max_usd }}
        run: |
          [ -n "$BURNER_KEY" ] || { echo "::error::BURNER_KEY secret missing"; exit 1; }
          echo "::add-mask::$BURNER_KEY"
          cd /tmp/probe && env -i PATH="$PATH" HOME="$HOME" BURNER_KEY="$BURNER_KEY" PROBE_URL="$PROBE_URL" PROBE_METHOD="$PROBE_METHOD" PROBE_BODY="$PROBE_BODY" PROBE_HEADERS="$PROBE_HEADERS" PROBE_MAX_USD="$PROBE_MAX_USD" node external-seller-probe.js
