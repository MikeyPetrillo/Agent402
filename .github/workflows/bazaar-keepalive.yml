# Keep every catalog route listed in the settlement-driven indexes.
#
# Routes have been observed to leave the Bazaar listing after about 30 days
# without a settlement. That is not a registration failure, and it explains
# what looked all night like a broken harvester: our oldest surviving listing
# was dated about 30 days back, and 405 of 573 routes had dropped out because
# nothing had paid them inside that window. The purpose of this workflow is to
# keep routes listed. Fewer listings means less
# discovery, which means fewer buyers, which means fewer settlements - the loop
# tightens on itself.
#
# scripts/refresh-bazaar.js already had the remedy (MODE=sweep, "pay one tiny
# settlement against every cheap route so settlement-driven indexes observe
# them"). It was wired to workflow_dispatch only and had never run on a
# schedule. This is that schedule; the script is unchanged.
#
# WEEKLY, not monthly, against the observed 30-day window: four missed runs in
# a row still leave the listings alive, so a broken week drops nothing.
#
# The CI burner pays OUR payTo, so most of the money is circular. The price
# ceiling is a proxy for upstream cost, not an exclusion: some swept routes
# bill a third party per call, which is why this runs weekly rather than daily.
# The ceiling is $0.10 a route: a fixed-price route up to that price has no
# other scheduled buyer, and at the earlier $0.05 one priced above it reached
# the observed 30-day window with only hand-run passes between. Routes above the
# ceiling (report products, premium tiers) are not bought here: their own
# pass runs twice a month (bazaar-keepalive-tail.yml). The per-batch spend cap is $2: a batch refuses to
# start when its estimate is over the cap, and with every selected route due
# at once a batch at this ceiling comes to a little over $1.
name: Bazaar keep-alive

on:
  schedule:
    # TUESDAY 04:17 UTC, and only the PRICED routes the daily pass does not
    # already cover (SKIP_UPSTREAM_FREE); re-buying those here would add
    # facilitator settlements for nothing.
    # GitHub throttles schedules on a busy repo (measured 2026-08-30: a
    # 15-minute cron delivered one run in 9.8 hours), which is exactly why the
    # cadence keeps 4x headroom against the observed 30-day window.
    - cron: "17 4 * * 2"
    # DAILY, zero-upstream only. The weekly pass above is bounded by PRICE,
    # which is only a proxy for upstream cost. This one is bounded by that
    # actual question (UPSTREAM_FREE_ONLY): routes that call no third party,
    # so it can run every day and keeps most of the catalog inside the window.
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      max_price_usd:
        description: "Per-route price ceiling."
        default: "0.10"
      batches:
        description: "Split the pass into N batches so no single run times out."
        default: "4"
      upstream_free_only:
        description: "1 = only routes that call no third party. The daily schedule sets this."
        default: ""
      skip_upstream_free:
        description: "1 = skip what the daily pass already covers. The Tuesday schedule sets this."
        default: ""
      min_price_usd:
        description: "Price FLOOR. Set it with a high max_price_usd to sweep only the expensive tail."
        default: "0"
      stale_days:
        description: "Only pay for listings older than N days (any settlement resets the clock, ours or a buyer's). Schedules use 14. 0 = sweep everything selected."
        default: "14"
      slugs:
        description: "Only these slugs, comma-separated, matched exactly (slug_prefix also buys every slug that starts with it)."
        default: ""
      slug_prefix:
        description: "Only slugs starting with this (e.g. 'skill-' for the skill packs)."
        default: ""
      max_spend_usd:
        description: "PER-BATCH spend cap."
        default: "2"

permissions:
  contents: read
  issues: write

concurrency:
  group: bazaar-keepalive
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # Sequential: the batches share one burner wallet, and concurrent buys
      # from one address race their own nonces.
      max-parallel: 1
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the x402 client
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/fetch@2.32.0 @x402/core@2.32.0 @x402/evm@2.32.0 viem@2.52.2
      - name: Refresh settlements
        env:
          TARGET_URL: https://agent402.tools
          MODE: sweep
          PAY_NETWORK: base
          MAX_PRICE_USD: ${{ inputs.max_price_usd || '0.10' }}
          # The daily cron sweeps only what costs nothing upstream; the weekly
          # one leaves this empty and sweeps everything under the ceiling.
          UPSTREAM_FREE_ONLY: ${{ github.event.schedule == '37 5 * * *' && '1' || inputs.upstream_free_only }}
          SKIP_UPSTREAM_FREE: ${{ github.event.schedule == '17 4 * * 2' && '1' || inputs.skip_upstream_free }}
          MIN_PRICE_USD: ${{ inputs.min_price_usd || '0' }}
          SLUG_PREFIX: ${{ inputs.slug_prefix }}
          # 14 days against the observed 30-day window: a weekly pass reaches
          # a listing at 14 to 21 days and again a week later if that buy
          # fails, and a route a customer is actually buying costs us nothing
          # to keep listed.
          STALE_DAYS: ${{ inputs.stale_days || '14' }}
          SLUGS: ${{ inputs.slugs }}
          # PER BATCH, not per pass: the estimate is checked inside each batch,
          # so a 4-batch tail pass needs roughly a quarter of its total here.
          MAX_SPEND_USD: ${{ inputs.max_spend_usd || '2' }}
          BATCH_COUNT: ${{ inputs.batches || '4' }}
          BATCH_INDEX: ${{ matrix.batch }}
          # The matrix above has this many jobs; more batches would leave routes unbought.
          BATCH_MATRIX_SIZE: "4"
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          # Signs X-Heartbeat-Token so these self-buys are booked as ours.
          POW_SECRET: ${{ secrets.POW_SECRET }}
        run: |
          [ -n "$BURNER_KEY" ] || { echo "::error::BURNER_KEY is not set - the keep-alive cannot pay, and listings may leave the Bazaar after about 30 days"; exit 1; }
          [ -n "$POW_SECRET" ] && echo "::add-mask::$POW_SECRET"
          echo "::add-mask::$BURNER_KEY"
          node scripts/refresh-bazaar.js

  report:
    needs: sweep
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # An open issue this check filed under a previous title gets the current
      # one, so the lookups below find it (scripts/adopt-issue-titles.js).
      - name: Adopt an open issue filed under a previous title
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/adopt-issue-titles.js

      - name: Count our listings, and page if the sweep failed
        env:
          GH_TOKEN: ${{ github.token }}
          SWEEP: ${{ needs.sweep.result }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          LISTED=$(node -e "
            (async () => {
              let n=0, offset=0;
              for (let p=0;p<20;p++){
                const r=await fetch(\`https://api.cdp.coinbase.com/platform/v2/x402/discovery/resources?limit=1000&offset=\${offset}\`).catch(()=>null);
                if(!r||!r.ok) break; const d=await r.json(); const items=d.items||d.resources||[]; if(!items.length) break;
                n+=items.filter(i=>String(i.resource||'').includes('agent402.tools')).length;
                if(items.length<1000) break; offset+=items.length;
              }
              console.log(n);
            })()" 2>/dev/null || echo "?")
          echo "agent402.tools listings after the sweep: $LISTED"
          TITLE="Scheduled check needs review: listing-keep-alive"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$SWEEP" != "success" ]; then
            if [ -z "$OPEN" ]; then
              node scripts/check-issue.js --title "$TITLE" --trust-owner
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
