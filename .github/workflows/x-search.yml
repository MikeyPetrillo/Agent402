name: X Search

# Read-only search of X (Twitter) via GET /2/tweets/search/recent, signed with
# the same OAuth 1.0a Actions secrets tweet.js posts with. Posts nothing,
# deletes nothing - pure read, dispatch-only (never runs on a push).
on:
  workflow_dispatch:
    inputs:
      query:
        description: "X search query (supports operators, e.g. -is:retweet)"
        required: true
      max:
        description: "Max results (10-100)"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Search X (no post)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          QUERY: ${{ inputs.query }}
          MAX: ${{ inputs.max }}
        run: node scripts/x-search.js --query "$QUERY" --max "$MAX"
