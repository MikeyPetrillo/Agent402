name: Paid render smoke test

# Owner-approved, manually-dispatched: buy ONE /api/render from production with
# real USDC on Base to prove Chromium launches and renders under the current
# image (the end-to-end check the R-06/Phase-1 Dockerfile changes can't confirm
# without a paid call). Cost ~$0.02. Marked internal traffic (X-Heartbeat-Token)
# so it doesn't pollute the sales ledger. Not scheduled — dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Non-secret config at job scope; the wallet/pow secrets live on the buy step
    # only (audit R-07).
    env:
      TARGET_URL: https://agent402.tools
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Install x402 client (EVM only)
        # No secrets in scope here; --ignore-scripts blocks dependency lifecycle
        # scripts. Pinned to the server's protocol version + the repo lock (R-07).
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/fetch@2.16.0 @x402/core@2.16.0 @x402/evm@2.16.0 viem@2.52.2
      - name: Buy one render from production (real USDC)
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
        run: |
          if [ -z "$BURNER_KEY" ]; then echo "No BURNER_KEY secret — cannot run the paid smoke test"; exit 1; fi
          echo "::add-mask::$BURNER_KEY"
          node scripts/smoke-render.js
