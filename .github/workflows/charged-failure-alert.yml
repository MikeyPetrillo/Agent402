name: Charged-failure alert

# The "an agent paid and got an error" alarm — the earnings-calendar failure class,
# but for EVERY paid tool, using data the server already records.
#
# When a tool settles USDC on-chain and the handler then returns non-200, the
# server records it in /api/stats -> chargedFailures[] (the code calls this "an
# operational red alert"). Nothing consumed it. This polls that surface every
# 30 min and opens a GitHub issue if any tool charged-and-failed a paying agent
# in the recent window. It complements the synthetic self-check (which only covers
# a curated set): this catches real paid failures on ANY of the ~1,400 tools,
# with zero config — /api/stats is free and public.
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - "main"
      - "claude/sweet-brown-i99jl3"
    paths:
      - ".github/trigger-charged-alert"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

env:
  PROD: https://agent402.tools
  WINDOW_HOURS: "2"

jobs:
  charged-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
    steps:
      - name: Poll the operator stats for charged failures
        id: check
        run: |
          # The itemised charged-failure log lives on the OPERATOR endpoint, not
          # public /api/stats (which only carries the lifetime counter). This
          # polled /api/stats for `.chargedFailures` for months, never found the
          # field, and took the skip path below on EVERY run — so the alarm for
          # our worst failure mode reported green while doing nothing. Found and
          # fixed 2026-07-25.
          [ -n "$OP_TOKEN" ] || { echo "no AGENT402_OPERATOR_TOKEN — cannot read the charged-failure log"; exit 1; }
          # Say WHY on the skip path. The original version printed a bare
          # "unreadable" and moved on, which is precisely how a permanently
          # broken alarm passed for months without anyone noticing.
          CODE="$(curl -s --max-time 30 -o /tmp/opstats.json -w '%{http_code}' \
            -H "X-Operator-Token: $OP_TOKEN" "$PROD/__operator/stats" || echo 000)"
          echo "operator stats: HTTP $CODE, $(wc -c < /tmp/opstats.json) bytes, token length ${#OP_TOKEN}"
          if [ "$CODE" = "404" ]; then
            # /__operator/* answers 404 (never 401) to unauthenticated callers,
            # so a 404 here means the token is wrong, not that the route moved.
            echo "::error::operator token REJECTED (404). The AGENT402_OPERATOR_TOKEN secret does not match the value on Railway."
            echo "status=skip" >> "$GITHUB_OUTPUT"; exit 1
          fi
          RESP="$(cat /tmp/opstats.json)"
          # A genuine outage is heartbeat's job, not ours — skip rather than
          # false-alert. A MISSING field is not treated as unreadable: that is
          # what hid the breakage last time.
          echo "$RESP" | jq -e 'has("chargedFailures")' >/dev/null 2>&1 || { echo "operator stats unreadable (HTTP $CODE) — skip"; echo "status=skip" >> "$GITHUB_OUTPUT"; exit 0; }
          # The window starts where the previous run started (minus 10 min of
          # overlap), not a fixed WINDOW_HOURS back: GitHub delivers this
          # "every 30 min" schedule every 4-6 h in practice (measured
          # 2026-10-02), so a fixed 2 h window left most of each day unchecked.
          # Capped at 48 h; with no previous run it falls back to WINDOW_HOURS.
          PREV="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow charged-failure-alert.yml --limit 5 --json databaseId,createdAt \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0].createdAt // empty" 2>/dev/null || true)"
          CUTOFF="$(date -u -d "$WINDOW_HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          if [ -n "$PREV" ]; then
            FLOOR="$(date -u -d "48 hours ago" +%Y-%m-%dT%H:%M:%SZ)"
            P="$(date -u -d "$PREV" +%s 2>/dev/null || echo "")"
            C=""; [ -n "$P" ] && C="$(date -u -d "@$((P - 600))" +%Y-%m-%dT%H:%M:%SZ)"
            if [ -n "$C" ] && [[ "$C" < "$CUTOFF" ]]; then CUTOFF="$C"; fi
            if [[ "$CUTOFF" < "$FLOOR" ]]; then CUTOFF="$FLOOR"; fi
          fi
          echo "window starts $CUTOFF"
          # Charged failures in the window, summarized as "slug(httpStatus)xN".
          SUMMARY="$(echo "$RESP" | jq -r --arg cut "$CUTOFF" '
            [.chargedFailures[] | select(.at > $cut)]
            | group_by(.slug + ":" + (.status|tostring))
            | map("\(.[0].slug)(\(.[0].status))x\(length)")
            | join(", ")')"
          if [ -z "$SUMMARY" ]; then
            echo "no charged failures since $CUTOFF"
            echo "status=clear" >> "$GITHUB_OUTPUT"
          else
            echo "charged failures: $SUMMARY"
            echo "status=alert" >> "$GITHUB_OUTPUT"
            { echo "detail<<EOF"; echo "$SUMMARY"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi
          echo "cutoff=$CUTOFF" >> "$GITHUB_OUTPUT"
      - name: Open, comment, or close the alert issue
        if: steps.check.outputs.status != 'skip'
        run: |
          TITLE="Charged failure: a paid tool returned an error to a paying agent"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "${{ steps.check.outputs.status }}" = "alert" ]; then
            BODY="One or more paid tools settled USDC on-chain and then returned an error to the paying agent since ${{ steps.check.outputs.cutoff }} — **they paid and got nothing.**

          **Failing (slug(httpStatus)×count):** ${{ steps.check.outputs.detail }}

          This is the earnings-calendar failure class — a broken paid tool — caught for ALL ~1,400 tools (not just the self-check's curated set), from data the server already records at \`/api/stats\` -> \`chargedFailures[]\`.
          Live: $PROD/api/stats · Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still charging-and-failing at $(date -u +%FT%TZ): ${{ steps.check.outputs.detail }}"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            fi
            exit 1
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "No charged failures since ${{ steps.check.outputs.cutoff }} at $(date -u +%FT%TZ)."
          fi
