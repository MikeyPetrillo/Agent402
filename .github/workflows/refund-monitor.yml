# Refund ledger monitor — watches for the states that need a human.
#
# The refund executor is dispatch-only, so somebody is already watching when it
# RUNS. This watches the states that arise when nobody is:
#
#   * a row STUCK in `sending` — a send began and never resolved. The claim
#     happens BEFORE the broadcast, so the money may already be gone with no
#     recorded tx, and it will never retry by design.
#   * debts sitting OWED past the window — real buyers who paid and got nothing.
#
# Follows the heartbeat convention exactly: upserts ONE issue, closes it when
# the ledger is clean, never comment-spams. Reports COUNTS AND IDS ONLY, never
# wallet addresses — this issue is public, and a roster of who we owe is a
# customer list (the rule that retired the revenue digest).
#
# An UNREADABLE ledger (exit 2) is reported as its own failure, not as clean:
# "we found nothing" and "we could not look" produce the same output otherwise,
# which is how the charged-failure alarm sat dead for months.
name: Refund monitor

on:
  schedule:
    - cron: "17 */6 * * *" # every 6h, offset off the hour
  workflow_dispatch:

concurrency:
  group: refund-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the refund ledger
        id: check
        env:
          AGENT402_OPERATOR_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          set +e
          OUT=$(node scripts/refund-monitor.js 2>&1); CODE=$?
          echo "$OUT"
          # Random delimiter: OUT is scripted/program output today (confirmed
          # by reading scripts/refund-monitor.js), but a fixed "XEOF" is still
          # one refactor away from a literal-"XEOF"-line prematurely closing
          # this heredoc and letting the rest be parsed as forged
          # GITHUB_OUTPUT key=value pairs - the OP_TOKEN-scoped step is not
          # where that risk should live even at low probability.
          DELIM="XEOF_$(date +%s%N)_$RANDOM"
          {
            echo "code=$CODE"
            echo "body<<$DELIM"
            echo "$OUT"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # An open issue this check filed under a previous title gets the current
      # one, so the lookups below find it (scripts/adopt-issue-titles.js).
      - name: Adopt an open issue filed under a previous title
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/adopt-issue-titles.js

      - name: Open or close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.check.outputs.code }}
          DETAIL: ${{ steps.check.outputs.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Scheduled check needs review: refund-ledger"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')

          if [ "$CODE" = "0" ]; then
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            echo "clean"
            exit 0
          fi

          # Code 2 is a ledger that could not be read, which is not the same as clean;
          # any other code is rows that need a person. The detail (counts and ids,
          # never addresses) is in the check step's log.
          echo "refund ledger check: code $CODE"
          if [ -n "$OPEN" ]; then
            echo "already tracked in #$OPEN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
          fi
