name: ERC-8004 register

# Mint Agent402's identity in the ERC-8004 registry on Base, ONCE.
#
# Dispatch-only and DRY BY DEFAULT. This writes to a public registry under our
# own name and we cannot undo it - the token can be transferred, never unminted
# - so the default run signs nothing and only prints what it would do. The
# `spending` environment gate means a live run is an explicit human approval,
# which is the right ceremony for a permanent public record.
#
# WHO SIGNS, AND WHY THIS MAY NOT RUN YET. The job reads
# X402_UPSTREAM_BUYER_KEY, our Base spending wallet, which today exists ONLY on
# Railway and is not an Actions secret - so a dispatch fails fast with "secret
# missing" until someone decides to put it here. That decision is deliberately
# not made by this file: copying a spending key into a second platform widens
# its blast radius, and the alternative is better in one respect - the identity
# is an ERC-721 held forever by whoever mints it, and the most durable owner is
# the treasury wallet that already receives our revenue, whose key is in no
# infrastructure at all. Minting from that wallet by hand against the registry's
# own write interface produces the same token with no key copied anywhere.
#
# The script refuses on its own before signing when: the agentURI does not
# resolve or lacks an EIP-required field (an identity pointing at a 404 is
# worse than none), this wallet already holds an identity, the registry cannot
# be read, the gas estimate exceeds the bound, or the wallet is thin on ETH.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "true to actually mint (default: dry run, signs nothing)"
        required: false
        default: "false"
      agent_uri:
        description: "the registration file the identity points at"
        required: false
        default: "https://agent402.tools/.well-known/agent-registration.json"
      max_gas_usd:
        description: "refuse if the estimated gas costs more than this"
        required: false
        default: "0.50"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-24.04
    environment: spending
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the pinned tree (viem only)
        run: |
          mkdir -p /tmp/reg && cp "$GITHUB_WORKSPACE"/scripts/agentkit-live/package.json "$GITHUB_WORKSPACE"/scripts/agentkit-live/package-lock.json /tmp/reg/
          cp "$GITHUB_WORKSPACE"/scripts/erc8004-register.js /tmp/reg/
          cd /tmp/reg && npm ci --ignore-scripts --no-audit --no-fund
      - name: Register (or dry-run)
        env:
          BASE_KEY: ${{ secrets.X402_UPSTREAM_BUYER_KEY }}
          LIVE: ${{ inputs.live }}
          AGENT_URI: ${{ inputs.agent_uri }}
          MAX_GAS_USD: ${{ inputs.max_gas_usd }}
        run: |
          [ -n "$BASE_KEY" ] || { echo "::error::X402_UPSTREAM_BUYER_KEY secret missing"; exit 1; }
          echo "::add-mask::$BASE_KEY"
          cd /tmp/reg && env -i PATH="$PATH" HOME="$HOME" BASE_KEY="$BASE_KEY" LIVE="$LIVE" AGENT_URI="$AGENT_URI" MAX_GAS_USD="$MAX_GAS_USD" node erc8004-register.js
