name: DCO

# Outside pull requests carry two records of provenance (see CONTRIBUTING.md):
#   1. Every commit is signed off (Developer Certificate of Origin 1.1) with a
#      Signed-off-by line whose email is the commit author's email.
#   2. Everyone whose work is in the PR agrees to the contributor license
#      agreement in CLA.md by its versioned agreement sentence: the PR author
#      in the description or a comment, every other commit author in a comment.
# Checks ONLY the PR's own commits, never history. The repository owner's PRs
# and bot PRs are exempt: they are first-party or machine updates.
#
# The check scripts run from the BASE branch: checkout takes the PR's base SHA
# (or, for a comment, the default branch), never the PR's head, so a PR that
# edits scripts/ci/ cannot change the check it is judged by. The PR's commits,
# description and comments are read through the API with a read-only token.
# A comment re-runs the check (issue_comment, which always runs the default
# branch's copy of this file). Untrusted input: PR text reaches the scripts only
# through the event file and the API, into quoted variables compared as fixed
# strings; no PR field is interpolated into a run block
# (scripts/test-dco-cla-workflow.js). Changes to this file, scripts/ci/ and the
# agreement texts need code-owner review (.github/CODEOWNERS).
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    # The job runs for every pull request so its check reports a result a
    # required-check rule can read (a skipped job reports none). The owner's
    # and bots' pull requests are exempt inside the job: the checks are skipped
    # step by step and the job passes.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUBJECT_TO_CHECK: >-
        ${{ (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'MikeyPetrillo' && github.event.pull_request.user.type != 'Bot') ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.user.login != 'MikeyPetrillo' && github.event.issue.user.type != 'Bot') }}
    steps:
      - name: First-party or bot pull request (exempt)
        if: env.SUBJECT_TO_CHECK != 'true'
        run: echo "exempt - the owner's and bots' pull requests carry no sign-off or agreement check"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SUBJECT_TO_CHECK == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check Signed-off-by on PR commits
        if: env.SUBJECT_TO_CHECK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/dco-check.sh
      - name: Check the contributor license agreement
        if: env.SUBJECT_TO_CHECK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/cla-check.sh
