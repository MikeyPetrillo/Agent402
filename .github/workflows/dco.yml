name: DCO

# Outside pull requests carry two records of provenance (see CONTRIBUTING.md):
#   1. Every commit is signed off (Developer Certificate of Origin 1.1) with a
#      Signed-off-by line whose email is the commit author's email.
#   2. The pull request author agrees to the contributor license agreement in
#      CLA.md by putting its agreement sentence in the PR description or in a
#      comment of their own on the PR.
# Checks ONLY the PR's own commits, never history. The repository owner's PRs
# and bot PRs are exempt: they are first-party or machine updates.
#
# Untrusted input: the PR description, comments and commit messages are read
# from the event file, the API and git into shell variables and compared as
# fixed strings; no PR field is interpolated into a run block
# (scripts/test-dco-cla-workflow.js).
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    if: github.event.pull_request.user.login != 'MikeyPetrillo' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by on PR commits
        run: bash scripts/ci/dco-check.sh
      - name: Check the contributor license agreement
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/cla-check.sh
