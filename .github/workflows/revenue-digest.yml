name: Revenue digest

# Daily per-rail revenue pulse, fully automated. Scans every chain the live
# 402 actually offers (payTo addresses come from the challenge itself, so no
# wallet config to drift), then upserts ONE pinned-style issue — "📊 Revenue
# digest" — whose body is replaced each day. No comment spam, no paging:
# this workflow never fails the run on scan errors (each scanner is
# best-effort by design); it exists to answer "what did each rail take
# yesterday?" without anyone asking.
on:
  schedule:
    - cron: "41 13 * * *" # daily ~13:41 UTC, after the 13:17 paid canary
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  PROD: https://agent402.tools

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Warm the x402 Economy snapshot (persists a daily-history row on prod)
        # Block scalar on purpose — a plain "run: curl … 'snapshot: HTTP'" puts
        # a colon+space inside an unquoted YAML value, which is invalid and
        # made GitHub reject the whole file (instant failed run on EVERY push).
        run: |
          curl -s --max-time 90 "$PROD/api/x402-economy" -o /dev/null -w "economy snapshot: HTTP %{http_code}\n" || true

      - name: Scan every offered rail
        # Alchemy key gives revenue-scan.js reliable getLogs — free public RPCs
        # (Polygon especially) rate-limit the runner's cloud IP and skip the rail.
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: |
          mkdir -p /tmp/digest
          # The live 402 is the source of truth for which chains are offered
          # and which wallets they pay to.
          curl -s --max-time 15 -D /tmp/402.h -o /dev/null "$PROD/api/search?q=digest" -H "Accept: application/json" || true
          HDR=$(tr -d '\r' < /tmp/402.h | awk -F': ' 'tolower($1)=="payment-required"{print $2}' | head -1)
          CH=$(echo "$HDR" | base64 -d 2>/dev/null || echo '{}')
          EVM_PAYTO=$(echo "$CH" | jq -r '[.accepts // [] | .[] | select((.network // "") | startswith("eip155:"))][0].payTo // empty')
          SOL_PAYTO=$(echo "$CH" | jq -r '[.accepts // [] | .[] | select((.network // "") | startswith("solana:"))][0].payTo // empty')
          XLM_PAYTO=$(echo "$CH" | jq -r '[.accepts // [] | .[] | select((.network // "") | startswith("stellar:"))][0].payTo // empty')
          ALGO_PAYTO=$(echo "$CH" | jq -r '[.accepts // [] | .[] | select((.network // "") | startswith("algorand:"))][0].payTo // empty')
          echo "$CH" | jq -r '[.accepts[]?.network] | join(",")' > /tmp/digest/networks.txt || true
          echo "offered: $(cat /tmp/digest/networks.txt) | evm payTo: ${EVM_PAYTO:-none} | solana payTo: ${SOL_PAYTO:-none} | stellar payTo: ${XLM_PAYTO:-none} | algorand payTo: ${ALGO_PAYTO:-none}"
          for NET in base polygon arbitrum monad celo avalanche robinhood; do
            case "$NET" in
              base)      CAIP2="eip155:8453" ;;
              polygon)   CAIP2="eip155:137" ;;
              arbitrum)  CAIP2="eip155:42161" ;;
              monad)     CAIP2="eip155:143" ;;
              celo)      CAIP2="eip155:42220" ;;
              avalanche) CAIP2="eip155:43114" ;;
              robinhood) CAIP2="eip155:4663" ;;
            esac
            if [ -n "$EVM_PAYTO" ] && grep -q "$CAIP2" /tmp/digest/networks.txt; then
              SCAN_NETWORK="$NET" REVENUE_WALLET="$EVM_PAYTO" node scripts/revenue-scan.js > "/tmp/digest/$NET.json" 2>/dev/null \
                || echo '{"scanSkipped":true}' > "/tmp/digest/$NET.json"
            else
              echo '{"notOffered":true}' > "/tmp/digest/$NET.json"
            fi
          done
          if [ -n "$SOL_PAYTO" ]; then
            SOLANA_REVENUE_WALLET="$SOL_PAYTO" node scripts/revenue-scan-solana.js > /tmp/digest/solana.json 2>/dev/null \
              || echo '{"scanSkipped":true}' > /tmp/digest/solana.json
          else
            echo '{"notOffered":true}' > /tmp/digest/solana.json
          fi
          if [ -n "$XLM_PAYTO" ]; then
            STELLAR_REVENUE_WALLET="$XLM_PAYTO" node scripts/revenue-scan-stellar.js > /tmp/digest/stellar.json 2>/dev/null \
              || echo '{"scanSkipped":true}' > /tmp/digest/stellar.json
          else
            echo '{"notOffered":true}' > /tmp/digest/stellar.json
          fi
          if [ -n "$ALGO_PAYTO" ]; then
            ALGORAND_REVENUE_WALLET="$ALGO_PAYTO" node scripts/revenue-scan-algorand.js > /tmp/digest/algorand.json 2>/dev/null \
              || echo '{"scanSkipped":true}' > /tmp/digest/algorand.json
          else
            echo '{"notOffered":true}' > /tmp/digest/algorand.json
          fi

      - name: Build the digest body
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const rails = [
            ["Base", "base", "USDC"], ["Solana", "solana", "USDC"],
            ["Polygon", "polygon", "USDC"], ["Arbitrum", "arbitrum", "USDC"],
            ["Monad", "monad", "USDC"], ["Celo", "celo", "USDC"],
            ["Avalanche", "avalanche", "USDC"],
            ["Stellar", "stellar", "USDC"], ["Algorand", "algorand", "USDC"],
            ["Robinhood Chain", "robinhood", "USDG"],
          ];
          const read = (f) => { try { return JSON.parse(readFileSync(`/tmp/digest/${f}.json`, "utf8")); } catch { return { scanSkipped: true }; } };
          const rows = [];
          const externals = [];
          for (const [name, file, asset] of rails) {
            const d = read(file);
            if (d.notOffered) { rows.push(`| ${name} | ${asset} | — | — | not offered |`); continue; }
            if (d.scanSkipped) { rows.push(`| ${name} | ${asset} | ? | ? | scan skipped (transient) |`); continue; }
            const bal = d.balanceUsd == null ? "?" : `$${Number(d.balanceUsd).toFixed(4)}`;
            const ext = Array.isArray(d.external) ? d.external : [];
            rows.push(`| ${name} | ${asset} | ${bal} | ${ext.length} ($${Number(d.totalUsd || 0).toFixed(4)} inbound in window) | ok |`);
            for (const e of ext.slice(0, 5)) externals.push(`- **${name}** $${e.usd} from \`${e.payer}\` — ${e.when || ""} ${e.tx ? `([tx](${e.tx.startsWith("http") ? e.tx : "#"}))` : ""}`);
          }
          const body = [
            `_Automated daily pulse — regenerated by the revenue-digest workflow. Last run: ${new Date().toISOString()} (UTC)._`,
            "",
            "| Rail | Asset | Wallet balance | External payments (scan window) | Scan |",
            "|---|---|---|---|---|",
            ...rows,
            "",
            externals.length ? `### Recent external payments\n${externals.join("\n")}` : "_No external per-call payments in the scan windows._",
            "",
            `On-chain ground truth: [Basescan](https://basescan.org/address/0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0#tokentxns) · [Robinhood Blockscout](https://robinhoodchain.blockscout.com/address/0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0) · [Stellar Expert](https://stellar.expert/explorer/public/account/GDNJXCKW7ZM7GEEVP674TWPU26YJNBQ2FI4ZIPRKTPTNUEJMDHFJWWRL) · [Allo.info](https://allo.info/account/C7IIHG7SPLPZ5H7ZT6HW3UV2OQMQQE6Y2HBNGZXSLRJULE42BEE2OY2XIE) · [/api/stats](https://agent402.tools/api/stats)`,
          ].join("\n");
          writeFileSync("/tmp/digest/body.md", body);
          console.log(body);
          EOF
        env:
          RUN_STAMP: ${{ github.run_started_at }}

      - name: Upsert the digest issue (edit-in-place — no comment spam)
        run: |
          TITLE="📊 Revenue digest"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue edit "$OPEN" --repo "$GITHUB_REPOSITORY" --body-file /tmp/digest/body.md
            echo "updated issue #$OPEN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/digest/body.md
            echo "created the digest issue"
          fi
