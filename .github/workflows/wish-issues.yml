# Wish bridge — DISABLED for public-issue creation (2026-07-21, owner call).
#
# The itemized agent-demand board (which unmet needs, how hot each is) is
# confidential. This workflow used to auto-open a PUBLIC GitHub issue per
# qualifying wish cluster on this PUBLIC repo, broadcasting the per-cluster
# text and counts to anyone watching the issues feed. The confidential board now lives behind the operator
# token at /__operator/wishes (page) and /__operator/wishes.json (feed); the
# public /api/wishes returns aggregate totals only (a "real demand exists,
# come sell" beacon), never per-cluster text/counts.
#
# The auto-open path is gated OFF behind the WISH_ISSUES_ENABLED repo variable
# (default unset = off), and the schedule was removed 2026-10-04 because every
# run exited early on that gate. Dispatch it by hand if the variable is ever set. If you ever want a demand tracker again, prefer a
# PRIVATE repo/board over re-enabling public issues here. Historical wish
# issues (#461, #471, …) are already public and cannot be un-leaked; that is
# exactly the exposure this change stops going forward.
name: wish-issues
on:
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Open issues for wish clusters at threshold (gated OFF by default)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Off unless the operator explicitly opts back in via repo variable.
          ENABLED: ${{ vars.WISH_ISSUES_ENABLED }}
          # Read the TOKEN-GATED detailed feed, never the now-aggregate-only
          # public /api/wishes. Secret unset -> the fetch 404s -> no-op.
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          set -e
          if [ "$ENABLED" != "true" ]; then
            echo "wish-issues auto-open is DISABLED (WISH_ISSUES_ENABLED != true)."
            echo "Confidential demand board: https://agent402.tools/__operator/wishes (operator token)."
            exit 0
          fi
          MAX_NEW=3
          WISHES=$(curl -sf --max-time 20 -H "X-Operator-Token: $OP_TOKEN" "https://agent402.tools/__operator/wishes.json") \
            || { echo "detailed wishes feed unavailable (token unset or endpoint down) — nothing to do"; exit 0; }
          gh label create tool-wish --repo "$REPO" --description "Agent-requested tool (wish loop)" --color D63C1A --force
          THRESHOLD=$(echo "$WISHES" | jq -r '.threshold // 5')
          EXISTING=$(gh issue list --repo "$REPO" --label tool-wish --state all --limit 200 --json title --jq '.[].title')
          CREATED=0
          echo "$WISHES" | jq -c '.clusters[] | select(.qualified == true)' | while read -r c; do
            [ "$CREATED" -ge "$MAX_NEW" ] && { echo "cap reached ($MAX_NEW)"; break; }
            # Wish text is buyer-supplied. Same treatment as wish-reports.yml: it
            # goes into the body inside a code fence, so it renders as plain
            # text (no markdown, links or @mentions). Control characters become
            # spaces and backticks become quotes, so nothing can close the
            # fence early; length is bounded.
            CLEAN='def clean: tostring | explode | map(if . < 32 or . == 127 then 32 elif . == 96 then 39 else . end) | implode | .[0:2000];'
            TEXT=$(echo "$c" | jq -r "$CLEAN"' .text | clean')
            COUNT=$(echo "$c" | jq -r '.count | tonumber? // 0')
            SOURCES=$(echo "$c" | jq -r "$CLEAN"' .sources | to_entries | map("\(.key | clean): \(.value | clean)") | join(", ") | clean')
            FIRST=$(echo "$c" | jq -r "$CLEAN"' .firstSeen | clean | .[0:40]')
            TITLE="Tool wish: ${TEXT:0:80}"
            if echo "$EXISTING" | grep -Fxq "$TITLE"; then echo "already tracked: $TITLE"; continue; fi
            BODY=$(printf 'Agents asked for this **%s** times.\n\nSources and first seen:\n\n```text\n%s; first seen %s\n```\n\nNormalized request:\n\n```text\n%s\n```\n\nOpened by the wish-issues bridge (WISH_ISSUES_ENABLED=true).' "$COUNT" "$SOURCES" "$FIRST" "$TEXT")
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --label tool-wish
            CREATED=$((CREATED+1)); echo "opened: $TITLE"
          done
          echo "done"
