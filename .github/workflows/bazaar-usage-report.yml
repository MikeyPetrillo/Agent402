# Monthly read of the Bazaar discovery listing for this host's routes.
#
# The log of a run on this repository is public, so the check prints a bare
# status (ran / could not read the listing) and files an issue, under the
# neutral text every scheduled check uses, only when the listing could not be
# read. No figure from the listing is printed or filed.
name: Bazaar usage report

on:
  schedule:
    # Monthly on the 21st, 06:11 UTC.
    - cron: "11 6 21 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bazaar-usage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Read the listing (prints a status only)
        run: node scripts/bazaar-usage-report.js
      - name: File it when the listing could not be read
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-issue.js --title "Scheduled check needs review: listing-usage-report ($(date -u +%Y-%m-%d))"
