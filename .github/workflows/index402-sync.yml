name: Sync 402 Index listing prices

# 402 Index never re-reads the MPP listings we registered, so a price change on
# our side left them quoting the old figure. This reprices any of our listings
# that carry a price which no longer matches the live catalog. It edits only
# listings on our own domain, authenticated by the domain claim's token.
permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, write nothing"
        type: boolean
        default: false
  schedule:
    - cron: "41 8 * * *"
  # After a deploy, which is when a price change goes live.
  workflow_run:
    workflows: ["Deploy to Railway"]
    types: [completed]

jobs:
  sync:
    # On workflow_run: only a successful push run of this repository's main.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    # On the job, not the workflow: a run whose job is skipped (a deploy that
    # is not a successful push of main) takes no place in the group, so it
    # never replaces a daily run that is waiting.
    concurrency:
      group: index402-sync
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # The script stops starting writes at 13 minutes and ends itself, so the
    # page step below still runs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Reprice drifted listings
        env:
          INDEX402_TOKEN: ${{ secrets.INDEX402_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # A run after each deploy normally corrects what that deploy changed,
          # so on the daily run an imported fixed-price listing that is off the
          # catalog price was most likely written back by the index's importer:
          # name it and exit 3.
          INDEX402_FLAG_REWRITTEN: ${{ github.event_name == 'schedule' && '1' || '0' }}
        # Exit 0: nothing left wrong. Exit 3: every read and write worked, and
        # the daily run named a listing written back. Anything else: the sync
        # itself failed.
        id: sync
        run: |
          set +e
          node scripts/index402-sync.js
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Exit 3 is reported by its issue, not by a failed run each day.
          if [ "$code" = "3" ]; then exit 0; fi
          if [ "$code" = "4" ]; then echo "::warning title=402 Index unavailable::The index did not answer (no answer, 429 or 5xx, asked twice); recorded as its outage, nothing of ours failed. The next run corrects what is left."; exit 0; fi
          exit "$code"

      # An open issue this check filed under a previous title gets the current
      # one, so the lookups below find it (scripts/adopt-issue-titles.js).
      - name: Adopt an open issue filed under a previous title
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/adopt-issue-titles.js

      # Two issues, one per cause, so a failed sync is never hidden behind a
      # listing that is waiting for its source to be refreshed.
      - name: Page on failure / recover on success
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.sync.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # No code means the step never finished (a job limit, a setup failure).
          CODE="${CODE:-1}"
          # 4: the index did not answer. Its outage pages nothing and closes
          # nothing (the sync was not proven); the step above left a warning.
          if [ "$CODE" = "4" ]; then echo "The index was unavailable on this run: nothing opened or closed."; exit 0; fi
          FAIL_TITLE="Scheduled check needs review: index-price-sync"
          BACK_TITLE="Scheduled check needs review: index-price-writeback"
          # Only this workflow's own issues and comments count: an issue or a
          # marker comment written by anyone else is not read.
          open_issue() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$1\" in:title author:app/github-actions" --json number,title,author \
              | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{let a=[];try{a=JSON.parse(s)}catch{}const ours=(x)=>/^(app\/)?github-actions(\[bot\])?$/.test((x&&x.author&&x.author.login)||"");const hit=a.find((i)=>i.title===process.argv[1]&&ours(i));process.stdout.write(hit?String(hit.number):"")})' "$1"
          }
          FAIL_OPEN="$(open_issue "$FAIL_TITLE" || true)"
          BACK_OPEN="$(open_issue "$BACK_TITLE" || true)"

          # The sync itself: with 0 and 3 every read and write worked.
          if [ "$CODE" = "0" ] || [ "$CODE" = "3" ]; then
            if [ -n "$FAIL_OPEN" ]; then
              gh issue close "$FAIL_OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ -z "$FAIL_OPEN" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$FAIL_TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
          fi

          # A listing written back. A deploy's own correction a few hours before
          # the daily run can hide it for one run, so the issue closes only on
          # the second clean daily run in a row (a marker comment holds the count).
          if [ -n "$BACK_OPEN" ]; then
            LAST="$(gh issue view "$BACK_OPEN" --repo "$GITHUB_REPOSITORY" --json comments \
              | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{let c=[];try{c=JSON.parse(s).comments||[]}catch{}const ours=(x)=>/^(app\/)?github-actions(\[bot\])?$/.test((x&&x.author&&x.author.login)||"");const m=c.filter((x)=>ours(x)&&/ state: (clean|again)$/.test(x.body||"")).pop();if(!m)return;const age=Math.floor((Date.now()-Date.parse(m.createdAt))/1000);process.stdout.write((m.body.endsWith("state: clean")?"clean":"back")+" "+age)})' || true)"
            LAST_KIND="${LAST%% *}"
            LAST_AGE="${LAST##* }"
          fi
          if [ "$CODE" = "3" ]; then
            echo "Remedy for a listing written back: one paid call to each named route, by dispatching the keep-alive workflow with slugs set to the route's slug, stale_days=0, and max_price_usd and max_spend_usd at or above its price."
            if [ -z "$BACK_OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$BACK_TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            elif [ "${LAST_KIND:-}" = "clean" ]; then
              gh issue comment "$BACK_OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID state: again"
            fi
          elif [ "$CODE" = "0" ] && [ -n "$BACK_OPEN" ]; then
            if [ "${LAST_KIND:-}" = "clean" ] && [ "${LAST_AGE:-999999}" -lt 129600 ]; then
              gh issue close "$BACK_OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              gh issue comment "$BACK_OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID state: clean"
            fi
          fi
