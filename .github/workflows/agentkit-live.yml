name: AgentKit adapter live proof

# Proves agent402-agentkit with a REAL AgentKit wallet provider against
# production: ViemWalletProvider over the canary burner pays a wallet-only tool
# over x402 through agent402_call. Installs @coinbase/agentkit from the
# registry (its real dependency tree, ~minutes) in a scratch dir with no secrets
# beyond the burner key. Dispatch-only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the PINNED proof tree + the adapter tarball
        run: |
          # scripts/agentkit-live/package-lock.json pins the whole tree: a
          # third-party dependency tree that runs beside a funded key must never
          # be resolved fresh at dispatch time. The adapter itself is packed
          # from the checkout (a folder install is a symlink and would resolve
          # its own dependencies from the repo, not this dir).
          TGZ=$(cd "$GITHUB_WORKSPACE/adapters/agentkit" && npm pack --silent | tail -1)
          mkdir -p /tmp/akproof && cp "$GITHUB_WORKSPACE"/scripts/agentkit-live/package.json "$GITHUB_WORKSPACE"/scripts/agentkit-live/package-lock.json "$GITHUB_WORKSPACE"/scripts/agentkit-live/agentkit-live.js /tmp/akproof/
          cd /tmp/akproof && npm ci --ignore-scripts --no-audit --no-fund
          npm i --no-save --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/adapters/agentkit/$TGZ"
      - name: Drive agent402_find + agent402_call with a real wallet provider
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
        run: |
          [ -n "$BURNER_KEY" ] || { echo "::error::BURNER_KEY secret missing"; exit 1; }
          echo "::add-mask::$BURNER_KEY"
          # Allowlisted env: the third-party tree sees the burner key it needs
          # to sign and nothing else (no POW_SECRET: the burner payer is
          # classified internal by address in the sales ledger already).
          cd /tmp/akproof && env -i PATH="$PATH" HOME="$HOME" BURNER_KEY="$BURNER_KEY" TARGET_URL="https://agent402.tools" AGENTKIT_ADAPTER="agent402-agentkit" node agentkit-live.js
