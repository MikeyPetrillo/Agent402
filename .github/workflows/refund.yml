# Refund run — repay the refund ledger (charged-but-failed buyers).
#
# Dispatch-only and DRY BY DEFAULT: a run with live=false (the default) prints
# the plan — who is owed, what would be sent, what is held and why — and moves
# no money. A live run requires explicitly setting live=true at dispatch.
#
# The ledger lives on production (src/refund-ledger.js, written the moment a
# settle receipt with success:true goes out on a non-200 response). This
# workflow is the ONLY thing that sends money: the spending keys live here as
# Actions secrets, never on Railway — the server can record debts but can
# never pay them.
#
# Keys: refunds ride the CI CANARY BURNERS by default (Mike's decision,
# 2026-08-04 — they already hold small USDC on exactly the chains buyers pay
# on, and the canary low-water alarms already watch their balances, so refund
# spend pages for a top-up the same way canary spend does). Dedicated
# REFUND_* secrets take precedence whenever they are set, so the burners can
# be retired from this duty without touching the workflow:
#   REFUND_EVM_KEY            || BURNER_KEY             (all eip155 rails)
#   REFUND_STELLAR_SECRET     || STELLAR_BURNER_SECRET  (+ "agent402 refund" memo)
#   REFUND_ALGORAND_MNEMONIC  || ALGORAND_BURNER_MNEMONIC (+ note)
# NEVER the treasury. Solana is detection-only until the SVM spending wallet
# lands; its rows stay owed and are listed on every run.
name: Refund run
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Actually send money (default is a dry run)"
        type: boolean
        default: false
      max_total_usd:
        description: "Hard cap on this run's total refunds"
        default: "2"
      max_each_usd:
        description: "Hard cap per individual refund"
        default: "0.25"
      max_per_payer_usd:
        description: "Hard cap per payer in this run"
        default: "0.5"
      only_chain:
        description: "Optional CAIP-2 filter (e.g. eip155:8453)"
        default: ""
      include_synthetic:
        description: "Also refund canary self-harm rows (churn - normally leave false)"
        type: boolean
        default: false
      include_lasting_hangups:
        description: "Also repay disconnects on routes whose effect was delivered (route-execute, memory writes, attest, feedback) - read those held rows first"
        type: boolean
        default: false
      include_repeat_hangups:
        description: "Also repay disconnects booked past the hang-up forgiveness budget (and older disconnects with no recorded reason) - read those held rows first"
        type: boolean
        default: false

# One refund run at a time, repo-wide. Two concurrent dispatches would each
# read the same owed rows; the ledger's claim step makes a double-send unlikely,
# but not racing at all is better than relying on the claim to win.
concurrency:
  group: refund-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refund:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A dedicated environment (never agent402/production - that one is also
    # deploy.yml's, and this repo deliberately deploys unconditionally on
    # push to main; gating IT would silently break that). Requires a manual
    # approval click before this job's steps run, even for a dry run - the
    # real value is on a LIVE run: a compromised write-access credential could
    # dispatch this, but the run pauses and needs a separate, visible
    # "approve deployment" action first, which is a chance to notice and stop
    # it. Solo-maintainer repo, so self-approval is allowed (there is no one
    # else) - the gate is against a compromised session, not a second-person
    # review.
    environment: refund-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install deps (senders only load for chains that have rows)
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @stellar/stellar-sdk@16.0.1 viem@2.52.2 algosdk@3.5.0
      - name: Run refunds
        env:
          AGENT402_OPERATOR_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          REFUND_LIVE: ${{ inputs.live && 'true' || 'false' }}
          REFUND_MAX_TOTAL_USD: ${{ inputs.max_total_usd }}
          REFUND_MAX_EACH_USD: ${{ inputs.max_each_usd }}
          REFUND_MAX_PER_PAYER_USD: ${{ inputs.max_per_payer_usd }}
          REFUND_ONLY_CHAIN: ${{ inputs.only_chain }}
          REFUND_INCLUDE_SYNTHETIC: ${{ inputs.include_synthetic && 'true' || 'false' }}
          # Held by default and listed in their own bucket on every run, dry or
          # live (planRefunds in scripts/refund-run.js); repaid only when the
          # dispatch opts in after reading them.
          REFUND_INCLUDE_LASTING_HANGUPS: ${{ inputs.include_lasting_hangups && 'true' || 'false' }}
          # Same rule for a disconnect booked because the forgiveness budget
          # was spent (a repeat hang-up), or one with no recorded reason.
          REFUND_INCLUDE_REPEAT_HANGUPS: ${{ inputs.include_repeat_hangups && 'true' || 'false' }}
          REFUND_EVM_KEY: ${{ secrets.REFUND_EVM_KEY != '' && secrets.REFUND_EVM_KEY || secrets.BURNER_KEY }}
          REFUND_STELLAR_SECRET: ${{ secrets.REFUND_STELLAR_SECRET != '' && secrets.REFUND_STELLAR_SECRET || secrets.STELLAR_BURNER_SECRET }}
          REFUND_ALGORAND_MNEMONIC: ${{ secrets.REFUND_ALGORAND_MNEMONIC != '' && secrets.REFUND_ALGORAND_MNEMONIC || secrets.ALGORAND_BURNER_MNEMONIC }}
          # The router tiers settle to our spending wallets, not the treasury
          # (src/payments.js), so the pre-send proof must count those public
          # addresses as ours (ourPayToSet in scripts/refund-run.js). Repository
          # VARIABLES, the same ones deploy.yml passes: addresses only, no key.
          # scripts/test-refund-run-self-funding.js keeps this list in step
          # with payments.js.
          X402_UPSTREAM_BUYER_ADDRESS: ${{ vars.X402_UPSTREAM_BUYER_ADDRESS }}
          ALGORAND_UPSTREAM_BUYER_ADDRESS: ${{ vars.ALGORAND_UPSTREAM_BUYER_ADDRESS }}
        run: node scripts/refund-run.js
