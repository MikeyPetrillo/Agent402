name: Tempo MPP volume

# Settled Tempo MPP transactions against our own cheapest route, from the
# canary burner (USDC.e on Tempo): 12 runs x 17 a day. Real on-chain volume
# for the MPP leaderboard window, the router's proven-seller gate and Tempo's
# transfer feed. The route is pure-CPU (/api/uuid) and pays our own payTo.
# The daily paid canary keeps the single GRADED mpp-tempo settle as the rail
# proof; this workflow is volume, graded only on its own success rate
# (>= 80%), and it refuses to start below a floor balance so it can never
# drain the burner itself (the canary's funding sweep pages first).
on:
  schedule:
    - cron: "41 */2 * * *"   # every 2 hours (GitHub delivers late/sparsely; that is fine for volume)
  workflow_dispatch:
    inputs:
      count:
        description: "Transactions this run (default 17)"
        required: false
        default: "17"

permissions:
  contents: read
  issues: write

concurrency:
  group: tempo-volume
  cancel-in-progress: false

jobs:
  volume:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_URL: https://agent402.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install (lock-pinned; mppx + viem from the repo lock)
        run: npm ci --ignore-scripts
      - name: Buy ${{ inputs.count || '17' }} x /api/uuid over Tempo MPP
        id: vol
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
          TEMPO_VOLUME_TX: ${{ inputs.count || '17' }}
        run: |
          [ -n "$BURNER_KEY" ] || { echo "No BURNER_KEY secret - cannot run"; exit 2; }
          echo "::add-mask::$BURNER_KEY"
          set +e
          node scripts/tempo-volume.js 2>&1 | tee /tmp/tempo-volume.log
          CODE=${PIPESTATUS[0]}
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      # An open issue this check filed under a previous title gets the current
      # one, so the lookups below find it (scripts/adopt-issue-titles.js).
      - name: Adopt an open issue filed under a previous title
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/adopt-issue-titles.js

      - name: Alert (open issue) or clear (close issue)
        # Same heartbeat-style doctrine: one issue per episode, auto-closed on
        # the next good run. Exit 2 (refused: low balance / no challenge) pages
        # too - a silent skip is how alarms die. `always()`: a run killed by the
        # job timeout (stalled relay) must still page, with no exit code = fail.
        if: always()
        run: |
          CODE="${{ steps.vol.outputs.code }}"
          [ -n "$CODE" ] || CODE="timeout"
          TITLE="Scheduled check needs review: mpp-volume"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          # Public issue body: the script's own summary lines only (counts,
          # bucketed balance, a truncated last error) - never the raw log tail.
          if [ "$CODE" != "0" ]; then
            if [ -z "$OPEN" ]; then
              node scripts/check-issue.js --title "$TITLE"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            exit 1
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
