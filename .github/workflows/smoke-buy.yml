name: Paid tool smoke test

# Owner-approved, manually-dispatched: buy ONE tool from production with real
# USDC on Base to confirm it works end-to-end (render, FRED, any live-data tool).
# Cost is the tool's own price (typically $0.005-0.025). Marked internal traffic
# (X-Heartbeat-Token) so it doesn't pollute the sales ledger. Dispatch only.
on:
  workflow_dispatch:
    inputs:
      route:
        description: "Tool route to buy, e.g. /api/unemployment-rate"
        required: true
        default: "/api/render"
      method:
        description: "GET or POST"
        required: false
        default: "GET"
      query:
        description: "Querystring for GET (e.g. q=gdp&limit=3)"
        required: false
        default: ""
      body:
        description: "JSON body for POST"
        required: false
        default: ""
      expect:
        description: "Response substring to require (required only when an external target is set)"
        required: false
        default: ""
      strip_extensions:
        description: "Diagnostic: comma-separated x402 extensions to drop from the challenge before paying (e.g. offer-receipt)"
        required: false
        default: ""
      capture_receipt:
        description: "Capture the seller-signed offer receipt as a workflow artifact (external target only - this host issues none)"
        required: false
        type: boolean
        default: false
      target:
        description: "Optional external seller origin to buy from instead of production (x402 compatibility check, e.g. https://seller.example)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://agent402.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install x402 client (EVM only)
        # No secrets in scope here; --ignore-scripts blocks dependency lifecycle
        # scripts. Pinned to the server's protocol version + the repo lock (R-07).
        # KEEP THIS IN STEP WITH package.json's @x402/* range. It drifted to
        # 2.16.0 while the server ran 2.22.0, and on 2026-08-29 a buy against an
        # external seller failed with CDP's `'paymentPayload' is invalid: must
        # match one of [x402V2Pay...]` - our own canary never caught it because
        # it only pays OUR 402s, which the old client still shaped correctly.
        # A buyer workflow that cannot pay a third party is not a buyer test.
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/fetch@2.22.0 @x402/core@2.22.0 @x402/evm@2.22.0 viem@2.52.2
      - name: Buy one tool from production (real USDC)
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
          SMOKE_ROUTE: ${{ github.event.inputs.route }}
          SMOKE_METHOD: ${{ github.event.inputs.method }}
          SMOKE_QUERY: ${{ github.event.inputs.query }}
          SMOKE_BODY: ${{ github.event.inputs.body }}
          SMOKE_EXPECT: ${{ github.event.inputs.expect }}
          SMOKE_TARGET: ${{ github.event.inputs.target }}
          SMOKE_STRIP_EXTENSIONS: ${{ github.event.inputs.strip_extensions }}
          SMOKE_RECEIPT_OUT: ${{ inputs.capture_receipt && format('{0}/signed-offer-receipt.json', runner.temp) || '' }}
        run: |
          if [ -z "$BURNER_KEY" ]; then echo "No BURNER_KEY secret — cannot run the paid smoke test"; exit 1; fi
          echo "::add-mask::$BURNER_KEY"
          node scripts/smoke-buy.js
      - name: Preserve signed offer receipt
        if: ${{ always() && inputs.capture_receipt }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-offer-receipt
          path: ${{ runner.temp }}/signed-offer-receipt.json
          if-no-files-found: warn
          retention-days: 7
