name: Paid demo buy

# One REAL paid buy of a named tool over a pinned chain, for announcement demo
# cards ("real output, never a fixture" — see scripts/paid-demo.js). Prints the
# quote, full result JSON, and settle receipt to the job log and uploads the
# capture as an artifact for the card renderer. Costs whatever the tool costs
# (dust — from the same funded test burner as the paid canary).
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Tool path incl. query, e.g. /api/company-financials?ticker=NVDA"
        required: true
      method:
        description: "HTTP method"
        required: false
        default: "GET"
      body:
        description: "JSON body for POST tools (empty for GET)"
        required: false
        default: ""
      chain:
        description: "Pinned CAIP-2 chain to pay on (must be among the live accepts)"
        required: false
        default: "eip155:8453"
      mirror:
        description: "Mirror the credential under X-PAYMENT too (default on); 'off' = pure stock client, PAYMENT-SIGNATURE only"
        required: false
        default: "on"
      target:
        description: "Seller base URL - defaults to our prod; set to buy from an EXTERNAL x402 seller (ecosystem demos)"
        required: false
        default: "https://agent402.tools"

permissions:
  contents: read

jobs:
  buy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: ${{ inputs.target || 'https://agent402.tools' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install x402 client
        # Same pinning + lifecycle-script hygiene as the paid canary (audit
        # R-07): no wallet secrets in scope here, --ignore-scripts everywhere,
        # @x402/* pinned to the server's protocol version (2.16).
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/core@2.22.0 @x402/evm@2.22.0 @x402/svm@2.22.0 @x402/stellar@2.21.0 @stellar/stellar-sdk@16.0.1 @solana/kit@5.5.1 viem@2.52.2
      - name: Buy the tool (real funds, pinned chain)
        # Wallet secrets scoped to THIS step only (audit R-07) — only the one
        # matching the pinned chain's namespace is read by the script. Inputs
        # ride env vars, never shell interpolation (same rule as announce.yml).
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          SOLANA_BURNER_KEY: ${{ secrets.SOLANA_BURNER_KEY }}
          PAID_DEMO_MIRROR: ${{ github.event.inputs.mirror }}
          STELLAR_BURNER_SECRET: ${{ secrets.STELLAR_BURNER_SECRET }}
          ALGORAND_BURNER_MNEMONIC: ${{ secrets.ALGORAND_BURNER_MNEMONIC }}
          DEMO_PATH: ${{ inputs.path }}
          DEMO_METHOD: ${{ inputs.method }}
          DEMO_BODY: ${{ inputs.body }}
          DEMO_CHAIN: ${{ inputs.chain }}
        run: |
          for v in BURNER_KEY SOLANA_BURNER_KEY STELLAR_BURNER_SECRET ALGORAND_BURNER_MNEMONIC; do
            [ -n "${!v}" ] && echo "::add-mask::${!v}"
          done
          ARGS=(--path "$DEMO_PATH" --method "$DEMO_METHOD" --chain "$DEMO_CHAIN" --out paid-demo-result.json)
          [ -n "$DEMO_BODY" ] && ARGS+=(--body "$DEMO_BODY")
          node scripts/paid-demo.js "${ARGS[@]}"
      - name: Upload capture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paid-demo-result
          path: paid-demo-result.json
