name: Brave reconciliation

# Monthly billing-cycle reconciliation for the Brave Search subscription.
#
# July 2026 could not be reconciled: Brave billed 5,106 Search requests while
# every inbound accounting surface could explain ~600 (the gap was our own CI,
# invisible to PostHog - since closed and guarded by test-brave-leak.js). The
# fix that makes THIS workflow possible is the outbound meter: search.js counts
# every Brave call where it leaves the process, and stats.js persists it in
# day buckets (daily_upstream_calls) that survive redeploys.
#
# On the 1st of each month this checks that the prior month's series is
# readable on the operator endpoint and opens an issue, so the operator reads
# our number there (/__operator/stats) and lines it up against the Brave
# dashboard's usage for the same date range. The number itself is never
# printed or filed: this log and the issue are public. It is a reconciliation
# prompt, not an alarm - it always files, and the issue is closed by a human
# once the two numbers are compared.
on:
  schedule:
    - cron: "23 8 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  PROD: https://agent402.tools

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read the prior month's outbound Brave series
        id: series
        # Scoped to just this step (audit R-07 pattern) - it's the only one
        # that needs the full-access operator token; the issue-filing step
        # below only needs values already resolved into step outputs.
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          [ -n "$OP_TOKEN" ] || { echo "::error::no AGENT402_OPERATOR_TOKEN - cannot read the meter"; exit 1; }
          CODE="$(curl -s --max-time 30 -o /tmp/opstats.json -w '%{http_code}' \
            -H "X-Operator-Token: $OP_TOKEN" "$PROD/__operator/stats" || echo 000)"
          echo "operator stats: HTTP $CODE, $(wc -c < /tmp/opstats.json) bytes"
          if [ "$CODE" = "404" ]; then
            echo "::error::operator token REJECTED (404) - secret does not match Railway"; exit 1
          fi
          # A MISSING field fails loudly - the charged-failure alarm taught us
          # that treating it as "unreadable, skip" is how a dead check hides.
          jq -e '.upstreamCalls.brave.daily' /tmp/opstats.json >/dev/null \
            || { echo "::error::upstreamCalls.brave.daily missing from operator stats"; exit 1; }
          MONTH="$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)"
          DAYS_IN_MONTH="$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%d)"
          DAYS_WITH_DATA="$(jq -r --arg m "$MONTH" '[.upstreamCalls.brave.daily[] | select(.day | startswith($m)) | .day] | unique | length' /tmp/opstats.json)"
          # The totals are read on /__operator/stats, not printed: this log is public.
          echo "month=$MONTH daysWithData=$DAYS_WITH_DATA/$DAYS_IN_MONTH"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
      # Only the two files the next step runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        if: always()
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/adopt-issue-titles.js
            workers/status-probe/src/previous-issue-titles.js
            scripts/check-issue.js
            scripts/lib/monitor-issue-text.js
            workers/status-probe/src/reopen-window.js

      # An open issue this check filed under a previous title gets the current
      # one, so the lookups below find it (scripts/adopt-issue-titles.js).
      - name: Adopt an open issue filed under a previous title
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/adopt-issue-titles.js

      - name: File the reconciliation issue
        # The month is routed through env: (not spliced via ${{ }} into the
        # script) to match the repo-wide convention.
        env:
          MONTH: ${{ steps.series.outputs.month }}
        run: |
          TITLE="Scheduled check needs review: search-call-reconciliation ($MONTH)"
          EXISTS=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ -n "$EXISTS" ]; then echo "issue for $MONTH already filed (#$EXISTS) - not duplicating"; exit 0; fi
          node scripts/check-issue.js --title "$TITLE"
