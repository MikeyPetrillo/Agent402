name: Brave reconciliation

# Monthly billing-cycle reconciliation for the Brave Search subscription.
#
# July 2026 could not be reconciled: Brave billed 5,106 Search requests while
# every inbound accounting surface could explain ~600 (the gap was our own CI,
# invisible to PostHog - since closed and guarded by test-brave-leak.js). The
# fix that makes THIS workflow possible is the outbound meter: search.js counts
# every Brave call where it leaves the process, and stats.js persists it in
# day buckets (daily_upstream_calls) that survive redeploys.
#
# On the 1st of each month this reads the prior month's series from the
# operator endpoint and opens an issue with our number, so the operator can
# line it up against the Brave dashboard's usage for the same date range.
# It is a reconciliation prompt, not an alarm - it always files, and the
# issue is closed by a human once the two numbers are compared.
on:
  schedule:
    - cron: "23 8 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  PROD: https://agent402.tools

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read the prior month's outbound Brave series
        id: series
        # Scoped to just this step (audit R-07 pattern) - it's the only one
        # that needs the full-access operator token; the issue-filing step
        # below only needs values already resolved into step outputs.
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          [ -n "$OP_TOKEN" ] || { echo "::error::no AGENT402_OPERATOR_TOKEN - cannot read the meter"; exit 1; }
          CODE="$(curl -s --max-time 30 -o /tmp/opstats.json -w '%{http_code}' \
            -H "X-Operator-Token: $OP_TOKEN" "$PROD/__operator/stats" || echo 000)"
          echo "operator stats: HTTP $CODE, $(wc -c < /tmp/opstats.json) bytes"
          if [ "$CODE" = "404" ]; then
            echo "::error::operator token REJECTED (404) - secret does not match Railway"; exit 1
          fi
          # A MISSING field fails loudly - the charged-failure alarm taught us
          # that treating it as "unreadable, skip" is how a dead check hides.
          jq -e '.upstreamCalls.brave.daily' /tmp/opstats.json >/dev/null \
            || { echo "::error::upstreamCalls.brave.daily missing from operator stats"; exit 1; }
          MONTH="$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)"
          DAYS_IN_MONTH="$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%d)"
          TOTAL="$(jq -r --arg m "$MONTH" '[.upstreamCalls.brave.daily[] | select(.day | startswith($m)) | .n] | add // 0' /tmp/opstats.json)"
          BYCALLER="$(jq -r --arg m "$MONTH" '
            [.upstreamCalls.brave.daily[] | select(.day | startswith($m))]
            | group_by(.caller) | map("\(.[0].caller): \(map(.n) | add)") | join(", ")' /tmp/opstats.json)"
          DAYS_WITH_DATA="$(jq -r --arg m "$MONTH" '[.upstreamCalls.brave.daily[] | select(.day | startswith($m)) | .day] | unique | length' /tmp/opstats.json)"
          echo "month=$MONTH total=$TOTAL daysWithData=$DAYS_WITH_DATA/$DAYS_IN_MONTH byCaller=[$BYCALLER]"
          { echo "month=$MONTH"; echo "total=$TOTAL"; echo "bycaller=$BYCALLER";
            echo "dayswithdata=$DAYS_WITH_DATA"; echo "daysinmonth=$DAYS_IN_MONTH"; } >> "$GITHUB_OUTPUT"
      - name: File the reconciliation issue
        # Values are our own server's numeric/day/caller-slug data, not
        # attacker-facing free text, but routed through env: anyway (not
        # spliced via ${{ }} into the script) to match the repo-wide
        # convention and stay safe if that assumption ever changes upstream.
        env:
          MONTH: ${{ steps.series.outputs.month }}
          TOTAL: ${{ steps.series.outputs.total }}
          BYCALLER: ${{ steps.series.outputs.bycaller }}
          DAYS_WITH_DATA: ${{ steps.series.outputs.dayswithdata }}
          DAYS_IN_MONTH: ${{ steps.series.outputs.daysinmonth }}
        run: |
          TITLE="Brave reconciliation: $MONTH"
          EXISTS=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTS" ]; then echo "issue for $MONTH already filed (#$EXISTS) - not duplicating"; exit 0; fi
          NOTE=""
          if [ "$DAYS_WITH_DATA" = "0" ]; then
            NOTE="**No days recorded for $MONTH.** Either the meter shipped after this month (persistent recording began 2026-07-29) or something is wrong with the series - distinguish the two before trusting a zero."
          elif [ "$DAYS_WITH_DATA" != "$DAYS_IN_MONTH" ]; then
            NOTE="Note: only $DAYS_WITH_DATA of $DAYS_IN_MONTH days have rows. Days with zero outbound calls record nothing, so a short count here is normal on quiet days - but if recording began mid-month, compare only the covered range."
          fi
          BODY="Our outbound Brave call count for **$MONTH**, from the deploy-proof meter (stats DB \`daily_upstream_calls\`, counted where the request leaves the process):

          **Total: $TOTAL** (by caller: $BYCALLER)
          Days with data: $DAYS_WITH_DATA/$DAYS_IN_MONTH. $NOTE

          To reconcile: compare against the Brave dashboard's Search-plan usage for the same date range (their daily CSV). CI spend is guarded off (test-brave-leak.js), so the dashboard number should match this count - the July 2026 gap (5,106 billed vs ~600 accountable) must not recur. Answers and Autosuggest reconciled exactly last cycle and are metered under their own callers here.

          Close this issue once the two numbers are compared. If they disagree materially, the per-day series is on \`/__operator/stats\` -> \`upstreamCalls.brave.daily\`.
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
