name: Base list sweep (register the unlisted routes in the Bazaar)

# A resource enters the CDP Bazaar on its FIRST SETTLEMENT through Coinbase's
# facilitator, not by being advertised. Measured 2026-09-11: 547 of 586 paid
# routes are listed, and the 39 absent ones are exactly the set nobody has ever
# bought - the pro/premium model tiers, every report product, video, the X
# tools. This buys the 37 of them that spend only against our OWN upstream
# accounts, once each, from the CI burner to our own payTo, so the USDC
# recycles and the real cost is the upstream calls. See scripts/base-list-sweep.js for the route list and why the two
# router tiers are excluded.
#
# Dispatch only. DRY BY DEFAULT - set dry=false to actually pay.
on:
  workflow_dispatch:
    inputs:
      max_usd:
        description: "Hard total-spend cap in USDC (aborts cleanly before exceeding)"
        required: false
        default: "25"
      dry:
        description: "'true' previews and signs nothing; 'false' pays"
        required: false
        default: "true"
      limit:
        description: "Stop after N routes (0 = all)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    # The report composites run 30 s to 4 min each and the paywall settles AFTER
    # the handler, so the sweep has to outlast the work on every one of them.
    timeout-minutes: 330
    environment: spending
    env:
      TARGET_URL: https://agent402.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install x402 client
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/core@2.27.0 @x402/evm@2.27.0
      - name: Run the sweep
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          # Marks every buy internal so 37 self-purchases are not printed into
          # the sales ledger and PostHog as outside demand.
          POW_SECRET: ${{ secrets.POW_SECRET }}
          SWEEP_MAX_USD: ${{ inputs.max_usd }}
          SWEEP_LIMIT: ${{ inputs.limit }}
          SWEEP_DRY: ${{ inputs.dry == 'false' && '0' || '1' }}
        run: |
          [ -n "$BURNER_KEY" ] && echo "::add-mask::$BURNER_KEY"
          [ -n "$POW_SECRET" ] && echo "::add-mask::$POW_SECRET"
          node scripts/base-list-sweep.js --out sweep-report.json --max-usd "$SWEEP_MAX_USD"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-list-sweep-report
          path: sweep-report.json
          if-no-files-found: ignore
