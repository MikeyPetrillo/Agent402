name: X Read

# Read-only: print a public X post's content (text, author, any quoted post)
# by fetching the public fxtwitter/vxtwitter mirror APIs from the runner,
# which has open egress (the Claude Code sandbox does not). No credentials,
# posts nothing. Dispatch with a status id or full x.com URL.
on:
  workflow_dispatch:
    inputs:
      status:
        description: "Status id or full x.com/twitter.com URL of the post to read"
        required: true

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch post JSON (fxtwitter, vxtwitter fallback)
        env:
          # Dispatch input rides an env var, never shell interpolation (N-03).
          IN_STATUS: ${{ github.event.inputs.status }}
        run: |
          S="$IN_STATUS"
          [ -z "$S" ] && S="2077749647703949603"
          ID=$(echo "$S" | grep -oE '[0-9]{10,}' | head -1)
          [ -n "$ID" ] || { echo "no status id found in: $S"; exit 1; }
          echo "Reading status $ID"
          if curl -fsSL --max-time 30 "https://api.fxtwitter.com/status/$ID" -o /tmp/post.json; then
            echo "--- fxtwitter ---"
          elif curl -fsSL --max-time 30 "https://api.vxtwitter.com/i/status/$ID" -o /tmp/post.json; then
            echo "--- vxtwitter ---"
          else
            echo "both mirrors failed for status $ID"; exit 1
          fi
          jq . /tmp/post.json
