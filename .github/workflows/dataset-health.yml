name: Dataset health (daily)

# Did the daily record actually happen, and does it have data IN it?
#
# Built 2026-09-11 after two failures the same afternoon that every existing
# guard was blind to:
#   - the routes table recorded 101,733 rows with price_usd null on EVERY row
#     (the allowlist read a field name the crawl row does not carry). The row
#     count was perfect. Nothing that checks "did it run" can see that.
#   - /api/index served network:null and discoveryPath:null for every seller
#     for weeks, because neither survived cache persistence.
#
# So this counts VALUES, not statuses, and it reads the BUCKET rather than the
# server's in-memory status - that memory is wiped by every deploy, and a check
# reading it would file an outage every afternoon and be trained away as noise.
#
# Runs after the 05:00 UTC snapshot window. Heartbeat style: one issue, and a
# clean run closes it.
on:
  schedule:
    - cron: "17 7 * * *"   # after the snapshot, off the hour
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # No install: the check is dependency-free on purpose, so a broken
      # lockfile can never be the reason the alarm goes quiet.
      - name: Check the record
        id: check
        env:
          AGENT402_OPERATOR_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          TARGET_URL: https://agent402.tools
        run: |
          if [ -z "$AGENT402_OPERATOR_TOKEN" ]; then
            echo "::error::AGENT402_OPERATOR_TOKEN is not set - refusing to report health it cannot read"
            exit 1
          fi
          node scripts/dataset-health.mjs 2>&1 | tee /tmp/health.log
          exit "${PIPESTATUS[0]}"

      - name: Open or close the alert
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          TITLE="Dataset record UNHEALTHY"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY_TAIL=$(tail -n 25 /tmp/health.log 2>/dev/null || echo "(no output - the check itself failed to run)")
          if [ "$OUTCOME" = "failure" ]; then
            BODY=$(printf 'The daily ecosystem record failed its health check.\n\nThis check counts VALUES, not statuses: a table can record every row and still be worthless if a load-bearing column is null on all of them, which is exactly what shipped on 2026-09-11. It reads the bucket, not the server memory, so a deploy cannot cause this.\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s\nA clean run closes this.' "$BODY_TAIL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY";
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"; fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "$(printf 'Recovered at %s.\n\n```\n%s\n```' "$(date -u +%FT%TZ)" "$BODY_TAIL")"
          fi
