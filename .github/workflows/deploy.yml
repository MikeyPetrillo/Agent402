    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # Restores ~/.npm keyed on package-lock.json. `npm ci` still runs and
          # still installs exactly what the lockfile pins, so this only saves
          # the network fetch - a stale or poisoned cache cannot change which
          # versions land. Measured before adding it: 21s/19s/16s across the
          # three lanes on every single run, all of it re-downloading tarballs
          # that had not changed.
          cache: npm
      # node_modules restored by lockfile hash (2026-08-25): npm ci was 13-17 s in
      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        # F07: shadow the job-scope provider keys to EMPTY for this step only, so
        # a malicious dependency lifecycle script running during `npm ci` cannot
        # read them. No server or tool runs here, so empty keys are harmless.
        env:
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
        run: npm ci
      # Chromium is ~150 MB from Playwright's CDN plus an apt round for fonts,
      # 30 s on a good day and the step that stalled two runs for 28 min on a
      # bad apt mirror (2026-08-18, see the install step). The browser bundle
      # keys on the installed playwright-core version, so a dependency bump
      # re-downloads and everything else hits. On a hit the install step is
      # skipped outright: Chromium's shared libraries are already on the
      # ubuntu-24.04 image and the fonts it pulls are not what any browser test
      # here measures.
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Install Playwright Chromium (+ system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        # `--with-deps` runs apt-get against the runner's mirror list
        # (/etc/apt/apt-mirrors.txt), whose first entry is
        # azure.archive.ubuntu.com. On 2026-08-18 that mirror was bad on SOME
        # runners and fine on others: two runs stalled with no output for 28 min
        # until cancelled; later the same commit's push run finished this step
        # in ~45s while its pull_request twin, started the same second on
        # another runner, answered InRelease after 30s and crawled at ~295 kB/s
        # (attempt 3 spent 128s on 21 MB of fonts and never finished) — 3 of 3
        # attempts lost, because every retry walked the same mirror list. So:
        # (1) prefer the canonical archive and keep azure as a fallback, (2) an
        # apt inactivity timeout, so a stalled transfer fails over to the next
        # mirror instead of eating the attempt (apt's default is 120s, longer
        # than our per-attempt bound), (3) after a lost attempt drop azure from
        # the list entirely, and (4) a mirror set that is dead for a full three
        # attempts fails the step LOUDLY instead of eating the job's timeout.
        # The only apt payload here is fonts (Chromium's shared libraries are
        # already on the ubuntu-24.04 image), so a mirror swap changes nothing
        # about what gets installed.
        timeout-minutes: 10
        env:
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-mirror-timeouts >/dev/null
          set_mirrors() {  # $1 = "with-azure" | "no-azure"
            [ -f /etc/apt/apt-mirrors.txt ] || return 0
            {
              printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\n'
              [ "$1" = "with-azure" ] && printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n'
              printf 'https://security.ubuntu.com/ubuntu/\tpriority:3\n'
            } | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          }
          set_mirrors with-azure
          for i in 1 2 3; do
            if timeout 170 npx playwright install --with-deps chromium; then exit 0; fi
            echo "playwright install attempt $i failed or stalled (apt mirror?) - retrying without the azure mirror"
            # A stalled apt-get may outlive the killed npx (sudo can detach it
            # from the group); clear it so the retry isn't blocked on its lock.
            # The stall is in apt's fetch phase, so killing it is safe.
            sudo pkill -TERM -f 'apt-get' 2>/dev/null || true
            set_mirrors no-azure
            sleep 10
          done
          echo "playwright install failed 3x - the runner's apt mirror is likely down"
          exit 1
      - name: Start server in free mode
        run: |
          # Raise the MCP rate limit so the full-catalog connector test can sweep
          # every tool (production keeps the default 20/min, 120/hr).
          AGENT402_MCP_MAX_PER_MIN=1000000 AGENT402_MCP_MAX_PER_HOUR=1000000 \
