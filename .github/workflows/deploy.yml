      !cancelled()
      && (
        (github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/sweet-brown-i99jl3')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/sweet-brown-i99jl3')) || github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' || inputs.mode == 'deploy' || inputs.mode == 'publish') || needs.markers.outputs.test == 'true' || needs.markers.outputs.deploy == 'true' || needs.markers.outputs.publish == 'true'
      )
      && needs.tree-gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # A healthy run takes 22-25 min. Without this the GitHub default is 360
    # min, and on 2026-08-18 two consecutive runs sat for 28+ min inside the
    # Playwright system-deps apt step (see below) — the deploy job hard-gates
    # on this one, so a hung test job silently blocks every deploy behind it.
    timeout-minutes: 60
    # A REAL redis, because until 2026-08-07 nothing in CI ever connected to
    # one. test-shared-limit.js injects a fake store deliberately (it proves
    # "two callers share one counter", and a fake proves that exactly), but
    # that left the redis CLIENT path untested — so Dependabot's redis 4 -> 6
    # bump arrived with a green CI that could not have caught a client
    # regression. Prod is not in-memory: REDIS_URL is set there, and the shared
    # limiter FAILS CLOSED, so a client regression refuses trials.
    env:
      UPSTREAM_COSTS_JSON: ${{ secrets.UPSTREAM_COSTS_JSON }}
      # A fork PR cannot read the secret; its cost-table suites skip instead of failing.
      UPSTREAM_COSTS_OPTIONAL: ${{ github.event.pull_request.head.repo.fork && '1' || '' }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API_KEY_V2: ${{ secrets.FRED_API_KEY_V2 }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      # Raises CoinGecko off the 30/min keyless budget shared per runner IP.
      # It does NOT make the calls free: the Demo plan has a monthly quota and
      # CI would burn it on every push, which is the trap the Brave notes in
      # test-non-metered-examples.js already record. So the sweep still SAMPLES
      # the family (COINGECKO_SLUGS there). Key plus sampling: the two live
      # calls per run are reliable, and the quota lasts.
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Restores ~/.npm keyed on package-lock.json. `npm ci` still runs and
          # still installs exactly what the lockfile pins, so this only saves
          # the network fetch - a stale or poisoned cache cannot change which
          # versions land. Measured before adding it: 21s/19s/16s across the
          # three lanes on every single run, all of it re-downloading tarballs
          # that had not changed.
          cache: npm
      # node_modules restored by lockfile hash (2026-08-25): npm ci was 13-17 s in
      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        # F07: shadow the job-scope provider keys to EMPTY for this step only, so
        # a malicious dependency lifecycle script running during `npm ci` cannot
        # read them. No server or tool runs here, so empty keys are harmless.
        env:
          UPSTREAM_COSTS_JSON: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: npm ci
      - name: Start server in free mode
        run: |
          # Raise the MCP rate limit so the full-catalog connector test can sweep
          # every tool (production keeps the default 20/min, 120/hr).
          AGENT402_MCP_MAX_PER_MIN=1000000 AGENT402_MCP_MAX_PER_HOUR=1000000 \
            AGENT402_SHOW_ROUTER=1 X402_SYNC_ON_START=false FREE_MODE=true X402_PAYWALL_PROBES_PER_CYCLE=0 PORT=3000 node src/server.js &
          for i in $(seq 1 20); do curl -s localhost:3000/health >/dev/null && break; sleep 1; done
      - name: Offline suites (16 scripts, one process each)
        run: bash scripts/ci/run-step.sh test 1

      - name: Previously-orphaned kit suites (offline, no upstream spend)
        # These 30 suites existed but no workflow ran them. All verified offline
        # and spend-free: test-enrich-kit gates live calls behind ENRICH_LIVE_TEST.
        # Listed one per line ON PURPOSE - a for-loop over a variable hides
        # which suites actually run, and test-ci-coverage.js requires the
        # literal path so the wiring stays greppable.
        run: |
          set -e
          node scripts/test-a2a-card.js
          node scripts/test-proof-card.js
          node scripts/test-api-kit.js
          node scripts/test-free-tool-bounds.js
          node scripts/test-captcha-kit.js
          node scripts/test-chain-logos.js
          node scripts/test-date-time-kit.js
          node scripts/test-theme.js
          node scripts/test-faint-contrast.js
          node scripts/test-design-tokens.js
          node scripts/test-design-tokens.js --self-test
          node scripts/test-reveal-on-scroll.js
          node scripts/test-validation-kit.js
          node scripts/test-text-analysis-kit.js
          node scripts/test-heartbeat-token.js
          node scripts/test-lb-warmstart.js
          node scripts/test-sor-seed.js
          node scripts/test-self-funding.js
          node scripts/test-x402-buyer.js
          # Router money invariants through the real payers: one deadline per purchase, release only on proof, every signed payment recorded as our own, one memo key (stub sellers and chain, offline)
          node scripts/test-router-money.js
          node scripts/test-router-identification.js
          node scripts/test-synthetic-marker.js
          node scripts/test-router-health.js
          node scripts/test-chain-kit.js
          node scripts/test-contract-kit.js
          node scripts/test-address-label-settlement.js
          node scripts/test-dex-kit.js
          node scripts/test-forecast-kit.js
          node scripts/test-mev-and-l2-kit.js
          node scripts/test-nft-market-kit.js
          node scripts/test-onchain-identity-kit.js
          node scripts/test-prediction-market-kit.js
          node scripts/test-price-feed-kit.js
          node scripts/test-weather-kit.js
          node scripts/test-web-kit.js
          node scripts/test-enrich-kit.js

      - name: Rails-copy lock (rails.js ↔ payments.js + every key page renders every rail)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-rails.js

      - name: Discoverability (every tool reachable on every surface an agent reads)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-discoverability.js

      - name: Legacy surfaces still redirect (needs the booted server)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-redirects.js

      - name: Projection parity (one tool, three surfaces, one vocabulary)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-projection-parity.js

      - name: Retry-safety contract is true, verifiable, and not re-absolutised
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-retry-contract.js

      - name: Gate integrity (each regression gate must FAIL when its own defect is reintroduced)
        # A gate that cannot fail turns "we never checked" into "we checked and it
        # was fine". This mutates each invariant and requires a non-zero exit,
        # then asserts every mutated file was restored.
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-gates.js

      - name: Docs truth (every documented route, slug and price matches the served catalog)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-docs-truth.js
      - name: Wiki facts (ranges, ladders, tier caps and the router order match the code)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-wiki-facts.js
      - name: Skill-pack pricing rule (every pack = sum of its tools minus 10%, recomputed from the live catalog)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-pack-pricing-rule.js

      - name: Public-surface leak gate (no buyer addresses, no per-tool revenue, operator feeds stay 404)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-public-surface-leak.js

      - name: Chain page layout stability (no chain's page geometry shifts based on how long its name is)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-chain-page-layout-stability.js

      - name: Title coverage (tool, skill, doc and guide H1s wrap balanced, never clipped)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-title-clamp-coverage.js

      - name: Reveal-on-scroll coverage (shared, site-wide - not a per-page opt-in that only ever reached the homepage)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-reveal-coverage.js

      - name: Single <main> landmark per page (no page-level renderer may nest a second <main> inside ledgerShell's own)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-single-main-landmark.js

      - name: Heading order (one h1 per page, no skipped levels, no empty headings - a screen reader announces level as structure)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-heading-order.js

      - name: Wrong-method 405 with Allow header (a known catalog path hit with the wrong verb no longer looks like a dead route)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-wrong-method-405.js

      - name: Heartbeat probe mapping (FAILS -> per-component status; stubbed curl — offline)
        run: bash scripts/test-heartbeat-probe.sh

      # Strict FREE_MODE sweep of paid tools that do NOT burn Brave/OpenAI/
      # OpenRouter/E2B/FRED/Neynar/etc. Fails on 502/503/504
      # (unlike test-all.js NETWORK leniency — that hole kept gov-data green
      # while dead; issue #730). Filter never calls metered routes; own-boot
      # strips keys too. Uses the shared FREE_MODE server when TARGET_URL is set.
      - name: Remote MCP connector (/mcp — initialize, search, free call, paid refusal)
        run: AGENT402_SHOW_ROUTER=1 TARGET_URL=http://127.0.0.1:3000 node scripts/test-mcp-http.js

      - name: "Every tool through the MCP connector (call_tool — free executes, wallet refuses)"
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-mcp-all.js

      - name: "Independent MCP client (the reference SDK client reads a local boot; a stub drift fails it)"
        run: node scripts/test-mcp-client-check.js

      - name: "Self-consistency — every tool and route our own text names must exist"
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-mcp-self-consistency.js

      - name: Bazaar listing copy (curated flagship descriptions name real slugs, fit the 500-char cap, say when to use them; generic cap never cuts mid-word)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-bazaar-descriptions.js

      - name: /api/stats surfaces the M2M economy
        run: |
          curl -s localhost:3000/api/hash -X POST -H 'Content-Type: application/json' -d '{"text":"x"}' >/dev/null
          curl -s localhost:3000/api/stats | jq -e '.tools >= 500 and .toolCallsServed.total >= 1 and (.summary | test("machine-to-machine"))' >/dev/null \
            && echo "/api/stats OK" || { echo "/api/stats wrong"; curl -s localhost:3000/api/stats; exit 1; }
      - name: Runner kills and memory (on failure)
        if: failure()
        run: |
          free -m || true
          sudo dmesg -T 2>/dev/null | grep -iE 'killed process|out of memory|oom-kill' | tail -20 || true
          ps -eo pid,rss,etime,comm --sort=-rss | head -15 || true

  test-paid:
    # Suites that boot their OWN paid-mode or stub-facilitator server (PoW gate,
    # bridge routes, multi-chain 402, deep security audit, adapters, MCP e2e /
    # tasks / native MPP, PostHog funnel). Split out of `test` on 2026-08-25:
    # none of them touch the shared free-mode server, and together they were
    # ~130 s of that lane, which had become the critical path once the sweeps
    # moved out. No redis service: nothing here sets REDIS_URL.
    needs: [markers, tree-gate]
    if: >-
      !cancelled()
      && (
        (github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/sweet-brown-i99jl3')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/sweet-brown-i99jl3')) || github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' || inputs.mode == 'deploy' || inputs.mode == 'publish') || needs.markers.outputs.test == 'true' || needs.markers.outputs.deploy == 'true' || needs.markers.outputs.publish == 'true'
      )
      && needs.tree-gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UPSTREAM_COSTS_JSON: ${{ secrets.UPSTREAM_COSTS_JSON }}
      # A fork PR cannot read the secret; its cost-table suites skip instead of failing.
      UPSTREAM_COSTS_OPTIONAL: ${{ github.event.pull_request.head.repo.fork && '1' || '' }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API_KEY_V2: ${{ secrets.FRED_API_KEY_V2 }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Restores ~/.npm keyed on package-lock.json. `npm ci` still runs and
          # still installs exactly what the lockfile pins, so this only saves
          # the network fetch - a stale or poisoned cache cannot change which
          # versions land. Measured before adding it: 21s/19s/16s across the
          # three lanes on every single run, all of it re-downloading tarballs
          # that had not changed.
          cache: npm
      # node_modules restored by lockfile hash (2026-08-25): npm ci was 13-17 s in
      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        # F07: shadow the job-scope provider keys to EMPTY for this step only, so
        # a malicious dependency lifecycle script running during `npm ci` cannot
        # read them. No server or tool runs here, so empty keys are harmless.
        env:
          UPSTREAM_COSTS_JSON: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: npm ci
      - name: Deep security audit (payment gate + PoW replay/slug-bind/tamper + SSRF + attribution; boots paid-mode)
        # No POW_SECRET here, on purpose: the audit only talks to the server it
        # boots, which mints and verifies its own challenges, so src/pow.js's
        # random per-process secret is exactly right. The production signer has
        # no business in this step.
        run: |
          # Boot a paid-mode server (x402 paywall ACTIVE) so the gate is real,
          # then run the deep audit against it. PoW/SSRF/attribution assertions
          # are facilitator-independent; the unpaid-402 shape check lights up
          # when the base-sepolia facilitator syncs, and fails CLOSED otherwise
          # (the audit treats fail-closed as no-bypass, only a 200 is a hard fail).
          WALLET_ADDRESS=0x0000000000000000000000000000000000000001 NETWORK=base-sepolia \
          POW_DIFFICULTY=12 POW_ALLOW_EPHEMERAL=true \
          PORT=3778 node src/server.js > /tmp/audit-deep-srv.log 2>&1 &
          SRV_PID=$!
          for i in $(seq 1 30); do curl -s localhost:3778/api/pow >/dev/null && break; sleep 1; done
          BASE_URL=http://127.0.0.1:3778 node scripts/audit-deep.mjs; rc=$?
          kill $SRV_PID 2>/dev/null || true
          exit $rc

      - name: Adapter tests (openai-tools + anthropic-tools + ai-sdk + langchain + openai-agents + llamaindex + strands + google-adk + langchain-py)
        # Installs framework packages from the registry: no secret in this env.
        env:
          UPSTREAM_COSTS_JSON: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: |
          X402_SYNC_ON_START=false FREE_MODE=true PORT=3091 node src/server.js > /tmp/a402-test.log 2>&1 &
          ADAPTER_PID=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3091/health >/dev/null && break || sleep 0.5; done
          curl -sf http://127.0.0.1:3091/health >/dev/null || { echo "FREE_MODE server failed to boot"; cat /tmp/a402-test.log; kill $ADAPTER_PID; exit 1; }
          # Each adapter test self-installs its framework peer (and agent402-client)
          # into its own node_modules; tests verify tool-shape + execute() round-trip.
          # ai-sdk/langchain/openai-agents tests exercise the framework-agnostic
          # spec path (no peer install needed); peer wrappers are checked in
          # consumers' projects via optional peerDeps.
          AGENT402_BASE_URL=http://127.0.0.1:3091 node adapters/openai-tools/test.js
          ( cd adapters/anthropic-tools && npm install ../../client --no-save --silent --ignore-scripts )
          AGENT402_BASE_URL=http://127.0.0.1:3091 node adapters/anthropic-tools/test.js
          AGENT402_BASE_URL=http://127.0.0.1:3091 node adapters/ai-sdk/test.js
          AGENT402_BASE_URL=http://127.0.0.1:3091 node adapters/langchain/test.js
          AGENT402_BASE_URL=http://127.0.0.1:3091 node adapters/openai-agents/test.js
          AGENT402_BASE_URL=http://127.0.0.1:3091 node adapters/openai-agents/test-real-sdk.js
          AGENT402_BASE_URL=http://127.0.0.1:3091 node adapters/llamaindex/test.js
          AGENT402_BASE_URL=http://127.0.0.1:3091 node adapters/strands/test.js
          AGENT402_BASE_URL=http://127.0.0.1:3091 node adapters/google-adk/test.js
          AGENT402_BASE_URL=http://127.0.0.1:3091 node adapters/agentkit/test.js
          node scripts/test-agentkit-data-to-deploy.js
          # The committed contract artifact must be REPRODUCIBLE from the committed
          # source: a bytecode edit that leaves the .sol alone would pass the
          # source-hash pin, so recompile with the pinned solc and diff the blob.
          ( cd examples/agentkit-data-to-deploy && npm i --no-save --ignore-scripts --no-audit --no-fund --silent solc@0.8.28 && node contracts/compile.js && rm -rf node_modules )
          git diff --exit-code -- examples/agentkit-data-to-deploy/contracts/artifact.json
          AGENT402_BASE_URL=http://127.0.0.1:3091 node adapters/eliza/test.js
          # Paid calls in the zero-dependency adapters and the OpenClaw proxy refuse redirects (offline, loopback)
          node scripts/test-adapter-paid-redirects.js
          # Python adapter (agent402-langchain): requests-only keeps CI lean; the
          # test skips the langchain-native path gracefully without langchain-core,
          # so this locks the spec + free proof-of-work call behavior.
          python3 -m pip install --quiet requests
          AGENT402_BASE_URL=http://127.0.0.1:3091 python3 adapters/langchain-py/test.py
          kill $ADAPTER_PID 2>/dev/null || true

      - name: Proof-of-work tier (gate bypass with payments enabled)
        run: |
          # Start a second instance with the x402 paywall ACTIVE so the PoW gate
          # is meaningful (in FREE_MODE everything is free). The facilitator is
          # never contacted (X402_SYNC_ON_START=false); unpaid+unproven requests
          # are rejected, a valid proof-of-work is served.
          WALLET_ADDRESS=0x000000000000000000000000000000000000dEaD NETWORK=base \
          FACILITATOR_URL=https://facilitator.payai.network X402_SYNC_ON_START=false \
          POW_DIFFICULTY=16 PORT=3001 node src/server.js &
          for i in $(seq 1 20); do curl -s localhost:3001/api/pow >/dev/null && break; sleep 1; done
          node --input-type=module -e '
          const B = "http://127.0.0.1:3001";
          const { createHash } = await import("node:crypto");
          const lz = (b) => { let t = 0; for (const x of b) { if (!x) { t += 8; continue; } t += Math.clz32(x) - 24; break; } return t; };
          const solve = (c) => { let n = 0; while (lz(createHash("sha256").update(c.challenge + ":" + n).digest()) < c.difficulty) n++; return n; };
          const fail = (m) => { console.error("FAIL:", m); process.exit(1); };

          const info = await (await fetch(B + "/api/pow")).json();
          if (info.eligibleTools.length < 150) fail("expected >=150 PoW-eligible tools, got " + info.eligibleTools.length);
          if (info.eligibleTools.includes("render")) fail("render must NOT be PoW-eligible");

          const c = await (await fetch(B + "/api/pow/challenge?slug=hash")).json();
          const n = solve(c);
          const ok = await fetch(B + "/api/hash", { method: "POST", headers: { "Content-Type": "application/json", "X-Pow-Solution": c.token + ":" + n }, body: JSON.stringify({ text: "hello world" }) });
          if (ok.status !== 200) fail("valid PoW should return 200, got " + ok.status);
          if ((await ok.json()).hex.slice(0, 8) !== "b94d27b9") fail("wrong hash result");
          console.log("valid PoW -> 200 ✓");

          const replay = await fetch(B + "/api/hash", { method: "POST", headers: { "Content-Type": "application/json", "X-Pow-Solution": c.token + ":" + n }, body: JSON.stringify({ text: "x" }) });
          if (replay.status === 200) fail("replayed challenge must be rejected");
          console.log("replay -> " + replay.status + " ✓");

          const noPow = await fetch(B + "/api/hash", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: "x" }) });
          if (noPow.status === 200) fail("no payment + no PoW must be rejected");
          console.log("no PoW -> " + noPow.status + " ✓");

          const c2 = await (await fetch(B + "/api/pow/challenge?slug=hash")).json();
          const n2 = solve(c2);
          const walletOnly = await fetch(B + "/api/render", { method: "POST", headers: { "Content-Type": "application/json", "X-Pow-Solution": c2.token + ":" + n2 }, body: JSON.stringify({ url: "https://example.com" }) });
          // The PAYWALL must be what answered, never the handler. "!== 200" used
          // to be enough when this lane had Chromium; without it the handler
          // answers 503 even with the gate wide open, and the assertion proved
          // nothing (2026-08-25). This boot never contacts a facilitator
          // (X402_SYNC_ON_START=false), so the paywall cannot mint a 402 here:
          // it fails CLOSED with the x402 route-config 500 ("Facilitator does
          // not support exact on ..."), and that is the paywall speaking too.
          // Anything else - 200, the browser 503, an upstream 502 - means the
          // request reached the handler, i.e. the gate was bypassed.
          // (No apostrophes in this block: it lives inside a single-quoted
          // bash heredoc, and one ended the script on the first run.)
          // The fail-closed 500 carries a generic body (the facilitator wording
          // is in the server log only), so it is recognised by what it is NOT:
          // a bypass here can only surface as 200 or the browser-unavailable
          // 503 (this lane has no Chromium), never as a 500 from the handler
          // that answered 200 on /api/hash a moment ago.
          const wText = await walletOnly.text();
          const paywalled = walletOnly.status === 402 || (walletOnly.status === 500 && !/browser|chromium|render/i.test(wText));
          if (!paywalled) fail("PoW must NOT bypass the wallet-only /api/render (expected the paywall 402 or its fail-closed 500, got " + walletOnly.status + ": " + wText.slice(0, 120) + ")");
          console.log("PoW on wallet-only render -> " + walletOnly.status + " ✓ (paywall answered)");
          console.log("proof-of-work gate: all assertions passed");
          '

      - name: Bridge routes removed (no token grants free access; direct unpaid call still 402s)
        run: |
          # Paywall ACTIVE. The old marketplace bridge (/mkt/<token>/<slug> +
          # X-Mkt-Bypass header) must be fully gone: no token value may skip the
          # x402 paywall, and a direct unpaid call still 402s.
          WALLET_ADDRESS=0x000000000000000000000000000000000000dEaD NETWORK=base \
          FACILITATOR_URL=https://facilitator.payai.network X402_SYNC_ON_START=false \
          MARKETPLACE_TOKEN=test-bridge-token PORT=3004 node src/server.js &
          for i in $(seq 1 20); do curl -s localhost:3004/health >/dev/null && break; sleep 1; done
          node --input-type=module -e '
          import { createHmac } from "node:crypto";
          const B = "http://127.0.0.1:3004"; const fail = (m) => { console.error("FAIL:", m); process.exit(1); };
          const MASTER = "test-bridge-token";
          const tok = (slug) => createHmac("sha256", MASTER).update(slug).digest("hex").slice(0, 32);
          // the old per-slug bridge URL must not exist (even with the env var still set)
          const perSlug = await fetch(B + "/mkt/" + tok("hash") + "/hash", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: "hello world" }) });
          if (perSlug.status === 200) fail("removed bridge route must not serve a result");
          console.log("bridge per-slug URL -> " + perSlug.status + " ✓ (removed)");
          // the old master-token bypass header must not skip the paywall
          const bypass = await fetch(B + "/api/hash", { method: "POST", headers: { "Content-Type": "application/json", "X-Mkt-Bypass": MASTER }, body: JSON.stringify({ text: "x" }) });
          if (bypass.status === 200) fail("X-Mkt-Bypass header must not skip the paywall");
          console.log("bypass header -> " + bypass.status + " ✓ (paywalled)");
          // direct unpaid call to the tool still requires payment
          const direct = await fetch(B + "/api/hash", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: "x" }) });
          if (direct.status === 200) fail("direct unpaid call must still be paywalled");
          console.log("direct unpaid -> " + direct.status + " ✓");
          console.log("bridge removal: all assertions passed");
          '

      - name: Multi-chain USDC — code registers all chains (hard gate) + live 402 (informational)
        run: |
          # HARD GATE: our code must boot multi-chain and advertise the chains in
          # /api/pricing. The live 402 from an external facilitator is captured for
          # diagnostics but does not fail the build (it depends on the facilitator
          # settling each chain, which is verified out-of-band before enabling).
          # SOLANA_WALLET_ADDRESS is the system program id — a syntactically valid
          # base58 pubkey used only as a dummy payTo so the Solana accept is built
          # (without it payments.js omits the Solana option from every 402, which
          # is exactly the silent misconfig this gate must not reproduce).
          WALLET_ADDRESS=0x000000000000000000000000000000000000dEaD NETWORK=base \
          SOLANA_WALLET_ADDRESS=11111111111111111111111111111111 \
          PAYMENT_NETWORKS=base,solana,polygon,arbitrum,stellar FACILITATOR_URL=https://facilitator.payai.network \
          PORT=3002 node src/server.js >/tmp/mc.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:3002/health >/dev/null && break; sleep 1; done
          grep -i "Accepting USDC" /tmp/mc.log
          NETS=$(curl -s localhost:3002/api/pricing | jq -c '.payment.networks')
          echo "pricing.payment.networks = $NETS"
          # Stellar is configured here without its wallet or facilitator, so it is
          # dropped from the offer and /api/pricing lists only what can settle.
          [ "$NETS" = '["base","solana","polygon","arbitrum"]' ] || { echo "code did not register all chains"; exit 1; }
          grep -q "dropping stellar:pubnet from the offered networks" /tmp/mc.log || { echo "a configured chain with no facilitator was not reported as dropped"; exit 1; }
          echo "--- live 402 against PayAI (informational status; hard gate on the accepts below) ---"
          # RETRY LOOP, not one shot: @x402/express syncs the facilitator's
          # /supported lazily — a request that lands before the first sync
          # completes gets a 500 and the middleware retries the sync on the
          # NEXT request (verified in node_modules/@x402/express index.mjs,
          # initPromise reset in initializeHttpServer's catch). A single curl
          # therefore samples a self-healing system once and flaked for months
          # as "the PayAI 500"; five attempts 3s apart make the gate
          # deterministic while still hard-failing a real regression.
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -D /tmp/402.h -o /tmp/402.body -w "%{http_code}" -X POST localhost:3002/api/hash \
              -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{"text":"x"}' || echo 000)
            echo "attempt $i: status $STATUS"
            [ "$STATUS" = "402" ] && break
            sleep 3
          done
          # x402 v2 puts the requirements in the base64 PAYMENT-REQUIRED header
          # (the body is {}); v1 kept them in the body. Decode whichever exists.
          HDR=$(tr -d '\r' < /tmp/402.h | awk -F': ' 'tolower($1)=="payment-required"{print $2}' | head -1)
          if [ -n "$HDR" ]; then echo "$HDR" | base64 -d > /tmp/402req.json 2>/dev/null || cp /tmp/402.body /tmp/402req.json; else cp /tmp/402.body /tmp/402req.json; fi
          echo "402 requirements:"; jq -c '{x402Version, accepts: ([.accepts[]?.network])}' /tmp/402req.json 2>/dev/null || head -c 400 /tmp/402req.json || true
          SOLANA_402=$(jq -r '[.accepts[]? | select((.network // "") | startswith("solana:"))] | length' /tmp/402req.json 2>/dev/null || echo 0)
          [ "$SOLANA_402" -ge 1 ] || { echo "402 accepts is missing the Solana option despite SOLANA_WALLET_ADDRESS being set"; exit 1; }

      - name: Offline suites (3 scripts, one process each)
        run: bash scripts/ci/run-step.sh test-paid 1
      - name: Runner kills and memory (on failure)
        if: failure()
        run: |
          free -m || true
          sudo dmesg -T 2>/dev/null | grep -iE 'killed process|out of memory|oom-kill' | tail -20 || true
          ps -eo pid,rss,etime,comm --sort=-rss | head -15 || true

  test-paid2:
