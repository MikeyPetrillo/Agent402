      - name: Start server in free mode
        run: |
          # Raise the MCP rate limit so the full-catalog connector test can sweep
          # every tool (production keeps the default 20/min, 120/hr).
          AGENT402_MCP_MAX_PER_MIN=1000000 AGENT402_MCP_MAX_PER_HOUR=1000000 \
            X402_SYNC_ON_START=false FREE_MODE=true X402_PAYWALL_PROBES_PER_CYCLE=0 PORT=3000 node src/server.js &
          for i in $(seq 1 20); do curl -s localhost:3000/health >/dev/null && break; sleep 1; done
      - name: Crypto-kit tests (CoinGecko price/market/history/trending/global — keyless live API)
        # Keyless on purpose: the job-scope key is for the sampled sweep only,
        # and these live calls ran against the monthly Demo quota on every push.
        env:
          COINGECKO_API_KEY: ""
        run: node scripts/test-crypto-kit.js

      # The strict sweep runs FIRST so its sampled CoinGecko calls land before
      # the lenient sweep touches that shared 30/min budget; then test-all hands
      # it every route it covers (TEST_ALL_SKIP_STRICT_COVERED) and sweeps the rest.
      - name: Non-metered paid examples (strict — 502/503/504 fail; NETWORK leniency hole)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-non-metered-examples.js

      # Published examples fetch from agent402.tools or our /fixtures/, never
      # another site that can refuse a CI runner (seo-audit, 2026-10-07).
      - name: Published examples name only our own hosts
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-example-hosts.js

      # A price the wiki quotes for an endpoint is the catalog's (wiki/TTS.md
      # kept old TTS prices after a reprice, 2026-10-07).
      - name: Wiki endpoint prices match the catalog
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-wiki-prices.js

      # Every skill pack must WORK on its own published example, not merely
      # return a well-shaped envelope. Nine packs sold for two months answering
      # "0/N steps succeeded" because every guard asserted SHAPE and none
      # asserted OUTCOME.
      #
      # Booted WITHOUT the paid keys on purpose. The keys live on the SERVER, so
      # a keyed boot would make this sweep buy a live Brave query on every push -
      # the CI-spend leak that has recurred three times. With them shadowed,
      # every keyed pack reports "not configured" and is skipped as not-ours,
      # every keyless pack is fully verified, and there is no skip list to drift.
      # The keyed subset is covered by running this against a keyed server by
      # hand; that is a real gap and it is written down rather than hidden.
      - name: Skill packs answer their own published example (keyless boot - no upstream spend)
        env:
          BRAVE_API_KEY: ""
          BRAVE_ANSWERS_API_KEY: ""
          BRAVE_SUGGEST_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          X402_SYNC_ON_START=false X402_INDEX_CRAWL=off FREE_MODE=true PORT=3097 node src/server.js > /tmp/a402-packs.log 2>&1 &
          PACK_PID=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3097/health >/dev/null && break || sleep 1; done
          curl -sf http://127.0.0.1:3097/health >/dev/null || { echo "keyless server failed to boot"; cat /tmp/a402-packs.log; kill $PACK_PID; exit 1; }
          TARGET_URL=http://127.0.0.1:3097 node scripts/test-pack-examples.js; rc=$?
          kill $PACK_PID 2>/dev/null || true
          exit $rc

      - name: Every tool responds to its own example (all ~1070 endpoints)
        run: TEST_ALL_SKIP_STRICT_COVERED=1 TARGET_URL=http://127.0.0.1:3000 node scripts/test-all.js

      - name: CSS tokens resolve (every :root custom property must actually resolve in a real browser, not just exist as text)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-css-tokens-resolve.js
      # Rendered text contrast: every visible text vs its real backdrop, both themes, 390 + 1280 px (Chromium; a dark-surface token on a light surface is invisible in light mode, /sell 2026-09-10)
      - name: Text contrast (rendered, WCAG AA, both themes)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-text-contrast.js
      # Wrap quality, measured: line boxes read back in Chromium at 1440, 400, 390 and 360 px; a
      # last line under 30% or under 3 words, a label split over two lines, a link
      # row ending on one stray link, a code name split mid-word, or text past the
      # viewport fails (DESIGN.md "Wrap"). Every hand-written page in the sitemap and
      # every wiki page; each generated family is a fixed sample of 25 (WRAP_ALL=1
      # runs all of them by hand). The script boots its own server with the index
      # crawlers off: the shared server on :3000 crawls live sellers, and their names
      # and counts change between runs, so the pages it measured were never the same
      # twice. The templates are what this guards; seller data is not in the repo.
      - name: Wrap quality (rendered line boxes, 1440 + 400 + 390 + 360 px, sitemap + wiki, families sampled)
        run: node scripts/test-wrap-quality.js
      # Sticky chrome, measured: html and body are never scroll containers, and the
      # nav, docs TOC, playground panel and 101 bar hold their offsets after a scroll
      # (Chromium, 1440 + 390 px). Boots its own server like the wrap check.
      - name: Sticky chrome (nav and panels hold after a scroll, 1440 + 390 px)
        run: node scripts/test-sticky-chrome.js
      - name: Runner kills and memory (on failure)
        if: failure()
        run: |
          free -m || true
          sudo dmesg -T 2>/dev/null | grep -iE 'killed process|out of memory|oom-kill' | tail -20 || true
          ps -eo pid,rss,etime,comm --sort=-rss | head -15 || true

