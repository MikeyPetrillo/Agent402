      - name: Seller-trust honesty invariants (no evidence never reads as a bad verdict; advertised ≠ settled — offline)
        run: node scripts/test-seller-trust.js

      - name: Package integrity (files allowlist covers every import; no sibling dep range excludes what we ship — offline)
        run: node scripts/test-package-integrity.js

      - name: Analytics redaction (per-tool table never reaches an unauthenticated caller - seeded, DB not required)
        run: node scripts/test-analytics-redaction.js

      - name: Discoverability (every tool reachable on every surface an agent reads)
        run: TARGET_URL=http://localhost:3000 node scripts/test-discoverability.js

      - name: Legacy surfaces still redirect (needs the booted server)
        run: TARGET_URL=http://localhost:3000 node scripts/test-redirects.js

      - name: Retry-safety contract is true, verifiable, and not re-absolutised
