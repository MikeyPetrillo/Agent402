        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Install Playwright Chromium (+ system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        # `--with-deps` runs apt-get against the runner's mirror list
        # (/etc/apt/apt-mirrors.txt), whose first entry is
        # azure.archive.ubuntu.com. On 2026-08-18 that mirror was bad on SOME
        # runners and fine on others: two runs stalled with no output for 28 min
        # until cancelled; later the same commit's push run finished this step
        # in ~45s while its pull_request twin, started the same second on
        # another runner, answered InRelease after 30s and crawled at ~295 kB/s
        # (attempt 3 spent 128s on 21 MB of fonts and never finished) — 3 of 3
        # attempts lost, because every retry walked the same mirror list. So:
        # (1) prefer the canonical archive and keep azure as a fallback, (2) an
        # apt inactivity timeout, so a stalled transfer fails over to the next
        # mirror instead of eating the attempt (apt's default is 120s, longer
        # than our per-attempt bound), (3) after a lost attempt drop azure from
        # the list entirely, and (4) a mirror set that is dead for a full three
        # attempts fails the step LOUDLY instead of eating the job's timeout.
