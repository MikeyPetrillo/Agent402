        # attempts fails the step LOUDLY instead of eating the job's timeout.
        # The only apt payload here is fonts (Chromium's shared libraries are
        # already on the ubuntu-24.04 image), so a mirror swap changes nothing
        # about what gets installed.
        timeout-minutes: 10
        env:
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
        run: bash scripts/ci-apt-install.sh --playwright-chromium
      - name: Start server in free mode
        run: |
          # Raise the MCP rate limit so the full-catalog connector test can sweep
          # every tool (production keeps the default 20/min, 120/hr).
          AGENT402_MCP_MAX_PER_MIN=1000000 AGENT402_MCP_MAX_PER_HOUR=1000000 \
            X402_SYNC_ON_START=false FREE_MODE=true X402_PAYWALL_PROBES_PER_CYCLE=0 PORT=3000 node src/server.js &
          for i in $(seq 1 20); do curl -s localhost:3000/health >/dev/null && break; sleep 1; done
      - name: Exercise tools against live sites
        run: |
          echo "=== extract: BBC News article ==="
          curl -s -X POST localhost:3000/api/extract -H 'Content-Type: application/json' \
            -d '{"url":"https://www.bbc.com/news"}' | jq '{title, siteName, wordCount, sample: (.markdown | .[0:400])}'
          echo "=== extract: Wikipedia x402-adjacent page ==="
          curl -s -X POST localhost:3000/api/extract -H 'Content-Type: application/json' \
            -d '{"url":"https://en.wikipedia.org/wiki/List_of_HTTP_status_codes"}' | jq '{title, wordCount, sample: (.markdown | .[0:400])}'
          echo "=== meta: github.com ==="
          curl -s 'localhost:3000/api/meta?url=https://github.com' | jq .
          echo "=== dns: MX for gmail.com ==="
          curl -s 'localhost:3000/api/dns?name=gmail.com&type=MX' | jq .
          echo "=== dns: TXT for openai.com ==="
          curl -s 'localhost:3000/api/dns?name=openai.com&type=TXT' | jq '.records | length as $n | {records_found: $n}'
          echo "=== SSRF guard: cloud metadata endpoint must be blocked ==="
          curl -s -X POST localhost:3000/api/extract -H 'Content-Type: application/json' \
            -d '{"url":"http://169.254.169.254/latest/meta-data"}' | jq .
          echo "=== render: JS-only page (plain extract cannot read this) ==="
          curl -s -X POST localhost:3000/api/render -H 'Content-Type: application/json' \
            -d '{"url":"https://react.dev"}' | jq '{title, wordCount, rendered, sample: (.markdown | .[0:300])}'
          echo "=== screenshot: example.com ==="
          curl -s 'localhost:3000/api/screenshot?url=https://example.com' -o shot.png
          file shot.png && ls -la shot.png
          echo "=== pdf: arXiv 'Attention Is All You Need' ==="
          curl -s -X POST localhost:3000/api/pdf -H 'Content-Type: application/json' \
            -d '{"url":"https://arxiv.org/pdf/1706.03762"}' | jq 'if .error then . else {pages, wordCount, sample: (.text | .[0:150])} end'
          echo "=== memory: write/read/isolation ==="
          curl -s -X POST 'localhost:3000/api/memory?ns=ci' -H 'Content-Type: application/json' -d '{"key":"a","value":{"n":1}}' | jq .
          curl -s 'localhost:3000/api/memory?ns=ci&key=a' | jq .
          curl -s 'localhost:3000/api/memory?ns=other&key=a' | jq .
          echo "=== memory v2: counter / recall / audit log ==="
          curl -s -X POST 'localhost:3000/api/memory/incr?ns=ci' -H 'Content-Type: application/json' -d '{"key":"jobs","by":3}' | jq -c .
          curl -s -X POST 'localhost:3000/api/memory/remember?ns=ci' -H 'Content-Type: application/json' -d '{"text":"The Railway deploy failed: build out of memory"}' | jq -c '{stored}'
          curl -s -X POST 'localhost:3000/api/memory/remember?ns=ci' -H 'Content-Type: application/json' -d '{"text":"pineapple pizza recipe"}' | jq -c '{stored}'
          curl -s -X POST 'localhost:3000/api/memory/recall?ns=ci' -H 'Content-Type: application/json' -d '{"query":"deployment ran out of memory","k":1}' | jq -c '.results[0].text'
          curl -s 'localhost:3000/api/memory/log?ns=ci&limit=3' | jq -c '.entries|map(.action)'
          echo "=== kit: encoding/data/text/time/validation ==="
          curl -s -X POST localhost:3000/api/hash -H 'Content-Type: application/json' -d '{"text":"hello"}' | jq -c .
          curl -s -X POST localhost:3000/api/json-to-csv -H 'Content-Type: application/json' -d '{"json":[{"a":1,"b":{"c":2}}]}' | jq -c .
          curl -s -X POST localhost:3000/api/cron-next -H 'Content-Type: application/json' -d '{"expr":"0 9 * * 1-5","count":2}' | jq -c .
          curl -s -X POST localhost:3000/api/email-validate -H 'Content-Type: application/json' -d '{"email":"test@gmail.com"}' | jq -c '{syntaxValid, deliverableDomain}'
          curl -s 'localhost:3000/api/uuid?version=7&count=2' | jq -c .
          curl -s 'localhost:3000/api/qr?text=https://agent402.tools' -o qr.png && file qr.png
          echo "=== brand assets ==="
          curl -s localhost:3000/logo.svg | grep -q '<svg' && echo "logo.svg ✓"
          curl -sL localhost:3000/logo.png -o logo.png && file logo.png | grep -q 'PNG image' && echo "logo.png ✓"
          curl -s localhost:3000/card.svg | grep -q '<svg' && echo "card.svg ✓"
          curl -sL localhost:3000/card.png -o card.png && file card.png | grep -q 'PNG image' && echo "card.png (1200x630 social card) ✓"
          echo "=== search: live web search (opt-in via BRAVE_LIVE_TEST=1) ==="
          # Every [test] run otherwise burns the Brave subscription with calls the
          # daily paid-canary (scripts/paid-canary.js) already covers post-deploy.
          # When the key is set but BRAVE_LIVE_TEST!=1, just verify the route is
          # registered (route returns either 200 or a structured 503 — never 404).
          if [ "$BRAVE_LIVE_TEST" = "1" ] && [ -n "$BRAVE_API_KEY" ]; then
            curl -s 'localhost:3000/api/search?q=x402+payment+protocol&count=3' | jq '{query, count, top: .results[0].url}'
            curl -s 'localhost:3000/api/search?q=x402+payment+protocol&count=3' | jq -e '.count >= 1' >/dev/null || { echo "search returned no results"; exit 1; }
          elif [ -z "$BRAVE_API_KEY" ]; then
            echo "(BRAVE_API_KEY secret not set — verifying the unconfigured 503 path)"
            code=$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3000/api/search?q=test')
            [ "$code" = "503" ] || { echo "expected 503 without key, got $code"; exit 1; }
          else
            echo "(BRAVE_LIVE_TEST!=1 — skipping live Brave call; route registration is covered by the /openapi.json + test-search-kit.js validation paths, and paid-canary covers post-deploy live verification)"
          fi
          echo "=== demand kit: live (pdf-to-markdown) ==="
          curl -s -X POST localhost:3000/api/pdf-to-markdown -H 'Content-Type: application/json' \
            -d '{"url":"https://arxiv.org/pdf/1706.03762"}' | jq '{pages, wordCount, md: (.markdown | .[0:160])}'
          echo "=== live public data (data.gov / NWS / USGS) ==="
          # data.gov has frequent upstream outages — exercise gov-data but don't
          # hard-fail the suite on its availability (the tool returns an honest
          # 502 when data.gov is down). NWS + USGS below are reliable and strict.
          GD=$(curl -s 'localhost:3000/api/gov-data?q=electric+vehicle+charging&rows=3')
          echo "$GD" | jq '{totalFound, top: .results[0].title, error}'
          echo "$GD" | jq -e '.totalFound >= 1' >/dev/null && echo "  gov-data OK" || echo "  (gov-data upstream flaky right now — not failing the suite)"
          curl -s 'localhost:3000/api/weather-alerts?area=CA' | jq '{count, top: .alerts[0].event}'
          curl -s 'localhost:3000/api/weather-alerts?area=CA' | jq -e 'has("alerts")' >/dev/null || { echo "weather-alerts malformed"; exit 1; }
          curl -s 'localhost:3000/api/earthquakes?minMag=2.5&period=day' | jq '{count, top: .quakes[0].place}'
          curl -s 'localhost:3000/api/earthquakes?minMag=2.5&period=day' | jq -e '.count >= 1' >/dev/null || { echo "earthquakes returned nothing"; exit 1; }
          echo "=== kit: live network tools ==="
          curl -s -X POST localhost:3000/api/http-check -H 'Content-Type: application/json' -d '{"url":"https://example.com"}' | jq -c '{up, status, latencyMs}'
          curl -s -X POST localhost:3000/api/tls-cert -H 'Content-Type: application/json' -d '{"host":"github.com"}' | jq -c '{subject, issuer, daysRemaining, chainTrusted}'
          curl -s -X POST localhost:3000/api/whois -H 'Content-Type: application/json' -d '{"domain":"github.com"}' | jq -c '{registrar, created, expires}'
          curl -s -X POST localhost:3000/api/robots-check -H 'Content-Type: application/json' -d '{"url":"https://www.google.com/search","userAgent":"TestBot"}' | jq -c '{allowed, matchedRule}'
          curl -s -X POST localhost:3000/api/sitemap -H 'Content-Type: application/json' -d '{"url":"https://www.sitemaps.org/sitemap.xml"}' | jq -c '{type, count}'
          echo "=== discovery surfaces ==="
          N=$(curl -s localhost:3000/api/pricing | jq '.endpoints | length'); echo "catalog endpoints: $N (expect >= 500)"; [ "$N" -ge 500 ]
          curl -s localhost:3000/openapi.json | jq '{paths: (.paths | length)}'
          curl -s localhost:3000/tools | grep -oiE -m1 '<h1[^>]*>'
          curl -s localhost:3000/tools/memory-write | grep -o '<title>[^<]*</title>'
          curl -s localhost:3000/sitemap.xml | grep -c '<loc>'

      # page-speed against a port-0 fixture (loopback refused by the public guard; timings, Web Vitals, heaviest, render-blocking, console errors, the single-measurement field) and
      - name: Browser pool tools (page-speed fixture + html-frames sandbox)
        run: node scripts/test-page-speed-frames.js

      - name: Browser contexts block service workers, WebSockets, redirect hops and popups to private hosts (real Chromium)
        run: node scripts/test-render-isolation.js

      - name: A refused redirect of the page's navigation answers 400; one proxy refusal text (real Chromium)
        run: node scripts/test-render-redirect-refusal.js

      - name: html-frames runs in its own jitless browser, no WebAssembly, failures bounded per payer (real Chromium)
        run: node scripts/test-html-frames-isolation.js
      # html-frames through the server: a payer's failed documents are bounded (free-mode boot, port 0)
      - name: html-frames failure bound through the route
        run: node scripts/test-html-frames-failure-bound.js

      - name: Chromium and the media binaries get an allowlisted environment, never a secret (real Chromium)
        run: node scripts/test-child-env.js

      - name: CSP violations sitewide (real browser, every distinct page template + real interactions on click-gated pages - script-src has no 'unsafe-inline' since 2026-08-16)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-csp-violations.js

      - name: Static asset caching (versioned /js immutable, other /js short; fonts immutable woff2 behind an allowlist)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-static-asset-cache.js

      - name: SDK playground sandbox runs code only for the page that frames it (real browser, cross-origin opener and frame)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-sdk-sandbox-origin.js

      - name: Focus-visible on search/demo inputs (real browser check - inline style can silently defeat a stylesheet :focus rule)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-focus-visible.js

      - name: /status 90-day strip fits a phone (local server, builds its own strip)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-status-bars-mobile.js

      - name: Reveal-on-scroll data-reveal-eager opt-in (a second above-fold section can be exempted explicitly, never leaks to unmarked pages)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-reveal-eager.js

      - name: Reveal-on-scroll skip-over safety net (a single fast scroll jump must never leave a section permanently invisible — real browser, found live on /marketplace 2026-08-16)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-reveal-scroll-skip.js

      - name: Hamburger menu aria-label toggles with aria-expanded (real browser click, not a static string check)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-burger-aria-label.js

      - name: Input labels (every text input has an accessible name; session replay stays off)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-input-labels.js

      - name: Controls and focus in a browser (skip link, focus ring, control contrast, target size, code block copy, storefront labels)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-a11y-controls.js

      - name: gov-data Catalog API v4 (retired CKAN v3 proxy 404s on catalog-old)
        run: node scripts/test-gov-data.js
      - name: Runner kills and memory (on failure)
        if: failure()
        run: |
          free -m || true
          sudo dmesg -T 2>/dev/null | grep -iE 'killed process|out of memory|oom-kill' | tail -20 || true
          ps -eo pid,rss,etime,comm --sort=-rss | head -15 || true

  test-pricing:
    # Test job runs on its own [test] marker AND auto-runs whenever a commit
    # asks to deploy or publish — so deploy/publish can hard-gate on it via
    # `needs: test`. This makes "ship without running tests" impossible by
    # design, not by developer discipline.
    needs: [markers, tree-gate]
    # Runs on the [test]/[deploy]/[publish] markers, on the matching
    # workflow_dispatch modes, on every PR into main (N-04: so the required
    # `test` status check always reports), AND unconditionally on every push
    # to main — a merge to main has no marker to scan (see the `on:` block
    # above) and needs none: it is asked to test-and-deploy regardless.
    # `!cancelled()` because tree-gate does not run at all outside a push to
    # main, and a SKIPPED `needs` job skips its dependents unless the dependent
    # carries a status function - without this, every dev-branch and PR run
    # would silently stop testing. With tree-gate skipped OR failed its output
    # is empty, which is not 'true', so the lane runs: the gate can only ever
    # subtract work by succeeding and saying so.
    if: >-
      !cancelled()
      && (
        (github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/sweet-brown-i99jl3')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/sweet-brown-i99jl3')) || github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' || inputs.mode == 'deploy' || inputs.mode == 'publish') || needs.markers.outputs.test == 'true' || needs.markers.outputs.deploy == 'true' || needs.markers.outputs.publish == 'true'
      )
      && needs.tree-gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # A healthy run takes 22-25 min. Without this the GitHub default is 360
    # min, and on 2026-08-18 two consecutive runs sat for 28+ min inside the
    # Playwright system-deps apt step (see below) — the deploy job hard-gates
    # on this one, so a hung test job silently blocks every deploy behind it.
    timeout-minutes: 60
    # Sharded into 2 runners (scripts/lib/ci-shards.js), each with its own services and
    # server. Shard 1 keeps this lane's name for the required check; `t` runs every
    # second call of the job in turn, and a single-script step names its shard.
    name: ${{ matrix.shard == 1 && 'test-pricing' || format('test-pricing ({0}/2)', matrix.shard) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # A REAL redis, because until 2026-08-07 nothing in CI ever connected to
    # one. test-shared-limit.js injects a fake store deliberately (it proves
    # "two callers share one counter", and a fake proves that exactly), but
    # that left the redis CLIENT path untested — so Dependabot's redis 4 -> 6
    # bump arrived with a green CI that could not have caught a client
    # regression. Prod is not in-memory: REDIS_URL is set there, and the shared
    # limiter FAILS CLOSED, so a client regression refuses trials.
    env:
      CI_SHARD: ${{ matrix.shard }}
      CI_SHARDS: "2"
      UPSTREAM_COSTS_JSON: ${{ secrets.UPSTREAM_COSTS_JSON }}
      # A fork PR cannot read the secret; its cost-table suites skip instead of failing.
      UPSTREAM_COSTS_OPTIONAL: ${{ github.event.pull_request.head.repo.fork && '1' || '' }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API_KEY_V2: ${{ secrets.FRED_API_KEY_V2 }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      # Raises CoinGecko off the 30/min keyless budget shared per runner IP.
      # It does NOT make the calls free: the Demo plan has a monthly quota and
      # CI would burn it on every push, which is the trap the Brave notes in
      # test-non-metered-examples.js already record. So the sweep still SAMPLES
      # the family (COINGECKO_SLUGS there). Key plus sampling: the two live
      # calls per run are reliable, and the quota lasts.
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # node_modules restored by lockfile hash (2026-08-25): npm ci was 13-17 s in
      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        env:
          UPSTREAM_COSTS_JSON: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: npm ci

      - name: Offline suites (62 scripts, one process each)
        run: bash scripts/ci/run-step.sh test-pricing 1
      - name: Runner kills and memory (on failure)
        if: failure()
        run: |
          free -m || true
          sudo dmesg -T 2>/dev/null | grep -iE 'killed process|out of memory|oom-kill' | tail -20 || true
          ps -eo pid,rss,etime,comm --sort=-rss | head -15 || true

