          # crypto-markets kit (offline)
          t node scripts/test-crypto-markets-kit.js

      - name: Previously-orphaned kit suites (offline, no upstream spend)
        # These 31 suites existed but no workflow ran them. All verified offline
        # and spend-free: test-blockscout-kit deletes X402_UPSTREAM_BUYER_KEY
        # itself, test-enrich-kit gates live calls behind ENRICH_LIVE_TEST.
        # Listed one per line ON PURPOSE - a for-loop over a variable hides
        # which suites actually run, and test-ci-coverage.js requires the
        # literal path so the wiring stays greppable.
        run: |
