        if: matrix.shard == 1
        run: X402_INDEX_CRAWL=off node scripts/test-route-aliases.js
      # What a seller can buy by renaming: the slug/name/description weights,
      # the placement premium as absolute scores, and both failure directions
      # (a 40-keyword slug must not win short queries; a FastAPI-generated
      # operationId must not be penalized for being long). Offline, mutation-tested.
      - name: Router slug weighting - what renaming is worth (offline)
        if: matrix.shard == 1
        run: X402_INDEX_CRAWL=off node scripts/test-route-slug-weighting.js
      # /api/route on a prod-sized pool (3,000 sellers / ~113k rows): the candidate index keeps a
      # query under the bound and the ranking byte-identical to the full-scan golden (offline, mutation-tested)
      - name: Router perf pin + golden ranking on a prod-sized index (offline)
        if: matrix.shard == 1
        run: X402_INDEX_CRAWL=off node scripts/test-route-perf.js
      # routeQueryAsync answers exactly as routeQuery and hands the event loop back while scoring (offline, mutation-tested)
      - name: Router async query equals sync and yields the loop (offline)
        if: matrix.shard == 1
        run: X402_INDEX_CRAWL=off node scripts/test-route-query-async.js
      # The router's short-term whole-token match agrees with the Unicode regex it replaced (20k-case fuzz, offline)
      - name: Router whole-token matcher equals the regex (offline)
        if: matrix.shard == 1
        run: X402_INDEX_CRAWL=off node scripts/test-whole-token-matcher.js
      # ?network= was echoed and never applied; the Solana SOR branch ranks strictly on-chain rows (offline, mutation-tested)
      - name: Router network filter + strict chain mode (offline)
        if: matrix.shard == 1
        run: X402_INDEX_CRAWL=off node scripts/test-route-network-filter.js
      # A documented path is not a callable URL: brace, colon and percent-encoded
      # templates all reached buyers as priced routes (offline, mutation-tested)
      - name: URL templates are never published as payable (offline)
        if: matrix.shard == 1
        run: X402_INDEX_CRAWL=off node scripts/test-url-templates.js
      # Input aliases may never change the MEANING of a call (offline, mutation-tested)
      - name: Input parameter aliases (offline)
        if: matrix.shard == 1
        run: node scripts/test-input-aliases.js
      # An input nested past the depth bound is a 400 on HTTP and MCP (boots its own server on port 0)
      - name: Input nesting depth bound
