          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3000/health >/dev/null 2>&1 && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/health >/dev/null || { echo "server never became healthy"; tail -40 /tmp/unit-c-srv.log; exit 1; }

      - name: Link integrity (every sitemap URL + every crawled internal href resolves; /mcp never a real <a href>)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-link-integrity.js
      # Every sitemap page served without its <title> clamped (boots its own server with an operator token, reads /__operator/seo-meta.json)
      - name: Title clamp (no served page needs its title cut)
        run: node scripts/test-title-clamp.js

      # These four were 210s of test-unit-b's 506s of work, and they share a
      # real property rather than an arbitrary place in the list: each BOOTS ITS
      # OWN servers on its own ports, uses no TARGET_URL and no redis. So this
      # lane needs neither the shared free-mode server nor the redis service,
      # and moving them is not a rebalance that some later edit can invalidate.
      #
      # Splitting a lane only pays until the next-slowest lane becomes the
      # floor: unit-a's 287s saving moved the bottleneck to unit-b, and this
      # moves it to `test`. Measure before splitting again.
      - name: Gate agent402-facilitator (real signed Stellar testnet payments; boots its own servers on 4099-4101)
        # Had ZERO CI coverage until 2026-08-15, unlike every other package in
        # this repo - found only after a real production incident (unbounded
        # /settle hang, then a broken Docker deploy shipped right past every
        # existing check because none of them looked at this package at all).
        # TEST_PAYER_STELLAR_SECRET is a persistent testnet-only Stellar
        # account holding testnet USDC (Circle's faucet is CAPTCHA-gated, so
        # it can't be minted fresh per run - see facilitator/README.md).
        # Self-skips LOUDLY if the secret is ever unset, same pattern as the
        # Robinhood settlement probe - never a silent pass.
        # PATH-SCOPED (2026-08-25): ~60 s of real Stellar testnet payments on every
        # push, and facilitator/test.js imports only facilitator/* (pinned by
        # scripts/test-ci-facilitator-scope.js - the moment it reaches outside,
        # this scoping is dishonest and CI fails). So it runs only when the push
        # touched facilitator/** or Dockerfile.facilitator.
        # FAIL-OPEN: an unreadable diff (first push, force-push, API error) RUNS it.
        # A dev-branch push diffs the whole batch against main (main...SHA), not
        # the previous push: a push whose run a newer one cancelled would
        # otherwise hide a facilitator change from every later run (2026-11-01).
        run: |
          if [ -z "$TEST_PAYER_STELLAR_SECRET" ]; then
            echo "TEST_PAYER_STELLAR_SECRET unset - skipping facilitator/test.js (see facilitator/README.md)"
            exit 0
          fi
          RUN_GATE=yes
          if [ -n "$DIFF_BASE" ] && ! echo "$DIFF_BASE" | grep -qE '^0+$'; then
            if CHANGED=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DIFF_BASE...$GITHUB_SHA" --paginate --jq '.files[].filename' 2>/dev/null); then
              if echo "$CHANGED" | grep -qE '^(facilitator/|Dockerfile\.facilitator$)'; then
                echo "facilitator files changed since $DIFF_BASE - running the gate"
              else
                echo "no facilitator/** change in $DIFF_BASE...$GITHUB_SHA ($(echo "$CHANGED" | grep -c .) files) - facilitator/test.js imports only facilitator/*, skipping the gate"
                RUN_GATE=no
              fi
            else
              echo "could not read the diff $DIFF_BASE...$GITHUB_SHA - running the gate (fail-open)"
            fi
          else
            echo "no diff base for this event - running the gate (fail-open)"
          fi
          [ "$RUN_GATE" = "yes" ] || exit 0
          cd facilitator
          npm ci --ignore-scripts
          node test.js
        env:
          TEST_PAYER_STELLAR_SECRET: ${{ secrets.TEST_PAYER_STELLAR_SECRET }}
          GH_TOKEN: ${{ github.token }}
          # PR: its base. Push to main: the previous head. Push to any other
          # branch: main (the whole batch). Anything else (workflow_dispatch,
          # a main push with no before): empty, so the gate runs (fail-open).
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && (github.ref == 'refs/heads/main' && github.event.before || github.ref != 'refs/heads/main' && 'main')) || '' }}

      - name: Offline suites (1 script, one process each)
        run: bash scripts/ci/run-step.sh test-unit-c 1
      - name: Runner kills and memory (on failure)
        if: failure()
        run: |
          free -m || true
          sudo dmesg -T 2>/dev/null | grep -iE 'killed process|out of memory|oom-kill' | tail -20 || true
          ps -eo pid,rss,etime,comm --sort=-rss | head -15 || true

  test-unit-c2:
    # Second half of test-unit-c (2026-08-25), split by the seconds each script
    # measured in its own log line - not by count. Same header, same setup, same
    # order within each half; only the list differs.
    needs: [markers, tree-gate]
    if: >-
      !cancelled()
      && (
        (github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/sweet-brown-i99jl3')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/sweet-brown-i99jl3')) || github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' || inputs.mode == 'deploy' || inputs.mode == 'publish') || needs.markers.outputs.test == 'true' || needs.markers.outputs.deploy == 'true' || needs.markers.outputs.publish == 'true'
      )
      && needs.tree-gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UPSTREAM_COSTS_JSON: ${{ secrets.UPSTREAM_COSTS_JSON }}
      # A fork PR cannot read the secret; its cost-table suites skip instead of failing.
      UPSTREAM_COSTS_OPTIONAL: ${{ github.event.pull_request.head.repo.fork && '1' || '' }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API_KEY_V2: ${{ secrets.FRED_API_KEY_V2 }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # node_modules restored by lockfile hash (2026-08-25): npm ci was 13-17 s in
      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        env:
          UPSTREAM_COSTS_JSON: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: npm ci

      # A free-mode server for the link-integrity sweep below. This lane had
      # no server until now; it gets one so the 66s sweep can leave `test`,
      # which was the critical path at 409s. Unlike `test`, nothing here needs
      # Chromium, so the lane stays Playwright-free - that install is the
      # expensive part, and non-metered (which does need it) deliberately
      # stays where the browser already is.
      - name: Start server in free mode
        run: |
          X402_SYNC_ON_START=false FREE_MODE=true X402_INDEX_CRAWL=off X402_PAYWALL_PROBES_PER_CYCLE=0 PORT=3000 node src/server.js > /tmp/unit-c-srv.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3000/health >/dev/null 2>&1 && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/health >/dev/null || { echo "server never became healthy"; tail -40 /tmp/unit-c-srv.log; exit 1; }

      - name: Offline suites (14 scripts, one process each)
        run: bash scripts/ci/run-step.sh test-unit-c2 1

  publish-gate:
    # Every per-package gate that used to run INSIDE the publish job. It is a
    # separate job for one reason: these gates execute third-party code (a
    # scripted `npm ci` so better-sqlite3 fetches its prebuilt binary, a booted
    # FREE_MODE server, adapter tests that self-install their frameworks), and
    # the job that publishes holds `id-token: write`, the credential npm
    # exchanges for a publish token. A dependency's install script running
    # beside that credential could publish under our names. Here there is no
    # id-token, no registry-url, no environment and nothing to steal; publish
    # needs this job's SUCCESS and runs only the publish commands themselves.
    needs: [markers, tree-gate, test, test-sweeps, test-sweeps2, test-paid, test-paid2, test-unit-a, test-unit-a2, test-unit-a3, test-unit-a4, test-unit-b, test-unit-b2, test-unit-b3, test-unit-b4, test-unit-c, test-unit-c2, test-unit-d, test-pricing]
    # The lanes are `needs:`, so this used to inherit an implicit success() and
    # nothing else was required. !cancelled() removes that implicit check, so
    # the success requirement is written out - and the ONLY accepted alternative
    # is tree-gate proving this exact tree already passed the full suite on the
    # dev branch. A lane that FAILED, errored, or was skipped for any other
    # reason still blocks the release.
    if: >-
      !cancelled()
      && (
        needs.tree-gate.outputs.skip == 'true'
        || ( needs.test.result == 'success' && needs.test-sweeps.result == 'success' && needs.test-paid.result == 'success' && needs.test-paid2.result == 'success' && needs.test-unit-a.result == 'success' && needs.test-unit-a2.result == 'success' && needs.test-unit-b.result == 'success' && needs.test-unit-b2.result == 'success' && needs.test-unit-c.result == 'success' && needs.test-unit-c2.result == 'success' && needs.test-unit-a3.result == 'success' && needs.test-unit-a4.result == 'success' && needs.test-unit-b3.result == 'success' && needs.test-unit-b4.result == 'success' && needs.test-sweeps2.result == 'success' && needs.test-unit-d.result == 'success' && needs.test-pricing.result == 'success' )
      )
      && (
        github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' || needs.markers.outputs.publish == 'true'
      )
    runs-on: ubuntu-24.04
    # Recent runs on main took 1 to 2 minutes; the bound stops a hung install or boot.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # NOTE: this job and the test lanes are the ONLY installs that still run
      # dependency lifecycle scripts, because better-sqlite3 downloads its
      # prebuilt binary from one (the server cannot boot without it). Every
      # other install in this repo is --ignore-scripts, and the `publish` job
      # that follows installs NOTHING at all: it holds `id-token: write`, and
      # a lifecycle script next to that credential could publish under our
      # names, which is why these gates live here and not there. Keep it that
      # way: a new gate that needs node_modules belongs in THIS job; if a step
      # here ever stops needing a native build, add the flag.
      - name: MCP e2e gate before publishing
        run: |
          npm ci
          npm --prefix mcp ci
          node mcp/test.js
      - name: MCP package gate (pack → install the tarball → real initialize handshake)
        # mcp/test.js runs from the working tree, so a module missing from
        # package.json's `files` allowlist is invisible to it. That shipped a
        # package that threw ERR_MODULE_NOT_FOUND on its first line. This packs
        # and installs the actual artifact and drives a handshake against it.
        run: node scripts/test-mcp-package.js
      - name: mcp version consistency (package.json ↔ server.json)
        # Guards against the drift that bit us once already: mcp-publisher reads
        # server.json's version, npm reads package.json's, and the registry
        # rejects a duplicate (name, version) at the storage layer (not the
        # search index, so checks against the public listing can mislead).
        # Also asserts the MCP Registry's ≤100-char limit on server.json's
        # description, which is enforced by the registry at publish time —
        # fail-fast here so we don't burn an npm publish on a registry-only
        # validation error (caught us once: 0.8.1 shipped to npm but bounced
        # at the registry with a 287-char description).
        # Fail CI here, before we waste a publish attempt and a version bump.
        run: |
          node -e '
            const pkg = require("./mcp/package.json");
            const srv = require("./mcp/server.json");
            const a = pkg.version;
            const b = srv.version;
            const c = srv.packages && srv.packages[0] && srv.packages[0].version;
            if (a !== b || a !== c) {
              console.error("mcp version drift:");
              console.error("  mcp/package.json.version         =", a);
              console.error("  mcp/server.json.version          =", b);
              console.error("  mcp/server.json.packages[0].ver  =", c);
              process.exit(1);
            }
            const dlen = (srv.description || "").length;
            if (dlen > 100) {
              console.error("mcp/server.json.description is", dlen, "chars — MCP Registry limit is 100");
              console.error("  current:", JSON.stringify(srv.description));
              process.exit(1);
            }
            console.log("mcp versions aligned at", a, "· server.json.description =", dlen, "chars");
          '
      - name: Gate agent402-tollbooth (tests run with NO npm token in env)
        run: |
          node tollbooth/test.js && node tollbooth/edge.test.js && node tollbooth/features.test.js && node tollbooth/tempo.test.js   # gate: node + edge + feature/security + tempo assertions must pass before shipping

      - name: Gate agent402-client (tests run with NO npm token in env)
        run: |
          node client/test.js            # gate: the buyer SDK must pass before shipping
          node scripts/test-client-caps.js  # gate: spending-cap safety must pass too

      - name: Gate agent402-openclaw (tests run with NO npm token in env)
        run: node openclaw/test.js

      - name: Boot FREE_MODE server for adapter tests
        run: |
          FREE_MODE=true PORT=3090 node src/server.js > /tmp/a402-adapter.log 2>&1 &
          echo $! > /tmp/a402-adapter.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3090/health >/dev/null && { echo "server up"; break; }
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3090/health >/dev/null || { echo "FREE_MODE server failed to boot"; cat /tmp/a402-adapter.log; exit 1; }

      - name: Gate agent402-openai-tools (tests run with NO npm token in env)
        run: |
          # Gate: tool list builds + execute() returns a real result against the FREE_MODE server.
          AGENT402_BASE_URL=http://127.0.0.1:3090 node adapters/openai-tools/test.js

      - name: Gate agent402-anthropic-tools (tests run with NO npm token in env)
        run: |
          # Install agent402-client locally for the test (same self-bootstrap as openai-tools/test.js).
          ( cd adapters/anthropic-tools && npm install ../../client --no-save --silent --ignore-scripts )
          AGENT402_BASE_URL=http://127.0.0.1:3090 node adapters/anthropic-tools/test.js

      - name: Gate agent402-ai-sdk (tests run with NO npm token in env)
        run: |
          # Test self-bootstraps agent402-client + ai (Vercel AI SDK) into its own node_modules.
          AGENT402_BASE_URL=http://127.0.0.1:3090 node adapters/ai-sdk/test.js

      - name: Gate agent402-langchain (tests run with NO npm token in env)
        run: |
          # Test self-bootstraps agent402-client + @langchain/core + zod.
          AGENT402_BASE_URL=http://127.0.0.1:3090 node adapters/langchain/test.js

      - name: Gate agent402-openai-agents (tests run with NO npm token in env)
        run: |
          # Test runs framework-agnostic spec path; @openai/agents is an
          # optional peerDep so consumers install it on their side.
          AGENT402_BASE_URL=http://127.0.0.1:3090 node adapters/openai-agents/test.js

      - name: Gate agent402-llamaindex (tests run with NO npm token in env)
        run: |
          # Test self-bootstraps agent402-client + llamaindex.
          AGENT402_BASE_URL=http://127.0.0.1:3090 node adapters/llamaindex/test.js

      - name: Gate agent402-strands (tests run with NO npm token in env)
        run: |
          # Test self-bootstraps agent402-client + stubs @strands-agents/sdk
          # so we don't pull AWS Bedrock + uuid + yaml transitively just to
          # verify the adapter shape.
          AGENT402_BASE_URL=http://127.0.0.1:3090 node adapters/strands/test.js

      - name: Gate agent402-agentkit (tests run with NO npm token in env)
        run: |
          # Test self-bootstraps agent402-client + stubs @coinbase/agentkit to
          # the one export the adapter uses (customActionProvider).
          AGENT402_BASE_URL=http://127.0.0.1:3090 node adapters/agentkit/test.js

      - name: Gate elizaos-plugin-agent402 (tests run with NO npm token in env)
        run: |
          # Self-bootstraps agent402-client; no @elizaos/core at runtime (types only).
          AGENT402_BASE_URL=http://127.0.0.1:3090 node adapters/eliza/test.js

      - name: Gate agent402-google-adk (tests run with NO npm token in env)
        run: |
          AGENT402_BASE_URL=http://127.0.0.1:3090 node adapters/google-adk/test.js

      - name: Stop adapter-test server
        if: always()
        run: kill "$(cat /tmp/a402-adapter.pid 2>/dev/null)" 2>/dev/null || true

  publish:
    needs: [markers, tree-gate, test, test-sweeps, test-sweeps2, test-paid, test-paid2, test-unit-a, test-unit-a2, test-unit-a3, test-unit-a4, test-unit-b, test-unit-b2, test-unit-b3, test-unit-b4, test-unit-c, test-unit-c2, test-unit-d, test-pricing, publish-gate]
    # The lanes are `needs:`, so this used to inherit an implicit success() and
    # nothing else was required. !cancelled() removes that implicit check, so
    # the success requirement is written out - and the ONLY accepted alternative
    # is tree-gate proving this exact tree already passed the full suite on the
    # dev branch. A lane that FAILED, errored, or was skipped for any other
    # reason still blocks the release.
    if: >-
      !cancelled()
      && (
        needs.tree-gate.outputs.skip == 'true'
        || ( needs.test.result == 'success' && needs.test-sweeps.result == 'success' && needs.test-paid.result == 'success' && needs.test-paid2.result == 'success' && needs.test-unit-a.result == 'success' && needs.test-unit-a2.result == 'success' && needs.test-unit-b.result == 'success' && needs.test-unit-b2.result == 'success' && needs.test-unit-c.result == 'success' && needs.test-unit-c2.result == 'success' && needs.test-unit-a3.result == 'success' && needs.test-unit-a4.result == 'success' && needs.test-unit-b3.result == 'success' && needs.test-unit-b4.result == 'success' && needs.test-sweeps2.result == 'success' && needs.test-unit-d.result == 'success' && needs.test-pricing.result == 'success' )
      )
      && (
        github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' || needs.markers.outputs.publish == 'true'
      )
      && needs.publish-gate.result == 'success'
    runs-on: ubuntu-24.04
    # Recent runs on main took up to 6 minutes; the registry wait loops below sum to about 20.
    timeout-minutes: 45
    # F01: publishing packages mutates a production artifact — gate it behind the
    # same protected environment as deploy (see the deploy job comment).
    # publish-gate is deliberately OUTSIDE this environment: it holds no
    # credential, so there is nothing for the environment to protect there.
    environment: "agent402 / production"
    # This job is the only one with id-token: write, so it executes NOTHING it
    # did not write itself: no `npm ci`, no lifecycle script, no gate. Every
    # test moved to publish-gate (which this job requires to have SUCCEEDED).
    # What remains needs no node_modules - `npm publish --provenance` packs the
    # working tree, no published package declares a prepack/prepare/
    # prepublishOnly script (test-supply-chain-guards pins the install hooks),
    # `npm view` is registry-only, the version reads are `node -p` on a JSON
    # file, and scripts/mcp-find-latest-version.js imports nothing. The two
    # third-party executables that DO run here are a checksum-verified
    # mcp-publisher binary and `npx` of a pinned ClawHub CLI with lifecycle
    # scripts disabled (see that step). Adding an install here re-opens the
    # hole this split closes.
    permissions:
      contents: read
      id-token: write   # GitHub OIDC → authorize the io.github.mikeypetrillo/* MCP Registry namespace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 22 ships npm 10.x.
      # Pinned exactly (our own supply-chain doctrine: no floating installs of
      # anything that can execute). Still 11.x, the line every publish so far
      # has gone out on; npm 12's default of disabling install scripts no
      # longer matters either way, because this job installs nothing - the
      # server-booting gates run in publish-gate on the runner's stock npm.
      # Nothing in this job runs before this step except checkout/setup-node.
      #
      # TRUSTED PUBLISHING (OIDC) - no npm token exists in this workflow.
      # Auth comes from the job's id-token: write, exchanged by the npm CLI
      # against the trusted publisher configured on npmjs.com for each
      # package (owner MikeyPetrillo, repo Agent402, workflow deploy.yml,
      # environment "agent402 / production"). A stolen repo secret therefore
      # cannot publish, and the ~January 2027 removal of token publishing
      # does not affect us.
      #
      # If a publish ever fails auth: the trusted-publisher config for THAT
      # package is missing or its fields do not match exactly (the
      # environment name includes the spaces around the slash). Rollback, if
      # ever needed, is re-adding `env: NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}`
      # to the publish steps - the token stays valid until ~January 2027.
      - name: Upgrade npm for trusted publishing (OIDC)
        run: |
          npm install -g npm@11.19.0 --ignore-scripts
          NPM_V=$(npm --version)
          echo "npm $NPM_V"
          # Fail loudly if the CLI is too old to exchange the OIDC token - a
          # silent fallback to token auth is exactly the ambiguity we are
          # trying to remove.
          MAJOR=${NPM_V%%.*}
          REST=${NPM_V#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
          if [ "$MAJOR" -lt 11 ] || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; } \
             || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -eq 5 ] && [ "$PATCH" -lt 1 ]; }; then
            echo "::error::npm $NPM_V is below the 11.5.1 trusted-publishing minimum"; exit 1
          fi
          echo "npm $NPM_V supports trusted publishing"

      # OIDC diagnostics + npmrc hygiene. The first trusted-publishing attempt
      # failed with `E404 PUT` (npm's generic unauthenticated/unauthorized
      # response) while provenance signing SUCCEEDED in the same run - meaning
      # OIDC works but the registry did not accept it for AUTH. The prime
      # suspect is actions/setup-node: with `registry-url` set it writes an
      # .npmrc line `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and
      # with our token removed that expands to an EMPTY token. npm then sees
      # configured credentials and can skip the OIDC exchange entirely.
      # So: print the state, then strip any empty auth line before publishing.
      - name: OIDC preflight (diagnose auth state, strip empty npmrc token)
        run: |
          echo "OIDC request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "npm registry: $(npm config get registry)"
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC" ]; then
            echo "--- npmrc (values redacted) ---"
            sed -E 's/(=).*/\1<redacted>/' "$NPMRC"
            # Strip ANY _authToken line. setup-node writes the LITERAL text
            # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`; with the
            # token deleted that expands to nothing, npm sees a configured
            # credential it cannot resolve (proved: `npm whoami` -> E401), and
            # never falls through to the OIDC exchange -> publish 404s.
            # We hold no npm token by design, so any auth line here is stale.
            if grep -q '_authToken' "$NPMRC"; then
              echo "removing _authToken line(s) so npm authenticates via OIDC"
              sed -i.bak '/_authToken/d' "$NPMRC"
              # sed -i leaves $NPMRC.bak holding the ORIGINAL auth line. Empty
              # today, but it would hold a real token under the documented
              # NODE_AUTH_TOKEN rollback - and this job still runs a pinned
              # third-party CLI (ClawHub) and a downloaded publisher binary
              # after this step. Delete it.
              rm -f "$NPMRC.bak"
              echo "--- npmrc after ---"; sed -E 's/(=).*/\1<redacted>/' "$NPMRC"
            else
              echo "no _authToken line present"
            fi
          else
            echo "no npmrc at $NPMRC"
          fi
          echo "npm whoami: $(npm whoami 2>&1 | head -1)"
          # Ask npm's OIDC exchange endpoint DIRECTLY what it thinks of our
          # trusted publisher. The CLI falls through to token auth silently
          # (ENEEDAUTH) whether the config is missing OR mismatched, which
          # cannot tell us which - this can. Diagnostic only: never fails the
          # step, and the exchanged token is not used to publish.
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            IDTOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).value||"")}catch{console.log("")}})')
            if [ -n "$IDTOK" ]; then
              # Claims identify what npm is matching against (no secret in them).
              echo "--- OIDC claims npm will see ---"
              echo "$IDTOK" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const c=JSON.parse(s);console.log(JSON.stringify({repository:c.repository,workflow_ref:c.workflow_ref,job_workflow_ref:c.job_workflow_ref,environment:c.environment,ref:c.ref},null,1))}catch(e){console.log("(claims unparsed)")}})'
              # Probe EVERY package, not just one: a per-package config can be
              # present on some and absent on others, and one sample cannot
              # tell those apart. Prints a verdict line per package.
              #
              # The package list is READ FROM DISK, never hardcoded. It used to
              # be a literal list of 11 names, which is a second place to
              # remember when a package is added - and a package missing from
              # that list is invisible to exactly the check meant to catch it.
              #
              # A 404 here means npm could not MATCH this run to a trusted
              # publisher for that package. It does NOT distinguish "no config"
              # from "config that names something else" (npm/cli#8976) - but
              # note what the claims above prove: one token is exchanged
              # against every package endpoint, so the claims are IDENTICAL
              # for all of them. If a claim field were wrong, EVERY package
              # would 404. A split verdict can therefore only be per-package
              # registry-side config, never the workflow, the environment, or
              # the ref.
              echo "--- npm exchange verdict, every publishable package ---"
              UNMATCHED_PENDING=""
              for DIR in mcp tollbooth client adapters/*/; do
                [ -f "$DIR/package.json" ] || continue
                PKG=$(node -p "const p=require('./$DIR/package.json'); p.private ? '' : (p.name || '')" 2>/dev/null || echo "")
                [ -n "$PKG" ] || continue
                VER=$(node -p "require('./$DIR/package.json').version" 2>/dev/null || echo "")
                CODE=$(curl -sS -o /tmp/oidc-out.txt -w "%{http_code}" \
                  -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$PKG" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer $IDTOK" 2>/dev/null || echo "000")
                VERDICT=$(node -e 'const fs=require("fs");let t="";try{t=fs.readFileSync("/tmp/oidc-out.txt","utf8")}catch{};let o;try{o=JSON.parse(t)}catch{};if(o&&o.token){console.log("MATCHED (short-lived token issued)")}else{console.log((o&&o.message)||t.slice(0,120))}' || true)
                # Does this package actually need publishing on this run? An
                # unmatched package that is already in sync publishes nothing,
                # so it is a latent problem; an unmatched package with a NEW
                # version is a run that is going to fail, and the failure it
                # produces at `npm publish` is an opaque ENEEDAUTH that says
                # nothing about which side is wrong.
                PENDING="in-sync"
                if [ -n "$VER" ] && ! npm view "$PKG@$VER" version >/dev/null 2>&1; then PENDING="PENDING $VER"; fi
                printf "  %-28s HTTP %s  %-38s %s\n" "$PKG" "$CODE" "$VERDICT" "$PENDING"
                if [ "$CODE" != "201" ]; then
                  case "$PENDING" in
                    PENDING*) UNMATCHED_PENDING="$UNMATCHED_PENDING $PKG@$VER" ;;
                    *) echo "::warning::$PKG has no matching npm trusted publisher. Nothing to publish right now, but its next version bump will fail to authenticate." ;;
                  esac
                fi
              done
              if [ -n "$UNMATCHED_PENDING" ]; then
                echo "::error::These packages have a NEW version to publish but no matching npm trusted publisher, so their publish step will fail:$UNMATCHED_PENDING"
                echo "::error::Fix on npmjs.com (needs an owner + 2FA; a token cannot set it): package → Settings → Trusted Publisher → GitHub Actions, organization/repository MikeyPetrillo/Agent402, workflow file deploy.yml, environment 'agent402 / production' (with the spaces, exactly as the claim above prints it)."
              fi
              # A successful exchange body is {"token":"npm_..."} - a live
              # short-lived publish credential. The gates moved to publish-gate,
              # but later steps in THIS job still execute third-party code (the
              # ClawHub CLI, the mcp-publisher binary), so the response must
              # not outlive the probe.
              rm -f /tmp/oidc-out.txt
            else
              echo "could not mint a GitHub OIDC token for the npm audience"
            fi
          fi

      - name: Publish agent402-mcp to npm
        run: |
          cd mcp
          VERSION=$(node -p "require('./package.json').version")
          # Idempotent: a re-run after a successful publish is a no-op.
          if npm view "agent402-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "agent402-mcp@$VERSION is already on npm — nothing to do"
