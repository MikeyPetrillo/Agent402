  test-unit-b:
    # Test job runs on its own [test] marker AND auto-runs whenever a commit
    # asks to deploy or publish — so deploy/publish can hard-gate on it via
    # `needs: test`. This makes "ship without running tests" impossible by
    # design, not by developer discipline.
    needs: [markers, tree-gate]
    # Runs on the [test]/[deploy]/[publish] markers, on the matching
    # workflow_dispatch modes, on every PR into main (N-04: so the required
    # `test` status check always reports), AND unconditionally on every push
    # to main — a merge to main has no marker to scan (see the `on:` block
    # above) and needs none: it is asked to test-and-deploy regardless.
    # `!cancelled()` because tree-gate does not run at all outside a push to
    # main, and a SKIPPED `needs` job skips its dependents unless the dependent
    # carries a status function - without this, every dev-branch and PR run
    # would silently stop testing. With tree-gate skipped OR failed its output
    # is empty, which is not 'true', so the lane runs: the gate can only ever
    # subtract work by succeeding and saying so.
    if: >-
      !cancelled()
      && (
        (github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/sweet-brown-i99jl3')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/sweet-brown-i99jl3')) || github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' || inputs.mode == 'deploy' || inputs.mode == 'publish') || needs.markers.outputs.test == 'true' || needs.markers.outputs.deploy == 'true' || needs.markers.outputs.publish == 'true'
      )
      && needs.tree-gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # A healthy run takes 22-25 min. Without this the GitHub default is 360
    # min, and on 2026-08-18 two consecutive runs sat for 28+ min inside the
    # Playwright system-deps apt step (see below) — the deploy job hard-gates
    # on this one, so a hung test job silently blocks every deploy behind it.
    timeout-minutes: 60
    # A REAL redis, because until 2026-08-07 nothing in CI ever connected to
    # one. test-shared-limit.js injects a fake store deliberately (it proves
    # "two callers share one counter", and a fake proves that exactly), but
    # that left the redis CLIENT path untested — so Dependabot's redis 4 -> 6
    # bump arrived with a green CI that could not have caught a client
    # regression. Prod is not in-memory: REDIS_URL is set there, and the shared
    # limiter FAILS CLOSED, so a client regression refuses trials.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    # F07: provider keys stay at job scope so every TEST step gates its
    # expectations on the SAME config the booted server has. But the ONE step
    # that runs untrusted third-party code — the dependency install, where npm
    # lifecycle scripts execute — SHADOWS them to empty (below), so a malicious
    # package cannot read them. That is the real F07 exposure; our own test
    # steps are trusted code from this repo.
    env:
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API_KEY_V2: ${{ secrets.FRED_API_KEY_V2 }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      # Raises CoinGecko off the 30/min keyless budget shared per runner IP.
      # It does NOT make the calls free: the Demo plan has a monthly quota and
      # CI would burn it on every push, which is the trap the Brave notes in
      # test-non-metered-examples.js already record. So the sweep still SAMPLES
      # the family (COINGECKO_SLUGS there). Key plus sampling: the two live
      # calls per run are reliable, and the quota lasts.
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # Restores ~/.npm keyed on package-lock.json. `npm ci` still runs and
          # still installs exactly what the lockfile pins, so this only saves
          # the network fetch - a stale or poisoned cache cannot change which
          # versions land. Measured before adding it: 21s/19s/16s across the
          # three lanes on every single run, all of it re-downloading tarballs
          # that had not changed.
          cache: npm
      # node_modules restored by lockfile hash (2026-08-25): npm ci was 13-17 s in
      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        # F07: shadow the job-scope provider keys to EMPTY for this step only, so
        # a malicious dependency lifecycle script running during `npm ci` cannot
        # read them. No server or tool runs here, so empty keys are harmless.
        env:
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
        run: npm ci
      # NO Playwright in this lane on purpose: it runs no browser-driven
      # script. All eight (csp-violations, css-tokens-resolve, focus-visible,
      # the reveal suite, burger-aria-label, compare-scroll,
      # non-metered-examples) live in the `test` lane. Installing Chromium
      # here cost 32s and 22s for nothing, and the slower unit lane IS the
      # critical path. If a browser-driven script is ever added here, copy
      # the install step back from the `test` job with it.
      - name: Start server in free mode
        run: |
          # Raise the MCP rate limit so the full-catalog connector test can sweep
          # every tool (production keeps the default 20/min, 120/hr).
          AGENT402_MCP_MAX_PER_MIN=1000000 AGENT402_MCP_MAX_PER_HOUR=1000000 \
            X402_SYNC_ON_START=false FREE_MODE=true X402_PAYWALL_PROBES_PER_CYCLE=0 PORT=3000 node src/server.js &
          for i in $(seq 1 20); do curl -s localhost:3000/health >/dev/null && break; sleep 1; done
      - name: Image work stays off the event loop (concurrent transforms must not stall /health)
        # Boots its own server on 3221. The offline probe in scripts/test-image.js
        # guards the same property, but only this one proves it end to end
        # through HTTP, which is where a buyer would feel the stall.
        run: node scripts/test-image-concurrency.js

      # ONE STEP, MANY SCRIPTS (2026-08-25): GitHub spends ~0.7 s of runner setup
      # per step and this lane had over a hundred one-line steps. Each script still
      # runs in its own process, in the same order; `t` groups its log and names it
      # with its elapsed time, and a failure prints the failing script as an error.
      # The original step names ride above each script so the WHY stays here.
      - name: Offline suites (3 scripts, one process each)
        run: |
          set -euo pipefail
          t() { local s=$SECONDS; echo "::group::$*"; "$@" || { echo "::endgroup::"; echo "::error::failed: $*"; exit 1; }; echo "::endgroup::"; echo "ok  $* ($((SECONDS - s))s)"; }
          # PoW solve roundtrip (paid-mode boot, honest solver unlocks /api/hash, replay rejected)
          t node scripts/test-pow-solve-roundtrip.js
          # Cold start (a wallet-less agent reaches its first call from the docs alone)
          t node scripts/test-coldstart.js
          # Idempotency (opt-in safe retry of paid/proven calls; boots paid-mode)
          t node scripts/test-idempotency.js

      - name: Free tier makes no outbound calls (every compute-payable tool, instrumented)
        # Boots its own instrumented server on 3231. WALLET_ONLY_SLUGS is a
        # hand-maintained list, and a kit whose author forgets to list an
        # egressing slug is permanently free. This is the structural check that
        # a list cannot be.
        run: node scripts/test-free-tier-egress.js

      # ONE STEP, MANY SCRIPTS (2026-08-25): GitHub spends ~0.7 s of runner setup
      # per step and this lane had over a hundred one-line steps. Each script still
      # runs in its own process, in the same order; `t` groups its log and names it
      # with its elapsed time, and a failure prints the failing script as an error.
      # The original step names ride above each script so the WHY stays here.
      - name: Offline suites (4 scripts, one process each)
        run: |
          set -euo pipefail
          t() { local s=$SECONDS; echo "::group::$*"; "$@" || { echo "::endgroup::"; echo "::error::failed: $*"; exit 1; }; echo "::endgroup::"; echo "ok  $* ($((SECONDS - s))s)"; }
          # /.well-known/glama.json maintainer email env pass-through (with + without override)
          t node scripts/test-glama-manifest.js
          # Skill-pack invariants (toolSlugs resolve in catalog; substitution renders)
          t node scripts/test-skill-packs.js
          # /health flag shape contract (every documented flag present + boolean-typed)
          t node scripts/test-health-flags.js
          # /skills/<slug> contract (every pack renders workflow + tools + claudePrompt + JSON-LD)
          t node scripts/test-skill-page-contract.js

