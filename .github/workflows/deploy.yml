      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API_KEY_V2: ${{ secrets.FRED_API_KEY_V2 }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      # Raises CoinGecko off the 30/min keyless budget shared per runner IP.
      # It does NOT make the calls free: the Demo plan has a monthly quota and
      # CI would burn it on every push, which is the trap the Brave notes in
      # test-non-metered-examples.js already record. So the sweep still SAMPLES
      # the family (COINGECKO_SLUGS there). Key plus sampling: the two live
      # calls per run are reliable, and the quota lasts.
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
