  publish:
    needs: [markers, tree-gate, test, test-sweeps, test-sweeps2, test-paid, test-paid2, test-unit-a, test-unit-a2, test-unit-a3, test-unit-a4, test-unit-b, test-unit-b2, test-unit-b3, test-unit-b4, test-unit-c, test-unit-c2, test-unit-d, test-pricing]
    # The lanes are `needs:`, so this used to inherit an implicit success() and
    # nothing else was required. !cancelled() removes that implicit check, so
    # the success requirement is written out - and the ONLY accepted alternative
    # is tree-gate proving this exact tree already passed the full suite on the
    # dev branch. A lane that FAILED, errored, or was skipped for any other
    # reason still blocks the release.
    if: >-
      !cancelled()
      && (
        needs.tree-gate.outputs.skip == 'true'
        || ( needs.test.result == 'success' && needs.test-sweeps.result == 'success' && needs.test-paid.result == 'success' && needs.test-paid2.result == 'success' && needs.test-unit-a.result == 'success' && needs.test-unit-a2.result == 'success' && needs.test-unit-b.result == 'success' && needs.test-unit-b2.result == 'success' && needs.test-unit-c.result == 'success' && needs.test-unit-c2.result == 'success' && needs.test-unit-a3.result == 'success' && needs.test-unit-a4.result == 'success' && needs.test-unit-b3.result == 'success' && needs.test-unit-b4.result == 'success' && needs.test-sweeps2.result == 'success' && needs.test-unit-d.result == 'success' && needs.test-pricing.result == 'success' )
      )
      && (
        github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' || needs.markers.outputs.publish == 'true'
      )
    runs-on: ubuntu-latest
    # F01: publishing packages mutates a production artifact — gate it behind the
    # same protected environment as deploy (see the deploy job comment).
    environment: "agent402 / production"
    permissions:
      contents: read
      id-token: write   # GitHub OIDC → authorize the io.github.mikeypetrillo/* MCP Registry namespace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # NOTE: this gate and the test job are the ONLY installs that still run
      # dependency lifecycle scripts, because better-sqlite3 downloads its
      # prebuilt binary from one (the server cannot boot without it). Every
      # other install in this repo is --ignore-scripts. Keep it that way: if a
      # step here ever stops needing a native build, add the flag.
      - name: MCP e2e gate before publishing
        run: |
          npm ci
          npm --prefix mcp ci
          node mcp/test.js
      - name: MCP package gate (pack → install the tarball → real initialize handshake)
        # mcp/test.js runs from the working tree, so a module missing from
        # package.json's `files` allowlist is invisible to it. That shipped a
        # package that threw ERR_MODULE_NOT_FOUND on its first line. This packs
        # and installs the actual artifact and drives a handshake against it.
        run: node scripts/test-mcp-package.js
      - name: mcp version consistency (package.json ↔ server.json)
        # Guards against the drift that bit us once already: mcp-publisher reads
        # server.json's version, npm reads package.json's, and the registry
        # rejects a duplicate (name, version) at the storage layer (not the
        # search index, so checks against the public listing can mislead).
        # Also asserts the MCP Registry's ≤100-char limit on server.json's
        # description, which is enforced by the registry at publish time —
        # fail-fast here so we don't burn an npm publish on a registry-only
        # validation error (caught us once: 0.8.1 shipped to npm but bounced
        # at the registry with a 287-char description).
        # Fail CI here, before we waste a publish attempt and a version bump.
        run: |
          node -e '
            const pkg = require("./mcp/package.json");
            const srv = require("./mcp/server.json");
            const a = pkg.version;
            const b = srv.version;
            const c = srv.packages && srv.packages[0] && srv.packages[0].version;
            if (a !== b || a !== c) {
              console.error("mcp version drift:");
              console.error("  mcp/package.json.version         =", a);
              console.error("  mcp/server.json.version          =", b);
              console.error("  mcp/server.json.packages[0].ver  =", c);
              process.exit(1);
            }
            const dlen = (srv.description || "").length;
            if (dlen > 100) {
              console.error("mcp/server.json.description is", dlen, "chars — MCP Registry limit is 100");
              console.error("  current:", JSON.stringify(srv.description));
              process.exit(1);
            }
            console.log("mcp versions aligned at", a, "· server.json.description =", dlen, "chars");
          '
      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 22 ships npm 10.x.
      # Pinned exactly (our own supply-chain doctrine: no floating installs of
      # anything that can execute), and deliberately 11.x not 12.x - npm 12
      # disables install scripts by default, which would stop better-sqlite3
      # building for the server-booting gates ABOVE this line. Placed here so
      # only the publish steps see the new CLI; the gates keep running on the
      # runner's stock npm.
      #
      # TRUSTED PUBLISHING (OIDC) - no npm token exists in this workflow.
      # Auth comes from the job's id-token: write, exchanged by the npm CLI
      # against the trusted publisher configured on npmjs.com for each
      # package (owner MikeyPetrillo, repo Agent402, workflow deploy.yml,
      # environment "agent402 / production"). A stolen repo secret therefore
      # cannot publish, and the ~January 2027 removal of token publishing
      # does not affect us.
      #
      # If a publish ever fails auth: the trusted-publisher config for THAT
      # package is missing or its fields do not match exactly (the
      # environment name includes the spaces around the slash). Rollback, if
      # ever needed, is re-adding `env: NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}`
      # to the publish steps - the token stays valid until ~January 2027.
      - name: Upgrade npm for trusted publishing (OIDC)
        run: |
          npm install -g npm@11.19.0 --ignore-scripts
          NPM_V=$(npm --version)
          echo "npm $NPM_V"
          # Fail loudly if the CLI is too old to exchange the OIDC token - a
          # silent fallback to token auth is exactly the ambiguity we are
          # trying to remove.
          MAJOR=${NPM_V%%.*}
          REST=${NPM_V#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
          if [ "$MAJOR" -lt 11 ] || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; } \
             || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -eq 5 ] && [ "$PATCH" -lt 1 ]; }; then
            echo "::error::npm $NPM_V is below the 11.5.1 trusted-publishing minimum"; exit 1
          fi
          echo "npm $NPM_V supports trusted publishing"

      # OIDC diagnostics + npmrc hygiene. The first trusted-publishing attempt
      # failed with `E404 PUT` (npm's generic unauthenticated/unauthorized
      # response) while provenance signing SUCCEEDED in the same run - meaning
      # OIDC works but the registry did not accept it for AUTH. The prime
      # suspect is actions/setup-node: with `registry-url` set it writes an
      # .npmrc line `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and
      # with our token removed that expands to an EMPTY token. npm then sees
      # configured credentials and can skip the OIDC exchange entirely.
      # So: print the state, then strip any empty auth line before publishing.
      - name: OIDC preflight (diagnose auth state, strip empty npmrc token)
        run: |
          echo "OIDC request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-NO}"
          echo "npm registry: $(npm config get registry)"
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC" ]; then
            echo "--- npmrc (values redacted) ---"
            sed -E 's/(=).*/\1<redacted>/' "$NPMRC"
            # Strip ANY _authToken line. setup-node writes the LITERAL text
            # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`; with the
            # token deleted that expands to nothing, npm sees a configured
            # credential it cannot resolve (proved: `npm whoami` -> E401), and
            # never falls through to the OIDC exchange -> publish 404s.
            # We hold no npm token by design, so any auth line here is stale.
            if grep -q '_authToken' "$NPMRC"; then
              echo "removing _authToken line(s) so npm authenticates via OIDC"
              sed -i.bak '/_authToken/d' "$NPMRC"
              # sed -i leaves $NPMRC.bak holding the ORIGINAL auth line. Empty
              # today, but it would hold a real token under the documented
              # NODE_AUTH_TOKEN rollback - and this job runs third-party gate
              # code after this step. Delete it.
              rm -f "$NPMRC.bak"
              echo "--- npmrc after ---"; sed -E 's/(=).*/\1<redacted>/' "$NPMRC"
            else
              echo "no _authToken line present"
            fi
          else
            echo "no npmrc at $NPMRC"
          fi
          echo "npm whoami: $(npm whoami 2>&1 | head -1)"
          # Ask npm's OIDC exchange endpoint DIRECTLY what it thinks of our
          # trusted publisher. The CLI falls through to token auth silently
          # (ENEEDAUTH) whether the config is missing OR mismatched, which
          # cannot tell us which - this can. Diagnostic only: never fails the
          # step, and the exchanged token is not used to publish.
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            IDTOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).value||"")}catch{console.log("")}})')
            if [ -n "$IDTOK" ]; then
              # Claims identify what npm is matching against (no secret in them).
              echo "--- OIDC claims npm will see ---"
              echo "$IDTOK" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const c=JSON.parse(s);console.log(JSON.stringify({repository:c.repository,workflow_ref:c.workflow_ref,job_workflow_ref:c.job_workflow_ref,environment:c.environment,ref:c.ref},null,1))}catch(e){console.log("(claims unparsed)")}})'
              # Probe EVERY package, not just one: a per-package config can be
              # present on some and absent on others, and one sample cannot
              # tell those apart. Prints a verdict line per package.
              #
              # The package list is READ FROM DISK, never hardcoded. It used to
              # be a literal list of 11 names, which is a second place to
              # remember when a package is added - and a package missing from
              # that list is invisible to exactly the check meant to catch it.
              #
              # A 404 here means npm could not MATCH this run to a trusted
              # publisher for that package. It does NOT distinguish "no config"
              # from "config that names something else" (npm/cli#8976) - but
              # note what the claims above prove: one token is exchanged
              # against every package endpoint, so the claims are IDENTICAL
              # for all of them. If a claim field were wrong, EVERY package
              # would 404. A split verdict can therefore only be per-package
              # registry-side config, never the workflow, the environment, or
              # the ref.
              echo "--- npm exchange verdict, every publishable package ---"
              UNMATCHED_PENDING=""
              for DIR in mcp tollbooth client adapters/*/; do
                [ -f "$DIR/package.json" ] || continue
                PKG=$(node -p "const p=require('./$DIR/package.json'); p.private ? '' : (p.name || '')" 2>/dev/null || echo "")
                [ -n "$PKG" ] || continue
                VER=$(node -p "require('./$DIR/package.json').version" 2>/dev/null || echo "")
                CODE=$(curl -sS -o /tmp/oidc-out.txt -w "%{http_code}" \
                  -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$PKG" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer $IDTOK" 2>/dev/null || echo "000")
                VERDICT=$(node -e 'const fs=require("fs");let t="";try{t=fs.readFileSync("/tmp/oidc-out.txt","utf8")}catch{};let o;try{o=JSON.parse(t)}catch{};if(o&&o.token){console.log("MATCHED (short-lived token issued)")}else{console.log((o&&o.message)||t.slice(0,120))}' || true)
                # Does this package actually need publishing on this run? An
                # unmatched package that is already in sync publishes nothing,
                # so it is a latent problem; an unmatched package with a NEW
                # version is a run that is going to fail, and the failure it
                # produces at `npm publish` is an opaque ENEEDAUTH that says
                # nothing about which side is wrong.
                PENDING="in-sync"
                if [ -n "$VER" ] && ! npm view "$PKG@$VER" version >/dev/null 2>&1; then PENDING="PENDING $VER"; fi
                printf "  %-28s HTTP %s  %-38s %s\n" "$PKG" "$CODE" "$VERDICT" "$PENDING"
                if [ "$CODE" != "201" ]; then
                  case "$PENDING" in
                    PENDING*) UNMATCHED_PENDING="$UNMATCHED_PENDING $PKG@$VER" ;;
                    *) echo "::warning::$PKG has no matching npm trusted publisher. Nothing to publish right now, but its next version bump will fail to authenticate." ;;
                  esac
                fi
              done
              if [ -n "$UNMATCHED_PENDING" ]; then
                echo "::error::These packages have a NEW version to publish but no matching npm trusted publisher, so their publish step will fail:$UNMATCHED_PENDING"
                echo "::error::Fix on npmjs.com (needs an owner + 2FA; a token cannot set it): package → Settings → Trusted Publisher → GitHub Actions, organization/repository MikeyPetrillo/Agent402, workflow file deploy.yml, environment 'agent402 / production' (with the spaces, exactly as the claim above prints it)."
              fi
              # A successful exchange body is {"token":"npm_..."} - a live
              # short-lived publish credential. Later steps in THIS job execute
              # third-party code (server boot, adapter gates), so the response
              # must not outlive the probe.
              rm -f /tmp/oidc-out.txt
            else
              echo "could not mint a GitHub OIDC token for the npm audience"
            fi
          fi

      - name: Publish agent402-mcp to npm
        run: |
          cd mcp
          VERSION=$(node -p "require('./package.json').version")
          # Idempotent: a re-run after a successful publish is a no-op.
          if npm view "agent402-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "agent402-mcp@$VERSION is already on npm — nothing to do"
