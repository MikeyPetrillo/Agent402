      # The strict sweep runs FIRST so its sampled CoinGecko calls land before
      # the lenient sweep touches that shared 30/min budget; then test-all hands
      # it every route it covers (TEST_ALL_SKIP_STRICT_COVERED) and sweeps the rest.
      - name: Non-metered paid examples (strict — 502/503/504 fail; NETWORK leniency hole)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-non-metered-examples.js

      # Every skill pack must WORK on its own published example, not merely
      # return a well-shaped envelope. Nine packs sold for two months answering
      # "0/N steps succeeded" because every guard asserted SHAPE and none
      # asserted OUTCOME.
      #
      # Booted WITHOUT the paid keys on purpose. The keys live on the SERVER, so
      # a keyed boot would make this sweep buy a live Brave query on every push -
      # the CI-spend leak that has recurred three times. With them shadowed,
      # every keyed pack reports "not configured" and is skipped as not-ours,
      # every keyless pack is fully verified, and there is no skip list to drift.
      # The keyed subset is covered by running this against a keyed server by
      # hand; that is a real gap and it is written down rather than hidden.
      - name: Skill packs answer their own published example (keyless boot - no upstream spend)
        env:
          BRAVE_API_KEY: ""
          BRAVE_ANSWERS_API_KEY: ""
          BRAVE_SUGGEST_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          X402_SYNC_ON_START=false X402_INDEX_CRAWL=off FREE_MODE=true PORT=3097 node src/server.js > /tmp/a402-packs.log 2>&1 &
          PACK_PID=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3097/health >/dev/null && break || sleep 1; done
          curl -sf http://127.0.0.1:3097/health >/dev/null || { echo "keyless server failed to boot"; cat /tmp/a402-packs.log; kill $PACK_PID; exit 1; }
          TARGET_URL=http://127.0.0.1:3097 node scripts/test-pack-examples.js; rc=$?
          kill $PACK_PID 2>/dev/null || true
          exit $rc

      - name: Every tool responds to its own example (all ~1070 endpoints)
        run: TEST_ALL_SKIP_STRICT_COVERED=1 TARGET_URL=http://127.0.0.1:3000 node scripts/test-all.js

      - name: CSS tokens resolve (every :root custom property must actually resolve in a real browser, not just exist as text)
