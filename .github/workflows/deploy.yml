name: Deploy to Railway

# Serialize deploy runs per branch to the LATEST push. Without this, two quick
# [deploy] pushes each trigger a Railway deployment; the second SUPERSEDES the
# first, and the first push's deploy job — still watching its now-REMOVED
# deployment — fails with "deployment ended REMOVED", a scary false-failure
# even though the newer deploy carries its changes (hit 2026-07-21). cancel-in-
# progress kills the older RUN cleanly the moment a newer push starts, so the
# only run that survives is the one whose build actually reaches prod.
#
# That holds for the dev branch only. On `main` a run is a release: canceling
# one in progress can stop a deploy between its variable upsert and its
# verification, or an npm publish between two packages. So a run on `main` is
# never canceled by a newer push; the newer run waits in the same group until
# the running one ends (GitHub keeps one pending run per group, the newest),
# and its own deploy then carries both merges: main only moves forward, so the
# newest pending push contains every merge before it.
#
# The release group holds only runs that can release: a push, a pull_request,
# and a dispatch whose mode is deploy or publish (the two modes that start the
# jobs in the production environment). Every other dispatch mode (probe, test,
# paytest, purl, drain, demo, the bazaar passes) runs in a second group per
# branch. In one shared group a long manual pass held a merge's tests and
# deploy behind it, and a dispatch queued after a pending merge run replaced
# it, so that merge's run never started. The manual modes still run one at a
# time among themselves, and are never canceled on main.
# scripts/test-ci-gating.js evaluates this expression for every mode a job reads.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'deploy' && inputs.mode != 'publish' && format('deploy-dispatch-{0}', github.ref) || format('deploy-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  # NO path filter on this push trigger, deliberately - GitHub Actions applies
  # `paths:` to every branch in a single push block, there is no way to scope
  # it to claude/sweet-brown-i99jl3 only. It used to be here, and used to gate
  # BOTH branches; removing it is what actually lets `main` fire at all (see
  # below), so it could not simply be duplicated onto a second push entry -
  # `on:` only accepts one `push:` key.
  #
  # `claude/sweet-brown-i99jl3` is unaffected in practice: every real commit
  # there already carries a marker by convention (a marker-less push just
  # means the lightweight `markers` job runs and every other job correctly
  # skips - negligible cost, not a correctness change).
  #
  # `main` NEEDS no path filter and no marker: a PR merge's commit is
  # whatever the PR contained (its subject is usually the PR title), so an
  # external contributor's merge will never touch a trigger-* file and, more
  # to the point, will never carry our [deploy] marker either. A push to main
  # is asked to test-and-deploy UNCONDITIONALLY instead (see the test/deploy
  # jobs' own `if:` below) - merging to main means "this should be live" in
  # this project's model, full stop, no marker required.
  #
  # Found the hard way 2026-08-11: five PRs merged straight to main (one from
  # an external contributor, three from throwaway Cursor branches) landed
  # correct-in-source and green-in-CI while production silently kept serving
  # the pre-merge build for hours, because this trigger only ever watched the
  # dev branch. One of those five was a duplicate-seller bug an external
  # contributor found LIVE IN PRODUCTION after their own fix had already
  # merged - they were right, and CI could not have told them otherwise.
  #
  # The normal flow deploys once: a dev-branch push runs the tests (its
  # commits carry [test], never [deploy], and the production environment's
  # branch policy admits only main), and the merge to main deploys. A merge
  # that had no dev-branch push at all deploys the same way.
  push:
    branches:
      - "claude/sweet-brown-i99jl3"
      - "main"
  # PRs into main run the test + markers jobs so branch-protection required
  # checks always report (N-04 hardening). SAFE by construction: the markers
  # job emits ALL markers false on any non-push event, and every deploy/money
  # job gates on `workflow_dispatch && mode==X || markers.X == 'true'` (plus,
  # for test/deploy, the unconditional-on-main-push clause below) — so none
  # of them can fire on a pull_request itself. Only the test job opts in (via
  # its own `github.event_name == 'pull_request'` condition below).
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "probe, test, paytest, purl (Stripe client interop), publish (npm), bazaar-refresh, bazaar-register (one-shot: pay missing routes so the Coinbase harvester registers them), bazaar-solana, demo (run the company one-pager with the funded burner, upload output), or deploy"
        default: "deploy"
      demo_ticker:
        description: "Ticker for mode=demo (US symbol)."
        default: "NVDA"

# Least privilege by default: jobs get a read-only GITHUB_TOKEN. The only job
# that needs more (publish → OIDC) overrides this with its own permissions block.
permissions:
  contents: read

jobs:
  # Single source of truth for marker parsing. Every downstream job gates on
  # `needs.markers.outputs.<name> == 'true'` instead of calling
  # `contains(join(github.event.commits.*.message), '[...]')` directly.
  #
  # Why: the old contains() check was a substring scan over both subject lines
  # AND bodies, so prose in a commit message that mentioned a marker (even in
  # negation, like "publish later via the publish marker") would trip the gate.
  # This job scans only commit subject lines (%s) across the push range, and
  # matches each marker as a standalone whitespace-delimited token.
  markers:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # actions: read lets the parse step list this workflow's earlier runs and
    # their jobs (scripts/marker-base.js); nothing here writes.
    permissions:
      contents: read
      actions: read
    outputs:
      test: ${{ steps.parse.outputs.test }}
      deploy: ${{ steps.parse.outputs.deploy }}
      publish: ${{ steps.parse.outputs.publish }}
      probe: ${{ steps.parse.outputs.probe }}
      drain: ${{ steps.parse.outputs.drain }}
      paytest: ${{ steps.parse.outputs.paytest }}
      purl: ${{ steps.parse.outputs.purl }}
      bazaar_refresh: ${{ steps.parse.outputs.bazaar_refresh }}
      bazaar_register: ${{ steps.parse.outputs.bazaar_register }}
      bazaar_solana: ${{ steps.parse.outputs.bazaar_solana }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages carry mechanism, not market framing
        # Scoped to the PUSH RANGE, never all history: the offenders already
        # merged cannot be reworded (the oldest is 2026-06-16, so a rewrite
        # means new SHAs for ~90% of the repo, a force-push to a protected
        # branch and a broken .gitleaks.toml commit allowlist - and the old
        # objects stay addressable by SHA and live on in every fork anyway).
        # This stops the NEXT one, which is the part still controllable.
        # Lives here because this job is the only one that checks out full
        # history (fetch-depth: 0) and already has the range.
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Event is $EVENT_NAME (not push) - no range to scan."
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$AFTER~1..$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          echo "Scanning $RANGE"
          COMMIT_RANGE="$RANGE" node scripts/test-commit-message-framing.js
      - id: parse
        name: Parse markers from commit subject lines only
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          MARKER_WORKFLOW_FILE: deploy.yml
        run: |
          set -euo pipefail
          MARKERS="test deploy publish probe drain paytest purl bazaar-refresh bazaar-register bazaar-solana"
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Event is $EVENT_NAME (not push) — emitting all markers as false."
            for m in $MARKERS; do
              echo "${m//-/_}=false" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          # Collect subject lines for every commit in this push range.
          # Fall back to the head commit alone if BEFORE is empty/zero
          # (new branch or force-push with no shared ancestor) or unreachable.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            TITLES=$(git log -1 --format='%s' "$AFTER")
          else
            TITLES=$(git log --format='%s' "$BEFORE..$AFTER" 2>/dev/null || git log -1 --format='%s' "$AFTER")
          fi
          # On main a pending run can be replaced by a newer push before it
          # starts (one pending run per concurrency group), and the pushed range
          # above holds only this push's commits. Read on from the head of the
          # last run whose markers job finished (scripts/marker-base.js), so a
          # replaced push's markers are read here, by exactly one run. No such
          # run, an unreadable API or a commit that is not an ancestor of this
          # push leaves the pushed range as it is.
          if [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
            LAST=$(node scripts/marker-base.js || true)
            if printf '%s' "$LAST" | grep -qE '^[0-9a-f]{40}$' && git cat-file -e "$LAST^{commit}" 2>/dev/null && git merge-base --is-ancestor "$LAST" "$AFTER" 2>/dev/null; then
              echo "Reading subjects since the last run that read its markers: $LAST"
              SINCE=$(git log --format='%s' "$LAST..$AFTER")
              TITLES=$(printf '%s\n%s\n' "$TITLES" "$SINCE" | awk 'NF && !seen[$0]++')
            else
              echo "No earlier run to read from; the pushed range stands."
            fi
          fi
          echo "Subject lines scanned for markers:"
          printf '%s\n' "$TITLES" | sed 's/^/  /'
          # Standalone token match: marker must be bracketed and bounded by
          # whitespace, line edges, or ANOTHER bracketED marker. So
          # "feat: stuff (publish)" never matches the publish gate and
          # "publish-config" never matches either — but "[test][deploy]"
          # (no space) matches BOTH. Without the bracket boundary, that
          # subject skipped every job while the workflow still reported
          # success — a false-green deploy (2026-07-03 incident).
          for m in $MARKERS; do
            out_name="${m//-/_}"
            if printf '%s\n' "$TITLES" | grep -qE "(^|[[:space:]]|\])\[${m}\]([[:space:]]|\[|\$)"; then
              echo "${out_name}=true" >> "$GITHUB_OUTPUT"
              echo "[${m}] matched"
            else
              echo "${out_name}=false" >> "$GITHUB_OUTPUT"
            fi
          done

  # Answers one question: is the tree main is about to build byte-identical to
  # a tree that already went green on the dev branch? If so, the suite about to
  # run is the same suite over the same files - ~13 minutes of duplicated work
  # on every single change.
  #
  # It gates only a SKIP. `deploy` still refuses to run on a lane that FAILED;
  # the exception it allows is narrow and explicit (see its `if:`), so the
  # "cannot ship without tests" property holds - the only way past a skipped
  # lane is this job proving the identical tree already passed.
  tree-gate:
    needs: markers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The gate reads deploy.yml with the real YAML parser rather than a
      # bespoke regex, so it needs node_modules. Omitting this is what made its
      # first real run fail: js-yaml is a genuine dependency, it just was not
      # installed here. The failure was harmless because the whole design fails
      # closed - every lane ran exactly as it would have without the gate - but
      # a guard that cannot execute saves nothing.
      # node_modules restored by lockfile hash (2026-08-25): npm ci was 13-17 s in
      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        env:
          UPSTREAM_COSTS_JSON: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: npm ci
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-tree-gate.js

  paytest:
    needs: markers
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'paytest' || needs.markers.outputs.paytest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TARGET_URL: https://agent402.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/fetch@2.30.0 viem@2.52.2

      # Run FIRST (before the slow faucet-funding E2E) for fast iteration. Live
      # proof of the agent402-client 402-inspection preflight (v0.6.0): a real Base
      # burner buy on PROD, with a raw-payFetch CONTROL right beside the client buy
      # so a 402 is attributed correctly (client bug vs funding/facilitator).
      - name: Live client-SDK 402-inspection (real Base burner buy vs prod)
        if: always()
        continue-on-error: true
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
          TARGET_URL: https://agent402.tools
        run: |
          if [ -z "$BURNER_KEY" ]; then echo "BURNER_KEY unset — skipping live client paid test."; exit 0; fi
          echo "::add-mask::$BURNER_KEY"
          printf '%s' "$BURNER_KEY" > /tmp/client-burner-key
          KEY_FILE=/tmp/client-burner-key node scripts/test-client-paid-live.js; rc=$?
          shred -u /tmp/client-burner-key 2>/dev/null || rm -f /tmp/client-burner-key
          exit $rc

      # Real end-to-end proof of the IPv4 egress fix: buy the exact wallet-only tools
      # that were 504ing on the IPv6 race (treasury-debt/avg-rates, gov-data) many
      # times with the real burner and assert every paid call delivers data — zero
      # charged failures. Runs early (before the slow faucet E2E) for fast iteration.
      - name: Live IPv4-egress proof (real burner buys of the previously-504ing tools)
        if: always()
        continue-on-error: true
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
          TARGET_URL: https://agent402.tools
        run: |
          if [ -z "$BURNER_KEY" ]; then echo "BURNER_KEY unset — skipping live treasury paid test."; exit 0; fi
          echo "::add-mask::$BURNER_KEY"
          printf '%s' "$BURNER_KEY" > /tmp/treasury-burner-key
          KEY_FILE=/tmp/treasury-burner-key node scripts/test-treasury-paid-live.js; rc=$?
          shred -u /tmp/treasury-burner-key 2>/dev/null || rm -f /tmp/treasury-burner-key
          exit $rc

      # Wallet birth-to-first-purchase E2E: a keypair generated inside the
      # runner (never printed, never persisted — only its address) is faucet-
      # funded with testnet USDC and completes a REAL x402 purchase against a
      # paid-mode base-sepolia server, then every byte of output + the server
      # log is scanned for key material. Proves the whole onboarding flow a
      # new user walks, and that no secret can leak from it.
      - name: Wallet E2E — fresh key → faucet → real x402 settle → leak audit
        # continue-on-error: testnet facilitator reverts don't block the PROD
        # buy step. The E2E still reports FAIL in the log but doesn't gate.
        continue-on-error: true
        env:
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
          FULL_E2E: "1"
        run: node scripts/test-wallet-e2e.js
      # Regression guard for the 2026-07-02 outage: a network listed in
      # PAYMENT_NETWORKS but backed by NO facilitator (robinhood without
      # ROBINHOOD_FACILITATOR_URL) must be DROPPED from the 402 offer, not
      # poison it. Before the fix this threw while building the challenge and
      # surfaced as HTTP 500 on EVERY paid endpoint. Boot paid mode with
      # base(+CDP)+robinhood and NO robinhood facilitator, then assert a paid
      # route still returns a 402 whose accepts EXCLUDE robinhood (eip155:4663).
      # Gating — this locks the incident so it can never silently recur.
      - name: Regression — facilitator-less network must not 500 the paywall
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS || '0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0' }}
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
          ROBINHOOD_FACILITATOR_URL_SECRET: ${{ secrets.ROBINHOOD_FACILITATOR_URL }}
        run: |
          # robinhood in PAYMENT_NETWORKS; ROBINHOOD_FACILITATOR_URL deliberately UNSET.
          PAYMENT_NETWORKS=base,robinhood NETWORK=base PORT=3795 \
            node src/server.js > /tmp/reg-srv.log 2>&1 &
          SRV=$!
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3795/health >/dev/null 2>&1 && break; sleep 1; done
          grep -iE 'dropping Robinhood|Accepting USDC|facilitator routing' /tmp/reg-srv.log | head -5 || true
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3795/api/hash \
            -H 'Content-Type: application/json' -d '{"text":"x"}')
          HDR=$(curl -s -D - -o /dev/null -X POST http://127.0.0.1:3795/api/hash \
            -H 'Content-Type: application/json' -d '{"text":"x"}' \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="payment-required"{print $2}' | head -1)
          NETS=$(node -e 'const h=process.argv[1]||""; if(!h){console.log("[]");process.exit(0)} const d=JSON.parse(Buffer.from(h,"base64").toString("utf8")); console.log(JSON.stringify((d.accepts||[]).map(a=>a.network)))' "$HDR")
          kill $SRV 2>/dev/null || true
          echo "unpaid /api/hash -> HTTP $code (expect 402) | offered networks: $NETS"
          fail=0
          [ "$code" = "402" ] || { echo "FAIL: expected 402, got $code — facilitator-less network poisoned the paywall"; fail=1; }
          case "$NETS" in *eip155:4663*) echo "FAIL: robinhood (eip155:4663) still offered with no facilitator"; fail=1;; esac
          [ "$fail" = "0" ] && echo "PASS: robinhood dropped, base 402 intact" || exit 1
          # Second regression (2026-07-02, part two): a robinhood-ONLY server
          # (NETWORK=robinhood, the live-settle test's config) must BOOT with
          # only ROBINHOOD_FACILITATOR_URL — the generic resolver used to
          # demand CDP keys / FACILITATOR_URL and crash. Runs only when the
          # secret is available; asserts boot + a 402 offering eip155:4663.
          if [ -n "$ROBINHOOD_FACILITATOR_URL_SECRET" ]; then
            ROBINHOOD_FACILITATOR_URL="$ROBINHOOD_FACILITATOR_URL_SECRET" \
              NETWORK=robinhood PAYMENT_NETWORKS=robinhood PORT=3796 \
              node src/server.js > /tmp/reg-rh.log 2>&1 &
            SRV2=$!
            for i in $(seq 1 40); do curl -sf http://127.0.0.1:3796/health >/dev/null 2>&1 && break; sleep 1; done
            code2=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3796/api/hash \
              -H 'Content-Type: application/json' -d '{"text":"x"}')
            HDR2=$(curl -s -D - -o /dev/null -X POST http://127.0.0.1:3796/api/hash \
              -H 'Content-Type: application/json' -d '{"text":"x"}' \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="payment-required"{print $2}' | head -1)
            NETS2=$(node -e 'const h=process.argv[1]||""; if(!h){console.log("[]");process.exit(0)} const d=JSON.parse(Buffer.from(h,"base64").toString("utf8")); console.log(JSON.stringify((d.accepts||[]).map(a=>a.network)))' "$HDR2")
            kill $SRV2 2>/dev/null || true
            echo "robinhood-only /api/hash -> HTTP $code2 | offered: $NETS2"
            if [ "$code2" != "402" ]; then
              echo "FAIL: robinhood-only server did not serve a 402 (boot log tail):"
              tail -8 /tmp/reg-rh.log; exit 1
            fi
            case "$NETS2" in *eip155:4663*) echo "PASS: robinhood-only server boots and offers USDG on 4663";;
              *) echo "FAIL: robinhood-only 402 does not offer eip155:4663"; exit 1;; esac
          else
            echo "(ROBINHOOD_FACILITATOR_URL secret unset — robinhood-only boot check skipped)"
          fi
      - name: Load burner key
        env:
          # Provide a throwaway, low-value test wallet key as the BURNER_KEY
          # repo secret only (never a workflow_dispatch input: dispatch inputs
          # are not masked and would leak the key into run metadata/logs —
          # security audit A402-04). Never commit a private key to the repo.
          # With the secret unset, the script generates a fresh wallet and
          # waits for funding.
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
        run: |
          if [ -n "$BURNER_KEY" ]; then
            echo "::add-mask::$BURNER_KEY"
            printf '%s' "$BURNER_KEY" > "$RUNNER_TEMP/agent-key"
            chmod 600 "$RUNNER_TEMP/agent-key"
          fi
      - name: Generate burner agent wallet
        run: MODE=address KEY_FILE=$RUNNER_TEMP/agent-key node scripts/agent-e2e.js
      - name: Publish funding address
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-address
          path: agent-address.txt
      - name: Wait for funding, then buy from the live API
        env:
          # Marks every e2e buy with X-Heartbeat-Token → synthetic in the
          # sales ledger + PostHog, so full-suite proof runs don't read as
          # organic external demand in revenue analyses.
          POW_SECRET: ${{ secrets.POW_SECRET }}
        run: MODE=run KEY_FILE=$RUNNER_TEMP/agent-key node scripts/agent-e2e.js
      # Forward-looking: prove the Robinhood Chain (chain 4663) params baked
      # into x402-kit are correct and its public RPC is live, so the
      # `robinhood` network on tx-status/gas-estimate actually works. Read-
      # only, no secrets, non-gating (a day-old chain's RPC may flap).
      - name: Robinhood Chain read probe (chain 4663 RPC live + params correct)
        if: always()
        run: node scripts/rh-chain-probe.js || true
      # LIVE Robinhood Chain / USDG settlement. Boots a Robinhood-ONLY server (so
      # the buyer's only option is USDG on chain 4663 via the configured external
      # facilitator), confirms the burner holds USDG, then buys one cheap tool — a
      # real on-chain USDG transfer. Retries with EIP-712 version=2 if 1's
      # signature is rejected. Non-gating: it reports the settlement tx (or the
      # facilitator's reason). Requires the burner (its address is published as
      # the funding artifact) to hold USDG on Robinhood Chain, and the
      # ROBINHOOD_FACILITATOR_URL secret to be set; otherwise it self-reports and skips.
      - name: Live Robinhood Chain USDG settlement (burner-funded, real on-chain settle)
        if: always()
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS || '0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0' }}
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          ROBINHOOD_FACILITATOR_URL: ${{ secrets.ROBINHOOD_FACILITATOR_URL }}
        run: |
          if [ -z "$ROBINHOOD_FACILITATOR_URL" ]; then
            echo "ROBINHOOD_FACILITATOR_URL secret unset — skipping live Robinhood settlement."; exit 0
          fi
          printf '%s' "$BURNER_KEY" > /tmp/burner-key
          settled=0
          for V in 1 2; do
            echo "=================== USDG EIP-712 version=$V ==================="
            ROBINHOOD_USDG_EIP712_VERSION=$V \
              NETWORK=robinhood PAYMENT_NETWORKS=robinhood \
              PORT=3790 node src/server.js > /tmp/rh-settle-srv.log 2>&1 &
            SRV=$!
            for i in $(seq 1 40); do curl -sf http://127.0.0.1:3790/health >/dev/null 2>&1 && break; sleep 1; done
            grep -iE 'facilitator|robinhood|accepting usdc|USDG' /tmp/rh-settle-srv.log | head -4 || true
            if TARGET_URL=http://127.0.0.1:3790 KEY_FILE=/tmp/burner-key node scripts/rh-settle-test.js; then
              echo ">>> SETTLED with USDG EIP-712 version=$V"; settled=1; kill $SRV 2>/dev/null || true; break
            fi
            echo "--- server-side facilitator/settle log (version=$V) ---"
            grep -viE '\[tool-error\]' /tmp/rh-settle-srv.log | grep -iE 'facilitator|verify|settle|invalid|reject|error|USDG|payment' | tail -12 || true
            kill $SRV 2>/dev/null || true
            sleep 2
          done
          shred -u /tmp/burner-key 2>/dev/null || rm -f /tmp/burner-key
          if [ "$settled" = "1" ]; then echo "RESULT: ✅ real USDG settlement on Robinhood Chain succeeded"; else echo "RESULT: settlement did not succeed (see reasons above)"; fi
      # Polygon USDC settlement via PayAI facilitator. Boots a Polygon-ONLY
      # server so the buyer's only option is USDC on chain 137, then buys one
      # cheap tool. Non-gating: PayAI free-tier flaps must not block the run.
      - name: Polygon USDC settlement probe (PayAI facilitator, chain 137)
        if: always()
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS || '0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0' }}
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
        run: |
          if [ ! -f "$RUNNER_TEMP/agent-key" ]; then
            if [ -z "$BURNER_KEY" ]; then echo "No burner key — skipping Polygon settlement."; exit 0; fi
            printf '%s' "$BURNER_KEY" > "$RUNNER_TEMP/agent-key"
            chmod 600 "$RUNNER_TEMP/agent-key"
          fi
          NETWORK=polygon PAYMENT_NETWORKS=polygon \
            FACILITATOR_URL=https://facilitator.payai.network \
            PORT=3791 node src/server.js > /tmp/poly-srv.log 2>&1 &
          SRV=$!
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3791/health >/dev/null 2>&1 && break; sleep 1; done
          grep -iE 'facilitator|polygon|accepting usdc|multi-chain' /tmp/poly-srv.log | head -4 || true
          CHAIN=polygon TARGET_URL=http://127.0.0.1:3791 KEY_FILE="$RUNNER_TEMP/agent-key" \
            node scripts/evm-settle-test.js || true
          kill $SRV 2>/dev/null || true
      # Arbitrum USDC settlement via PayAI facilitator. Same pattern as Polygon
      # but chain 42161. Non-gating.
      - name: Arbitrum USDC settlement probe (PayAI facilitator, chain 42161)
        if: always()
        env:
          WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS || '0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0' }}
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
        run: |
          if [ ! -f "$RUNNER_TEMP/agent-key" ]; then
            if [ -z "$BURNER_KEY" ]; then echo "No burner key — skipping Arbitrum settlement."; exit 0; fi
            printf '%s' "$BURNER_KEY" > "$RUNNER_TEMP/agent-key"
            chmod 600 "$RUNNER_TEMP/agent-key"
          fi
          NETWORK=arbitrum PAYMENT_NETWORKS=arbitrum \
            FACILITATOR_URL=https://facilitator.payai.network \
            PORT=3792 node src/server.js > /tmp/arb-srv.log 2>&1 &
          SRV=$!
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3792/health >/dev/null 2>&1 && break; sleep 1; done
          grep -iE 'facilitator|arbitrum|accepting usdc|multi-chain' /tmp/arb-srv.log | head -4 || true
          CHAIN=arbitrum TARGET_URL=http://127.0.0.1:3792 KEY_FILE="$RUNNER_TEMP/agent-key" \
            node scripts/evm-settle-test.js || true
          kill $SRV 2>/dev/null || true
      - name: Shred burner key
        if: always()
        run: |
          # Defense in depth: even though hosted runners are ephemeral, scrub
          # the on-disk key as soon as the consuming steps are done so any
          # later step (or rerun reusing cached layers) can't read it.
          if [ -f "$RUNNER_TEMP/agent-key" ]; then
            shred -u "$RUNNER_TEMP/agent-key" 2>/dev/null || rm -f "$RUNNER_TEMP/agent-key"
          fi

  bazaar-solana:
    # One-shot sweep: pays every catalog route priced <= $0.05 once VIA SOLANA
    # (SVM client, settled at the boot order's first facilitator, CDP), so
    # settlement-driven indexes register each tool for Solana and every
    # harvester re-observes the live 402 with the full multi-chain accepts.
    # The PayAI registry is filled by spend.yml's listing-pass job, which asks for PayAI
    # per request. Skips the LLM/image/audio/code proxies (real
    # upstream credit per call). Payments recycle burner -> revenue wallet.
    needs: markers
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bazaar-solana' || needs.markers.outputs.bazaar_solana == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TARGET_URL: https://agent402.tools
      MODE: sweep
      PAY_NETWORK: solana
      MAX_PRICE_USD: "0.05"
      MAX_SPEND_USD: "8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/fetch@2.30.0 @x402/core@2.30.0 @x402/evm@2.30.0 @x402/svm@2.30.0 @solana/kit@8.6.0 viem@2.52.2
      - name: Sweep the catalog via Solana settlement
        env:
          SOLANA_BURNER_KEY: ${{ secrets.SOLANA_BURNER_KEY }}
        run: |
          [ -n "$SOLANA_BURNER_KEY" ] || { echo "No SOLANA_BURNER_KEY — cannot pay the Solana sweep"; exit 1; }
          echo "::add-mask::$SOLANA_BURNER_KEY"
          node scripts/refresh-bazaar.js

  bazaar-refresh:
    # One-shot job: makes a tiny paid request against every Agent402 Bazaar
    # listing whose serviceName is stale, so the CDP harvester re-observes
    # the current 402 challenge metadata (description, serviceName, tags).
    needs: markers
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bazaar-refresh' || needs.markers.outputs.bazaar_refresh == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_URL: https://agent402.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/fetch@2.30.0 @x402/core@2.30.0 @x402/evm@2.30.0 viem@2.52.2
      - name: Refresh stale Bazaar listings
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
        run: |
          [ -n "$BURNER_KEY" ] || { echo "No BURNER_KEY — cannot refresh paid listings"; exit 1; }
          echo "::add-mask::$BURNER_KEY"
          node scripts/refresh-bazaar.js

  bazaar-register:
    # One-shot job: discovers catalog routes that the Coinbase CDP Bazaar
    # harvester has never observed and pays one tiny request against each so
    # the harvester registers them. Idempotent — already-registered routes
    # drop out of the missing set, so partial runs can be resumed.
    #
    # Cost is bounded by MAX_SPEND_USD; the script refuses to run if the
    # estimate exceeds that ceiling.
    #
    # Ordering: buys hit PROD, so when this run also deploys, wait for the
    # deploy — otherwise the sweep buys routes the old build still serves
    # (2026-07-09: three runs bought a route whose fix was sitting in the
    # same run's undeployed commit — settled, then 502'd). deploy skipped
    # (no [deploy] marker) still runs the sweep immediately.
    needs: [markers, deploy]
    if: always() && (github.event_name == 'workflow_dispatch' && inputs.mode == 'bazaar-register' || needs.markers.outputs.bazaar_register == 'true') && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_URL: https://agent402.tools
      MODE: missing
      MAX_SPEND_USD: "12"
      SLUGS: ${{ vars.BAZAAR_REGISTER_SLUGS || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/fetch@2.30.0 @x402/core@2.30.0 @x402/evm@2.30.0 viem@2.52.2
      - name: Register missing Bazaar routes
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
        run: |
          [ -n "$BURNER_KEY" ] || { echo "No BURNER_KEY — cannot pay to register missing routes"; exit 1; }
          echo "::add-mask::$BURNER_KEY"
          node scripts/refresh-bazaar.js

  bazaar-sweep:
    # One-shot job (workflow_dispatch mode=bazaar-sweep): pays one tiny Base
    # settlement against every cheap catalog route (≤ MAX_PRICE_USD) so
    # settlement-driven indexes (x402scan) OBSERVE and list them. Distinct from
    # bazaar-register (MODE=missing, only routes the Bazaar has never registered):
    # this re-settles every affordable route to refresh the observation those
    # indexes key on. Split into BATCH_COUNT passes (BATCH_INDEX 0..N) so no
    # single pass runs long enough to time out; each pass is bounded by
    # MAX_SPEND_USD (the script refuses to run a batch whose estimate exceeds it).
    needs: [markers, deploy]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'bazaar-sweep' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_URL: https://agent402.tools
      MODE: sweep
      PAY_NETWORK: base
      MAX_PRICE_USD: "0.01"
      MAX_SPEND_USD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/fetch@2.30.0 @x402/core@2.30.0 @x402/evm@2.30.0 viem@2.52.2
      - name: Sweep the catalog via Base settlement (4 batches)
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
        run: |
          [ -n "$BURNER_KEY" ] || { echo "No BURNER_KEY — cannot pay the Base sweep"; exit 1; }
          echo "::add-mask::$BURNER_KEY"
          for i in 0 1 2 3; do
            echo "::group::sweep batch $((i+1))/4"
            BATCH_COUNT=4 BATCH_INDEX=$i node scripts/refresh-bazaar.js || echo "batch $((i+1)) reported errors (continuing)"
            echo "::endgroup::"
            [ "$i" -lt 3 ] && sleep 45 || true
          done

  drain:
    needs: markers
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'drain' || needs.markers.outputs.drain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/fetch@2.30.0 @x402/core@2.30.0 @x402/evm@2.30.0 viem@2.52.2
      - name: Drain the burner into the revenue wallet via paid tool calls
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          TARGET_URL: https://agent402.tools
        run: |
          [ -n "$BURNER_KEY" ] || { echo "No BURNER_KEY — nothing to drain"; exit 0; }
          echo "::add-mask::$BURNER_KEY"
          printf '%s' "$BURNER_KEY" > "$RUNNER_TEMP/agent-key" && chmod 600 "$RUNNER_TEMP/agent-key"
          KEY_FILE="$RUNNER_TEMP/agent-key" node scripts/drain-burner.js
      - name: Shred burner key
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/agent-key" ]; then
            shred -u "$RUNNER_TEMP/agent-key" 2>/dev/null || rm -f "$RUNNER_TEMP/agent-key"
          fi

  # Interop check against Stripe's open-source x402 client (github.com/stripe/purl).
  # Stripe's machine-payments quickstart points buyers at purl, so "purl can pay
  # us" means every developer following Stripe's docs can buy from us unchanged.
  purl:
    needs: markers
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'purl' || needs.markers.outputs.purl == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_URL: https://agent402.tools
    steps:
      - name: Install Stripe purl
        run: |
          if brew install stripe/purl/purl 2>&1; then
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          else
            echo "brew install failed — building from source"
            git clone --depth 1 https://github.com/stripe/purl /tmp/purl
            cargo install --locked --path /tmp/purl/cli
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Show purl CLI surface (for the logs)
        run: |
          purl --version || true
          purl --help || true
          purl wallet --help || true
          purl wallet add --help || true
      - name: Import burner wallet (non-interactive keystore)
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          PURL_PASSWORD: ci-throwaway
        run: |
          [ -n "$BURNER_KEY" ] || { echo "no burner key — skipping wallet import"; exit 0; }
          echo "::add-mask::$BURNER_KEY"
          purl wallet add --name burner --type evm -k "$BURNER_KEY" -p "$PURL_PASSWORD" --set-active=true
          purl wallet list
      - name: "Interop gate: purl must parse our 402 quote (--dry-run)"
        env:
          PURL_PASSWORD: ci-throwaway
        run: |
          set +e
          OUT=$(purl --dry-run "$TARGET_URL/api/dns?name=example.com&type=A" 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          echo "(exit $STATUS)"
          # Pass if purl surfaced our payment requirements (price/asset/network),
          # i.e. it understood the 402 challenge our server returns.
          echo "$OUT" | grep -Eiq 'usdc|0\.001|eip155|base|payment' \
            || { echo "::error::purl could not parse the x402 challenge from $TARGET_URL"; exit 1; }
          echo "purl parsed our x402 quote — Stripe-tooling compatible"
      - name: Real paid call via purl (best effort, burner dust)
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          PURL_PASSWORD: ci-throwaway
          # $0.001 price = 1000 atomic USDC units; cap at 2000 to also exercise
          # purl's client-side spend control.
          PURL_MAX_AMOUNT: "2000"
        run: |
          [ -n "$BURNER_KEY" ] || { echo "no burner key — skipping paid call"; exit 0; }
          set +e
          OUT=$(purl "$TARGET_URL/api/dns?name=example.com&type=A" 2>&1)
          STATUS=$?
          set -e
          echo "$OUT" | head -40
          if [ $STATUS -eq 0 ] && echo "$OUT" | grep -q 'records'; then
            echo "PAID CALL SETTLED via Stripe's purl client ✓"
          else
            echo "paid call did not complete (likely dust balance) — not failing the job"
          fi

  # On-demand: run the company one-pager demo against prod with the funded
  # burner, real USDC buys end to end, and upload the terminal output as an
  # artifact. Dispatch-only (gh workflow run deploy.yml -f mode=demo
  # [-f demo_ticker=AAPL]) — no marker, repeatable any time.
  demo:
    needs: markers
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'demo'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_URL: https://agent402.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/fetch@2.30.0 viem@2.52.2
      - name: Run the demo (real paid buys from the burner)
        env:
          AGENT_KEY: ${{ secrets.BURNER_KEY }}
          # Marks the buys as internal traffic in the sales ledger (see the
          # note in scripts/demo-company-onepager.js); on-chain txs stay real.
          POW_SECRET: ${{ secrets.POW_SECRET }}
          # Dispatch input rides an env var, never shell interpolation (N-03).
          DEMO_TICKER: ${{ inputs.demo_ticker || 'NVDA' }}
        run: |
          [ -n "$AGENT_KEY" ] || { echo "::error::BURNER_KEY secret is not set"; exit 1; }
          node scripts/demo-company-onepager.js "$DEMO_TICKER" | tee demo-output.txt
      - name: Upload demo output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-output
          path: demo-output.txt

  # LANE TRIGGER RULE (2026-08-25). Every push to the dev branch runs every lane,
  # marker or not: a lane that is SKIPPED still satisfies a required status check
  # on GitHub, so a marker-less push used to produce a mergeable-looking PR whose
  # tests never ran. And a PR from our own dev branch does NOT run the lanes on
  # the pull_request event: the push-event run of the same commit already did,
  # required checks are check runs on the COMMIT, so the twin proved nothing and
  # doubled the runner minutes (16+ lanes queued against the concurrency cap).
  # PRs from forks or any other branch get no push run here, so they keep the
  # full pull_request lanes - that is what the head.repo/head.ref test guards.
  test-unit-a:
    # Test job runs on its own [test] marker AND auto-runs whenever a commit
    # asks to deploy or publish — so deploy/publish can hard-gate on it via
    # `needs: test`. This makes "ship without running tests" impossible by
    # design, not by developer discipline.
    needs: [markers, tree-gate]
    # Runs on the [test]/[deploy]/[publish] markers, on the matching
    # workflow_dispatch modes, on every PR into main (N-04: so the required
    # `test` status check always reports), AND unconditionally on every push
    # to main — a merge to main has no marker to scan (see the `on:` block
    # above) and needs none: it is asked to test-and-deploy regardless.
    # `!cancelled()` because tree-gate does not run at all outside a push to
    # main, and a SKIPPED `needs` job skips its dependents unless the dependent
    # carries a status function - without this, every dev-branch and PR run
    # would silently stop testing. With tree-gate skipped OR failed its output
    # is empty, which is not 'true', so the lane runs: the gate can only ever
    # subtract work by succeeding and saying so.
    if: >-
      !cancelled()
      && (
        (github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/sweet-brown-i99jl3')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/sweet-brown-i99jl3')) || github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' || inputs.mode == 'deploy' || inputs.mode == 'publish') || needs.markers.outputs.test == 'true' || needs.markers.outputs.deploy == 'true' || needs.markers.outputs.publish == 'true'
      )
      && needs.tree-gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # A healthy run takes 22-25 min. Without this the GitHub default is 360
    # min, and on 2026-08-18 two consecutive runs sat for 28+ min inside the
    # Playwright system-deps apt step (see below) — the deploy job hard-gates
    # on this one, so a hung test job silently blocks every deploy behind it.
    timeout-minutes: 60
    # A REAL redis, because until 2026-08-07 nothing in CI ever connected to
    # one. test-shared-limit.js injects a fake store deliberately (it proves
    # "two callers share one counter", and a fake proves that exactly), but
    # that left the redis CLIENT path untested — so Dependabot's redis 4 -> 6
    # bump arrived with a green CI that could not have caught a client
    # regression. Prod is not in-memory: REDIS_URL is set there, and the shared
    # limiter FAILS CLOSED, so a client regression refuses trials.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    # F07: provider keys stay at job scope so every TEST step gates its
    # expectations on the SAME config the booted server has. But the ONE step
    # that runs untrusted third-party code — the dependency install, where npm
    # lifecycle scripts execute — SHADOWS them to empty (below), so a malicious
    # package cannot read them. That is the real F07 exposure; our own test
    # steps are trusted code from this repo.
    env:
      UPSTREAM_COSTS_JSON: ${{ secrets.UPSTREAM_COSTS_JSON }}
      # A fork PR cannot read the secret; its cost-table suites skip instead of failing.
      UPSTREAM_COSTS_OPTIONAL: ${{ github.event.pull_request.head.repo.fork && '1' || '' }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API_KEY_V2: ${{ secrets.FRED_API_KEY_V2 }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      # Raises CoinGecko off the 30/min keyless budget shared per runner IP.
      # It does NOT make the calls free: the Demo plan has a monthly quota and
      # CI would burn it on every push, which is the trap the Brave notes in
      # test-non-metered-examples.js already record. So the sweep still SAMPLES
      # the family (COINGECKO_SLUGS there). Key plus sampling: the two live
      # calls per run are reliable, and the quota lasts.
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: scripts/test-page-dates.js dates every page module
        # from its newest commit, and a shallow checkout would date them all
        # at the head.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Restores ~/.npm keyed on package-lock.json. `npm ci` still runs and
          # still installs exactly what the lockfile pins, so this only saves
          # the network fetch - a stale or poisoned cache cannot change which
          # versions land. Measured before adding it: 21s/19s/16s across the
          # three lanes on every single run, all of it re-downloading tarballs
          # that had not changed.
          cache: npm
      # node_modules restored by lockfile hash (2026-08-25): npm ci was 13-17 s in
      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        # F07: shadow the job-scope provider keys to EMPTY for this step only, so
        # a malicious dependency lifecycle script running during `npm ci` cannot
        # read them. No server or tool runs here, so empty keys are harmless.
        env:
          UPSTREAM_COSTS_JSON: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: npm ci
      # NO Playwright in this lane on purpose: it runs no browser-driven
      # script. All eight (csp-violations, css-tokens-resolve, focus-visible,
      # the reveal suite, burger-aria-label, compare-scroll,
      # non-metered-examples) live in the `test` lane. Installing Chromium
      # here cost 32s and 22s for nothing, and the slower unit lane IS the
      # critical path. If a browser-driven script is ever added here, copy
      # the install step back from the `test` job with it.
      - name: Start server in free mode
        run: |
          # Raise the MCP rate limit so the full-catalog connector test can sweep
          # every tool (production keeps the default 20/min, 120/hr).
          AGENT402_MCP_MAX_PER_MIN=1000000 AGENT402_MCP_MAX_PER_HOUR=1000000 \
            X402_SYNC_ON_START=false FREE_MODE=true X402_PAYWALL_PROBES_PER_CYCLE=0 PORT=3000 node src/server.js &
          for i in $(seq 1 20); do curl -s localhost:3000/health >/dev/null && break; sleep 1; done
      - name: CDP kit live check (real balances + onramp session — skips without secrets)
        env:
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
        run: node scripts/test-cdp-live.js

      - name: Buyer SDK (agent402-client — resolve + auto-pay via PoW; boots paid-mode)
        run: node client/test.js

      - name: OpenClaw provider plugin (agent402-openclaw — offline, stub gateway)
        run: node openclaw/test.js

      # The plugin against a REAL OpenClaw (npm openclaw@latest): plugins install,
      # setup through the bin symlink, models list, gateway boot, ONE agent turn to
      # a stub gateway. test.js proves the plugin against our model of OpenClaw;
      # this proves it against OpenClaw. It found the manifest refusal
      # (configSchema) and the auto-primary context overflow that 0.1.0-0.2.0
      # shipped with. npm registry only; no money moves.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: OpenClaw provider plugin against a REAL OpenClaw install
        # Third-party install (PINNED in the test; openclaw-latest.yml tracks
        # @latest on a schedule) with lifecycle scripts + its binary run
        # with network access: shadow the job's metered keys (same class as the
        # F07 npm ci step); the test also spawns with an allowlisted env.
        env:
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: node openclaw/test-real-install.js
      # The same file against the PREVIOUS pin, so raising the pin never drops
      # the host most installed users still run. Same key shadowing as above.
      - name: OpenClaw provider plugin against the previous OpenClaw pin
        env:
          OPENCLAW_SPEC: openclaw@2026.10.1
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: node openclaw/test-real-install.js
      # The pinned host (2026.9.x and later) requires Node >= 24.16; the lane itself
      # stays on 22 (prod's floor), so Node 24 is scoped to this one step and
      # the lane's version is restored right after.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # elizaos-plugin-agent402 against a REAL elizaOS runtime (2026-09-15): the
      # packed artifact + @elizaos/core, plugin-sql (PGlite) and plugin-bootstrap
      # from the registry, a real AgentRuntime, the runtime's own dispatcher on a
      # plain user message. Once on `latest` (1.x) and once on `beta` (2.x). The
      # registry review asked for exactly this; a stub runtime proved nothing.
      # Same key shadowing as above: third-party install with network access.
      # AFTER the Node 22 restore: the step boots src/server.js, whose native
      # modules were built for the lane's Node (a first cut ran under the
      # openclaw step's Node 24 and the server never answered).
      - name: elizaOS plugin against a REAL elizaOS runtime (latest + beta)
        env:
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: |
          node adapters/eliza/test-runtime.js
          ELIZA_CORE_VERSION=beta node adapters/eliza/test-runtime.js

      - name: Offline suites (10 scripts, one process each)
        run: bash scripts/ci/run-step.sh test-unit-a 1

      - name: Tollbooth tests (pay-per-crawl gate — node + edge/Web-Crypto)
        run: node tollbooth/test.js && node tollbooth/edge.test.js && node tollbooth/features.test.js && node tollbooth/tempo.test.js
      - name: Live visualizer tests (services/live, offline)
        run: node services/live/test.js

      - name: Live visualizer outbound guard and per-address stream cap (services/live, offline)
        run: node services/live/test-guard.js

      - name: Offline suites (5 scripts, one process each)
        run: bash scripts/ci/run-step.sh test-unit-a 2
      - name: Runner kills and memory (on failure)
        if: failure()
        run: |
          free -m || true
          sudo dmesg -T 2>/dev/null | grep -iE 'killed process|out of memory|oom-kill' | tail -20 || true
          ps -eo pid,rss,etime,comm --sort=-rss | head -15 || true

  test-unit-a3:
    # The second half of test-unit-a (2026-08-25, split by the seconds each item
    # measured in the previous run so both halves finish together). Same header,
    # same booted server, same env; only the step list differs.
    # Test job runs on its own [test] marker AND auto-runs whenever a commit
    # asks to deploy or publish — so deploy/publish can hard-gate on it via
    # `needs: test`. This makes "ship without running tests" impossible by
    # design, not by developer discipline.
    needs: [markers, tree-gate]
    # Runs on the [test]/[deploy]/[publish] markers, on the matching
    # workflow_dispatch modes, on every PR into main (N-04: so the required
    # `test` status check always reports), AND unconditionally on every push
    # to main — a merge to main has no marker to scan (see the `on:` block
    # above) and needs none: it is asked to test-and-deploy regardless.
    # `!cancelled()` because tree-gate does not run at all outside a push to
    # main, and a SKIPPED `needs` job skips its dependents unless the dependent
    # carries a status function - without this, every dev-branch and PR run
    # would silently stop testing. With tree-gate skipped OR failed its output
    # is empty, which is not 'true', so the lane runs: the gate can only ever
    # subtract work by succeeding and saying so.
    if: >-
      !cancelled()
      && (
        (github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/sweet-brown-i99jl3')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/sweet-brown-i99jl3')) || github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' || inputs.mode == 'deploy' || inputs.mode == 'publish') || needs.markers.outputs.test == 'true' || needs.markers.outputs.deploy == 'true' || needs.markers.outputs.publish == 'true'
      )
      && needs.tree-gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # A healthy run takes 22-25 min. Without this the GitHub default is 360
    # min, and on 2026-08-18 two consecutive runs sat for 28+ min inside the
    # Playwright system-deps apt step (see below) — the deploy job hard-gates
    # on this one, so a hung test job silently blocks every deploy behind it.
    timeout-minutes: 60
    # A REAL redis, because until 2026-08-07 nothing in CI ever connected to
    # one. test-shared-limit.js injects a fake store deliberately (it proves
    # "two callers share one counter", and a fake proves that exactly), but
    # that left the redis CLIENT path untested — so Dependabot's redis 4 -> 6
    # bump arrived with a green CI that could not have caught a client
    # regression. Prod is not in-memory: REDIS_URL is set there, and the shared
    # limiter FAILS CLOSED, so a client regression refuses trials.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    # F07: provider keys stay at job scope so every TEST step gates its
    # expectations on the SAME config the booted server has. But the ONE step
    # that runs untrusted third-party code — the dependency install, where npm
    # lifecycle scripts execute — SHADOWS them to empty (below), so a malicious
    # package cannot read them. That is the real F07 exposure; our own test
    # steps are trusted code from this repo.
    env:
      UPSTREAM_COSTS_JSON: ${{ secrets.UPSTREAM_COSTS_JSON }}
      # A fork PR cannot read the secret; its cost-table suites skip instead of failing.
      UPSTREAM_COSTS_OPTIONAL: ${{ github.event.pull_request.head.repo.fork && '1' || '' }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API_KEY_V2: ${{ secrets.FRED_API_KEY_V2 }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      # Raises CoinGecko off the 30/min keyless budget shared per runner IP.
      # It does NOT make the calls free: the Demo plan has a monthly quota and
      # CI would burn it on every push, which is the trap the Brave notes in
      # test-non-metered-examples.js already record. So the sweep still SAMPLES
      # the family (COINGECKO_SLUGS there). Key plus sampling: the two live
      # calls per run are reliable, and the quota lasts.
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Restores ~/.npm keyed on package-lock.json. `npm ci` still runs and
          # still installs exactly what the lockfile pins, so this only saves
          # the network fetch - a stale or poisoned cache cannot change which
          # versions land. Measured before adding it: 21s/19s/16s across the
          # three lanes on every single run, all of it re-downloading tarballs
          # that had not changed.
          cache: npm
      # node_modules restored by lockfile hash (2026-08-25): npm ci was 13-17 s in
      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        # F07: shadow the job-scope provider keys to EMPTY for this step only, so
        # a malicious dependency lifecycle script running during `npm ci` cannot
        # read them. No server or tool runs here, so empty keys are harmless.
        env:
          UPSTREAM_COSTS_JSON: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: npm ci
      # NO Playwright in this lane on purpose: it runs no browser-driven
      # script. All eight (csp-violations, css-tokens-resolve, focus-visible,
      # the reveal suite, burger-aria-label, compare-scroll,
      # non-metered-examples) live in the `test` lane. Installing Chromium
      # here cost 32s and 22s for nothing, and the slower unit lane IS the
      # critical path. If a browser-driven script is ever added here, copy
      # the install step back from the `test` job with it.
      - name: Start server in free mode
        run: |
          # Raise the MCP rate limit so the full-catalog connector test can sweep
          # every tool (production keeps the default 20/min, 120/hr).
          AGENT402_MCP_MAX_PER_MIN=1000000 AGENT402_MCP_MAX_PER_HOUR=1000000 \
            X402_SYNC_ON_START=false FREE_MODE=true X402_PAYWALL_PROBES_PER_CYCLE=0 PORT=3000 node src/server.js &
          for i in $(seq 1 20); do curl -s localhost:3000/health >/dev/null && break; sleep 1; done
      - name: Offline suites (7 scripts, one process each)
        run: bash scripts/ci/run-step.sh test-unit-a3 1

      - name: Code-run-kit tests (E2B sandbox — validation always runs; live calls opt-in via E2B_LIVE_TEST=1)
        run: node scripts/test-code-run-kit.js
        env:
          E2B_LIVE_TEST: ${{ secrets.E2B_API_KEY && '1' || '' }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}

      - name: Offline suites (13 scripts, one process each)
        run: bash scripts/ci/run-step.sh test-unit-a3 2

  test-unit-a2:
    # Second half of test-unit-a (2026-08-25), split by the seconds each script
    # measured in its own log line - not by count. Same header, same setup, same
    # order within each half; only the list differs.
    needs: [markers, tree-gate]
    if: >-
      !cancelled()
      && (
        (github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/sweet-brown-i99jl3')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/sweet-brown-i99jl3')) || github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' || inputs.mode == 'deploy' || inputs.mode == 'publish') || needs.markers.outputs.test == 'true' || needs.markers.outputs.deploy == 'true' || needs.markers.outputs.publish == 'true'
      )
      && needs.tree-gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Sharded into 3 runners (scripts/lib/ci-shards.js), each with its own services and
    # server. Shard 1 keeps this lane's name for the required check; `t` runs every
    # third call of the job in turn, and a single-script step names its shard.
    name: ${{ matrix.shard == 1 && 'test-unit-a2' || format('test-unit-a2 ({0}/3)', matrix.shard) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # A REAL Postgres for the state-database suites (src/state-db.js): the
      # documents, records, ledgers and leases the server keeps there. Each
      # suite makes and drops its own schema. Under CI a missing database FAILS those suites (scripts/lib/test-pg.js).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_SHARD: ${{ matrix.shard }}
      CI_SHARDS: "3"
      UPSTREAM_COSTS_JSON: ${{ secrets.UPSTREAM_COSTS_JSON }}
      # A fork PR cannot read the secret; its cost-table suites skip instead of failing.
      UPSTREAM_COSTS_OPTIONAL: ${{ github.event.pull_request.head.repo.fork && '1' || '' }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API_KEY_V2: ${{ secrets.FRED_API_KEY_V2 }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Restores ~/.npm keyed on package-lock.json. `npm ci` still runs and
          # still installs exactly what the lockfile pins, so this only saves
          # the network fetch - a stale or poisoned cache cannot change which
          # versions land. Measured before adding it: 21s/19s/16s across the
          # three lanes on every single run, all of it re-downloading tarballs
          # that had not changed.
          cache: npm
      # node_modules restored by lockfile hash (2026-08-25): npm ci was 13-17 s in
      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        # F07: shadow the job-scope provider keys to EMPTY for this step only, so
        # a malicious dependency lifecycle script running during `npm ci` cannot
        # read them. No server or tool runs here, so empty keys are harmless.
        env:
          UPSTREAM_COSTS_JSON: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: npm ci
      # NO Playwright in this lane on purpose: it runs no browser-driven
      # script. All eight (csp-violations, css-tokens-resolve, focus-visible,
      # the reveal suite, burger-aria-label, compare-scroll,
      # non-metered-examples) live in the `test` lane. Installing Chromium
      # here cost 32s and 22s for nothing, and the slower unit lane IS the
      # critical path. If a browser-driven script is ever added here, copy
      # the install step back from the `test` job with it.
      - name: Start server in free mode
        run: |
          # Raise the MCP rate limit so the full-catalog connector test can sweep
          # every tool (production keeps the default 20/min, 120/hr).
          AGENT402_MCP_MAX_PER_MIN=1000000 AGENT402_MCP_MAX_PER_HOUR=1000000 \
            X402_SYNC_ON_START=false FREE_MODE=true X402_PAYWALL_PROBES_PER_CYCLE=0 PORT=3000 node src/server.js &
          for i in $(seq 1 20); do curl -s localhost:3000/health >/dev/null && break; sleep 1; done
      - name: Offline suites (15 scripts, one process each)
        run: bash scripts/ci/run-step.sh test-unit-a2 1

      # The live-catalog guard (scripts/test-gateway-model-ids.js) runs every 6
      # hours in model-drift.yml, not on a push: an upstream price change is
      # not a defect in the change under review.

      - name: Offline suites (4 scripts, one process each)
        run: bash scripts/ci/run-step.sh test-unit-a2 2

      - name: "Replay guard, cross-replica (REAL redis — two guard instances prove shared claim/settle/release; fails open to local state on a redis outage — 2026-08-16)"
        if: matrix.shard == 1
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: node scripts/test-replay-guard-redis.js

      - name: "Shared limits (REAL redis: the counter primitive on both backends, two Redis instances read one count, a store that does not answer is a miss and never an exception; then two servers and two control replicas on one Redis: a breaker, a money guard and a budget counted on A refuse on B, an operator session minted on A is honoured and revoked on B, the judge's token ceiling and a wallet's in-flight runs are summed across A and B)"
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: bash scripts/ci/run-step.sh test-unit-a2 3

      - name: "State database (REAL postgres: documents/records/log lines/leases; every migrated store imports its file once and reads the row; loops skip under another holder's lease; idempotency answers and claims shared over REAL redis)"
        env:
          REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
          REDIS_URL: redis://127.0.0.1:6379
          LEDGER_JOURNAL_REDIS: "on"
          STATE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          STATE_DATABASE_URL_FOR_TEST: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: bash scripts/ci/run-step.sh test-unit-a2 4

      - name: Offline suites (5 scripts, one process each)
        run: bash scripts/ci/run-step.sh test-unit-a2 5

      - name: Discovery note (a seller must be able to see the gap)
        if: matrix.shard == 1
        run: X402_INDEX_CRAWL=off node scripts/test-discovery-note.js
      # Targets PROD on purpose. The CI server boots FREE_MODE and answers no
      # 402 anywhere, so a local run measures nothing and skips; and the size
      # that matters is the one a buyer actually receives, with all 13 rails in
      # the accepts. Unpaid 402s are free. Note the one-run lag this shares
      # with the SEO gate: the test job runs BEFORE the deploy, so a change
      # that grows the challenge is caught on the run AFTER the one that ships
      # it.
      - name: 402 challenge header stays payable (a buyer echoes it back)
        if: matrix.shard == 1
        env:
          # Marks the sweep's ~600 prod 402s per run as synthetic (signed
          # X-Heartbeat-Token), so they never read as outside demand.
          POW_SECRET: ${{ secrets.POW_SECRET }}
        run: CHALLENGE_LOCAL_BOOT=1 TARGET_URL=https://agent402.tools node scripts/test-challenge-size.js
