  test-pricing:
    # Test job runs on its own [test] marker AND auto-runs whenever a commit
    # asks to deploy or publish — so deploy/publish can hard-gate on it via
    # `needs: test`. This makes "ship without running tests" impossible by
    # design, not by developer discipline.
    needs: [markers, tree-gate]
    # Runs on the [test]/[deploy]/[publish] markers, on the matching
    # workflow_dispatch modes, on every PR into main (N-04: so the required
    # `test` status check always reports), AND unconditionally on every push
    # to main — a merge to main has no marker to scan (see the `on:` block
    # above) and needs none: it is asked to test-and-deploy regardless.
    # `!cancelled()` because tree-gate does not run at all outside a push to
    # main, and a SKIPPED `needs` job skips its dependents unless the dependent
    # carries a status function - without this, every dev-branch and PR run
    # would silently stop testing. With tree-gate skipped OR failed its output
    # is empty, which is not 'true', so the lane runs: the gate can only ever
    # subtract work by succeeding and saying so.
    if: >-
      !cancelled()
      && (
        (github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/sweet-brown-i99jl3')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/sweet-brown-i99jl3')) || github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' || inputs.mode == 'deploy' || inputs.mode == 'publish') || needs.markers.outputs.test == 'true' || needs.markers.outputs.deploy == 'true' || needs.markers.outputs.publish == 'true'
      )
      && needs.tree-gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # A healthy run takes 22-25 min. Without this the GitHub default is 360
    # min, and on 2026-08-18 two consecutive runs sat for 28+ min inside the
    # Playwright system-deps apt step (see below) — the deploy job hard-gates
    # on this one, so a hung test job silently blocks every deploy behind it.
    timeout-minutes: 60
    # A REAL redis, because until 2026-08-07 nothing in CI ever connected to
    # one. test-shared-limit.js injects a fake store deliberately (it proves
    # "two callers share one counter", and a fake proves that exactly), but
    # that left the redis CLIENT path untested — so Dependabot's redis 4 -> 6
    # bump arrived with a green CI that could not have caught a client
    # regression. Prod is not in-memory: REDIS_URL is set there, and the shared
    # limiter FAILS CLOSED, so a client regression refuses trials.
    env:
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API_KEY_V2: ${{ secrets.FRED_API_KEY_V2 }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      # Raises CoinGecko off the 30/min keyless budget shared per runner IP.
      # It does NOT make the calls free: the Demo plan has a monthly quota and
      # CI would burn it on every push, which is the trap the Brave notes in
      # test-non-metered-examples.js already record. So the sweep still SAMPLES
      # the family (COINGECKO_SLUGS there). Key plus sampling: the two live
      # calls per run are reliable, and the quota lasts.
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # node_modules restored by lockfile hash (2026-08-25): npm ci was 13-17 s in
      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        env:
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
        run: npm ci

      # ONE STEP, MANY SCRIPTS (2026-08-25): GitHub spends ~0.7 s of runner setup
      # per step and this lane had over a hundred one-line steps. Each script still
      # runs in its own process, in the same order; `t` groups its log and names it
      # with its elapsed time, and a failure prints the failing script as an error.
      # The original step names ride above each script so the WHY stays here.
      - name: Offline suites (5 scripts, one process each)
        run: |
          set -euo pipefail
          t() { local s=$SECONDS; echo "::group::$*"; "$@" || { echo "::endgroup::"; echo "::error::failed: $*"; exit 1; }; echo "::endgroup::"; echo "ok  $* ($((SECONDS - s))s)"; }
          # Moved here from test-unit-a (2026-08-25 rebalance): the pricing lane was
          # one 4.5-minute test; with that test bounded (see countTokensBounded in
          # llm-gateway-kit.js) it had four minutes of headroom.
          # Deterministic correctness proofs run FIRST — a flaky live upstream
          # (e.g. data.gov downtime) must never mask whether the tools actually work.
          # Ox Alpha tier (locked stealth model, zdr refusal, zero-cost clamp, reasoning floor, vanish gate - offline)
          t node scripts/test-ox-tier.js
          # Macro-kit tests (FRED yield curve, Treasury debt + avg rates, ECB FX series, World Bank — live keyless APIs)
          t node scripts/test-macro-kit.js
          # MPP dual-stack shim (real mppx client buys over WWW-Authenticate/Authorization wire; single settle; x402 pass-through; HMAC tamper — offline)
          t node scripts/test-mpp-shim.js
          # MPP evm EIP-712 domain fallback (a wrong-domain credential is refused locally, its 402 carries no challenge so the client takes x402, healthy clients untouched — boots a paid server, offline)
          t node scripts/test-mpp-evm-domain.js
          # Report products' free probe stage + the pure handler helpers it feeds (the 147 metered slugs both catalog sweeps skip; live keyless APIs, no paid key, no spend; a planted defect is caught before a clean run is believed)
          t node scripts/test-report-probes.js
          # Checkout rate limit runs BEFORE the body parser (a malformed body used to 400 at the parser and be counted against nothing) — boots a server, offline
          t node scripts/test-checkout-limiter.js
          # A refused payment says WHY on the 402 (the vendor answers a bare {} and drops the reason; one client looped ~9/min for 12h) — boots a paid server, offline
          t node scripts/test-payment-reject.js
          # A v1-era client names the price maxAmountRequired; x402 v2 deep-equals the echoed accepts block, so that one rename made a correct payment unmatchable — boots a paid server, offline
          t node scripts/test-x402-v1-accepts.js
          # HEAD paywall bypass closed (HEAD on paid GET routes 402s with challenges + empty body; free surfaces untouched — offline)
          t node scripts/test-head-paywall.js
          # Anthropic SDK base-URL alias (/v1/<tier>/v1/messages) + 1 MB body limit on the metered routes (boots a paid server, offline)
          t node scripts/test-messages-sdk-alias.js
          # Real sample reports: fixtures are finished reports, pages indexable with own title/JSON-LD, /reports links them, sitemap carries them (boots FREE_MODE, offline)
          t node scripts/test-sample-reports.js
          # openFDA 404 = no matches, an empty result: recall-report must not 502 on it (offline)
          t node scripts/test-recall-nomatch.js
          # Free email alerts engine: double opt-in, signed links, change-only daily email, caps (offline)
          t node scripts/test-free-alerts.js
          t node scripts/test-wallet-digest.js
          # Alert routes end to end on a booted server: confirm / unsubscribe / stop pages render (the engine test could not see a 500 here)
          t node scripts/test-alerts-routes.js
          # Post-purchase follow-ups: two emails at most, stoppable, failure notice (offline)
          t node scripts/test-followups.js
          # Public reports: buyer toggle by session id, unguessable public id, indexable page, revocable (boots FREE_MODE)
          t node scripts/test-public-reports.js
          # House style on every report tier: no em/en dashes in delivered copy (offline)
          t node scripts/test-house-style.js
          # Domain audit inputs round 2: DKIM by MX provider, DNS-host feasibility, advisory cross-origin headers, www twin (offline)
          t node scripts/test-domain-audit-inputs.js
          # Dev shortlinks (/claude, /cursor, ...) + the /install script (boots a free server)
          t node scripts/test-shortlinks.js
          # A rejected payment is answered in the buyer's terms (balance vs stale authorization) on the 402 (offline)
          t node scripts/test-verify-hint.js
          t node scripts/test-verify-hint-live.js
          # Router dispatch eligibility, labelled: one function for the resolver's Base gate and every public row (offline)
          t node scripts/test-dispatch-eligibility.js
          # In-flight composites are cut off on SIGTERM: scope wrapper + fetch signal + shutdown seam (offline)
          t node scripts/test-drain-abort.js
          # Solana SPL leaderboard: batched credits scan, primed gate, payTo list, ranking, persistence (offline stub RPC)
          t node scripts/test-solana-leaderboard.js
          # accepts[0].outputSchema on the 402: pure header rewrite + mount order (offline)
          t node scripts/test-accept-output-schema.js
          # OWN LANE on purpose. This single step ran 254s - 42% of the unit-a
          # lane, and unit-a was the slowest of the three, so it was 42% of the
          # critical path. It rebuilds a max-size dense-CJK body and BPE-tokenizes
          # it once PER MODEL, when the text is identical across models in a tier.
          #
          # The obvious speedup is memoizing the tokenizer, but this test imports
          # worstCaseUpstreamCost / clampToMargin FROM PRODUCTION precisely so the
          # guard and the runtime can never disagree about what a call costs. That
          # property is worth more than four minutes, so the step is untouched and
          # moved off the critical path instead, where its duration stops mattering.
          # Pricing margin invariant (worst-case upstream < price on every gateway tier, failover links included; cap-before-spend; 410 tool_gone telemetry — offline)
          t node scripts/test-pricing-margin.js

  test-unit-c:
    # Test job runs on its own [test] marker AND auto-runs whenever a commit
    # asks to deploy or publish — so deploy/publish can hard-gate on it via
    # `needs: test`. This makes "ship without running tests" impossible by
    # design, not by developer discipline.
    needs: [markers, tree-gate]
    # Runs on the [test]/[deploy]/[publish] markers, on the matching
    # workflow_dispatch modes, on every PR into main (N-04: so the required
    # `test` status check always reports), AND unconditionally on every push
    # to main — a merge to main has no marker to scan (see the `on:` block
    # above) and needs none: it is asked to test-and-deploy regardless.
    # `!cancelled()` because tree-gate does not run at all outside a push to
    # main, and a SKIPPED `needs` job skips its dependents unless the dependent
    # carries a status function - without this, every dev-branch and PR run
    # would silently stop testing. With tree-gate skipped OR failed its output
    # is empty, which is not 'true', so the lane runs: the gate can only ever
    # subtract work by succeeding and saying so.
    if: >-
      !cancelled()
      && (
        (github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/sweet-brown-i99jl3')) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/sweet-brown-i99jl3')) || github.event_name == 'workflow_dispatch' && (inputs.mode == 'test' || inputs.mode == 'deploy' || inputs.mode == 'publish') || needs.markers.outputs.test == 'true' || needs.markers.outputs.deploy == 'true' || needs.markers.outputs.publish == 'true'
      )
      && needs.tree-gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # A healthy run takes 22-25 min. Without this the GitHub default is 360
    # min, and on 2026-08-18 two consecutive runs sat for 28+ min inside the
    # Playwright system-deps apt step (see below) — the deploy job hard-gates
    # on this one, so a hung test job silently blocks every deploy behind it.
    timeout-minutes: 60
    # A REAL redis, because until 2026-08-07 nothing in CI ever connected to
    # one. test-shared-limit.js injects a fake store deliberately (it proves
    # "two callers share one counter", and a fake proves that exactly), but
    # that left the redis CLIENT path untested — so Dependabot's redis 4 -> 6
    # bump arrived with a green CI that could not have caught a client
    # regression. Prod is not in-memory: REDIS_URL is set there, and the shared
    # limiter FAILS CLOSED, so a client regression refuses trials.
    env:
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API_KEY_V2: ${{ secrets.FRED_API_KEY_V2 }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      # Raises CoinGecko off the 30/min keyless budget shared per runner IP.
      # It does NOT make the calls free: the Demo plan has a monthly quota and
      # CI would burn it on every push, which is the trap the Brave notes in
      # test-non-metered-examples.js already record. So the sweep still SAMPLES
      # the family (COINGECKO_SLUGS there). Key plus sampling: the two live
      # calls per run are reliable, and the quota lasts.
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # node_modules restored by lockfile hash (2026-08-25): npm ci was 13-17 s in
      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        env:
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
        run: npm ci

      # A free-mode server for the link-integrity sweep below. This lane had
      # no server until now; it gets one so the 66s sweep can leave `test`,
      # which was the critical path at 409s. Unlike `test`, nothing here needs
      # Chromium, so the lane stays Playwright-free - that install is the
      # expensive part, and non-metered (which does need it) deliberately
      # stays where the browser already is.
      - name: Start server in free mode
        run: |
          X402_SYNC_ON_START=false FREE_MODE=true X402_INDEX_CRAWL=off X402_PAYWALL_PROBES_PER_CYCLE=0 PORT=3000 node src/server.js > /tmp/unit-c-srv.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3000/health >/dev/null 2>&1 && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/health >/dev/null || { echo "server never became healthy"; tail -40 /tmp/unit-c-srv.log; exit 1; }

      - name: Link integrity (every sitemap URL + every crawled internal href resolves; /mcp never a real <a href>)
        run: TARGET_URL=http://127.0.0.1:3000 node scripts/test-link-integrity.js

      # These four were 210s of test-unit-b's 506s of work, and they share a
      # real property rather than an arbitrary place in the list: each BOOTS ITS
      # OWN servers on its own ports, uses no TARGET_URL and no redis. So this
      # lane needs neither the shared free-mode server nor the redis service,
      # and moving them is not a rebalance that some later edit can invalidate.
      #
      # Splitting a lane only pays until the next-slowest lane becomes the
      # floor: unit-a's 287s saving moved the bottleneck to unit-b, and this
      # moves it to `test`. Measure before splitting again.
      - name: Gate agent402-facilitator (real signed Stellar testnet payments; boots its own servers on 4099-4101)
        # Had ZERO CI coverage until 2026-08-15, unlike every other package in
        # this repo - found only after a real production incident (unbounded
        # /settle hang, then a broken Docker deploy shipped right past every
        # existing check because none of them looked at this package at all).
        # TEST_PAYER_STELLAR_SECRET is a persistent testnet-only Stellar
        # account holding testnet USDC (Circle's faucet is CAPTCHA-gated, so
        # it can't be minted fresh per run - see facilitator/README.md).
        # Self-skips LOUDLY if the secret is ever unset, same pattern as the
        # Robinhood settlement probe - never a silent pass.
        # PATH-SCOPED (2026-08-25): ~60 s of real Stellar testnet payments on every
        # push, and facilitator/test.js imports only facilitator/* (pinned by
        # scripts/test-ci-facilitator-scope.js - the moment it reaches outside,
        # this scoping is dishonest and CI fails). So it runs only when the push
        # touched facilitator/**, Dockerfile.facilitator or its Railway config.
        # FAIL-OPEN: an unreadable diff (first push, force-push, API error) RUNS it.
        run: |
          if [ -z "$TEST_PAYER_STELLAR_SECRET" ]; then
            echo "TEST_PAYER_STELLAR_SECRET unset - skipping facilitator/test.js (see facilitator/README.md)"
            exit 0
          fi
          RUN_GATE=yes
          if [ -n "$DIFF_BASE" ] && ! echo "$DIFF_BASE" | grep -qE '^0+$'; then
            if CHANGED=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DIFF_BASE...$GITHUB_SHA" --paginate --jq '.files[].filename' 2>/dev/null); then
              if echo "$CHANGED" | grep -qE '^(facilitator/|Dockerfile\.facilitator$|railway\.facilitator\.json$)'; then
                echo "facilitator files changed since $DIFF_BASE - running the gate"
              else
                echo "no facilitator/** change in $DIFF_BASE...$GITHUB_SHA ($(echo "$CHANGED" | grep -c .) files) - facilitator/test.js imports only facilitator/*, skipping the gate"
                RUN_GATE=no
              fi
            else
              echo "could not read the diff $DIFF_BASE...$GITHUB_SHA - running the gate (fail-open)"
            fi
          else
            echo "no diff base for this event - running the gate (fail-open)"
          fi
          [ "$RUN_GATE" = "yes" ] || exit 0
          cd facilitator
          npm ci --ignore-scripts
          node test.js
        env:
          TEST_PAYER_STELLAR_SECRET: ${{ secrets.TEST_PAYER_STELLAR_SECRET }}
          GH_TOKEN: ${{ github.token }}
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      # ONE STEP, MANY SCRIPTS (2026-08-25): GitHub spends ~0.7 s of runner setup
      # per step and this lane had over a hundred one-line steps. Each script still
      # runs in its own process, in the same order; `t` groups its log and names it
      # with its elapsed time, and a failure prints the failing script as an error.
      # The original step names ride above each script so the WHY stays here.
      - name: Offline suites (1 scripts, one process each)
        run: |
          set -euo pipefail
          t() { local s=$SECONDS; echo "::group::$*"; "$@" || { echo "::endgroup::"; echo "::error::failed: $*"; exit 1; }; echo "::endgroup::"; echo "ok  $* ($((SECONDS - s))s)"; }
          # upto scheme ships dark, refuses what it cannot price
          t node scripts/test-upto-scheme.js

