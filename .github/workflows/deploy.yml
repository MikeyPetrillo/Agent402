          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: npm ci
      # Moved here from test-unit-b (2026-08-25 rebalance): self-booting suites
      # that need no shared server; test-unit-b was the next-slowest lane.
