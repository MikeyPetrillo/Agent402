      - name: Publish to the official MCP Registry (GitHub OIDC, no secret)
        env:
          # Pin the publisher release with a repo variable (e.g. v1.2.3); leave
          # unset to track the latest. Optionally hard-pin the exact tarball
          # digest with MCP_PUBLISHER_SHA256 for full supply-chain integrity.
          MCP_PUBLISHER_VERSION: ${{ vars.MCP_PUBLISHER_VERSION }}
          MCP_PUBLISHER_SHA256: ${{ vars.MCP_PUBLISHER_SHA256 }}
        run: |
          set -euo pipefail
          # The registry verifies ownership by matching mcp/package.json's
          # "mcpName" to the server.json name and confirming the npm package is
          # published — so this runs after the npm publish above.
          VER=$(node -p "require('./mcp/package.json').version")
          SEARCH_RESULT=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.MikeyPetrillo/agent402&limit=100")
          if echo "$SEARCH_RESULT" | grep -q "\"version\":\"$VER\""; then
            echo "io.github.mikeypetrillo/agent402@$VER already in the MCP Registry — nothing to do"; exit 0
          fi
          # Capture whichever version is isLatest RIGHT NOW - it's about to
          # become stale the moment the new publish below lands. Deprecation
          # tooling gap found 2026-08-16: nothing ever marked a superseded
          # version deprecated, so 24 of 25 published versions were still
          # "active" in the registry. Best-effort: a lookup failure here
          # leaves PREV_LATEST empty and the deprecate step below just skips.
          PREV_LATEST=$(echo "$SEARCH_RESULT" | node scripts/mcp-find-latest-version.js || true)
          asset="mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          if [ -n "${MCP_PUBLISHER_VERSION:-}" ]; then base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"; else base="https://github.com/modelcontextprotocol/registry/releases/latest/download"; fi
          # Download to disk and fail fast (no curl|tar of unverified bytes).
          curl -fsSL -o "$asset" "$base/$asset"
          # Verify the binary before executing it. Fail CLOSED: require either a
          # hard-pinned digest (MCP_PUBLISHER_SHA256 repo var) or the release's
          # published checksums.txt — never run an unverified download.
          verified=""
          if [ -n "${MCP_PUBLISHER_SHA256:-}" ]; then
            echo "$MCP_PUBLISHER_SHA256  $asset" | sha256sum -c - && verified=1
          fi
          if [ -z "$verified" ]; then
            # As of registry v1.7.0+ the checksums file is versioned —
            # registry_<ver>_checksums.txt — instead of a flat checksums.txt.
            # Resolve the actual filename from the GitHub release API rather
            # than guessing, then verify with sha256sum.
            tag_path="${MCP_PUBLISHER_VERSION:-}"
            if [ -z "$tag_path" ]; then
              tag_path=$(curl -fsSL "https://api.github.com/repos/modelcontextprotocol/registry/releases/latest" | grep -oP '"tag_name":\s*"\K[^"]+' | head -1)
            fi
            checksums_name=$(curl -fsSL "https://api.github.com/repos/modelcontextprotocol/registry/releases/tags/$tag_path" \
              | grep -oP '"name":\s*"\K[^"]*_checksums\.txt(?=")' | head -1)
            if [ -n "$checksums_name" ]; then
              curl -fsSL -o "$checksums_name" "https://github.com/modelcontextprotocol/registry/releases/download/$tag_path/$checksums_name" 2>/dev/null || true
              if [ -s "$checksums_name" ] && grep -q " $asset\$" "$checksums_name"; then
                grep " $asset\$" "$checksums_name" | sha256sum -c - && verified=1
              fi
            fi
            # Legacy fallback: pre-v1.7.0 releases used a flat checksums.txt.
            if [ -z "$verified" ]; then
              curl -fsSL -o checksums.txt "$base/checksums.txt" 2>/dev/null || true
              if [ -s checksums.txt ] && grep -q " $asset\$" checksums.txt; then
                grep " $asset\$" checksums.txt | sha256sum -c - && verified=1
              fi
            fi
          fi
          [ -n "$verified" ] || { echo "mcp-publisher could not be verified (no MCP_PUBLISHER_SHA256 and no checksums file) — refusing to execute"; exit 1; }
          tar -xzf "$asset" mcp-publisher
          cd mcp
          ../mcp-publisher login github-oidc
          # The registry validates the npm version EXISTS before it registers
          # it, and npm takes ~a minute to serve a version it just accepted
          # (0.13.1: published 01:49:00, visible 01:49:54, registry 400
          # "version '0.13.1' was not found (status: 404)" at 01:49:18, run
          # 34073854085). Retry only that propagation 404, never any other
          # refusal, for up to ~3 minutes.
          for attempt in 1 2 3 4 5 6 7 8 9; do
            if out=$(../mcp-publisher publish 2>&1); then printf '%s\n' "$out"; break; fi
            printf '%s\n' "$out"
            if [ "$attempt" = 9 ] || ! printf '%s' "$out" | grep -q "was not found (status: 404)"; then
              echo "::error::registry publish failed (attempt $attempt)"; exit 1
            fi
            echo "npm has not served $VER yet (attempt $attempt) - waiting 20s"; sleep 20
          done
          echo "published io.github.mikeypetrillo/agent402@$VER → https://registry.modelcontextprotocol.io"
          # Deprecate the version this publish just superseded. Only ever
          # touches the ONE immediately-previous version - never a bulk
          # rewrite of history - and never fails the job: a registry hiccup
          # here is a missed housekeeping step, not a publish failure.
          if [ -n "$PREV_LATEST" ] && [ "$PREV_LATEST" != "$VER" ]; then
            ../mcp-publisher status --status deprecated --message "Superseded by $VER" \
              io.github.MikeyPetrillo/agent402 "$PREV_LATEST" \
              && echo "deprecated superseded version $PREV_LATEST" \
              || echo "::warning::failed to deprecate superseded version $PREV_LATEST (non-fatal)"
          fi

      # ClawHub is OpenClaw's discovery surface (`openclaw plugins install
      # clawhub:agent402-openclaw`); their docs keep no static third-party
      # catalog, so this release is the listing. Token-authenticated (repo secret
      # CLAWHUB_TOKEN, a ClawHub CLI token on the publisher account; the CLI reads
      # it from its config file, written under a job-scoped path so nothing lands
      # in the runner home). Idempotent: an already-published version is skipped,
      # never re-uploaded. A missing token skips loudly instead of failing the
      # npm publish that already happened. It runs last in the job, so a
      # refusal on ClawHub's side never holds back the npm and MCP Registry
      # releases above.
      #
      # This is the one `npx` in the id-token job. The CLI's pinned tree
      # (47 packages, measured 2026-09-03) carries no preinstall/install/
      # postinstall script - only `prepare` entries, which npm never runs for a
      # registry install - so nothing executes at install time today. The env
      # below makes that a rule rather than an observation: a future version
      # of a transitive dependency that grows an install hook is skipped, not
      # run, beside the OIDC credential. The CLI itself still runs (verified:
      # `--help` under NPM_CONFIG_IGNORE_SCRIPTS=true).
      - name: Publish agent402-openclaw to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then echo "::warning::CLAWHUB_TOKEN not set - ClawHub release skipped"; exit 0; fi
          VERSION=$(node -p "require('./openclaw/package.json').version")
          npx -y clawhub@0.23.3 login --token "$CLAWHUB_TOKEN" --no-browser --label "github-actions deploy.yml" >/dev/null
          # Inspect and publish retry only ClawHub's write rate limit, and an inspect
          # that fails for any reason but not-found never falls through to a publish.
          # The version is the sole input, passed through env (scripts/clawhub-release.js).
          VERSION="$VERSION" node scripts/clawhub-release.js || { rm -f "$CLAWHUB_CONFIG_PATH"; exit 1; }
          rm -f "$CLAWHUB_CONFIG_PATH"

  probe:
    needs: markers
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe' || needs.markers.outputs.probe == 'true'
    runs-on: ubuntu-24.04
    # Read-only diagnostics, a few minutes; the bound stops a hung read.
    timeout-minutes: 30
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # The project id is KNOWN (repo var). Railway's `projects` listing query
      # answered "Internal Server Error" for account tokens on 2026-09-08 (the
      # CLI's `railway list` failed the same way while `project(id:)` reads
      # worked), which failed three deploy attempts of a green main. With the
      # id in hand every step goes straight to project(id:).
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Multi-chain ground truth. /health flags show which env-gated features are
      # live; the 402 challenge shows the payment options a buyer is ACTUALLY
      # offered (payments.js silently omits the Solana accept when
      # SOLANA_WALLET_ADDRESS is unset, so config intent and buyer-visible truth
      # can differ). If Solana is offered, scan its payTo for USDC received —
      # the Base-only revenue check below can't see Solana settlements.
      - name: Multi-chain payment surface (health flags, live 402 accepts, Solana revenue)
        env:
          RAILWAY_API_TOKEN: ""
        run: |
          PROD=https://agent402.tools
          echo "=== production /health — env-gated feature flags live right now ==="
          curl -s --max-time 15 "$PROD/health" | jq '{ok, checks, flags}' || true
          echo
          echo "=== live 402 on a wallet-only route — network + payTo per payment option ==="
          # x402 v2 carries the requirements in the base64 PAYMENT-REQUIRED
          # header (the 402 body is {}); v1 kept them in the body. Read both.
          curl -s --max-time 15 -D /tmp/402.h -o /tmp/402.body "$PROD/api/search?q=probe" -H "Accept: application/json" || true
          HDR=$(tr -d '\r' < /tmp/402.h | awk -F': ' 'tolower($1)=="payment-required"{print $2}' | head -1)
          if [ -n "$HDR" ]; then CH=$(echo "$HDR" | base64 -d 2>/dev/null || true); else CH=$(cat /tmp/402.body); fi
          echo "$CH" | jq -r '.accepts // [] | .[] | "\(.network)  payTo=\(.payTo)  amount=\(.maxAmountRequired // .price // "?")"' \
            || { echo "could not parse 402 requirements:"; echo "$CH" | head -c 400; }
          SOLANA_PAYTO=$(echo "$CH" | jq -r '[.accepts // [] | .[] | select((.network // "") | startswith("solana:"))][0].payTo // empty' 2>/dev/null || true)
          echo
          if [ -n "$SOLANA_PAYTO" ]; then
            echo "Solana IS offered to buyers (payTo=$SOLANA_PAYTO)."
            echo "=== Solana revenue scan — USDC received by $SOLANA_PAYTO ==="
            SOLANA_REVENUE_WALLET="$SOLANA_PAYTO" node scripts/revenue-scan-solana.js || true
          else
            echo "!! Solana is NOT among the live 402 payment options. Either PAYMENT_NETWORKS on"
            echo "!! Railway does not include 'solana', or SOLANA_WALLET_ADDRESS is unset (the"
            echo "!! Solana accept is silently omitted in that case — src/payments.js). No Solana"
            echo "!! revenue is possible until a buyer can see a Solana payment option."
          fi
          echo
          # Every accepted EVM chain pays the same 0x wallet but on a different
          # native-USDC contract — scan each so Polygon/Arbitrum revenue is as
          # visible as Base's (balance + recent external per-call payments).
          EVM_PAYTO=$(echo "$CH" | jq -r '[.accepts // [] | .[] | select((.network // "") | startswith("eip155:"))][0].payTo // empty' 2>/dev/null || true)
          if [ -n "$EVM_PAYTO" ]; then
            for NET_NAME in polygon arbitrum robinhood; do
              case "$NET_NAME" in
                polygon)  CAIP2="eip155:137" ;;
                arbitrum) CAIP2="eip155:42161" ;;
                robinhood) CAIP2="eip155:4663" ;;   # settles USDG, same 6-decimal scan
              esac
              if echo "$CH" | jq -e --arg c "$CAIP2" '[.accepts // [] | .[] | select(.network == $c)] | length > 0' >/dev/null 2>&1; then
                echo "=== $NET_NAME revenue scan — stablecoin received by $EVM_PAYTO ==="
                SCAN_NETWORK="$NET_NAME" REVENUE_WALLET="$EVM_PAYTO" node scripts/revenue-scan.js || true
                echo
              else
                echo "$NET_NAME: not among the live 402 payment options — skipped"
              fi
            done
          fi

      - name: Railway deployment history (which image is live, what failed)
        run: |
          gql() {
            curl -s --max-time 30 -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
              --data @-
          }
          PROJECT_ID="${RAILWAY_PROJECT_ID:-}"
          [ -n "$PROJECT_ID" ] || PROJECT_ID=$(jq -n '{query:"query { projects { edges { node { id name } } } }"}' | gql \
            | jq -r '.data.projects.edges[] | select(.node.name=="agent402") | .node.id' | head -1)
          ENV_ID=$(jq -n --arg id "$PROJECT_ID" '{query:"query($id:String!) { project(id: $id) { environments { edges { node { id name } } } } }", variables:{id:$id}}' | gql \
            | jq -r '.data.project.environments.edges[] | select(.node.name=="production") | .node.id' | head -1)
          SERVICE_ID=$(jq -n --arg id "$PROJECT_ID" '{query:"query($id:String!) { project(id: $id) { services { edges { node { id name } } } } }", variables:{id:$id}}' | gql \
            | jq -r '.data.project.services.edges[] | select(.node.name=="agent402") | .node.id' | head -1)
          echo "=== last 10 deployments (newest first) ==="
          DEPLOYS=$(jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
            '{query:"query($p:String!, $e:String!, $s:String!) { deployments(first: 10, input: { projectId: $p, environmentId: $e, serviceId: $s }) { edges { node { id status createdAt meta } } } }", variables:{p:$p,e:$e,s:$s}}' | gql)
          echo "$DEPLOYS" | jq -r '.data.deployments.edges[]?.node | "\(.createdAt)  \(.status)  \(.id)  commit=\(.meta.commitHash // .meta.commit // "?" | tostring | .[0:8])  msg=\((.meta.commitMessage // "" | tostring | .[0:60]) | gsub("\n";" "))"' || echo "$DEPLOYS" | head -c 1500
          LATEST_ID=$(echo "$DEPLOYS" | jq -r '.data.deployments.edges[0].node.id // empty')
          LATEST_STATUS=$(echo "$DEPLOYS" | jq -r '.data.deployments.edges[0].node.status // empty')
          echo; echo "latest deployment: $LATEST_ID status=$LATEST_STATUS"
          if [ -n "$LATEST_ID" ] && [ "$LATEST_STATUS" != "SUCCESS" ]; then
            echo "=== build logs (tail) for latest deployment ==="
            jq -n --arg d "$LATEST_ID" '{query:"query($d:String!) { buildLogs(deploymentId: $d, limit: 60) { timestamp message } }", variables:{d:$d}}' | gql \
              | jq -r '.data.buildLogs[]? | "\(.timestamp)  \(.message)"' | tail -60 || true
          fi
          # Runtime logs unconditionally: settlement failures (facilitator
          # verify/settle errors, sync warnings) only surface here — a
          # SUCCESS deployment can still be failing every USDC purchase.
          # Two views: a raw tail, and a payment/boot-line filter that
          # survives tool-error floods (a sweep's 400s drown a plain tail).
          if [ -n "$LATEST_ID" ]; then
            jq -n --arg d "$LATEST_ID" '{query:"query($d:String!) { deploymentLogs(deploymentId: $d, limit: 5000) { timestamp message } }", variables:{d:$d}}' | gql \
              | jq -r '.data.deploymentLogs[]? | "\(.timestamp)  \(.message)"' > /tmp/runtime.log || true
            echo "=== runtime logs (raw tail, latest deployment) ==="
            tail -40 /tmp/runtime.log || true
            echo "=== runtime logs — payment/facilitator/boot lines ==="
            grep -viE '\[tool-error\]' /tmp/runtime.log \
              | grep -iE 'facilitator|x402 payments|multi-chain|accepting usdc|builder code|solana payto|warn|error|fail|settle|verify|listening' \
              | tail -80 || echo "(no matching lines)"
          fi


      - name: Revenue + real-usage check (stats vs on-chain receipts)
        env:
          RAILWAY_API_TOKEN: ""
        run: |
          echo "=== production /api/stats (calls served, split by settlement) ==="
          STATS=$(curl -s https://agent402.tools/api/stats)
          echo "$STATS" | jq '{tools, served: .toolCallsServed, topTools, topPaidTools, estimatedRevenueUsd}' || true
          echo
          echo "=== production /api/stats — last 25 served calls (slug + rail + time) ==="
          echo "$STATS" | jq '.recentCalls' || true
          echo
          node --input-type=module -e '
          const WALLET = "0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0".toLowerCase();
          const USDC = "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913";
          const TRANSFER = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef";
          const pad = (a) => "0x" + "0".repeat(24) + a.replace(/^0x/, "");
          const RPCS = ["https://mainnet.base.org", "https://base-rpc.publicnode.com", "https://base.llamarpc.com"];
          const rpc = async (m, p) => { for (const u of RPCS) { try { const r = await fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: m, params: p }) }); const j = await r.json(); if (j.result !== undefined) return j.result; } catch {} } throw new Error("RPC failed " + m); };
          const latest = parseInt(await rpc("eth_blockNumber", []), 16);
          const SPAN = 40000; // ~24h of Base blocks
          const logs = await rpc("eth_getLogs", [{ fromBlock: "0x" + (latest - SPAN).toString(16), toBlock: "latest", address: USDC, topics: [TRANSFER, null, pad(WALLET)] }]);
          // distinct payers (real source = facilitator relayer; payer is in the auth, so group by tx origin instead)
          const tsCache = {};
          const ts = async (blk) => { if (!tsCache[blk]) { const b = await rpc("eth_getBlockByNumber", [blk, false]); tsCache[blk] = parseInt(b.timestamp, 16); } return tsCache[blk]; };
          let total = 0n; const rows = [];
          for (const l of logs) {
            const amt = BigInt(l.data); total += amt;
            const t = await ts(l.blockNumber);
            const tx = await rpc("eth_getTransactionByHash", [l.transactionHash]);
            rows.push({ usd: Number(amt) / 1e6, when: new Date(t * 1000).toISOString(), submitter: tx.from.toLowerCase(), tx: l.transactionHash });
          }
          // Decode the REAL payer from each tx input. USDC x402 settles via
          // transferWithAuthorization(from, to, value, …) — "from" is the first
          // 32-byte word after the 4-byte selector. That is the actual buyer.
          const OURS = new Set(["0xfeda7403aabe9a492ed70e810b396d8548a4a022", "0x902dcf34e53695bdea2ffb354b1a2e58bd598256"]); // our canary burners (0xfeda7403 retired 2026-07-17, 0x902dcf34 current)
          for (const r of rows) {
            try {
              const tx = await rpc("eth_getTransactionByHash", [r.tx]);
              const input = tx.input || "0x";
              r.payer = input.length >= 10 + 64 ? "0x" + input.slice(10 + 24, 10 + 64) : null;
            } catch { r.payer = null; }
          }
          rows.sort((a, b) => a.when.localeCompare(b.when));
          console.log(`\nUSDC received in ~24h: ${rows.length} payments, total $${(Number(total) / 1e6).toFixed(4)}`);
          const payers = {};
          for (const r of rows) { const p = (r.payer || "unknown").toLowerCase(); payers[p] = (payers[p] || 0) + 1; }
          console.log("payments grouped by REAL payer (decoded from tx input):");
          for (const [p, n] of Object.entries(payers).sort((a, b) => b[1] - a[1])) {
            const tag = OURS.has(p) ? "  (our test burner)" : p === "unknown" ? "" : "  <-- NOT our burner — possible external customer";
            console.log(`  ${n} payment(s) from ${p}${tag}`);
          }
          const external = rows.filter((r) => r.payer && !OURS.has(r.payer.toLowerCase()));
          if (external.length) {
            console.log(`\n*** ${external.length} payment(s) from wallets that are NOT our test burner: ***`);
            for (const r of external) console.log(`  ${r.when}  $${r.usd.toFixed(6)}  payer ${r.payer}  ${r.tx}`);
          } else {
            console.log("\nAll decoded payments came from our own test burner — no external customer in this 24h window yet.");
          }
          console.log("Full history: https://basescan.org/address/" + WALLET + "#tokentxns");
          ' || echo "Base on-chain check skipped — public RPC flake (chain is still the source of truth: https://basescan.org/address/0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0#tokentxns)"

      - name: Check which facilitator production is configured to use
        run: |
          gql() {
            curl -s --max-time 30 -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
              --data @-
          }
          PROJECT_ID="${RAILWAY_PROJECT_ID:-}"
          [ -n "$PROJECT_ID" ] || PROJECT_ID=$(jq -n '{query:"query { projects { edges { node { id name } } } }"}' | gql \
            | jq -r '.data.projects.edges[] | select(.node.name=="agent402") | .node.id' | head -1)
          ENV_ID=$(jq -n --arg id "$PROJECT_ID" '{query:"query($id:String!) { project(id: $id) { environments { edges { node { id name } } } } }", variables:{id:$id}}' | gql \
            | jq -r '.data.project.environments.edges[] | select(.node.name=="production") | .node.id' | head -1)
          SERVICE_ID=$(jq -n --arg id "$PROJECT_ID" '{query:"query($id:String!) { project(id: $id) { services { edges { node { id name } } } } }", variables:{id:$id}}' | gql \
            | jq -r '.data.project.services.edges[] | select(.node.name=="agent402") | .node.id' | head -1)
          echo "Variable NAMES set on the production service (values withheld):"
          jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
            '{query:"query($p:String!, $e:String!, $s:String!) { variables(projectId: $p, environmentId: $e, serviceId: $s) }", variables:{p:$p,e:$e,s:$s}}' | gql \
            | jq -r '.data.variables | keys[]'
          echo
          echo "If CDP_API_KEY_ID + CDP_API_KEY_SECRET are absent, the server uses"
          echo "FACILITATOR_URL (PayAI) and will NEVER appear in the CDP Bazaar."

      - name: Search full discovery indexes for agent402
        run: |
          WALLET="0xabf4fabd7c416fb67202e5f9002389fc75e2a9d0"
          for base in \
            "https://api.cdp.coinbase.com/platform/v2/x402/discovery/resources" \
            "https://facilitator.payai.network/discovery/resources"; do
            echo "=== $base (paginated) ==="
            offset=0; total=0; found=0
            while true; do
              BODY=$(curl -s --max-time 30 "$base?limit=100&offset=$offset") || break
              N=$(echo "$BODY" | jq '.items | length' 2>/dev/null || echo "")
              if [ -z "$N" ] || [ "$N" = "0" ] || [ "$N" = "null" ]; then break; fi
              total=$((total+N))
              HITS=$(echo "$BODY" | jq -c --arg w "$WALLET" \
                '.items[] | select(((.resource // "") | ascii_downcase | contains("agent402")) or (any(.accepts[]?; (.payTo // "" | ascii_downcase) == $w)))' \
                2>/dev/null || true)
              if [ -n "$HITS" ]; then
                # Count matches; print only the first page of hits. Dumping
                # every listed resource (~1,300 rows) floods the job log so
                # badly the logs API's tail window can't reach the output of
                # any earlier step.
                if [ "$found" = "0" ]; then
                  echo ">>> FOUND (first hits at offset $offset; sample):"
                  echo "$HITS" | head -3 | jq '{resource, type, lastUpdated, payTo: [.accepts[]?.payTo]}'
                fi
                found=$((found + $(echo "$HITS" | wc -l)))
              fi
              if [ "$N" -lt 100 ]; then break; fi
              offset=$((offset+100))
              if [ "$offset" -ge 20000 ]; then echo "(stopping after 20000 items)"; break; fi
            done
            if [ "$found" -gt 0 ]; then
              echo ">>> RESULT: agent402 IS LISTED in this index ($found resources across $total scanned items)"
            else
              echo ">>> RESULT: agent402 NOT FOUND (scanned $total items)"
            fi
            echo
          done

      # Base Builder Code (ERC-8021) attribution, end-to-end: is the extension
      # declared on live 402s (BASE_BUILDER_CODE on Railway), and do recent
      # on-chain settlements actually carry the calldata suffix the Base
      # dashboard indexes? Dependency-free script — no npm ci in this job.
      # LAST step on purpose: the logs API serves a bounded tail of the job
      # log, so the verdict must sit at the end to stay retrievable.
      # ~8 days of history (43,200 blocks/day), evenly sampled: the per-day
      # attribution table separates "indexer hasn't caught up with a recent
      # rollout" from "suffixes have landed for a week and the dashboard
      # still counts zero" (a Base-side bug report with tx-hash evidence).
      - name: Builder Code attribution check (live 402 declaration + on-chain suffix scan)
        env:
          RAILWAY_API_TOKEN: ""
        run: SPAN_BLOCKS=350000 MAX_TXS=80 node scripts/check-builder-attribution.js || true

  deploy:
    needs: [markers, tree-gate, test, test-sweeps, test-sweeps2, test-paid, test-paid2, test-unit-a, test-unit-a2, test-unit-a3, test-unit-a4, test-unit-b, test-unit-b2, test-unit-b3, test-unit-b4, test-unit-c, test-unit-c2, test-unit-d, test-pricing]
    # Unconditional on a push to main (same reasoning as the test job above -
    # a merge to main has no marker to scan and needs none), otherwise the
    # existing dispatch/marker gates for the dev branch.
    # The lanes are `needs:`, so this used to inherit an implicit success() and
    # nothing else was required. !cancelled() removes that implicit check, so
    # the success requirement is written out - and the ONLY accepted alternative
    # is tree-gate proving this exact tree already passed the full suite on the
    # dev branch. A lane that FAILED, errored, or was skipped for any other
    # reason still blocks the release.
    if: >-
      !cancelled()
      && (
        needs.tree-gate.outputs.skip == 'true'
        || ( needs.test.result == 'success' && needs.test-sweeps.result == 'success' && needs.test-paid.result == 'success' && needs.test-paid2.result == 'success' && needs.test-unit-a.result == 'success' && needs.test-unit-a2.result == 'success' && needs.test-unit-b.result == 'success' && needs.test-unit-b2.result == 'success' && needs.test-unit-c.result == 'success' && needs.test-unit-c2.result == 'success' && needs.test-unit-a3.result == 'success' && needs.test-unit-a4.result == 'success' && needs.test-unit-b3.result == 'success' && needs.test-unit-b4.result == 'success' && needs.test-sweeps2.result == 'success' && needs.test-unit-d.result == 'success' && needs.test-pricing.result == 'success' )
      )
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' || needs.markers.outputs.deploy == 'true'
      )
    runs-on: ubuntu-24.04
    # Recent runs on main took up to 21 minutes. The wait loops below (the quiet
    # gate, two deployment watches, health, MCP, the listing validation) sum to
    # about 75 minutes at their own bounds, so the job bound sits above them and
    # only ends a step that hangs outside its own limit.
    timeout-minutes: 120
    # actions: read lets the worker step find the last successful deploy run
    # (its diff base); contents: read is the workflow default restated.
    permissions:
      contents: read
      actions: read
    # F01: bind the production-mutating job to the protected GitHub environment.
    # Today this just associates the job; once the owner configures the
    # environment with a required reviewer + deploy-branch policy, every deploy
    # pauses for human approval and can read environment-scoped secrets. Repo
    # secrets keep working until they are migrated to the environment.
    environment: "agent402 / production"
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # The project id is KNOWN (repo var). Railway's `projects` listing query
      # answered "Internal Server Error" for account tokens on 2026-09-08 (the
      # CLI's `railway list` failed the same way while `project(id:)` reads
      # worked), which failed three deploy attempts of a green main. With the
      # id in hand every step goes straight to project(id:).
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      # The key ID and wallet address are not sensitive (the wallet address is
      # public on-chain); only the Railway token and CDP secret live in secrets.
      CDP_KEY_ID: ${{ secrets.CDP_API_KEY_ID || 'ff16e708-0590-4a24-8a17-b0e978143f68' }}
      CDP_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FRED_API_KEY_V2: ${{ secrets.FRED_API_KEY_V2 }}
      MPP_SECRET_KEY: ${{ secrets.MPP_SECRET_KEY }}
      # The offsite backup's bucket variables (BACKUP_S3_*) are not here: the
      # bucket is a Railway bucket whose credentials Railway issues and can
      # regenerate, so the service variables (`railway bucket credentials`) are
      # their only source of truth. A copy carried by this job would write a
      # stale credential back over the current one on every deploy;
      # scripts/test-ci-secretless-install.js keeps them out of the upsert.
      # /v1/audio/speech rollout gate (server.js GATEWAY_TOOLS_ENABLED) — a
      # repo VARIABLE (not secret) so flipping it is one `gh variable set`
      # away and the value is auditable. Injected only when set.
      OPENROUTER_TTS_ENABLED: ${{ vars.OPENROUTER_TTS_ENABLED }}
      # SOR external-execution rollout gate (server.js SOR_EXTERNAL_ENABLED) — a
      # repo VARIABLE so the money-moving external router is flipped with one
      # `gh variable set`, auditable, and set on the CORRECT service atomically
      # with a SHA-pinned deploy (never an out-of-band `railway variables --set`
      # that can roll a stale build or land on the wrong service). Injected only
      # when set; absent → server default (off).
      SOR_EXTERNAL_ENABLED: ${{ vars.SOR_EXTERNAL_ENABLED }}
      # Public address of the x402 spending wallet (the burner). Set so the SOR
      # external router settles route-execute's BASE leg to the burner and pays
      # itself. A repo VARIABLE (public, auditable); unset = falls back to the
      # treasury payTo (self-funding off). Must match X402_UPSTREAM_BUYER_KEY's
      # address; a burner->treasury sweep keeps the hot wallet bounded.
      X402_UPSTREAM_BUYER_ADDRESS: ${{ vars.X402_UPSTREAM_BUYER_ADDRESS }}
      # Public address of the AVM spending wallet (ALGORAND_UPSTREAM_BUYER_MNEMONIC's
      # account). Set so route-execute's ALGORAND leg settles to the wallet that
      # pays Algorand sellers - chain-matched self-funding, same rule as Base.
      # Unset = Algorand revenue keeps the treasury payTo (self-funding off).
      ALGORAND_UPSTREAM_BUYER_ADDRESS: ${{ vars.ALGORAND_UPSTREAM_BUYER_ADDRESS }}
      WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS || '0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0' }}
      NETWORK: ${{ vars.NETWORK || 'base' }}
      # CDP keys take priority in the server's facilitator selection, so this
      # default is harmless once CDP_API_KEY_ID/SECRET secrets are added.
      FACILITATOR_URL: ${{ vars.FACILITATOR_URL || 'https://facilitator.payai.network' }}
      PROJECT_NAME: agent402
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'agent402.tools' }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check inputs
        run: |
          [ -n "$RAILWAY_API_TOKEN" ] && echo "::add-mask::$RAILWAY_API_TOKEN"
          [ -n "$CDP_KEY_SECRET" ] && echo "::add-mask::$CDP_KEY_SECRET"
          [ -n "$DATABENTO_API_KEY" ] && echo "::add-mask::$DATABENTO_API_KEY"
          [ -n "$BRAVE_API_KEY" ] && echo "::add-mask::$BRAVE_API_KEY"
          [ -n "$FRED_API_KEY" ] && echo "::add-mask::$FRED_API_KEY"
          [ -n "$FRED_API_KEY_V2" ] && echo "::add-mask::$FRED_API_KEY_V2"
          [ -n "$MPP_SECRET_KEY" ] && echo "::add-mask::$MPP_SECRET_KEY"
          # Not a credential, but a project id narrows a target and has no
          # reader in a public log.
          [ -n "$RAILWAY_PROJECT_ID" ] && echo "::add-mask::$RAILWAY_PROJECT_ID"
          [ -n "$RAILWAY_API_TOKEN" ] || { echo "No Railway token provided"; exit 1; }
          [ -n "$WALLET_ADDRESS" ] || { echo "No wallet address provided"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find or create project
        id: project
        run: |
          gql() {
            curl -s --max-time 30 -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
              --data @-
          }
          PROJECT_ID="${RAILWAY_PROJECT_ID:-}"
          if [ -z "$PROJECT_ID" ]; then
            PROJECT_ID=$(jq -n '{query:"query { projects { edges { node { id name } } } }"}' | gql \
              | jq -r --arg n "$PROJECT_NAME" '.data.projects.edges[] | select(.node.name==$n) | .node.id' | head -1)
          fi
          if [ -z "$PROJECT_ID" ]; then
            RESP=$(jq -n --arg n "$PROJECT_NAME" '{query:"mutation($n:String) { projectCreate(input: { name: $n }) { id } }", variables:{n:$n}}' | gql)
            echo "$RESP"
            PROJECT_ID=$(echo "$RESP" | jq -r '.data.projectCreate.id // empty')
          fi
          [ -n "$PROJECT_ID" ] || { echo "Could not find or create project"; exit 1; }
          ENV_ID=$(jq -n --arg id "$PROJECT_ID" '{query:"query($id:String!) { project(id: $id) { environments { edges { node { id name } } } } }", variables:{id:$id}}' | gql \
            | jq -r '.data.project.environments.edges[] | select(.node.name=="production") | .node.id' | head -1)
          [ -n "$ENV_ID" ] || { echo "No production environment found"; exit 1; }
          # Shape-checked before they become step outputs: outputs are template-
          # interpolated into later run: scripts, so an API answer that was not
          # a UUID would otherwise be executed as shell.
          UUID='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          [[ "$PROJECT_ID" =~ $UUID ]] || { echo "project id is not a UUID: $(printf '%s' "$PROJECT_ID" | head -c 80)"; exit 1; }
          [[ "$ENV_ID" =~ $UUID ]] || { echo "environment id is not a UUID: $(printf '%s' "$ENV_ID" | head -c 80)"; exit 1; }
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_ID  Environment: $ENV_ID"

      - name: Find or create service (connected to GitHub repo)
        id: service
        run: |
          gql() {
            curl -s --max-time 30 -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
              --data @-
          }
          PROJECT_ID='${{ steps.project.outputs.project_id }}'
          SERVICE_ID=$(jq -n --arg id "$PROJECT_ID" '{query:"query($id:String!) { project(id: $id) { services { edges { node { id name } } } } }", variables:{id:$id}}' | gql \
            | jq -r --arg n "$PROJECT_NAME" '.data.project.services.edges[] | select(.node.name==$n) | .node.id' | head -1)
          if [ -z "$SERVICE_ID" ]; then
            RESP=$(jq -n --arg p "$PROJECT_ID" --arg n "$PROJECT_NAME" --arg r "$REPO" --arg b "$BRANCH" \
              '{query:"mutation($p:String!, $n:String, $r:String!, $b:String) { serviceCreate(input: { projectId: $p, name: $n, branch: $b, source: { repo: $r } }) { id } }", variables:{p:$p,n:$n,r:$r,b:$b}}' | gql)
            echo "$RESP"
            SERVICE_ID=$(echo "$RESP" | jq -r '.data.serviceCreate.id // empty')
          fi
          [ -n "$SERVICE_ID" ] || { echo "Could not find or create service. If the error above mentions GitHub, install the Railway GitHub app: https://railway.com/account/integrations"; exit 1; }
          [[ "$SERVICE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "service id is not a UUID: $(printf '%s' "$SERVICE_ID" | head -c 80)"; exit 1; }
          echo "service_id=$SERVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Service: $SERVICE_ID"

      - name: Create public domain
        id: domain
        run: |
          gql() {
            curl -s --max-time 30 -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
              --data @-
          }
          ENV_ID='${{ steps.project.outputs.env_id }}'
          SERVICE_ID='${{ steps.service.outputs.service_id }}'
          # Two answers have to stay distinguishable here: "the service has no
          # domain" and "we could not READ whether it has one". The first
          # version folded both into an empty string and created a domain on
          # either, so every Railway API blip during a deploy minted another
          # *.up.railway.app hostname - 20 of them had accumulated by
          # 2026-08-25, each a public route to prod (all 301 to the canonical
          # domain, so harmless, but unbounded). Only a readable, well-formed
          # answer that says "none" may create one; an unreadable answer falls
          # through to the custom domain below, which is what the poll needs.
          # Railway's `domains` query requires projectId since 2026-09-22 (the
          # 02:31Z deploy was the first to fail the read); without it every
          # read failed and the custom-domain step re-attempted a create on
          # every run.
          PROJECT_ID='${{ steps.project.outputs.project_id }}'
          queryDomain() {
            jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
              '{query:"query($p:String!, $e:String!, $s:String!) { domains(projectId: $p, environmentId: $e, serviceId: $s) { serviceDomains { domain } } }", variables:{p:$p,e:$e,s:$s}}' | gql
          }
          RAW=$(queryDomain || true)
          DOMAIN=""
          READABLE=0
          if printf '%s' "$RAW" | jq -e '.data.domains.serviceDomains | type == "array"' >/dev/null 2>&1; then
            READABLE=1
            DOMAIN=$(printf '%s' "$RAW" | jq -r '.data.domains.serviceDomains[0].domain // empty')
          else
            echo "::warning::could not read the service's domain list (not creating one): $(printf '%s' "$RAW" | head -c 300)"
          fi
          if [ -z "$DOMAIN" ] && [ "$READABLE" = "1" ]; then
            RESP=$(jq -n --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
              '{query:"mutation($e:String!, $s:String!) { serviceDomainCreate(input: { environmentId: $e, serviceId: $s }) { domain } }", variables:{e:$e,s:$s}}' | gql || true)
            echo "$RESP" | head -c 300; echo
            DOMAIN=$(printf '%s' "$RESP" | jq -r '.data.serviceDomainCreate.domain // empty' 2>/dev/null || true)
          fi
          # The public Railway domain is only used to poll /health below; the
          # real address is the custom domain. Fall back to it so a domain quirk
          # never blocks the actual deploy (env vars + trigger come after).
          [ -z "$DOMAIN" ] && DOMAIN="${CUSTOM_DOMAIN}"
          [ -n "$DOMAIN" ] || { echo "No domain available to verify against"; exit 1; }
          # A hostname and nothing else - this value is interpolated into later
          # run: scripts, so anything the API returned that is not a hostname
          # must stop here rather than execute there.
          [[ "$DOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]] || { echo "domain is not a hostname: $(printf '%s' "$DOMAIN" | head -c 80)"; exit 1; }
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "PUBLIC URL: https://$DOMAIN"

      - name: Attach custom domain
        if: env.CUSTOM_DOMAIN != ''
        run: |
          gql() {
            curl -s --max-time 30 -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
              --data @-
          }
          ENV_ID='${{ steps.project.outputs.env_id }}'
          SERVICE_ID='${{ steps.service.outputs.service_id }}'
          PROJECT_ID='${{ steps.project.outputs.project_id }}'
          RAW=$(jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
            '{query:"query($p:String!, $e:String!, $s:String!) { domains(projectId: $p, environmentId: $e, serviceId: $s) { customDomains { domain } } }", variables:{p:$p,e:$e,s:$s}}' | gql || true)
          # Same rule as the public-domain step: only a READABLE list that lacks
          # the domain may create it. An unreadable answer is a skip, not a
          # create (every run was attempting one while the query was broken).
          if ! printf '%s' "$RAW" | jq -e '.data.domains.customDomains | type == "array"' >/dev/null 2>&1; then
            echo "::warning::could not read the custom domain list (not attaching): $(printf '%s' "$RAW" | head -c 300)"
            exit 0
          fi
          EXISTING=$(printf '%s' "$RAW" | jq -r '.data.domains.customDomains[]?.domain')
          echo "existing custom domains: ${EXISTING:-none}"
          if ! echo "$EXISTING" | grep -qx "$CUSTOM_DOMAIN"; then
            RESP=$(jq -n --arg p '${{ steps.project.outputs.project_id }}' --arg e "$ENV_ID" --arg s "$SERVICE_ID" --arg d "$CUSTOM_DOMAIN" \
              '{query:"mutation($p:String!, $e:String!, $s:String!, $d:String!) { customDomainCreate(input: { projectId: $p, environmentId: $e, serviceId: $s, domain: $d }) { id domain status { dnsRecords { hostlabel requiredValue recordType currentValue status } } } }", variables:{p:$p,e:$e,s:$s,d:$d}}' | gql)
            echo "$RESP" | jq .
          fi

      # Hold the deploy until outside traffic has a lull, paid or free (the
      # hosted /mcp connector's calls count), so a container swap never lands
      # in the middle of someone's burst; our own heartbeat rows are ignored.
      # Fail-open by design (stats down / sustained traffic past the max wait:
      # proceed with a warning); the in-server SIGTERM drain plus the Railway
      # grace set below still protect whatever is in flight. Runs BEFORE the
      # variable upsert because that upsert can itself trigger a redeploy.
      # Package code runs with no job-level secret in its environment (the
      # same rule as the install steps): the step shadows every one with "".
      - name: Quiet gate - wait for a lull in outside traffic and a clear ledger word
        env:
          TARGET_URL: https://${{ env.CUSTOM_DOMAIN || steps.domain.outputs.domain }}
          QUIET_GATE: ${{ vars.QUIET_GATE }}
          MAX_WAIT_SECS: ${{ vars.QUIET_GATE_MAX_WAIT || '1200' }}
          DATABENTO_API_KEY: ""
          RAILWAY_API_TOKEN: ""
          CDP_KEY_ID: ""
          CDP_KEY_SECRET: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          MPP_SECRET_KEY: ""
          X_BEARER_TOKEN: ""
          WALLET_ADDRESS: ""
        run: node scripts/deploy-quiet-gate.js

      - name: Set environment variables
        env:
          RAILWAY_DOMAIN: ${{ steps.domain.outputs.domain }}
        run: |
          gql() {
            curl -s --max-time 30 -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
              --data @-
          }
          BASE="https://${CUSTOM_DOMAIN:-$RAILWAY_DOMAIN}"
          # RAILWAY_DEPLOYMENT_DRAINING_SECONDS: Railway's default grace between
          # SIGTERM and SIGKILL is 0 seconds - without this, the server's
          # graceful drain never runs and every deploy hard-kills in-flight
          # (already paid-for) requests.
          #
          # It is a SIGKILL backstop and nothing more. Deploys overlap: Railway
          # starts the replacement, routes new calls to it once it is healthy
          # and keeps the old container serving for the service's overlap
          # window, then sends SIGTERM. The server closes its listener on the
          # signal and exits as soon as in-flight requests finish
          # (DRAIN_DEADLINE_MS 75s at the very worst); the overlap window is
          # the platform's setting, so a long grace here buys nothing and only
          # keeps two containers running. 120s clears the 75s deadline with
          # margin; scripts/test-drain-on-sigterm.js enforces both bounds.
          #
          # TRUST_PROXY_HOPS: production sits behind one trusted edge hop, so
          # req.ip is the entry that hop appends; unset, the server trusts no
          # hop and every client shares the edge's address in each per-IP
          # limiter (src/trust-proxy.js). A config value, not a secret, set
          # here on every deploy so the repository holds it.
          VARS=$(jq -n --arg w "$WALLET_ADDRESS" --arg n "$NETWORK" --arg f "$FACILITATOR_URL" --arg b "$BASE" \
            '{WALLET_ADDRESS:$w, NETWORK:$n, FACILITATOR_URL:$f, BASE_URL:$b, RAILWAY_DEPLOYMENT_DRAINING_SECONDS:"120", TRUST_PROXY_HOPS:"1"}')
          if [ -n "$CDP_KEY_ID" ] && [ -n "$CDP_KEY_SECRET" ]; then
            VARS=$(echo "$VARS" | jq --arg i "$CDP_KEY_ID" --arg s "$CDP_KEY_SECRET" '. + {CDP_API_KEY_ID:$i, CDP_API_KEY_SECRET:$s}')
          fi
          # The equities feed behind the equity tools bills per query. Prod
          # needs the key; CI deliberately does NOT get it, because an unkeyed
          # CI is what keeps a sweep from spending, the same rule as every
          # other metered upstream key below.
          if [ -n "$DATABENTO_API_KEY" ]; then
            VARS=$(echo "$VARS" | jq --arg d "$DATABENTO_API_KEY" '. + {DATABENTO_API_KEY:$d}')
          fi
          if [ -n "$BRAVE_API_KEY" ]; then
            VARS=$(echo "$VARS" | jq --arg b "$BRAVE_API_KEY" '. + {BRAVE_API_KEY:$b}')
          fi
          if [ -n "$FRED_API_KEY" ]; then
            VARS=$(echo "$VARS" | jq --arg f "$FRED_API_KEY" '. + {FRED_API_KEY:$f}')
          fi
          if [ -n "$FRED_API_KEY_V2" ]; then
            VARS=$(echo "$VARS" | jq --arg f "$FRED_API_KEY_V2" '. + {FRED_API_KEY_V2:$f}')
          fi
          # Yahoo relay: only inject when BOTH are set — partial config would
          # silently fall through to direct Yahoo and re-trigger the canary.
          if [ -n "$OPENROUTER_TTS_ENABLED" ]; then
            VARS=$(echo "$VARS" | jq --arg v "$OPENROUTER_TTS_ENABLED" '. + {OPENROUTER_TTS_ENABLED:$v}')
          fi
          if [ -n "$MPP_SECRET_KEY" ]; then
            VARS=$(echo "$VARS" | jq --arg v "$MPP_SECRET_KEY" '. + {MPP_SECRET_KEY:$v}')
          fi
          # X_BEARER_TOKEN (the x-data tools' rollout switch) is not upserted
          # here: x-bearer-sync.yml mints it and writes it to Railway, which
          # holds its only copy.
          # Never a variable whose source of truth is Railway itself (the
          # backup bucket's BACKUP_S3_* credentials): this upsert replaces the
          # service's value, so a copy held here would overwrite a credential
          # Railway has since regenerated.
          if [ -n "$SOR_EXTERNAL_ENABLED" ]; then
            VARS=$(echo "$VARS" | jq --arg v "$SOR_EXTERNAL_ENABLED" '. + {SOR_EXTERNAL_ENABLED:$v}')
          fi
          if [ -n "$X402_UPSTREAM_BUYER_ADDRESS" ]; then
            VARS=$(echo "$VARS" | jq --arg v "$X402_UPSTREAM_BUYER_ADDRESS" '. + {X402_UPSTREAM_BUYER_ADDRESS:$v}')
          fi
          if [ -n "$ALGORAND_UPSTREAM_BUYER_ADDRESS" ]; then
            VARS=$(echo "$VARS" | jq --arg v "$ALGORAND_UPSTREAM_BUYER_ADDRESS" '. + {ALGORAND_UPSTREAM_BUYER_ADDRESS:$v}')
          fi
          # skipDeploys: a write that changes a value otherwise starts Railway's
          # own deploy, which races the trigger below (two deployments of one
          # commit a second apart; Railway stops the first and marks it FAILED,
          # run 40999198917). The trigger below is the one deploy.
          RESP=$(jq -n --arg p '${{ steps.project.outputs.project_id }}' --arg e '${{ steps.project.outputs.env_id }}' --arg s '${{ steps.service.outputs.service_id }}' --argjson v "$VARS" \
            '{query:"mutation($p:String!, $e:String!, $s:String!, $v:EnvironmentVariables!) { variableCollectionUpsert(input: { projectId: $p, environmentId: $e, serviceId: $s, variables: $v, skipDeploys: true }) }", variables:{p:$p,e:$e,s:$s,v:$v}}' | gql)
          echo "$RESP"
          echo "$RESP" | jq -e '.data.variableCollectionUpsert' >/dev/null || { echo "Variable upsert failed"; exit 1; }

      - name: Trigger deploy of latest commit
        id: trigger
        run: |
          gql() {
            curl -s --max-time 30 -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
              --data @-
          }
          RESP=$(jq -n --arg e '${{ steps.project.outputs.env_id }}' --arg s '${{ steps.service.outputs.service_id }}' --arg c "$GITHUB_SHA" \
            '{query:"mutation($e:String!, $s:String!, $c:String) { serviceInstanceDeployV2(environmentId: $e, serviceId: $s, commitSha: $c) }", variables:{e:$e,s:$s,c:$c}}' | gql)
          echo "$RESP"
          # A swallowed trigger error is a FALSE-GREEN DEPLOY: the job passes,
          # prod keeps serving the old build, and nobody notices until a human
          # looks at the site (2026-07-03 incident). Fail loudly instead.
          if echo "$RESP" | jq -e '.errors' >/dev/null; then
            echo "::error::Railway rejected the deploy trigger — prod was NOT updated. With repo auto-deploy disabled, this job is the only deploy path, so this is a hard failure."
            exit 1
          fi
          DEPLOY_ID=$(echo "$RESP" | jq -r '.data.serviceInstanceDeployV2 // empty')
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "triggered deployment: ${DEPLOY_ID:-'(no id returned — status poll will use the latest deployment)'}"

      - name: Wait for the NEW deployment to reach SUCCESS
        run: |
          gql() {
            curl -s --max-time 30 -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
              --data @-
          }
          DEPLOY_ID='${{ steps.trigger.outputs.deploy_id }}'
          # Fall back to the newest deployment for this service+env when the
          # mutation returned no id (API shape drift) — it is the one we just
          # triggered.
          if [ -z "$DEPLOY_ID" ]; then
            DEPLOY_ID=$(jq -n --arg e '${{ steps.project.outputs.env_id }}' --arg s '${{ steps.service.outputs.service_id }}' \
              '{query:"query($e:String!,$s:String!){ deployments(input:{environmentId:$e, serviceId:$s}, first:1){ edges { node { id status } } } }", variables:{e:$e,s:$s}}' \
              | gql | jq -r '.data.deployments.edges[0].node.id // empty')
            echo "using latest deployment: $DEPLOY_ID"
            [ -n "$DEPLOY_ID" ] || { echo "::error::could not resolve a deployment id to watch"; exit 1; }
          fi
          # Poll until the build+deploy actually completes. The old 'Verify'
          # step probed /health seconds after the trigger — the OLD build
          # answers 200 and the job goes green without prod ever changing.
          # Three outcomes have to stay distinguishable here, because they call
          # for different actions and the first version conflated all of them
          # into "deploy failed":
          #   1. our build genuinely failed        -> read the Railway build log
          #   2. Railway never STARTED the build   -> platform delay, wait it out
          #   3. we could not READ the status      -> tells us nothing at all
          # Case 3 used to abort the step outright: `gql | jq` exits 5 on a
          # non-JSON body, which is exactly what the API returns during an
          # incident, so a degraded platform was reported as our failed deploy
          # (2026-07-30, Railway "builds and deployments are delayed").
          READ_FAILS=0
          QUEUED_TICKS=0
          LAST_STATUS="none"
          for i in $(seq 1 90); do
            RAW=$(jq -n --arg id "$DEPLOY_ID" '{query:"query($id:String!){ deployment(id:$id){ status } }", variables:{id:$id}}' | gql || true)
            if ! printf '%s' "$RAW" | jq -e . >/dev/null 2>&1; then
              READ_FAILS=$((READ_FAILS + 1))
              echo "[$i] Railway API returned a non-JSON body (consecutive read failures: $READ_FAILS)"
              if [ "$READ_FAILS" -ge 18 ]; then
                echo "::error::Railway's API was unreadable for $READ_FAILS consecutive polls. This is an UPSTREAM READ failure, not a failed deployment: prod is untouched and still serving the previous build. Check https://status.railway.com before retrying."
                exit 1
              fi
              sleep 10
              continue
            fi
            READ_FAILS=0
            STATUS=$(printf '%s' "$RAW" | jq -r '.data.deployment.status // "UNKNOWN"')
            LAST_STATUS="$STATUS"
            echo "[$i] deployment $DEPLOY_ID -> $STATUS"
            case "$STATUS" in
              SUCCESS) echo "new build is LIVE"; exit 0 ;;
              FAILED|CRASHED|REMOVED|SKIPPED) echo "::error::deployment ended $STATUS — prod is still on the previous build (check Railway build logs)"; exit 1 ;;
              QUEUED) QUEUED_TICKS=$((QUEUED_TICKS + 1)) ;;
            esac
            sleep 10
          done
          # Classify on the LAST status, never on a cumulative count. The first
          # version keyed off "was QUEUED for 60+ polls", which reported "never
          # started building" for a deployment that had queued, then moved to
          # DEPLOYING, and in fact SUCCEEDED about a minute after the window
          # closed (2026-07-30). A count says where it has been; only the last
          # status says where it is.
          case "$LAST_STATUS" in
            QUEUED)
              echo "::error::deployment never left QUEUED in the 15-minute window, so Railway did not pick the job up. That is a platform delay, NOT a failed build: prod is untouched on the previous build and there is no build log to inspect. Check https://status.railway.com; re-triggering adds to their backlog rather than clearing it."
              ;;
            BUILDING|DEPLOYING|INITIALIZING|WAITING)
              echo "::error::deployment was still $LAST_STATUS when the 15-minute window expired, so it is PROGRESSING but slower than this gate waits. It may well reach SUCCESS on its own shortly. Check the live status and prod's build hash before treating this as a failure, and do not re-trigger blindly."
              ;;
            *)
              echo "::error::deployment did not reach SUCCESS within 15 minutes (last status: $LAST_STATUS)"
              ;;
          esac
          exit 1

      - name: Verify deployment
        id: verify
        env:
          RAILWAY_DOMAIN: ${{ steps.domain.outputs.domain }}
        run: |
          URL="$RAILWAY_DOMAIN"
          # The Railway hostname now 301-redirects to the canonical domain
          # (see "Redirect Railway hostname to canonical domain"), so probing it
          # returns 301, never 200, and the gate below would false-fail every
          # deploy. Verify against the canonical domain — the real public surface
          # that doesn't redirect — when configured; fall back to the Railway URL.
          [ -n "$CUSTOM_DOMAIN" ] && URL="$CUSTOM_DOMAIN"
          echo "Waiting for https://$URL/health …"
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$URL/health" || echo 000)
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "health: $code"
          [ "$code" = "200" ] || { echo "Service did not become healthy in 10 minutes"; exit 1; }
          echo "=== pricing ==="
          curl -s --max-time 15 "https://$URL/api/pricing" || echo "(pricing read failed: curl exit $?; the gates below decide)"
          echo; echo "=== 402 check (paywall engaged) ==="
          # Retry the paywall probe — a single blip (cold container warming up, a
          # transient network hiccup) must NOT mark a healthy deploy as failed.
          # A red deploy that isn't real is monitoring noise; only a paywall that
          # stays un-engaged across several attempts is a genuine regression.
          paid=000
          for i in 1 2 3 4 5; do
            paid=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST "https://$URL/api/extract" -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{"url":"https://example.com"}' || echo 000)
            [ "$paid" = "402" ] && break
            echo "attempt $i: HTTP $paid (expect 402) — retrying in 6s"
            sleep 6
          done
          echo "unpaid request returned HTTP $paid (expect 402)"
          [ "$paid" = "402" ] || { echo "paywall not engaged after 5 attempts — real regression"; exit 1; }
          echo
          echo "🚀 LIVE: https://$URL"
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "=== custom domain check (informational — DNS may still be propagating) ==="
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$CUSTOM_DOMAIN/health" || echo 000)
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "https://$CUSTOM_DOMAIN/health → HTTP $code"
            [ "$code" = "200" ] && echo "🌐 CUSTOM DOMAIN LIVE: https://$CUSTOM_DOMAIN" || echo "(not resolving yet — Railway-managed DNS usually completes within minutes)"
          fi

      # The previous run's URL set, so only new URLs from every sitemap are pinged.
      - name: Restore IndexNow URL state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-

      - name: Ping IndexNow (instant Bing/Copilot/DDG re-indexing — best-effort, never fails the deploy)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          DATABENTO_API_KEY: ""
          RAILWAY_API_TOKEN: ""
          CDP_KEY_ID: ""
          CDP_KEY_SECRET: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          MPP_SECRET_KEY: ""
          X_BEARER_TOKEN: ""
          WALLET_ADDRESS: ""
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then echo "INDEXNOW_KEY secret not set — skipping"; exit 0; fi
          node scripts/indexnow-submit.js --state .indexnow-state.json || echo "IndexNow ping failed (non-fatal — the sitemap remains the source of truth)"

      - name: Save IndexNow URL state
        if: ${{ hashFiles('.indexnow-state.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}

      # The moved smoke check runs node against production: demo-payment.js
      # imports @x402/core, @x402/evm, @x402/fetch and viem at call time, and
      # the deploy job previously had neither a pinned node nor node_modules
      # (it only checks out and talks to Railway's API). --ignore-scripts is
      # correct here: nothing in this job boots our server, so better-sqlite3's
      # native build is not needed.
      # The npm ci below looks removable - the smoke check is mostly curl + jq -
      # and it is NOT: it runs scripts/test-mcp-http.js against production, which
      # imports src/mcp-flagship.js, which imports a package. Removing it passed
      # a first glance and was caught by test-ci-gating's transitive import walk
      # before it shipped (2026-08-25). Cache the fetch instead of skipping it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies for the production smoke check
        run: npm ci --ignore-scripts

      - name: Check production is serving the new catalog
        # MOVED OUT OF THE TEST LANE (2026-08-24). It sat at the end of the
        # test job, where it cost ~146s of the critical path polling for a
        # rollout that had not happened yet - deploy needs test, so the image it
        # checked was the PREVIOUS one. Its own comment said so: "a fix to these
        # surfaces goes green on the run AFTER the one that ships it". Here it
        # checks the build this run just shipped, which is what it was always
        # trying to do.
        #
        # NOW A REAL GATE (2026-08-24). It was `continue-on-error: true` for
        # years, which meant every `exit 1` below - the SEO surfaces counted
        # into FAILS, the proof-of-work check, the MCP connector poll - only
        # ever printed. The comments called them a hard gate; they were not.
        #
        # The reason for keeping it soft was a genuine deadlock: it used to run
        # in the test job, deploy needs test, so a check failing against a
        # crashed production would block the very deploy that would rescue it.
        # Running after the deploy removes that entirely - by the time this
        # executes the new image is already live, so failing here cannot stop a
        # fix from shipping. It can only tell us the truth about what shipped.
        #
        # What a red deploy job means now: the deploy SUCCEEDED and production
        # is serving this build, and one of these surfaces is wrong. That is
        # worth waking up to; silently printing it was not.
        #
        # Everything here is either idempotent or free: the catalog poll and
        # the MCP poll retry through any residual rollout lag, and
        # demo-payment.js takes the proof-of-work path (no wallet, no funds)
        # because the deploy job sets no AGENT_KEY.
        env:
          DATABENTO_API_KEY: ""
          RAILWAY_API_TOKEN: ""
          CDP_KEY_ID: ""
          CDP_KEY_SECRET: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          MPP_SECRET_KEY: ""
          X_BEARER_TOKEN: ""
          WALLET_ADDRESS: ""
        run: |
          PROD=https://agent402.tools
          # The deploy job and this test job run concurrently, so production may
          # still be swapping to the new image when we get here. Poll for up to
          # ~2 min before deciding it's a real failure (avoids rollout-race flakes).
          N=0; paid=000
          for i in $(seq 1 12); do
            N=$(curl -s --max-time 10 "$PROD/api/pricing" | jq '.endpoints | length' 2>/dev/null || echo 0)
            paid=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST "$PROD/api/hash" -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{"text":"x"}' || echo 000)
            [ "${N:-0}" -ge 500 ] && [ "$paid" = "402" ] && break
            echo "  attempt $i: endpoints=$N hash=$paid — production still rolling out, retrying in 10s…"
            sleep 10
          done
          echo "production endpoint count: $N (expect >= 500); hash unpaid → HTTP $paid (expect 402)"
          [ "${N:-0}" -ge 500 ] && [ "$paid" = "402" ] || { echo "Production not serving the catalog after ~2 min — the deploy SUCCEEDED and this build is live, so this is a real problem with what shipped."; exit 1; }
          curl -s "$PROD/api/pricing" | jq -r '.endpoints[] | "\(.method) \(.path) \(.price)"'
          echo "=== SEO + discovery surfaces on production (hard gate) ==="
          # These have all been live in production for a while — a miss now is a
          # real regression, not rollout lag. NOTE: this step runs BEFORE the
          # deploy job, so it checks the PREVIOUS build's homepage — a fix to
          # these surfaces goes green on the run AFTER the one that ships it.
          FAILS=0
          # Each surface is fetched whole, then searched, and a miss is retried
          # (this runs while the deploy's old and new containers overlap, when
          # a cold container can briefly refuse a page); a final miss names the
          # HTTP status it got. Only a 2xx answer counts: an error page that
          # happens to contain the needle is still a miss.
          has() { local body code i; for i in 1 2 3; do body=$(curl -s --max-time 20 -w '\n%{http_code}' "$1"); code=${body##*$'\n'}; body=${body%$'\n'*}; case "$code" in 2??) grep -qF -- "$2" <<<"$body" && return 0 ;; esac; LAST_CODE=$code; [ "$i" -lt 3 ] && sleep "${HAS_RETRY_SLEEP:-10}"; done; return 1; }
          ck() { if eval "$2"; then echo "  $1 ✓"; else echo "  $1 MISSING (last HTTP ${LAST_CODE:-?})"; FAILS=$((FAILS+1)); fi; }
          ck "FAQPage JSON-LD"            'has "$PROD/" "\"FAQPage\""'
          # The homepage renders its questions as <details> rows, each with an
          # ml-faq-mark toggle (the "$ GET /faq" kicker left with the home trim).
          ck "visible FAQ"               'has "$PROD/" "ml-faq-mark"'
          ck "AggregateOffer"            'has "$PROD/" AggregateOffer'
          ck "robots welcomes AI crawlers" 'has "$PROD/robots.txt" GPTBot'
          ck "MCP connector on landing"  'has "$PROD/" agent402-mcp'
          ck "MCP connector in llms.txt" 'has "$PROD/llms.txt" agent402-mcp'
          ck "unit-convert tool page"    'has "$PROD/tools/unit-convert" "Unit convert"'
          ck "guides with TechArticle JSON-LD" 'has "$PROD/guides/x402-in-5-minutes" TechArticle'
          [ "$FAILS" -eq 0 ] || { echo "$FAILS production surface(s) regressed"; exit 1; }
          echo "=== proof-of-work tier live on production (no wallet) ==="
          node --input-type=module -e '
          const B = "'"$PROD"'";
          const { createHash } = await import("node:crypto");
          const lz = (b) => { let t = 0; for (const x of b) { if (!x) { t += 8; continue; } t += Math.clz32(x) - 24; break; } return t; };
          const cr = await fetch(B + "/api/pow/challenge?slug=hash");
          const ct = cr.headers.get("content-type") || "";
          if (!ct.includes("application/json")) { console.error("Production not yet serving /api/pow (still building the new image?) — re-run shortly."); process.exit(1); }
          const c = await cr.json();
          let n = 0; while (lz(createHash("sha256").update(c.challenge + ":" + n).digest()) < c.difficulty) n++;
          const r = await fetch(B + "/api/hash", { method: "POST", headers: { "Content-Type": "application/json", "X-Pow-Solution": c.token + ":" + n }, body: JSON.stringify({ text: "hello world" }) });
          if (r.status !== 200) { console.error("PoW on production returned " + r.status); process.exit(1); }
          console.log("solved difficulty " + c.difficulty + " -> /api/hash HTTP 200, X-Pow-Accepted:", r.headers.get("x-pow-accepted"));
          '
          echo "=== remote MCP connector live on production (paid mode, real paywall mount order) ==="
          # /mcp is new — the old image 404s it, so poll through the rollout window.
          #
          # A 429 HERE IS OUR OWN RATE LIMITER, AND IT IS PROOF OF LIFE. This
          # sweep makes many /mcp calls, prod caps them per minute, and the old
          # 15s retry re-entered the SAME window with a full sweep each time -
          # so every retry spent more of the budget and made recovery less
          # likely. Armed as a real gate for the first time on 2026-08-24, it
          # failed the deploy with "connector not live" while /mcp was answering
          # 200 and the earlier attempts had already asserted real behaviour.
          #
          # So: a 429 backs off past the per-minute window instead of hammering
          # it, and if every failure was a 429 the check PASSES with a loud
          # note. "The connector answered and enforced its limits" is not
          # "the connector is down", and a gate that says otherwise is a gate
          # people learn to ignore. Any other failure still fails the deploy.
          MCP_OK=0; MCP_ONLY_429=1
          for i in $(seq 1 5); do
            OUT=$(TARGET_URL=$PROD node scripts/test-mcp-http.js 2>&1) && { echo "$OUT"; MCP_OK=1; break; }
            echo "$OUT" | tail -5
            if echo "$OUT" | grep -q "HTTP 429"; then
              echo "  attempt $i: throttled by OUR OWN /mcp limiter — backing off 65s past the per-minute window…"
              sleep 65
            else
              MCP_ONLY_429=0
              echo "  attempt $i: /mcp not serving yet — retrying in 15s…"; sleep 15
            fi
          done
          if [ "$MCP_OK" != "1" ]; then
            [ "$MCP_ONLY_429" = "1" ] || { echo "Remote MCP connector not live on production"; exit 1; }
            echo "NOTE: every attempt was throttled by our own /mcp rate limiter. The connector"
            echo "      is live (it answered and enforced its limits); the functional sweep could"
            echo "      not complete. Not a production defect, so not failing the deploy."
          fi
          echo "=== watch an agent pay an agent (live, no wallet) ==="
          TARGET_URL=https://agent402.tools node scripts/demo-payment.js
          echo "=== live M2M stats (informational; present once deployed) ==="
          curl -s https://agent402.tools/api/stats | jq '{tools, wallet, onchainRevenueProof, served: .toolCallsServed}' || echo "(/api/stats not live yet — will appear after this image rolls out)"

      # The render/media worker (agent402-worker) is its own Railway service,
      # built from Dockerfile.worker by an upload of this checkout; nothing
      # else rebuilds it, so a merge that changes the worker's code reaches it
      # only through this step. It runs when the pushed range touches a file
      # scripts/worker-deploy-paths.js lists (the image inputs plus
      # worker/server.js's import closure). FAIL-OPEN: an unreadable diff or no
      # diff base redeploys. The diff base is the head of the last deploy run
      # on main that succeeded, not the push's `before`: a deploy that failed
      # before this step never shipped its worker change, and a diff from its
      # commit would leave the worker behind (worker-deploy-paths.js --base).
      # The CLI is a pinned release binary checked
      # against its published sha256 (no package install, no lifecycle scripts).
      - name: Decide whether the render worker's code changed
        id: worker-diff
        env:
          GH_TOKEN: ${{ github.token }}
          DATABENTO_API_KEY: ""
          RAILWAY_API_TOKEN: ""
          CDP_KEY_ID: ""
          CDP_KEY_SECRET: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          MPP_SECRET_KEY: ""
          X_BEARER_TOKEN: ""
          WALLET_ADDRESS: ""
        run: |
          set -euo pipefail
          RUN=yes
          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --event push --status success --limit 30 --json databaseId,headSha,conclusion 2>/dev/null || true)
          DIFF_BASE=$(printf '%s' "$RUNS" | node scripts/worker-deploy-paths.js --base "$GITHUB_RUN_ID")
          if [ -n "${DIFF_BASE:-}" ] && ! echo "$DIFF_BASE" | grep -qE '^0+$'; then
            if CHANGED=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DIFF_BASE...$GITHUB_SHA" --paginate --jq '.files[].filename' 2>/dev/null); then
              # The compare API caps the files it lists (300); a list that long
              # may be cut, so it redeploys rather than trust a partial list.
              NFILES=$(printf '%s\n' "$CHANGED" | grep -c . || true)
              if [ "$NFILES" -ge 300 ]; then
                echo "the diff lists $NFILES files (the API may cap the list) - redeploying agent402-worker (fail-open)"
              elif [ "$(printf '%s\n' "$CHANGED" | node scripts/worker-deploy-paths.js --check 2>/dev/null || echo yes)" != "no" ]; then
                # Only a clean "no" keeps the old build; a check that fails redeploys.
                echo "worker files changed in $DIFF_BASE...$GITHUB_SHA (or the check could not run) - redeploying agent402-worker"
              else
                echo "no worker file changed in $DIFF_BASE...$GITHUB_SHA - agent402-worker keeps its build"
                RUN=no
              fi
            else
              echo "could not read the diff $DIFF_BASE...$GITHUB_SHA - redeploying agent402-worker (fail-open)"
            fi
          else
            echo "no successful deploy run to diff from - redeploying agent402-worker (fail-open)"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Redeploy the render worker when its code changed
        if: steps.worker-diff.outputs.run == 'yes'
        env:
          RAILWAY_CLI_VERSION: "5.63.1"
          RAILWAY_CLI_SHA256: cbb559de44cd304cf9d6598a4ea77575035a0e6e3215370bb3b105b8f48235cc
        run: |
          set -euo pipefail
          CLI_DIR=$(mktemp -d)
          curl -fsSL --max-time 120 -o "$CLI_DIR/cli.tgz" "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "$RAILWAY_CLI_SHA256  $CLI_DIR/cli.tgz" | sha256sum -c -
          tar -xzf "$CLI_DIR/cli.tgz" -C "$CLI_DIR"
          "$CLI_DIR/railway" up --service agent402-worker --environment production --project "$RAILWAY_PROJECT_ID" --ci

      # The decide service redeploys only when the pushed range touches a file
      # scripts/decide-deploy-paths.js lists (its image inputs, its import
      # closure, and the export row format and kit it shares with the main
      # app); tools reach it as data at runtime. Same base and FAIL-OPEN rules
      # as the worker selector above: an unreadable diff or no base redeploys.
      - name: Decide whether the decide service's code changed
        id: decide-diff
        env:
          GH_TOKEN: ${{ github.token }}
          DATABENTO_API_KEY: ""
          RAILWAY_API_TOKEN: ""
          CDP_KEY_ID: ""
          CDP_KEY_SECRET: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          MPP_SECRET_KEY: ""
          X_BEARER_TOKEN: ""
          WALLET_ADDRESS: ""
        run: |
          set -euo pipefail
          RUN=yes
          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --event push --status success --limit 30 --json databaseId,headSha,conclusion 2>/dev/null || true)
          DIFF_BASE=$(printf '%s' "$RUNS" | node scripts/decide-deploy-paths.js --base "$GITHUB_RUN_ID")
          if [ -n "${DIFF_BASE:-}" ] && ! echo "$DIFF_BASE" | grep -qE '^0+$'; then
            if CHANGED=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DIFF_BASE...$GITHUB_SHA" --paginate --jq '.files[].filename' 2>/dev/null); then
              # The compare API caps the files it lists (300); a list that long
              # may be cut, so it redeploys rather than trust a partial list.
              NFILES=$(printf '%s\n' "$CHANGED" | grep -c . || true)
              if [ "$NFILES" -ge 300 ]; then
                echo "the diff lists $NFILES files (the API may cap the list) - redeploying agent402-decide (fail-open)"
              elif [ "$(printf '%s\n' "$CHANGED" | node scripts/decide-deploy-paths.js --check 2>/dev/null || echo yes)" != "no" ]; then
                # Only a clean "no" keeps the old build; a check that fails redeploys.
                echo "decide files changed in $DIFF_BASE...$GITHUB_SHA (or the check could not run) - redeploying agent402-decide"
              else
                echo "no decide file changed in $DIFF_BASE...$GITHUB_SHA - agent402-decide keeps its build"
                RUN=no
              fi
            else
              echo "could not read the diff $DIFF_BASE...$GITHUB_SHA - redeploying agent402-decide (fail-open)"
            fi
          else
            echo "no successful deploy run to diff from - redeploying agent402-decide (fail-open)"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      # The decide service (DECIDE_MODE=true, same image) builds from the same
      # commit, AFTER the main app is verified: its index syncs from the main
      # app's internal export, which this commit's main build serves. It runs
      # only when a service named agent402-decide exists (created and given its
      # variables by hand); without one, nothing here changes. It is the LAST
      # step so a decide failure cannot skip a check of the main app, and it
      # still fails the job.
      - name: Deploy the decide service at the same commit
        if: steps.decide-diff.outputs.run == 'yes'
        run: |
          gql() {
            curl -s --max-time 30 -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
              --data @-
          }
          PROJECT_ID='${{ steps.project.outputs.project_id }}'
          ENV_ID='${{ steps.project.outputs.env_id }}'
          UUID='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          LIST=$(jq -n --arg id "$PROJECT_ID" '{query:"query($id:String!) { project(id: $id) { services { edges { node { id name } } } } }", variables:{id:$id}}' | gql)
          # An unreadable answer is not "no decide service": fail rather than skip.
          printf '%s' "$LIST" | jq -e '.data.project.services.edges | type == "array"' >/dev/null 2>&1 \
            || { echo "::error::could not list the project's services: $(printf '%s' "$LIST" | head -c 300)"; exit 1; }
          SID=$(printf '%s' "$LIST" | jq -r '.data.project.services.edges[] | select(.node.name=="agent402-decide") | .node.id' | head -1)
          if [ -z "$SID" ]; then echo "No agent402-decide service in this project: nothing to deploy."; exit 0; fi
          [[ "$SID" =~ $UUID ]] || { echo "::error::decide service id is not a UUID"; exit 1; }
          # First run only: the service has no source yet. Connecting one is
          # what lets a commit be deployed to it; it may start a build of the
          # branch head, which the pinned deploy below replaces.
          INST=$(jq -n --arg e "$ENV_ID" --arg s "$SID" '{query:"query($e:String!,$s:String!){ serviceInstance(environmentId:$e, serviceId:$s){ source { repo } } }", variables:{e:$e,s:$s}}' | gql)
          printf '%s' "$INST" | jq -e '.data.serviceInstance' >/dev/null 2>&1 \
            || { echo "::error::could not read the decide service instance: $(printf '%s' "$INST" | head -c 300)"; exit 1; }
          SRC=$(printf '%s' "$INST" | jq -r '.data.serviceInstance.source.repo // empty')
          if [ -z "$SRC" ]; then
            RESP=$(jq -n --arg s "$SID" --arg r "$REPO" '{query:"mutation($s:String!,$r:String!){ serviceConnect(id:$s, input:{ repo:$r, branch:\"main\" }) { id } }", variables:{s:$s,r:$r}}' | gql)
            echo "$RESP" | jq -e '.errors' >/dev/null && { echo "::error::could not connect the decide service to the repo: $(echo "$RESP" | jq -c '.errors' | head -c 300)"; exit 1; }
            echo "Connected agent402-decide to $REPO (main)."
            # Pushes must not deploy it on their own (only this pinned step
            # may): a watch pattern no commit touches means a push never
            # matches. The pinned deploy below names its commit explicitly.
            RESP=$(jq -n --arg e "$ENV_ID" --arg s "$SID" '{query:"mutation($e:String!,$s:String!){ serviceInstanceUpdate(environmentId:$e, serviceId:$s, input:{ watchPatterns:[\"/.decide-deploys-only-from-ci\"] }) }", variables:{e:$e,s:$s}}' | gql)
            echo "$RESP" | jq -e '.errors' >/dev/null && { echo "::error::could not set the decide service's watch pattern: $(echo "$RESP" | jq -c '.errors' | head -c 300)"; exit 1; }
            echo "Set a watch pattern no push matches: agent402-decide deploys only from this step."
          fi
          RESP=$(jq -n --arg e "$ENV_ID" --arg s "$SID" --arg c "$GITHUB_SHA" \
            '{query:"mutation($e:String!, $s:String!, $c:String) { serviceInstanceDeployV2(environmentId: $e, serviceId: $s, commitSha: $c) }", variables:{e:$e,s:$s,c:$c}}' | gql)
          if echo "$RESP" | jq -e '.errors' >/dev/null; then
            echo "::error::Railway rejected the decide deploy trigger - the main app is live, the decide service is NOT updated: $(echo "$RESP" | jq -c '.errors' | head -c 300)"
            exit 1
          fi
          DID=$(echo "$RESP" | jq -r '.data.serviceInstanceDeployV2 // empty')
          [ -n "$DID" ] || { echo "::error::no deployment id returned for the decide service"; exit 1; }
          echo "decide deployment: $DID"
          LAST=none
          for i in $(seq 1 90); do
            RAW=$(jq -n --arg id "$DID" '{query:"query($id:String!){ deployment(id:$id){ status } }", variables:{id:$id}}' | gql || true)
            ST=$(printf '%s' "$RAW" | jq -r '.data.deployment.status // "UNREADABLE"' 2>/dev/null || echo UNREADABLE)
            LAST="$ST"
            echo "[$i] decide $DID -> $ST"
            case "$ST" in
              SUCCESS) echo "decide service is LIVE at $GITHUB_SHA"; exit 0 ;;
              SKIPPED) echo "::error::decide deployment was SKIPPED - the main app is live. If Railway applied the service's watch pattern (/.decide-deploys-only-from-ci) to this pinned deploy, clear the pattern in the service settings and turn off auto-deploy there instead."; exit 1 ;;
              FAILED|CRASHED|REMOVED) echo "::error::decide deployment ended $ST - the main app is live; decide keeps its previous build (check its Railway logs)"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::decide deployment did not reach SUCCESS in 15 minutes (last status: $LAST). The main app is live."
          exit 1

      # The new build's 402s against Coinbase's Bazaar validator, read-only and
      # keyless (the heartbeat repeats it on a schedule). Up to three runs a
      # minute apart, stopping at the first clean one (exit 0), which passes.
      # With no clean run, one run that read a flagship route INVALID (exit 1)
      # fails this job whatever the other runs did, so a release that breaks a
      # listing is red on its own run. Only when every run could not read the
      # validator (exit 2, CDP-side) does the step warn instead: it then has
      # no verdict on our build.
      - name: Bazaar listing validation on the new build
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          DATABENTO_API_KEY: ""
          RAILWAY_API_TOKEN: ""
          CDP_KEY_ID: ""
          CDP_KEY_SECRET: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          MPP_SECRET_KEY: ""
          X_BEARER_TOKEN: ""
          WALLET_ADDRESS: ""
        run: |
          BEST=9
          INVALID=0
          for i in 1 2 3; do
            set +e
            OUT=$(TARGET_URL=https://agent402.tools node scripts/bazaar-validate.js 2>&1); CODE=$?
            set -e
            echo "--- run $i: exit $CODE"
            echo "$OUT" | tail -20
            if [ "$CODE" -lt "$BEST" ]; then BEST=$CODE; fi
            if [ "$CODE" = "1" ]; then INVALID=$((INVALID + 1)); fi
            if [ "$CODE" = "0" ]; then break; fi
            if [ "$i" -lt 3 ]; then sleep 60; fi
          done
          case "$BEST" in
            0) echo "Every flagship route validates on the new build." ;;
            2) echo "::warning::The Bazaar validator could not be read on any run (CDP-side); no listing verdict for this build." ;;
            *) echo "::error::No Bazaar validator run was clean against the new build: $INVALID of $i run(s) read a flagship route INVALID, the rest could not be read."; exit 1 ;;
          esac
