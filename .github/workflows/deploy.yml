      # every lane. On a hit the install is skipped outright, so no install script
      # runs at all - stricter than the secretless-env install below. Native
      # modules (better-sqlite3) ship prebuilt per Node ABI, hence node22 in the key.
      - name: ffmpeg for the three media tools in the example sweep (ubuntu-latest ships none; they answered 503 "not installed" once that stopped being a silent 422)
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh ffmpeg && ffmpeg -version | head -1
      - name: OCR language data for image-ocr in the example sweep (pinned, hash-checked; the server never downloads it)
        run: node scripts/fetch-tessdata.js tessdata eng
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (secretless)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        # F07: shadow the job-scope provider keys to EMPTY for this step only, so
        # a malicious dependency lifecycle script running during `npm ci` cannot
        # read them. No server or tool runs here, so empty keys are harmless.
        env:
          UPSTREAM_COSTS_JSON: ""
          BRAVE_API_KEY: ""
          FRED_API_KEY: ""
          FRED_API_KEY_V2: ""
          E2B_API_KEY: ""
          COINGECKO_API_KEY: ""
        run: npm ci
      # Chromium is ~150 MB from Playwright's CDN plus an apt round for fonts,
      # 30 s on a good day and the step that stalled two runs for 28 min on a
      # bad apt mirror (2026-08-18, see the install step). The browser bundle
      # keys on the installed playwright-core version, so a dependency bump
      # re-downloads and everything else hits. On a hit the install step is
      # skipped outright: Chromium's shared libraries are already on the
      # ubuntu-24.04 image and the fonts it pulls are not what any browser test
      # here measures.
