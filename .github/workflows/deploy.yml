  test:
    # UPSTREAM AFFINITY, not just time. Balancing by duration alone put suites
    # that call the SAME free rate-limited providers (CoinGecko, DefiLlama,
    # DexScreener, data.gov) into all three lanes. They had been serial in one
    # job; running them concurrently tripled the load on providers that limit by
    # IP, and eight tools failed on 504s in the first real run while both
    # providers answered in under 350ms from a laptop. The non-metered sweep
    # already caps itself at concurrency 3 for exactly this reason - "a
    # thundering herd just rate-limits" - and the split was undoing that from
    # the outside.
    #
    # So every suite touching a shared free-public upstream lives in THIS lane,
    # with everything that needs the booted server. The other two lanes are
    # pure-offline suites balanced by measured time.
    # Everything else that talks to the shared free-mode server, plus the
    # self-booting suites moved in from test-unit-b. The two catalog sweeps and
    # the browser page checks moved to `test-sweeps` (2026-08-25) - see that
    # lane's comment for why they stay together there.
    # Test job runs on its own [test] marker AND auto-runs whenever a commit
    # asks to deploy or publish — so deploy/publish can hard-gate on it via
    # `needs: test`. This makes "ship without running tests" impossible by
    # design, not by developer discipline.
    needs: [markers, tree-gate]
    # Runs on the [test]/[deploy]/[publish] markers, on the matching
    # workflow_dispatch modes, on every PR into main (N-04: so the required
    # `test` status check always reports), AND unconditionally on every push
    # to main — a merge to main has no marker to scan (see the `on:` block
    # above) and needs none: it is asked to test-and-deploy regardless.
    # `!cancelled()` because tree-gate does not run at all outside a push to
    # main, and a SKIPPED `needs` job skips its dependents unless the dependent
    # carries a status function - without this, every dev-branch and PR run
    # would silently stop testing. With tree-gate skipped OR failed its output
    # is empty, which is not 'true', so the lane runs: the gate can only ever
    # subtract work by succeeding and saying so.
