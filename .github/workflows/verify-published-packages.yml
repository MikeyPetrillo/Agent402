name: Verify the PUBLISHED npm packages against live prod

# Everything else in CI tests the packages from the working tree, which proves
# the source is good and cannot prove that what people actually `npm install`
# works. Publishing is a separate act with its own failure modes: a missing
# `files` entry, a stale version on the registry, a dependency that resolves
# differently outside this repo, or a package never republished after the
# surface it talks to moved. Those are invisible to a source test and visible
# to the first user who hits them.
#
# Read-only and free: it lists tools, resolves the catalog and reads public
# surfaces. It never buys, so it can run on a schedule without spending. The
# paid path stays the paid canary's job.
# Least privilege: the default token on this repo is read-only, so a job that
# opens an issue on failure needs issues: write spelled out (two alarms could
# not page before 2026-08-28).
permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"
  # Also after a publish, which is the moment a broken package is created.
  workflow_run:
    workflows: ["Deploy to Railway"]
    types: [completed]

concurrency:
  group: verify-published-packages
  cancel-in-progress: false

jobs:
  verify:
    # On the workflow_run trigger, only a successful push run of this
    # repository (never a run started from a fork or a pull request).
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install from the registry and drive live prod
        run: node scripts/verify-published-packages.js

      # An open issue this check filed under a previous title gets the current
      # one, so the lookups below find it (scripts/adopt-issue-titles.js).
      - name: Adopt an open issue filed under a previous title
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/adopt-issue-titles.js

      - name: Page on failure / recover on success
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Scheduled check needs review: published-packages"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' || true)
          if [ "$OUTCOME" = "success" ]; then
            [ -n "$OPEN" ] && gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" \
              --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          else
            [ -n "$OPEN" ] || node scripts/check-issue.js --title "$TITLE"
          fi
