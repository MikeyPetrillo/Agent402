name: PayAI listing pass

# Keep every Solana route listed in the PayAI facilitator registry.
#
# That registry is harvested from the settlements PayAI itself facilitates. On
# this host CDP is tried first on every chain its table lists, Solana included,
# so a buyer's Solana payment settles at CDP and refreshes the Bazaar row, never
# the PayAI one: a route the PayAI registry lacks stays missing until a payment
# settles through PayAI on purpose. The Bazaar side keeps itself full on its own
# schedule (bazaar-keepalive.yml); this is the PayAI side of the same goal.
#
# scripts/payai-listing-pass.js measures coverage first, then pays each route
# the registry lacks once, through the operator-gated settle preference
# (X-Agent402-Settle-Via plus the operator token, honored for that request
# alone by src/settle-preference.js). Before the first buy it reads one 402
# with and without the headers and spends nothing unless the Solana signer
# differs. A week with nothing missing spends nothing.
#
# Spend is bounded twice: per route (MAX_PRICE_USD, the list price a route may
# carry to be bought) and per run (MAX_SPEND_USD, the summed list price of the
# selection, cheapest first; the rest is skipped and named). The list price
# lands in our own treasury; the real cost is the vendor call behind a route
# that serves through one (--include-upstream), which is why the ceiling is
# small and the cadence weekly.
#
# One issue, "PayAI listing pass FAILED", stays open while a run fails and
# closes on the next green run.
on:
  schedule:
    # Wednesdays 03:53 UTC: clear of the Bazaar keep-alive (Tuesday 04:17,
    # daily 05:37), the paid canary's slots at :17, the heartbeat's quarter
    # hours, the MPP probe at :17 and :47, and the Monday catalog buy. Each
    # scheduled run waits on the spending environment's approval, like the
    # catalog buy.
    - cron: "53 3 * * 3"
  workflow_dispatch:
    inputs:
      max_spend_usd:
        description: "Per-run ceiling on the summed list price of the selection (cheapest first)."
        required: false
        default: "2"
      max_price_usd:
        description: "Per-route price ceiling; a route listed above it is skipped."
        required: false
        default: "0.25"

permissions:
  contents: read
  issues: write

concurrency:
  group: payai-listing
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: spending
    env:
      TARGET_URL: https://agent402.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/fetch@2.28.0 @x402/core@2.28.0 @x402/evm@2.28.0 @x402/svm@2.28.0 @solana/kit@8.5.0 viem@2.52.2
      - name: Settle one Solana payment through PayAI on every route its registry lacks
        # Wallet, gate and pow secrets are scoped to this step, never the
        # install above.
        env:
          MAX_PRICE_USD: ${{ inputs.max_price_usd || '0.25' }}
          MAX_SPEND_USD: ${{ inputs.max_spend_usd || '2' }}
          SOLANA_BURNER_KEY: ${{ secrets.SOLANA_BURNER_KEY }}
          AGENT402_OPERATOR_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          # Signs X-Heartbeat-Token so these self-buys are booked as ours.
          POW_SECRET: ${{ secrets.POW_SECRET }}
        run: |
          [ -n "$SOLANA_BURNER_KEY" ] || { echo "::error::SOLANA_BURNER_KEY is not set - the pass cannot pay"; exit 1; }
          [ -n "$AGENT402_OPERATOR_TOKEN" ] || { echo "::error::AGENT402_OPERATOR_TOKEN is not set - the settle-via gate cannot be opened"; exit 1; }
          echo "::add-mask::$SOLANA_BURNER_KEY"
          echo "::add-mask::$AGENT402_OPERATOR_TOKEN"
          [ -n "$POW_SECRET" ] && echo "::add-mask::$POW_SECRET"
          node scripts/payai-listing-pass.js --live --include-upstream --max-price "$MAX_PRICE_USD" --max-spend "$MAX_SPEND_USD" --out pass.json
      - name: Keep the pass records (route, status, tx; never a key)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payai-listing-pass
          path: pass.json
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: pass
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Page if the pass failed, close the page when it passes
        env:
          GH_TOKEN: ${{ github.token }}
          PASS: ${{ needs.pass.result }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="PayAI listing pass FAILED"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$PASS" != "success" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A PayAI listing pass did not complete (result: $PASS, trigger: ${GITHUB_EVENT_NAME}${SCHEDULE:+ $SCHEDULE}). While it fails, a route the PayAI Solana registry lacks stays unlisted there. Read the run: exit 2 is a refused preflight (the settle-via preference not honored, or a secret missing) and nothing was spent; exit 1 names the route whose buy failed. Records: the payai-listing-pass artifact on $RUN_URL. Re-run: \`gh workflow run payai-listing.yml --ref main\`."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still failing at $(date -u +%FT%TZ) (result: $PASS). $RUN_URL"
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the listing pass completed at $(date -u +%FT%TZ). $RUN_URL"
          fi
