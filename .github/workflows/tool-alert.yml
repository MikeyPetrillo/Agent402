name: Tool self-check

# The "is a paid tool actually working?" alarm — the gap that let
# earnings-calendar fail 100% for weeks while the board stayed green.
#
# Every 30 min it polls the live /api/selfcheck surface, which runs a curated set
# of high-value tools' own documented examples in-process (see src/selfcheck.js).
# If any curated tool is failing, it opens a GitHub issue (and comments while it
# stays down); recovery closes the issue. Same pattern as heartbeat.yml, but for
# per-tool correctness rather than overall server liveness.
#
# No secrets: /api/selfcheck is a free, unpaywalled surface and the check runs
# server-side (calling handlers directly — no payment, no organic traffic needed).
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - "main"
      - "claude/sweet-brown-i99jl3"
    paths:
      - ".github/trigger-tool-alert"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  PROD: https://agent402.tools

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Poll /api/selfcheck
        id: check
        run: |
          # Fetch the self-check result. A network/HTTP failure reaching the
          # endpoint is NOT a tool failure (overall outages are heartbeat's job),
          # so on an unreadable response we skip quietly rather than false-alert.
          RESP="$(curl -s --max-time 60 "$PROD/api/selfcheck" || true)"
          OK="$(echo "$RESP" | jq -r '.ok // empty' 2>/dev/null || echo "")"
          if [ -z "$OK" ]; then
            echo "self-check endpoint unreadable (prod outage is heartbeat's domain) — skipping"
            echo "status=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$OK" = "true" ]; then
            echo "all curated tools healthy"
            echo "status=up" >> "$GITHUB_OUTPUT"
          else
            # One-line summary of each failing tool: "slug(status): error"
            DETAIL="$(echo "$RESP" | jq -r '[.results[] | select(.ok==false) | "\(.slug)(\(.status // "?")): \(.error // "failed")"] | join("; ")')"
            echo "failing tools: $DETAIL"
            echo "status=down" >> "$GITHUB_OUTPUT"
            # Random delimiter, not a fixed "EOF": DETAIL is built from upstream
            # .error strings we don't control, and a literal "EOF" line in there
            # would otherwise prematurely close this heredoc and let the rest be
            # parsed as forged GITHUB_OUTPUT key=value pairs.
            DELIM="EOF_$(date +%s%N)_$RANDOM"
            { echo "detail<<$DELIM"; echo "$DETAIL"; echo "$DELIM"; } >> "$GITHUB_OUTPUT"
          fi
      - name: Open, comment, or close the alert issue
        if: steps.check.outputs.status != 'skip'
        env:
          # DETAIL is built from upstream API error strings we don't control -
          # route it through env: (safe, runtime bash variable substitution)
          # rather than splicing it into the run: script via ${{ }} (unsafe:
          # that substitution happens at YAML template-render time, before bash
          # ever sees it, so a crafted upstream error string could break out of
          # the quoted context and execute as shell in a step holding
          # issues:write via GH_TOKEN).
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          TITLE="Tool self-check: paid tool failing"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "${{ steps.check.outputs.status }}" = "down" ]; then
            BODY="A curated high-value tool failed its own documented example on prod (twice in a row — transient blips are already filtered).

          **Failing:** $DETAIL

          Live surface: $PROD/api/selfcheck
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still failing at $(date -u +%FT%TZ): $DETAIL"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            fi
            exit 1
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: all curated tools passing at $(date -u +%FT%TZ)."
          fi
