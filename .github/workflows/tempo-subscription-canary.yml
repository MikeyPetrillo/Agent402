name: Tempo subscription canary - live verification (daily + dispatch)

# LIVE proof of the MPP recurring subscription rail (tempo/subscription) against
# production. Offline tests prove our logic against injected stubs; the charge
# rail learned twice that a stub proves nothing about the wire, and this rail
# has one half no stub can speak for at all: the RENEWAL, where our server signs
# a transfer with a delegated access key and broadcasts it with no buyer
# present and no relay verdict to read.
#
# Buys the heartbeat-gated `rail-canary` product, which bills in mppx's
# dev_second unit so a second period comes due inside a CI run. That product is
# not in MONITOR_PRODUCTS, so it can never reach the monitor scheduler.
#
# Scheduled daily since 2026-08-23, the day both halves first settled on-chain.
# It pages heartbeat-style: a failure opens ONE issue and a passing run closes
# it, so a rail that quietly stops billing cannot go unnoticed - which is the
# exact failure mode this rail has, since a renewal that never fires means we
# serve a subscriber for free until their grace window ends.
# Least privilege: the default token on this repo is read-only, so a job that
# opens an issue on failure needs issues: write spelled out (two alarms could
# not page before 2026-08-28).
permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
  schedule:
    # Daily. Proven end to end on 2026-08-23 (activation tx 0xaaf92954...,
    # renewal tx 0x2d32927a...), which is what promotes it from dispatch-only:
    # scheduling a rail before it is green just pages every morning.
    # ~2 x $0.01 to our own payTo plus a few tenths of a cent of PathUSD gas.
    - cron: "37 6 * * *"

concurrency:
  # Two runs at once would each hold a standing authorization on the same
  # burner and race each other's cancel.
  group: tempo-subscription-canary
  cancel-in-progress: false

jobs:
  subscribe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install (mppx + viem already in package.json)
        run: npm ci --ignore-scripts
      - name: Real Tempo subscription (activation + a pulled renewal, real money)
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
        run: node scripts/tempo-subscription-canary.js

      # Heartbeat-style paging: one issue per episode, closed by a green run.
      # `always()` so a FAILED canary still reaches this step - a paging step
      # that only runs on success is the class of bug that let the paid canary
      # report green for five days while it had stopped buying.
      - name: Page on failure / recover on success
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="MPP subscription rail FAILING"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number -q '.[0].number' || true)
          if [ "$OUTCOME" = "success" ]; then
            [ -n "$OPEN" ] && gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" \
              --comment "Recovered: a real activation and a real pulled renewal both settled at $(date -u +%FT%TZ). $RUN_URL" || true
          else
            [ -n "$OPEN" ] || gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "The daily Tempo subscription canary failed. This rail bills by PULLING on a delegated access key with no buyer present and no relay verdict to read, so a broken renewal means subscribers are served for free until their grace window ends rather than anything erroring loudly. Check the gas sponsor's PathUSD balance first (gas is paid in PathUSD, not the USDC.e the products are priced in) and then prod's [mpp-subs] log lines. $RUN_URL"
          fi
