# Nightly correctness corpus, tiers 0 + 1: every tool driven with inputs other
# than its documented example on a FREE_MODE boot (no payment; the only key is the free
# CoinGecko Demo key, see the run step), asserting
# the answer is populated rather than merely shaped. Tier 0 (pure CPU) also runs
# on every push in deploy.yml; this run adds tier 1, the free public upstreams
# (SEC, openFDA, Hyperliquid, CoinGecko demo, open-meteo, public RPCs,
# Kalshi), which are rate-limited and belong to a nightly cadence, not
# a per-push one. Costs nothing. Upstream failures are reported, never fatal; only
# OUR code failing (a hollow 200, a silent fallback, our own 4xx on a valid input,
# a 500) opens the issue. Heartbeat-style: one issue, closed on the next clean run.
name: Correctness corpus (nightly)

on:
  schedule:
    - cron: "17 5 * * *" # daily ~05:17 UTC
  workflow_dispatch:
    inputs:
      tier:
        description: "Tiers to run (0,1 default; 2 needs keys and spends)"
        default: "0,1"
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: corpus-nightly
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: ffmpeg (the media tools; ubuntu-latest does not ship it)
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh ffmpeg && ffmpeg -version | head -1
      - name: OCR language data for image-ocr (pinned, hash-checked; the server never downloads it)
        run: node scripts/fetch-tessdata.js tessdata eng
      - name: Install
        # --ignore-scripts is the repo's supply-chain rule (no dependency
        # lifecycle scripts); better-sqlite3 is the one native module the
        # server needs, rebuilt explicitly (the first run booted nothing:
        # "Could not locate the bindings file", issue #1233).
        run: npm ci --ignore-scripts && npm rebuild better-sqlite3

      - name: Run the corpus (self-booted FREE_MODE server; only the free CoinGecko Demo key)
        id: corpus
        env:
          TIER: ${{ inputs.tier || '0,1' }}
          # The CI CoinGecko key (its own key, never production's), on the pro
          # tier: keyless CoinGecko from a shared GitHub egress IP rate-limited
          # most of the CoinGecko cases on a night, so those tools went
          # unverified. The server's own caps bound the night: its day ceiling
          # (CG_NIGHTLY_READ_CAP in scripts/test-non-metered-examples.js) and
          # its minute pacing, which the cases' shared `paceKey` clock keeps
          # under. Without the secret the run is keyless, as before.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_CI_API_KEY }}
          COINGECKO_API_TIER: pro
          COINGECKO_DAILY_MAX: "200"
          COINGECKO_MAX_PER_MIN: "30"
          # Our Solana RPC, read-only. RugCheck stopped publishing topHolders
          # for every mint on 2026-09-19, so sol-token-holders/-report build
          # their table from getTokenLargestAccounts + one batched
          # getMultipleAccounts instead. Those cases declare
          # `requires: SOLANA_RPC_URL` and are reported SKIPPED, never passed,
          # while this is unset - so the corpus can never certify a table it
          # did not see. Four reads a night.
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          # The RugCheck-backed tools are listed only with RUGCHECK_TOOLS=on
          # (src/rugcheck-switch.js). Production serves them, so the nightly
          # boots the same way and checks them; with it off the cases skip.
          RUGCHECK_TOOLS: "on"
        run: |
          set +e
          cg=keyless; if [ -n "$COINGECKO_API_KEY" ]; then cg=keyed; fi
          echo "CoinGecko: $cg"
          # --server-log keeps the booted server's own stdout/stderr: a kit's
          # "[price-feed] upstream unreachable: … → TimeoutError" line is the
          # only thing that separates a slow upstream from our own event loop,
          # and the runner otherwise drops the log once /health answers.
          node scripts/test-corpus.js --tier "$TIER" --concurrency 3 --json corpus-report.json --server-log server.log | tee corpus.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          tail -1 corpus.log
          exit 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corpus-report
          path: |
            corpus-report.json
            corpus.log
            server.log
          if-no-files-found: ignore

      # An open issue this check filed under a previous title gets the current
      # one, so the lookups below find it (scripts/adopt-issue-titles.js).
      - name: Adopt an open issue filed under a previous title
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/adopt-issue-titles.js

      - name: Page (open / update / close the issue)
        if: always()
        env:
          RESULT: ${{ steps.corpus.outputs.exit }}
        run: |
          TITLE="Scheduled check needs review: corpus"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$RESULT" != "0" ]; then
            FAILS=$(grep -E '^FAIL ' corpus.log | head -30 || true)
            # A run that produced no FAIL lines and still exited non-zero is the
            # HARNESS failing (a boot error, an upstream storm, nothing driven):
            # say so and carry the log tail, never an empty code block.
            if [ -z "$FAILS" ]; then FAILS="(no per-tool FAIL lines - the harness itself did not complete; log tail follows)
          $(tail -25 corpus.log)"; fi
            # Outside hosts ride along, named (the runner's note carries the
            # host a case targets), so a repeat offender is visible from the
            # issue and never mistaken for the failure that opened it.
            UPSTREAM=$(grep -E '^upstream ' corpus.log | head -30 || true)
            UPSTREAM_SECTION=""
            if [ -n "$UPSTREAM" ]; then UPSTREAM_SECTION="

          Outside hosts this run (reported, never fatal, listed so a repeat is visible):

          \`\`\`
          $UPSTREAM
          \`\`\`"; fi
            if [ -n "$OPEN" ]; then
              # The comment carries the cases too: a different case failing on
              # the second night is a second defect, not the first one persisting.
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
