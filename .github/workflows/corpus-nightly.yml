# Nightly correctness corpus, tiers 0 + 1: every tool driven with inputs other
# than its documented example on a FREE_MODE boot (no payment; the only key is the free
# CoinGecko Demo key, see the run step), asserting
# the answer is populated rather than merely shaped. Tier 0 (pure CPU) also runs
# on every push in deploy.yml; this run adds tier 1, the free public upstreams
# (SEC, openFDA, DefiLlama, Hyperliquid, CoinGecko demo, open-meteo, public RPCs,
# Kalshi), which are rate-limited and belong to a nightly cadence, not
# a per-push one. Costs nothing. Upstream failures are reported, never fatal; only
# OUR code failing (a hollow 200, a silent fallback, our own 4xx on a valid input,
# a 500) opens the issue. Heartbeat-style: one issue, closed on the next clean run.
name: Correctness corpus (nightly)

on:
  schedule:
    - cron: "17 5 * * *" # daily ~05:17 UTC
  workflow_dispatch:
    inputs:
      tier:
        description: "Tiers to run (0,1 default; 2 needs keys and spends)"
        default: "0,1"
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: corpus-nightly
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: ffmpeg (the media tools; ubuntu-latest does not ship it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1
      - name: Install
        # --ignore-scripts is the repo's supply-chain rule (no dependency
        # lifecycle scripts); better-sqlite3 is the one native module the
        # server needs, rebuilt explicitly (the first run booted nothing:
        # "Could not locate the bindings file", issue #1233).
        run: npm ci --ignore-scripts && npm rebuild better-sqlite3

      - name: Run the corpus (self-booted FREE_MODE server; only the free CoinGecko Demo key)
        id: corpus
        env:
          TIER: ${{ inputs.tier || '0,1' }}
          # The CoinGecko Demo key (free plan, spends nothing): keyless CoinGecko
          # from a shared GitHub egress IP rate-limited 13 of the 37 CoinGecko
          # cases on the first nightly (2026-09-06), so those tools were never
          # verified. With the key the server's own 25/min bucket is the bound
          # and the cases' shared `paceKey` clock keeps under it.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # Our Solana RPC, read-only. RugCheck stopped publishing topHolders
          # for every mint on 2026-09-19, so sol-token-holders/-report build
          # their table from getTokenLargestAccounts + one batched
          # getMultipleAccounts instead. Those cases declare
          # `requires: SOLANA_RPC_URL` and are reported SKIPPED, never passed,
          # while this is unset - so the corpus can never certify a table it
          # did not see. Four reads a night against a PAYG CU plan.
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          set +e
          # --server-log keeps the booted server's own stdout/stderr: a kit's
          # "[price-feed] upstream unreachable: … → TimeoutError" line is the
          # only thing that separates a slow upstream from our own event loop,
          # and the runner otherwise drops the log once /health answers.
          node scripts/test-corpus.js --tier "$TIER" --concurrency 3 --json corpus-report.json --server-log server.log | tee corpus.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          tail -1 corpus.log
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: corpus-report
          path: |
            corpus-report.json
            corpus.log
            server.log
          if-no-files-found: ignore

      - name: Page (open / update / close the issue)
        if: always()
        env:
          RESULT: ${{ steps.corpus.outputs.exit }}
        run: |
          TITLE="Correctness corpus FAILING"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$RESULT" != "0" ]; then
            FAILS=$(grep -E '^FAIL ' corpus.log | head -30 || true)
            # A run that produced no FAIL lines and still exited non-zero is the
            # HARNESS failing (a boot error, an upstream storm, nothing driven):
            # say so and carry the log tail, never an empty code block.
            if [ -z "$FAILS" ]; then FAILS="(no per-tool FAIL lines - the harness itself did not complete; log tail follows)
          $(tail -25 corpus.log)"; fi
            BODY="The nightly correctness corpus found tools answering wrong on a second input. Run: $RUN

          Only OUR code failing reaches here: a hollow 200, a silent fallback, our own 4xx on a valid input, or a 500. Upstream 502/503/504/429 are reported in the log and never open this issue.

          \`\`\`
          $FAILS
          \`\`\`

          Reproduce locally: \`node scripts/test-corpus.js --only <slug>\` (boots its own FREE_MODE server). Decide first whether the tool or the expectation is wrong (scripts/corpus/README.md)."
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still failing at $(date -u +%FT%TZ). Run: $RUN"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the corpus passed at $(date -u +%FT%TZ). Run: $RUN"
          fi

  # The live model/price guard, nightly. deploy.yml runs it on every push, but a
  # vendor can add a dearer endpoint or reprice a model on a quiet day, and the
  # speech and MODEL_COST rows are the worst-case bound every LLM/TTS price sits
  # under - a row that goes stale between pushes is a tool selling under cost until
  # somebody pushes. Found 2026-09-18: Kokoro's dearest endpoint had been 6.5x our
  # row for some time and only an audit noticed. Network-only, no key, spends nothing.
  model-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install
        run: npm ci --ignore-scripts && npm rebuild better-sqlite3
      - name: Live catalog guard (ids, prices, speech cost rows)
        id: guard
        run: |
          set +e
          node scripts/test-gateway-model-ids.js 2>&1 | tee guard.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Page (open / update / close the issue)
        if: always()
        env:
          RESULT: ${{ steps.guard.outputs.exit }}
        run: |
          TITLE="Gateway model/price guard FAILING"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$RESULT" != "0" ]; then
            FAILS=$(grep -E '^FAIL ' guard.log | head -30 || true)
            if [ -z "$FAILS" ]; then FAILS="(no FAIL lines - the guard itself did not complete; log tail follows)
          $(tail -25 guard.log)"; fi
            BODY="The nightly live-catalog guard failed: an advertised, ranked, fallback or speech id is gone upstream, a MODEL_COST or speech costPerChar row is under its dearest live price, or a ranked model expires within 14 days. A stale cost row is a tool selling under its worst case. Run: $RUN

          \`\`\`
          $FAILS
          \`\`\`

          Reproduce locally: \`node scripts/test-gateway-model-ids.js\` (network only, no key)."
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still failing at $(date -u +%FT%TZ). Run: $RUN"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the guard passed at $(date -u +%FT%TZ). Run: $RUN"
          fi
