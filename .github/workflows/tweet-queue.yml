# Tweet queue: posts APPROVED copy on a schedule with no local session involved.
#
# REPLACED BY THE SERVER QUEUE once that is enabled. src/tweet-queue.js posts
# the same JSON from the Railway variable TWEET_QUEUE on the hour, because
# GitHub delivers this schedule sparsely (slots posted hours late or aged out).
# At cutover the operator disables this workflow BEFORE the server starts
# posting:   gh workflow disable tweet-queue.yml
# so exactly one poster runs. The two keep separate posted-id records (the
# Actions cache here, /data on the server), so running both would leave only
# X's duplicate-text refusal between them. The server's FIRST run (no state
# file) posts nothing already due, since this workflow may have posted it; set
# TWEET_QUEUE_POST_AFTER (ISO time) on Railway to move that line. Kept, not
# deleted, as the fallback:
# re-enable it (gh workflow enable) only after TWEET_QUEUE_POSTING=off is set
# on Railway. The server refuses items that carry a card (its operator read
# lists them by id); post those through announce.yml with its card input.
#
# The queue is the repo SECRET `TWEET_QUEUE`: a JSON array of
# {id, when: "YYYY-MM-DDTHH:00:00Z", text, card?}. A secret is not a commit,
# so tweet copy never enters the tree (the standing rule); it cannot be read
# back through the API or the UI by anyone, it never reaches a fork or a
# pull_request run, and only a repo admin can replace it. The run log prints
# the item id and hour, never the text.
#
# Each run posts the OLDEST item that is due (its `when` is in the past, within
# the catch-up window) and not yet recorded as posted. GitHub delivers cron
# late and sometimes skips an hour (measured on the heartbeat: 2-12 h gaps),
# and the first version keyed on the current hour alone, so a skipped hour
# silently dropped its item (the 19:00Z slot on 2026-09-14). The posted-id
# record rides the Actions cache (restore by prefix, save under the run id),
# which needs no token beyond GITHUB_TOKEN; X's 403 on duplicate text is the
# belt if the record is ever lost. `hour` on dispatch pins one slot instead.
#
# Every text in the variable was approved verbatim by the operator before it
# was loaded; this workflow never edits copy and never invents a post.
# Load or replace the queue with:  gh secret set TWEET_QUEUE < queue.json  (48 KB max)
name: Tweet queue

on:
  schedule:
    - cron: "6 * * * *"
  # A NEW schedule is picked up late: every scheduled workflow this repo added
  # fired its first run the next day (corpus-nightly, verify-published-packages,
  # tempo-subscription-canary, measured 2026-09-14), and on the day this file
  # landed no cron fired for hours. So the queue also runs when a workflow that
  # is already firing completes. The catch-up rule makes bunched runs harmless:
  # each posts the oldest due item not yet recorded, or nothing.
  workflow_run:
    workflows: ["Heartbeat", "Tempo MPP volume", "Paid-path canary"]
    types: [completed]
  workflow_dispatch:
    inputs:
      hour:
        description: "UTC hour bucket to post, e.g. 2026-09-15T13 (default: the current hour)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: tweet-queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore the posted-id record
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/tweet-queue-posted.json
          key: tweet-queue-posted-${{ github.run_id }}
          restore-keys: |
            tweet-queue-posted-
      - name: Pick the oldest due item not yet posted
        id: pick
        env:
          TWEET_QUEUE: ${{ secrets.TWEET_QUEUE }}
          IN_HOUR: ${{ github.event.inputs.hour }}
          CATCHUP_HOURS: "12"
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const raw = process.env.TWEET_QUEUE || "[]";
          let q; try { q = JSON.parse(raw); } catch { console.error("TWEET_QUEUE is not JSON"); process.exit(1); }
          if (!Array.isArray(q)) { console.error("TWEET_QUEUE is not an array"); process.exit(1); }
          let posted = []; try { posted = JSON.parse(fs.readFileSync("/tmp/tweet-queue-posted.json", "utf8")); } catch {}
          if (!Array.isArray(posted)) posted = [];
          const out = fs.createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
          const valid = (x) => x && typeof x.when === "string" && typeof x.text === "string" && x.text.trim() && typeof x.id === "string";
          let due;
          if (process.env.IN_HOUR) {
            const bucket = process.env.IN_HOUR.slice(0, 13);
            due = q.filter((x) => valid(x) && x.when.slice(0, 13) === bucket);
          } else {
            const now = Date.now(); const window = Number(process.env.CATCHUP_HOURS) * 3600e3;
            due = q.filter((x) => valid(x) && !posted.includes(x.id)).map((x) => ({ x, t: Date.parse(x.when) }))
              .filter(({ t }) => Number.isFinite(t) && t <= now && now - t <= window).sort((a, b) => a.t - b.t).map(({ x }) => x);
          }
          if (!due.length) { console.log(`nothing due (queue ${q.length} items, ${posted.length} recorded posted)`); out.write("due=false\n"); out.end(); process.exit(0); }
          const item = due[0];
          if (due.length > 1) console.log(`${due.length} due; posting the oldest, ${item.id}`);
          fs.writeFileSync("/tmp/tweet-text.txt", item.text);
          const card = ["proof", "bestsellers", "robinhood"].includes(item.card) ? item.card : "";
          console.log(`due: ${item.id} (${item.when})${card ? ` card=${card}` : ""}`);
          out.write(`due=true\nid=${item.id}\ncard=${card}\n`); out.end();
          JS
      - name: Set up node deps for the card render
        if: steps.pick.outputs.due == 'true' && steps.pick.outputs.card != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install deps + Chromium (card render)
        if: steps.pick.outputs.due == 'true' && steps.pick.outputs.card != ''
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Render the proof receipt card from live /api/proof
        if: steps.pick.outputs.due == 'true' && steps.pick.outputs.card == 'proof'
        run: |
          curl -fsSL --max-time 30 https://agent402.tools/api/proof -o /tmp/proof.json
          node scripts/proof-card.js --from /tmp/proof.json --out /tmp/tweet-card.png
      - name: Render the Robinhood card from live /api/revenue
        if: steps.pick.outputs.due == 'true' && steps.pick.outputs.card == 'robinhood'
        run: |
          curl -fsSL --max-time 30 https://agent402.tools/api/revenue -o /tmp/revenue.json
          node scripts/robinhood-card.js --from /tmp/revenue.json --out /tmp/tweet-card.png
      - name: Post
        if: steps.pick.outputs.due == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          ARGS=(--file /tmp/tweet-text.txt --force)
          [ -f /tmp/tweet-card.png ] && ARGS+=(--media /tmp/tweet-card.png)
          echo "Posting ${{ steps.pick.outputs.id }}"
          # A 403 "duplicate content" means this exact text is already on X
          # (a slot posted by dispatch before the record existed, or a record
          # lost to cache eviction): count it as posted and move on, so one
          # item can never wedge the queue.
          set +e
          node scripts/tweet.js "${ARGS[@]}" 2> /tmp/post.err
          CODE=$?
          set -e
          cat /tmp/post.err >&2
          if [ "$CODE" -ne 0 ]; then
            if grep -qi "duplicate content" /tmp/post.err; then echo "already on X (duplicate refused) - recording as posted"; else exit "$CODE"; fi
          fi
      - name: Record the posted id
        if: steps.pick.outputs.due == 'true'
        env:
          POSTED_ID: ${{ steps.pick.outputs.id }}
        run: |
          node -e '
          const fs = require("node:fs"); let p = []; try { p = JSON.parse(fs.readFileSync("/tmp/tweet-queue-posted.json", "utf8")); } catch {}
          if (!Array.isArray(p)) p = []; if (!p.includes(process.env.POSTED_ID)) p.push(process.env.POSTED_ID);
          fs.writeFileSync("/tmp/tweet-queue-posted.json", JSON.stringify(p.slice(-500)));'
      - name: Save the posted-id record
        if: steps.pick.outputs.due == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/tweet-queue-posted.json
          key: tweet-queue-posted-${{ github.run_id }}
