name: Mint Bazaar rows (buy + verify the unlisted tools)

# A Coinbase Bazaar row is minted by a SETTLED PAYMENT on the canonical URL,
# never by listing a tool - so a freshly shipped endpoint is invisible to every
# Bazaar-driven discovery surface until somebody actually buys it. Measured
# 2026-09-13: 584 of 596 priced endpoints had rows; twelve did not, all recent.
#
# This buys each one once from the CI burner AND ASSERTS THE ANSWER, so it is
# also the correctness pass the paid canaries do not give (they prove
# settlement, not that the tool answered - a hollow 200 passes every shape
# guard we own).
#
# Dispatch-only, `spending` environment, so each run takes operator approval.
# Dry by default: `live: true` is what sends money. The two route-execute tiers
# (which also spend the SPENDING wallet at an outside seller)
# need `expensive: true` on top.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Actually buy (false = price the run and stop)"
        type: boolean
        default: false
      expensive:
        description: "Also buy route-execute-pro and -max"
        type: boolean
        default: false
      only:
        description: "Comma-separated slugs to limit the run (blank = all)"
        default: ""
        required: false

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-24.04
    environment: spending
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the PINNED client tree (x402 client + viem)
        run: |
          mkdir -p /tmp/mint && cp "$GITHUB_WORKSPACE"/scripts/agentkit-live/package.json "$GITHUB_WORKSPACE"/scripts/agentkit-live/package-lock.json /tmp/mint/
          cp "$GITHUB_WORKSPACE"/scripts/mint-bazaar-rows.js /tmp/mint/
          cd /tmp/mint && npm ci --ignore-scripts --no-audit --no-fund
      - name: Buy each unlisted tool once and verify what came back
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
          MINT_LIVE: ${{ inputs.live }}
          MINT_EXPENSIVE: ${{ inputs.expensive }}
          MINT_ONLY: ${{ inputs.only }}
        run: |
          [ -n "$BURNER_KEY" ] || { echo "::error::BURNER_KEY secret missing"; exit 1; }
          echo "::add-mask::$BURNER_KEY"
          [ -n "$POW_SECRET" ] && echo "::add-mask::$POW_SECRET"
          ARGS=""
          [ "$MINT_LIVE" = "true" ] && ARGS="$ARGS --live"
          [ "$MINT_EXPENSIVE" = "true" ] && ARGS="$ARGS --expensive"
          [ -n "$MINT_ONLY" ] && ARGS="$ARGS --only $MINT_ONLY"
          cd /tmp/mint && env -i PATH="$PATH" HOME="$HOME" \
            BURNER_KEY="$BURNER_KEY" POW_SECRET="${POW_SECRET}" \
            node mint-bazaar-rows.js $ARGS
