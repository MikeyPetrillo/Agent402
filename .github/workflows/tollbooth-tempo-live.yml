name: Tollbooth Tempo live proof

# Dispatch-only. Boots agent402-tollbooth 0.9.0's Tempo rail on the runner with
# the REAL Tempo relay (TEMPO_API_KEY secret, mpp:write scope) paying OUR payTo,
# and pays it one $0.001 USDC.e from the canary burner with a stock mppx tempo
# client. Proves the dependency-free relay wire (validate before the handler,
# broadcast after, Payment-Receipt back) against the live relay - the offline
# suite proves it only against a stub. Needs repo secret TEMPO_API_KEY (the
# Railway value) - the job fails loudly without it rather than skipping.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Boot a tollbooth on Tempo and pay it once
        env:
          TEMPO_API_KEY: ${{ secrets.TEMPO_API_KEY }}
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          # Our public Tempo payTo (WALLET_ADDRESS on Railway); a repo variable overrides it.
          RECIPIENT: ${{ vars.TEMPO_RECIPIENT_ADDRESS || '0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0' }}
        run: |
          [ -n "$TEMPO_API_KEY" ] || { echo "::error::TEMPO_API_KEY secret missing - add the Railway TEMPO_API_KEY value as an Actions secret to run this proof"; exit 1; }
          [ -n "$BURNER_KEY" ] || { echo "::error::BURNER_KEY secret missing"; exit 1; }
          echo "::add-mask::$BURNER_KEY"; echo "::add-mask::$TEMPO_API_KEY"
          # mppSecret binds the tempo challenge ids this gate mints; they only
          # have to verify inside this one process, so a per-process random key
          # is exactly right (PoW is off, so nothing else is keyed).
          node --input-type=module -e '
          import { randomBytes } from "node:crypto";
          import express from "express";
          import { createTollbooth } from "./tollbooth/index.js";
          import { Mppx, tempo } from "mppx/client";
          import { Challenge, Receipt } from "mppx";
          import { privateKeyToAccount } from "viem/accounts";
          const app = express();
          const gate = createTollbooth({ price: "$0.001", mode: "all", pow: false, mppSecret: randomBytes(32).toString("hex"), resourceBaseUrl: "https://tollbooth-live-proof.agent402.tools", tempo: { apiKey: process.env.TEMPO_API_KEY, recipient: process.env.RECIPIENT } });
          app.use(gate);
          app.get("/paid", (req, res) => res.json({ ok: true }));
          const server = app.listen(0, "127.0.0.1", async () => {
            const url = `http://127.0.0.1:${server.address().port}/paid`;
            const r402 = await fetch(url); const www = r402.headers.get("www-authenticate") || "";
            if (r402.status !== 402 || !/method="tempo"/.test(www)) { console.error("no tempo challenge", r402.status); process.exit(1); }
            const key = process.env.BURNER_KEY.startsWith("0x") ? process.env.BURNER_KEY : "0x" + process.env.BURNER_KEY;
            const client = Mppx.create({ methods: [tempo.charge({ account: privateKeyToAccount(key), autoSwap: true })], polyfill: false });
            const ch = Challenge.fromHeadersList(new Headers({ "WWW-Authenticate": www })).find((c) => c.method === "tempo");
            const cred = await client.createCredential(new Response(null, { status: 402, headers: { "WWW-Authenticate": Challenge.serialize(ch) } }));
            const paid = await fetch(url, { headers: { Authorization: cred } });
            const body = await paid.json().catch(() => ({}));
            const rc = paid.headers.get("payment-receipt");
            // On a refusal the gate 402 carries an RFC 9457 `problem` (code only, no relay body) and
            // X-Tollbooth-Error names the rail step - print both so a failed proof is diagnosable from the log.
            console.log("paid:", paid.status, JSON.stringify(body).slice(0, 600), "X-Tollbooth-Paid:", paid.headers.get("x-tollbooth-paid"), "X-Tollbooth-Error:", paid.headers.get("x-tollbooth-error"));
            if (rc) { const rec = Receipt.deserialize(rc); console.log("receipt:", rec.method, rec.status, "https://explore.tempo.xyz/tx/" + rec.reference); }
            console.log("stats:", JSON.stringify(gate.stats()));
            server.close();
            process.exit(paid.status === 200 && rc && gate.stats().tempoPaid === 1 ? 0 : 1);
          });'
