# Always-on secret scanning. Unlike deploy.yml (marker-gated), this runs on
# EVERY push to a tracked branch and EVERY pull request — a committed
# credential should never depend on remembering a marker. gitleaks scans the
# working tree against its default high-signal ruleset (OpenAI sk- keys,
# GitHub/AWS tokens, private keys, mnemonics, ...) plus the repo allowlist in
# .gitleaks.toml, which suppresses this repo's structural false positives
# (public on-chain addresses, the demo JWT, test canaries). Only a genuinely
# new secret fails the job.
name: secret-scan

on:
  push:
    branches: ["claude/sweet-brown-i99jl3", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so gitleaks can scan every reachable commit, not just
          # the working tree (audit R-08 — the tree-only scan missed a secret
          # that lived only in history).
          fetch-depth: 0
      - name: Scan for committed secrets (gitleaks, pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          FN="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSL --fail -o "/tmp/${FN}" "${BASE}/${FN}"
          curl -sSL --fail -o /tmp/gitleaks_checksums.txt "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          ( cd /tmp && grep " ${FN}\$" gitleaks_checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${FN}" -C /tmp gitleaks
          # HISTORY scan (--log-opts=--all): fails the job on any finding across
          # every reachable commit that is not allowlisted in .gitleaks.toml.
          # --redact keeps any matched value out of the public job log.
          /tmp/gitleaks detect --config .gitleaks.toml --redact --log-opts="--all" --verbose
          # WORKING-TREE scan (--no-git): also catch an untracked/gitignored
          # secret sitting on disk (e.g. a dev's local .env) that history can't
          # see. Belt-and-suspenders alongside the history scan above.
          /tmp/gitleaks detect --no-git --config .gitleaks.toml --redact --verbose
      - name: Canary coverage — a planted secret in a scanned path MUST be caught (audit F08)
        run: |
          set -euo pipefail
          # Prove docs/ (previously blanket-excluded) is now actually scanned: a
          # planted, detectable secret there must FAIL gitleaks. If gitleaks exits
          # 0 (no leak), the path is wrongly excluded and this step fails.
          CANARY="docs/__gitleaks_canary_${GITHUB_RUN_ID}.md"
          printf 'burner_private_key = "0x%s"\n' "$(printf 'a%.0s' $(seq 1 64))" > "$CANARY"
          if /tmp/gitleaks detect --no-git --config .gitleaks.toml --redact --source "$CANARY" >/dev/null 2>&1; then
            rm -f "$CANARY"
            echo "FAIL: a planted secret in $CANARY was NOT detected — docs/ is wrongly excluded from scanning."
            exit 1
          fi
          rm -f "$CANARY"
          echo "ok: planted canary in a docs/ path was detected — the path is genuinely scanned."
