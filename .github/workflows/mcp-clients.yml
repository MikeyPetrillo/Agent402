# The hosted MCP connector read by an independent client, every 6 hours: the
# reference @modelcontextprotocol/sdk Client over Streamable HTTP initializes
# against https://agent402.tools/mcp, lists the tools, and makes a handful of
# free calls (scripts/mcp-client-check.js); then the SDK v2 Client does the same
# on the 2026-07-28 revision (server/discover, no initialize). Our own harness posts raw JSON-RPC;
# a real client validates schemas and answer shapes, so this is the view a
# host gets, and the one a drift in names, descriptions or shapes breaks first.
#
# Schedule and dispatch only, never on a push: the CI lane runs the same check
# against a local boot on every push (scripts/test-mcp-client-check.js). A
# failure opens (or updates) ONE issue with the check lines and the next clean
# run closes it. No secrets: the check holds no wallet, the free tool runs on
# the free tier, the paid call carries no credential. Spends nothing.
name: MCP connector independent client (every 6 hours)

on:
  schedule:
    - cron: "41 */6 * * *" # every 6 hours, at :41
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mcp-clients
  cancel-in-progress: false

jobs:
  mcp-client-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies (secretless)
        # Dependency lifecycle scripts are skipped; the check needs only the
        # MCP SDK, and this workflow carries no secret at any scope.
        env:
          UPSTREAM_COSTS_JSON: ""
        run: npm ci --ignore-scripts
      - name: Independent client check against production
        id: check
        env:
          MCP_CHECK_TARGET: prod
          MCP_CHECK_OUT: mcp-client-check.json
        run: |
          set +e
          node scripts/mcp-client-check.js 2>&1 | tee check.log
          code=${PIPESTATUS[0]}
          MCP_CHECK_PROTOCOL=2026-07-28 MCP_CHECK_OUT=mcp-client-check-2026-07-28.json node scripts/mcp-client-check.js 2>&1 | tee -a check.log
          modern=${PIPESTATUS[0]}
          [ "$code" = "0" ] && code=$modern
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      # An open issue this check filed under a previous title gets the current
      # one, so the lookups below find it (scripts/adopt-issue-titles.js).
      - name: Adopt an open issue filed under a previous title
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/adopt-issue-titles.js

      - name: Page (open / update / close the issue)
        if: always()
        env:
          RESULT: ${{ steps.check.outputs.exit }}
        run: |
          TITLE="Scheduled check needs review: mcp-client"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          find_issue() { gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$1\"" --json number,title --jq "[.[] | select(.title == \"$1\")][0].number // empty"; }
          OPEN=$(find_issue "$TITLE")
          if [ "$RESULT" != "0" ]; then
            LINES=$(grep -E '^(ok|FAIL) - ' check.log 2>/dev/null | head -40 || true)
            if [ -z "$LINES" ]; then LINES="(no check lines: the client could not start; log tail follows)
          $(tail -25 check.log 2>/dev/null)"; fi
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
