name: Paid-path canary

# Once a day, make ONE real x402 USDC purchase from production to prove that
# *buying* still settles end-to-end — the heartbeat only exercises the free
# proof-of-work path, so a paywall/facilitator/settlement regression would go
# unnoticed. Repeated failure opens a GitHub issue; recovery closes it.
# Cost: ~$0.001/day of dust from the test burner.
on:
  schedule:
    # THREE attempts, not one. GitHub delivers scheduled workflows on a
    # best-effort queue, and for this workflow it has been neither punctual nor
    # reliable: measured deliveries of the single 13:17 cron arrived at 15:27
    # and 15:21 (two hours late), one arrived at 14:39 and was CANCELLED, and
    # one never arrived at all. A daily proof that buying works is not a proof
    # of anything if it silently skips a day, and the gap is invisible - a
    # missing run looks exactly like a quiet day on the revenue page.
    #
    # The `gate` job below makes the extra attempts free: whichever lands first
    # does the buy, the others see a recent success and stop before spending.
    - cron: "17 13 * * *"
    - cron: "17 17 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # Decide whether this attempt should spend anything. A JOB, not a step: a
  # step-level `if` would have to be repeated on every step below, and the one
  # that got forgotten would buy anyway. The gate is the only place that can be
  # forgotten, and it fails toward RUNNING (see below), which is the safe
  # direction for a monitor.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - name: Has a canary already proven buying today?
        id: fresh
        if: github.event_name == 'schedule'
        env:
          TARGET_URL: https://agent402.tools
        run: |
          set -euo pipefail
          # Ask production when a canary last actually BOUGHT. The previous
          # version asked GitHub when this workflow last concluded green, and a
          # run whose gate SKIPS the buy also concludes green - so every skip
          # refreshed the timestamp the next gate reads, and the gate ratcheted
          # itself shut. Measured: the gate shipped 2026-08-02 and not one
          # SCHEDULED run bought after it. Every real purchase from then on came
          # from a manual dispatch, which bypasses this step entirely. The
          # workflow reported success the whole time, because skipping is a
          # success; only /status noticed, by reporting the settlement component
          # stale, which is the alarm that survives this class of bug.
          #
          # The settlement observation is the honest signal: it is written ONLY
          # by a canary that ran, in the "Record settlement on /status" step
          # below, and it is the same fact the public page reports. Gate and
          # page can no longer disagree.
          SNAP=$(curl -sf --max-time 20 "$TARGET_URL/api/status" || true)
          if [ -z "$SNAP" ]; then
            echo "status unreachable - proceeding with the buy (a gate that cannot check must not block)"
            exit 0
          fi
          # `|| echo none` on both: jq exits 5 on a body that is not JSON (an
          # error page, an interstitial, a truncated response), and under
          # `set -e` that would fail this step, fail the gate job, and - see the
          # canary job's `if` below - stop the monitor because its own guard
          # broke. Every parse failure lands on the "no observation, so buy"
          # path instead. This step cannot fail.
          AGE=$(printf '%s' "$SNAP" | jq -r '(.components[]? | select(.key=="settlement") | .current.ageMs) // "none"' 2>/dev/null || echo none)
          STATE=$(printf '%s' "$SNAP" | jq -r '(.components[]? | select(.key=="settlement") | .current.state) // "none"' 2>/dev/null || echo none)
          if [ "$AGE" = "none" ] || [ "$AGE" = "null" ]; then
            echo "no settlement observation on record - proceeding with the buy"
            exit 0
          fi
          echo "last proven purchase: ${AGE}ms ago (state=$STATE)"
          # 20h, not 24h: deliveries drift by hours, and a 24h window would let
          # a late run suppress the next day's on-time one, quietly halving the
          # cadence instead of protecting it.
          #
          # state must be operational, not merely fresh: a recent observation
          # that recorded a FAILED purchase is not proof that buying works, and
          # suppressing the next attempt on the strength of it would turn the
          # three-attempt design into one attempt to fail per day.
          if [ "$STATE" = "operational" ] && [ "$AGE" -lt 72000000 ]; then
            echo "a real purchase settled within 20h - skipping this redundant attempt (not a failure)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "no proven purchase in the last 20h - this attempt will buy"
          fi

  canary:
    needs: gate
    # Runs unless the gate positively said skip. An errored or skipped gate
    # leaves `skip` empty and the canary RUNS - a monitor that silently stops
    # monitoring because its own guard broke is the failure this whole change
    # exists to remove.
    #
    # `!cancelled()` is what makes that comment TRUE rather than merely
    # intended. A job-level `if` with no status check function still carries
    # the implicit success() on `needs`, so a FAILED gate would have skipped
    # this job - the opposite of what the comment claimed, and never verified.
    # A status function overrides that implicit check. Not always(): a
    # cancelled run should stay cancelled, not go spend money.
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Wallet/pow secrets are NOT at job scope (audit R-07): job-scope env is in
    # the environment of EVERY step, including the dependency install, where a
    # malicious package lifecycle script could read them. They are scoped to the
    # buy step only. GH_TOKEN (github.token, issue management) and the
    # non-secret TARGET_URL stay job-wide.
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_URL: https://agent402.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install x402 client
        # No wallet secrets are in scope for this step (they live on the buy
        # step), and --ignore-scripts blocks dependency lifecycle scripts
        # entirely (audit R-07). EVM/SVM @x402/* pinned to the server's
        # protocol version (src/payments.js runs 2.16) — an unpinned install
        # pulled 2.17 and protocol skew is one suspect for SVM settle failures.
        # @x402/stellar is pinned separately to latest 2.21 (createPaymentPayload
        # is byte-identical to 2.17; facilitator settle path is not — keep the
        # buyer on current). viem / @solana/kit / @stellar/stellar-sdk are
        # pinned to the repo lock's resolved versions (no floating installs in
        # a paid job) - READ FROM THE LOCK at run time, never hand-typed: the
        # hand-typed viem@2.52.2 here was the lock's version on 2026-07-18 and
        # silently stayed after the lock moved to 2.55.8 for mppx's Tempo
        # client, so this step downgraded viem under mppx and the mpp-tempo leg
        # died deterministically with "Cannot convert undefined to a BigInt"
        # (2026-08-18: two runs, both attempts) while the standalone Tempo
        # canary - plain `npm ci` - settled the identical challenge fine.
        run: |
          npm ci --ignore-scripts
          LOCKV() { node -p "require('./package-lock.json').packages['node_modules/$1'].version"; }
          VIEM=$(LOCKV viem); STELLAR=$(LOCKV @stellar/stellar-sdk); SOLKIT=$(LOCKV @solana/kit)
          echo "lock-pinned: viem@$VIEM @stellar/stellar-sdk@$STELLAR @solana/kit@$SOLKIT"
          npm install --no-save --ignore-scripts @x402/fetch@2.22.0 @x402/core@2.22.0 @x402/evm@2.22.0 @x402/svm@2.22.0 @x402/stellar@2.21.0 "@stellar/stellar-sdk@$STELLAR" "@solana/kit@$SOLKIT" "viem@$VIEM"
          echo "installed viem: $(node -p "require('viem/package.json').version") mppx: $(node -p "require('./node_modules/mppx/package.json').version")"
      - name: Buy one tool from production (real USDC)
        id: canary
        # Wallet/pow secrets scoped to THIS step only (audit R-07).
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          SOLANA_BURNER_KEY: ${{ secrets.SOLANA_BURNER_KEY }}
          STELLAR_BURNER_SECRET: ${{ secrets.STELLAR_BURNER_SECRET }}
          ALGORAND_BURNER_MNEMONIC: ${{ secrets.ALGORAND_BURNER_MNEMONIC }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
        run: |
          if [ -z "$BURNER_KEY" ]; then
            echo "No BURNER_KEY secret — canary cannot run (configure a funded test wallet)."
            echo "result=noconfig" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::add-mask::$BURNER_KEY"
          # Optional Solana leg — buys the $0.05 decode-blob skill pack paying
          # USDC on Solana (sized to clear explorer dust filters; deterministic,
          # pure-CPU, no upstream cost). Informational (warns, never pages);
          # silently skipped when the SOLANA_BURNER_KEY secret is unset.
          [ -n "$SOLANA_BURNER_KEY" ] && echo "::add-mask::$SOLANA_BURNER_KEY"
          if node scripts/paid-canary.js; then echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            CODE=$?
            # Exit 3 = the script PROVED underfunding (every failed leg a clean
            # 402, at least one real settlement this run, live Base balance
            # below the cheapest failed leg). Exit 4 = the run was GREEN but
            # the burner is below the low-water mark - page for a top-up
            # before the next run starves (2026-07-27: it emptied silently
            # and the empty-wallet run paged as an outage). Exit 5 =
            # tools settled but one or more chain rail legs failed
            # (2026-08-10: Stellar alone failed while 30/30 tools settled —
            # painting that as a buying outage on /status was the false
            # alarm). Anything else is a real buying failure.
            if [ "$CODE" = "3" ]; then echo "result=underfunded" >> "$GITHUB_OUTPUT"
            elif [ "$CODE" = "4" ]; then echo "result=ok-low" >> "$GITHUB_OUTPUT"
            elif [ "$CODE" = "5" ]; then echo "result=partial-rail" >> "$GITHUB_OUTPUT"
            else echo "result=fail" >> "$GITHUB_OUTPUT"; fi
          fi

      # Feed the /status "settlement" component. Deliberately a SEPARATE step
      # from the buy above: that step holds the wallet keys, and widening its
      # environment to carry the operator token too would undo the per-step
      # secret scoping from audit R-07.
      #
      # A "noconfig" run posts NOTHING. The canary never actually bought
      # anything in that case, so there is no observation to record, and
      # inventing one either way is exactly what /status refuses to do.
      - name: Record settlement on /status
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          RESULT: ${{ steps.canary.outputs.result }}
          RAILS: ${{ steps.canary.outputs.rails }}
          RAIL_STATUS: ${{ steps.canary.outputs.rail_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$OP_TOKEN" ] || { echo "no operator token — skipping status record"; exit 0; }
          case "$RESULT" in
            ok)   OK=true;  DETAIL="" ;;
            # ok-low = every leg green, burner just needs a top-up soon.
            ok-low) OK=true; DETAIL="" ;;
            fail) OK=false; DETAIL="paid canary could not complete a real USDC purchase" ;;
            # Underfunded = the run PROVED settlement works (real settles
            # happened) and proved the failures were its own empty wallet.
            # Recording that as an outage put "outage" on the public page while
            # buyers were settling fine (2026-07-27). It is an ok observation
            # with the funding named; the funding issue below still pages us.
            underfunded) OK=true; DETAIL="settlement proven; canary burner needs a top-up (funding, not an outage)" ;;
            # Partial-rail = tools settled (buying works) but one or more
            # chain rail legs failed. Same /status doctrine as underfunded:
            # settlement is proven, so ok=true with the failed rail named.
            # The rail-scoped issue below still pages us (2026-08-10).
            partial-rail)
              OK=true
              if [ -n "$RAILS" ]; then
                DETAIL="settlement proven; rail fail: ${RAILS} (not a buying outage)"
              else
                DETAIL="settlement proven; one or more payment rails failed (not a buying outage — see canary run)"
              fi
              ;;
            *)    echo "canary result '$RESULT' — nothing was bought, so no observation to record"; exit 0 ;;
          esac
          # status-store caps detail at 500 chars.
          DETAIL=$(printf '%s' "$DETAIL" | cut -c1-500)
          # Per-rail components (rail_base, rail_stellar, ...), derived from the
          # canary's own rail_status output - a JSON array of {key, ok, detail}
          # for every rail actually attempted this run (a skipped leg, e.g. no
          # burner key configured, is simply absent, never a false "down").
          # Folded into the SAME POST as settlement above: same source data,
          # same operator token, no new secret exposure.
          RAIL_COMPONENTS=$(printf '%s' "${RAIL_STATUS:-[]}" | jq -c '
            if type == "array" then
              (map({("rail_" + .key): {ok: .ok, detail: (.detail // null)}}) | add) // {}
            else {} end')
          BODY=$(jq -nc --arg u "$RUN_URL" --arg d "$DETAIL" --argjson ok "$OK" --argjson rails "$RAIL_COMPONENTS" \
            '{source:"paid-canary", ts:(now*1000|floor), url:$u,
              components:({"settlement":{ok:$ok, detail:(if $d=="" then null else $d end)}} + $rails)}')
          curl -sf --max-time 20 -X POST "$TARGET_URL/api/status/probe" \
            -H "Content-Type: application/json" -H "X-Operator-Token: $OP_TOKEN" \
            -d "$BODY" >/dev/null && echo "settlement + rails recorded (ok=$OK, rails=$(printf '%s' "$RAIL_COMPONENTS" | jq -c 'keys'))" || echo "settlement not recorded (prod unreachable)"

      - name: Alert on failure / clear on recovery
        env:
          RESULT: ${{ steps.canary.outputs.result }}
          RAILS: ${{ steps.canary.outputs.rails }}
        run: |
          TITLE="Paid-path canary FAILED"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          # Funding starvation gets its own issue and CLOSES the outage-class
          # one: "buying may be broken" must not stay open when the run proved
          # buying works and only our wallet is empty.
          if [ "$RESULT" = "underfunded" ]; then
            FTITLE="Canary burner EMPTY (Base)"
            FOPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$FTITLE\"" --json number --jq '.[0].number // empty')
            if [ -z "$FOPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$FTITLE" --body "The paid canary's Base burner is out of USDC — the run settled real purchases on the funded rails and every Base failure was a clean 402 with the live balance below the cheapest leg, so this is FUNDING, not an outage. Top up the burner (see the run log for the address), then dispatch paid-canary.yml; a green run closes this. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              gh issue comment "$FOPEN" --repo "$GITHUB_REPOSITORY" --body "Still empty at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            [ -n "$OPEN" ] && gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Reclassified: the failure is canary-wallet funding, not a broken paid path — settlement was proven in the same run. Tracking in the funding issue."
            exit 0
          fi
          # Partial rail failure: buying is proven; do NOT keep/open the
          # systemic "Paid-path canary FAILED" issue (that copy claims buying
          # may be broken). Page a rail-scoped issue instead (2026-08-10).
          if [ "$RESULT" = "partial-rail" ]; then
            RTITLE="Paid canary rail FAILED"
            ROPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$RTITLE\"" --json number --jq '.[0].number // empty')
            RAIL_LIST="${RAILS:-see run log}"
            RBODY="The daily paid canary settled real USDC tool purchases, but one or more chain rail legs failed ($RAIL_LIST). This is a per-rail payment proof failure, not a buying outage — /status records settlement as proven with the failed rail named.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Check the named rail's burner balance/trustline and its facilitator; a fully green canary closes this."
            if [ -z "$ROPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$RTITLE" --body "$RBODY"
            else
              gh issue comment "$ROPEN" --repo "$GITHUB_REPOSITORY" --body "Still failing ($RAIL_LIST) at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            [ -n "$OPEN" ] && gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Reclassified: tools settled this run — failure is rail-scoped ($RAIL_LIST), not a broken paid path. Tracking in the rail issue."
            exit 1
          fi
          if [ "$RESULT" = "ok-low" ]; then
            LTITLE="Canary burner LOW"
            LOPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$LTITLE\"" --json number --jq '.[0].number // empty')
            if [ -z "$LOPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$LTITLE" --body "The paid canary ran fully green but one or more burner balances are below their low-water marks - the run log names each low chain and balance (the CANARY BURNER LOW line). Top up before it empties - an empty wallet fails the whole run. A green run with a healthy balance closes this. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              gh issue comment "$LOPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          fi
          if [ "$RESULT" = "ok" ]; then
            FTITLE="Canary burner EMPTY (Base)"
            FOPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$FTITLE\"" --json number --jq '.[0].number // empty')
            [ -n "$FOPEN" ] && gh issue close "$FOPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: full canary green at $(date -u +%FT%TZ)."
            LTITLE="Canary burner LOW"
            LOPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$LTITLE\"" --json number --jq '.[0].number // empty')
            [ -n "$LOPEN" ] && gh issue close "$LOPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: green run with a healthy balance at $(date -u +%FT%TZ)."
            RTITLE="Paid canary rail FAILED"
            ROPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$RTITLE\"" --json number --jq '.[0].number // empty')
            [ -n "$ROPEN" ] && gh issue close "$ROPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: all rail legs settled at $(date -u +%FT%TZ)."
          fi
          if [ "$RESULT" = "fail" ]; then
            BODY="The daily paid-path canary could not complete a real USDC purchase from production — *buying may be broken* (paywall, facilitator, or settlement). The free/proof-of-work path is checked separately by the Heartbeat.
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          If this is a funding issue, top up the test burner; otherwise check the x402 facilitator + the paywall on the Railway service."
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still failing at $(date -u +%FT%TZ)."
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            fi
            exit 1
          elif [ "$RESULT" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: a real USDC purchase settled at $(date -u +%FT%TZ)."
          fi
