name: Paid-path canary

# Once a day, make ONE real x402 USDC purchase from production to prove that
# *buying* still settles end-to-end — the heartbeat only exercises the free
# proof-of-work path, so a paywall/facilitator/settlement regression would go
# unnoticed. Repeated failure opens a GitHub issue; recovery closes it.
# Cost: ~$0.001/day of dust from the test burner.
on:
  schedule:
    - cron: "17 13 * * *" # daily ~13:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Wallet/pow secrets are NOT at job scope (audit R-07): job-scope env is in
    # the environment of EVERY step, including the dependency install, where a
    # malicious package lifecycle script could read them. They are scoped to the
    # buy step only. GH_TOKEN (github.token, issue management) and the
    # non-secret TARGET_URL stay job-wide.
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_URL: https://agent402.tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install x402 client
        # No wallet secrets are in scope for this step (they live on the buy
        # step), and --ignore-scripts blocks dependency lifecycle scripts
        # entirely (audit R-07). @x402/* pinned to the server's protocol version
        # (src/payments.js runs 2.16) — an unpinned install pulled 2.17 and
        # protocol skew is one suspect for SVM settle failures. viem /
        # @solana/kit / @stellar/stellar-sdk are pinned to the repo lock's
        # resolved versions (no floating installs in a paid job).
        run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts @x402/fetch@2.16.0 @x402/core@2.16.0 @x402/evm@2.16.0 @x402/svm@2.16.0 @x402/stellar@2.17.0 @stellar/stellar-sdk@16.0.1 @solana/kit@5.5.1 viem@2.52.2
      - name: Buy one tool from production (real USDC)
        id: canary
        # Wallet/pow secrets scoped to THIS step only (audit R-07).
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          SOLANA_BURNER_KEY: ${{ secrets.SOLANA_BURNER_KEY }}
          STELLAR_BURNER_SECRET: ${{ secrets.STELLAR_BURNER_SECRET }}
          ALGORAND_BURNER_MNEMONIC: ${{ secrets.ALGORAND_BURNER_MNEMONIC }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
        run: |
          if [ -z "$BURNER_KEY" ]; then
            echo "No BURNER_KEY secret — canary cannot run (configure a funded test wallet)."
            echo "result=noconfig" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::add-mask::$BURNER_KEY"
          # Optional Solana leg — buys the $0.05 decode-blob skill pack paying
          # USDC on Solana (sized to clear explorer dust filters; deterministic,
          # pure-CPU, no upstream cost). Informational (warns, never pages);
          # silently skipped when the SOLANA_BURNER_KEY secret is unset.
          [ -n "$SOLANA_BURNER_KEY" ] && echo "::add-mask::$SOLANA_BURNER_KEY"
          if node scripts/paid-canary.js; then echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            CODE=$?
            # Exit 3 = the script PROVED underfunding (every failed leg a clean
            # 402, at least one real settlement this run, live Base balance
            # below the cheapest failed leg). Anything else is a real failure.
            if [ "$CODE" = "3" ]; then echo "result=underfunded" >> "$GITHUB_OUTPUT"; else echo "result=fail" >> "$GITHUB_OUTPUT"; fi
          fi

      # Feed the /status "settlement" component. Deliberately a SEPARATE step
      # from the buy above: that step holds the wallet keys, and widening its
      # environment to carry the operator token too would undo the per-step
      # secret scoping from audit R-07.
      #
      # A "noconfig" run posts NOTHING. The canary never actually bought
      # anything in that case, so there is no observation to record, and
      # inventing one either way is exactly what /status refuses to do.
      - name: Record settlement on /status
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          RESULT: ${{ steps.canary.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$OP_TOKEN" ] || { echo "no operator token — skipping status record"; exit 0; }
          case "$RESULT" in
            ok)   OK=true;  DETAIL="" ;;
            fail) OK=false; DETAIL="paid canary could not complete a real USDC purchase" ;;
            # Underfunded = the run PROVED settlement works (real settles
            # happened) and proved the failures were its own empty wallet.
            # Recording that as an outage put "outage" on the public page while
            # buyers were settling fine (2026-07-27). It is an ok observation
            # with the funding named; the funding issue below still pages us.
            underfunded) OK=true; DETAIL="settlement proven; canary burner needs a top-up (funding, not an outage)" ;;
            *)    echo "canary result '$RESULT' — nothing was bought, so no observation to record"; exit 0 ;;
          esac
          BODY=$(jq -nc --arg u "$RUN_URL" --arg d "$DETAIL" --argjson ok "$OK" \
            '{source:"paid-canary", ts:(now*1000|floor), url:$u,
              components:{"settlement":{ok:$ok, detail:(if $d=="" then null else $d end)}}}')
          curl -sf --max-time 20 -X POST "$TARGET_URL/api/status/probe" \
            -H "Content-Type: application/json" -H "X-Operator-Token: $OP_TOKEN" \
            -d "$BODY" >/dev/null && echo "settlement recorded (ok=$OK)" || echo "settlement not recorded (prod unreachable)"

      - name: Alert on failure / clear on recovery
        run: |
          TITLE="Paid-path canary FAILED"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          # Funding starvation gets its own issue and CLOSES the outage-class
          # one: "buying may be broken" must not stay open when the run proved
          # buying works and only our wallet is empty.
          if [ "${{ steps.canary.outputs.result }}" = "underfunded" ]; then
            FTITLE="Canary burner EMPTY (Base)"
            FOPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$FTITLE\"" --json number --jq '.[0].number // empty')
            if [ -z "$FOPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$FTITLE" --body "The paid canary's Base burner is out of USDC — the run settled real purchases on the funded rails and every Base failure was a clean 402 with the live balance below the cheapest leg, so this is FUNDING, not an outage. Top up the burner (see the run log for the address), then dispatch paid-canary.yml; a green run closes this. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              gh issue comment "$FOPEN" --repo "$GITHUB_REPOSITORY" --body "Still empty at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            [ -n "$OPEN" ] && gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Reclassified: the failure is canary-wallet funding, not a broken paid path — settlement was proven in the same run. Tracking in the funding issue."
            exit 0
          fi
          if [ "${{ steps.canary.outputs.result }}" = "ok" ]; then
            FTITLE="Canary burner EMPTY (Base)"
            FOPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$FTITLE\"" --json number --jq '.[0].number // empty')
            [ -n "$FOPEN" ] && gh issue close "$FOPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: full canary green at $(date -u +%FT%TZ)."
          fi
          if [ "${{ steps.canary.outputs.result }}" = "fail" ]; then
            BODY="The daily paid-path canary could not complete a real USDC purchase from production — *buying may be broken* (paywall, facilitator, or settlement). The free/proof-of-work path is checked separately by the Heartbeat.
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          If this is a funding issue, top up the test burner; otherwise check the x402 facilitator + the paywall on the Railway service."
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still failing at $(date -u +%FT%TZ)."
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            fi
            exit 1
          elif [ "${{ steps.canary.outputs.result }}" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: a real USDC purchase settled at $(date -u +%FT%TZ)."
          fi
