# Live-catalog guard for the LLM gateway's model tables, every 6 hours: every
# advertised, ranked, fallback, image and speech id still exists upstream, every
# private cost row covers its dearest live endpoint, no cost row sits more than
# 15% above the dearest live endpoint of every servable model it owns (stale
# high), every row's long-context tiers cover the higher price an endpoint bills
# past a prompt size, no ranked model expires inside the warning window, and,
# while the DIRECT_UPSTREAM_URL and DIRECT_UPSTREAM_MODELS secrets are set,
# every mapped direct-upstream model still passes the serving guard on its
# public listing (unset: that check is skipped with a note; its lines carry
# counts and reason codes, never a model id, since the ids are a secret)
# (scripts/test-gateway-model-ids.js, public catalogs, no key).
#
# This is the single owner of that check. It runs on a schedule, never on a push:
# a vendor repricing a model is not a defect in the change under review, and
# serving already re-checks each model against its own cost row and refuses a
# dearer endpoint. A failure opens (or updates) ONE issue and the next clean run
# closes it.
#
# Logs and issues are public. The script names models only under CI, and every
# line it prints passes through REDACT_RATES before it reaches the log or the
# issue, so an amount next to "$", a per-unit price or a "row"/"table" value is
# replaced even if the script's output changes; so is any standalone decimal
# or exponent figure. The stale-high lines carry a row key, a unit, the
# direction and a whole percent only. scripts/test-model-drift-redaction.js
# runs this same program on such lines. Spends nothing.
name: Upstream model price drift (every 6 hours)

on:
  schedule:
    - cron: "53 */6 * * *" # every 6 hours, at :53
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: model-drift
  cancel-in-progress: false

jobs:
  model-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      # One perl program, used on the log and again on the issue text.
      REDACT_RATES: >-
        s/\$\s?[0-9][0-9.,eE+\-]*/\$[redacted]/g;
        s/[0-9][0-9.,eE+\-]*(\s?(?:\/|per\s)\s?(?:1M|1K|M|K|mtok|tokens?|chars?|characters?|s|secs?|seconds?|mins?|minutes?|requests?|calls?|images?|megapixels?|units?)\b)/[redacted]$1/gi;
        s/\b(rows?|tables?|rates?|costs?|prices?|live|costPerChar)(\s*[:=]?\s*)[0-9][0-9.,eE+\-]*/$1$2\[redacted]/gi;
        s/(?<![\w.\-\/:])(?:[0-9]*\.[0-9]+(?:[eE][+\-]?[0-9]+)?|[0-9]+[eE][+\-]?[0-9]+)/[redacted]/g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies (secretless)
        # Dependency lifecycle scripts run here, so the cost table is blanked
        # for this step; only the guard step below receives it.
        env:
          UPSTREAM_COSTS_JSON: ""
        run: npm ci --ignore-scripts && npm rebuild better-sqlite3
      - name: Redactor self-check
        run: |
          out=$(printf '%s\n' 'm $1.25 row 0.0001 live 3 2e-6/char 7 per token 4.5/M table 9 bare 0.00042 and 3e-7' | perl -pe "$REDACT_RATES")
          echo "$out"
          if printf '%s' "$out" | grep -q '[0-9]'; then
            echo "::error::REDACT_RATES left a digit in its own canary line; refusing to run the guard"
            exit 1
          fi
      - name: Live catalog guard (ids, cost rows, speech chain, expirations)
        id: guard
        # Step scope only: no other step sees the cost table.
        env:
          UPSTREAM_COSTS_JSON: ${{ secrets.UPSTREAM_COSTS_JSON }}
          # The direct upstream's public listing (no key is sent); unset skips its check.
          DIRECT_UPSTREAM_URL: ${{ secrets.DIRECT_UPSTREAM_URL }}
          DIRECT_UPSTREAM_MODELS: ${{ secrets.DIRECT_UPSTREAM_MODELS }}
          CI: "true"
        run: |
          set +e
          node scripts/test-gateway-model-ids.js 2>&1 | perl -pe "$REDACT_RATES" | tee guard.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      # An open issue this check filed under a previous title gets the current
      # one, so the lookups below find it (scripts/adopt-issue-titles.js).
      - name: Adopt an open issue filed under a previous title
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/adopt-issue-titles.js

      - name: Page (open / update / close the issue)
        if: always()
        env:
          RESULT: ${{ steps.guard.outputs.exit }}
        run: |
          TITLE="Scheduled check needs review: model-catalog"
          LEGACY="Gateway model/price guard FAILING"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          find_issue() { ISSUE_TITLE="$1" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$1\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty'; }
          OPEN=$(find_issue "$TITLE")
          # The nightly corpus workflow used to own this check under another title.
          OLD=$(find_issue "$LEGACY")
          if [ -n "$OLD" ]; then
            gh issue close "$OLD" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          if [ "$RESULT" != "0" ]; then
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
