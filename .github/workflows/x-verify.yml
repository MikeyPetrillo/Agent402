name: X Verify

# Read-only credential check for the X (Twitter) Actions secrets — runs
# `scripts/tweet.js --verify`, which calls GET /2/users/me and prints the
# authenticated handle. Posts NOTHING. Dispatch it to confirm the
# X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_SECRET secrets are
# present and valid before trusting the Announce workflow with a real post.
on:
  workflow_dispatch:
  push:
    branches: ["claude/sweet-brown-i99jl3"]
    paths: [".github/trigger-x-verify"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify X credentials (no post)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: node scripts/tweet.js --verify
