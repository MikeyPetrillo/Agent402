name: Permit2 approval for upto payments (dispatch-only)

# One-time, idempotent. The canary burner has bought on Base for months without
# ever holding ETH, because `exact` settles over EIP-3009 and the facilitator
# broadcasts. `upto` settles through Permit2, which needs a real approval
# transaction from the owner, paid in ETH.
# Least privilege: the default token on this repo is read-only, so a job that
# opens an issue on failure needs issues: write spelled out (two alarms could
# not page before 2026-08-28).
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      live:
        description: "true to send the approval; anything else is a dry run"
        required: false
        default: "false"

concurrency:
  group: permit2-approve
  cancel-in-progress: false

jobs:
  approve:
    # Money moves out of a spending wallet on dispatch: the `spending` GitHub
    # environment requires the operator's approval click before this job runs
    # (write access alone used to be enough). Scheduled canaries stay ungated.
    environment: spending
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Approve Permit2
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          LIVE: ${{ inputs.live }}
        run: node scripts/permit2-approve.js
