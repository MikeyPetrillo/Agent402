name: Metered settlement canary - sub-ceiling settle (dispatch-only)

# Proves the one claim that matters about metered billing: the amount that
# actually MOVED on-chain is less than the amount the buyer authorized.
#
# Everything cheaper-sounding can be true while the buyer is still charged the
# full ceiling - the 402 can offer upto, the client can sign it, a 200 can come
# back - so the assertion is on the SETTLED amount read from the settle receipt,
# never on the response status.
#
# Dispatch-only until it has run green: metering changes what buyers are
# charged, and a scheduled canary for an unproven billing path just pages.
# Least privilege: the default token on this repo is read-only, so a job that
# opens an issue on failure needs issues: write spelled out (two alarms could
# not page before 2026-08-28).
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      route:
        description: "Route to meter (default /v1/chat/completions)"
        required: false
        default: "/v1/chat/completions"

concurrency:
  group: upto-meter-canary
  cancel-in-progress: false

jobs:
  meter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Buy a metered call and assert it settled under the ceiling
        env:
          BURNER_KEY: ${{ secrets.BURNER_KEY }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
          METER_ROUTE: ${{ inputs.route }}
        run: node scripts/upto-meter-canary.js
