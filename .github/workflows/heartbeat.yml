              fi
              ;;
          esac

      # Circle Gateway batched settlements Gateway answered settlement_pending
      # (src/gateway-nanopayments.js): one word on /api/gateway-status. The
      # resolver books a settled, unserved entry as an owed debt (refundsOwed
      # covers it). unresolved / full page; ok and off close; pending,
      # near_capacity and unknown do neither.
      - name: Gateway pending settlements check (alarm when one needs an operator)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.gatewayPending.status // "unknown"' 2>/dev/null || echo unknown)
          echo "gateway pending: $WORD"
          TITLE="Scheduled check needs review: gateway-settlements"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            unresolved|full)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            ok|off)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Settlements that failed naming a transaction or an authorization, on an
      # EVM chain, Solana or Algorand (src/late-settlements.js): one word on /api/gateway-status. A landed,
      # unserved one becomes an owed debt (refundsOwed covers it).
      # unresolved / full page; ok and near_capacity close; unknown does neither.
      - name: Late settlements check (alarm when one needs an operator)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.lateSettlements.status // "unknown"' 2>/dev/null || echo unknown)
          echo "late settlements: $WORD"
          TITLE="Scheduled check needs review: late-settlements"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            unresolved|full)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            ok|near_capacity)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Live revenue snapshot (src/revenue-live.js): one word on
      # /api/gateway-status. stale (past its period plus grace, or missing an
      # offered rail past the grace) pages; fresh and due close; cold and
      # unknown do neither.
      - name: Live revenue read check (alarm when the snapshot is stale)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.revenueLive.status // "unknown"' 2>/dev/null || echo unknown)
          echo "revenue live: $WORD"
          TITLE="Scheduled check needs review: revenue-read"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            stale)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              fi
              ;;
            fresh|due)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Refunds owed (src/refund-ledger.js): one word on /api/gateway-status.
      # owed (any buyer's debt past a 15 min grace) / aging / stuck page; ok
      # closes; unknown does neither. The status Worker runs the same check
      # every five minutes under the same title. The issue carries counts only
      # (rows, distinct buyers, read from the operator view): never an address
      # or an amount.
      - name: Refunds owed check (alarm when a debt to a buyer is waiting)
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          GW=$(curl -s --max-time 15 -H "X-Operator-Token: $OP_TOKEN" "$PROD/api/gateway-status" || echo '{}')
          WORD=$(printf '%s' "$GW" | jq -r '.refundsOwed.status // "unknown"' 2>/dev/null || echo unknown)
          case "$WORD" in owed|aging|stuck|ok|unknown) ;; *) WORD=unknown ;; esac
          # Where the debt is: the refund ledger and the card report refunds
          # (pending: Stripe has every card refund in hand, nothing to do;
          # refused: one needs a refund by hand). Words only, allowlisted.
          LEDGER=$(printf '%s' "$GW" | jq -r '.refundsOwed.ledger // ""' 2>/dev/null || echo "")
          case "$LEDGER" in ok|owed|aging|stuck|unknown) ;; *) LEDGER="" ;; esac
          CARD=$(printf '%s' "$GW" | jq -r '.refundsOwed.card // ""' 2>/dev/null || echo "")
          case "$CARD" in none|pending|refused|unknown) ;; *) CARD="" ;; esac
          echo "refunds owed: $WORD (ledger ${LEDGER:-unread}, card ${CARD:-unread})"
          WF="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/refund.yml"
          TITLE="Scheduled check needs review: refunds"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            owed|aging|stuck)
              # A debt can stay owed for days (held for review), so an open
              # issue is updated in place rather than commented every run.
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                echo "already tracked in #$OPEN"
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Credits purchases refused by the daily limit whose card refund failed
      # (src/credits.js): one word on /api/gateway-status. owed pages; ok
      # closes; unknown does neither. Session ids stay on the operator view.
      - name: Credits refunds check (alarm when a refused purchase was not refunded)
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          GW=$(curl -s --max-time 15 -H "X-Operator-Token: $OP_TOKEN" "$PROD/api/gateway-status" || echo '{}')
          WORD=$(printf '%s' "$GW" | jq -r '.creditsRefunds.status // "unknown"' 2>/dev/null || echo unknown)
          case "$WORD" in owed|ok|unknown) ;; *) WORD=unknown ;; esac
          echo "credits refunds: $WORD"
          TITLE="Scheduled check needs review: credits-refund"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            owed)
              BODY="/api/gateway-status reports creditsRefunds.status=owed at $(date -u +%FT%TZ): a credits purchase was refused (the daily purchase limit, or an EU or UK billing address without a VAT number), issued no key, and its automatic card refund failed. Read the session ids on /__operator/credits.json (refusalsToRefund), refund each payment in the Stripe dashboard, then POST /__operator/credits/refusal-refunded {\"session\":\"cs_...\"}. Auto-closes when nothing is owed."
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # CDN-range peers reaching the origin without the shared origin secret
      # (src/cdn-client-ip.js): one word on /api/gateway-status. unauthenticated
      # pages; ok and off close; unknown does neither. The count and whether a
      # secret is configured stay on the operator view. The status Worker runs
      # the same check every five minutes under the same title.
      - name: CDN origin secret check (alarm when edge traffic reaches the origin unauthenticated)
        if: always()
        continue-on-error: true
        run: |
          GW=$(curl -s --max-time 15 "$PROD/api/gateway-status" || echo '{}')
          WORD=$(printf '%s' "$GW" | jq -r '.cdnOrigin.status // "unknown"' 2>/dev/null || echo unknown)
          case "$WORD" in unauthenticated|ok|off|unknown) ;; *) WORD=unknown ;; esac
          echo "cdn origin: $WORD"
          TITLE="Scheduled check needs review: cdn-origin"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            unauthenticated)
              BODY="/api/gateway-status reports cdnOrigin.status=unauthenticated at $(date -u +%FT%TZ): requests from the CDN's address ranges reached the origin without a valid X-Origin-Auth inside the last hour. While that lasts each such request is keyed on the edge address, not its client, so the per-address limiters, budgets and attribution fold onto a few addresses. Check CDN_ORIGIN_SECRET on Railway against the header rule on the proxy (a rotation on one side only reads exactly like this); the operator view of /api/gateway-status carries the count and whether a secret is configured. Auto-closes when the word is ok."
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            ok|off)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Recipients our spending wallets paid for the first time
      # (src/outbound-destinations.js): one word on /api/gateway-status.
      # burst pages (more first-time recipients inside the window than the
      # threshold); ok and new close (a first buy from a newly proven seller is
      # expected); unknown does neither. Two readings 30 s apart, like the
      # dead-letter check. The status Worker runs the same check every five
      # minutes under the same title.
      - name: Outbound destinations check (alarm on a burst of first-time recipients)
        if: always()
        continue-on-error: true
        run: |
          read_od() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.outboundDestinations.status // "unknown"' 2>/dev/null || echo unknown; }
          WORD=$(read_od)
          if [ "$WORD" = "burst" ]; then sleep 30; WORD=$(read_od); fi
          echo "outbound destinations: $WORD"
          TITLE="Scheduled check needs review: outbound-payments"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            burst)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            ok|new)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Tool and upstream failures (src/tool-failure-monitor.js): four words
      # on /api/gateway-status. toolFailures and upstreamHealth page on
      # degraded / failing; facilitatorFunds pages on low / refused / demoted;
      # buyerRefusals pages on refusing; settleFailures and unsettledReports page on burst;
      # robinhoodSettler pages on relayer (ok
      # and off close); subscriptionRenewals pages on unconfirmed (ok and off
      # close); directUpstream pages on degraded (ok and off close,
      # starting does neither); directUpstreamSpend on high and
      # directUpstreamBalance on exhausted (ok and off close; unknown and
      # starting do neither); ok closes; unknown does neither. The issues are public, so a body carries
      # the word and the operator endpoint only: slugs, upstreams, facilitators
      # and reasons stay on /__operator/tool-failures.json. The status Worker
      # runs the same checks every five minutes under the same titles.
      - name: Tool, upstream and facilitator failure checks (alarm on a failing tool or upstream)
        if: always()
        continue-on-error: true
        run: |
          GS=$(curl -s --max-time 15 "$PROD/api/gateway-status" || echo '{}')
          # TITLE is set before each call (the Worker test reads it as written).
          check_word() {
            FIELD="$1"; BAD="$2"; GOOD="$3"; ENDPOINT="${4:-/__operator/tool-failures.json}"
            WORD=$(echo "$GS" | jq -r ".${FIELD}.status // \"unknown\"" 2>/dev/null || echo unknown)
            echo "$FIELD: $WORD"
            OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
            if echo " $BAD " | grep -q " $WORD "; then
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
            elif echo " $GOOD " | grep -q " $WORD "; then
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
            fi
          }
          TITLE="Scheduled check needs review: tool-failures"
          check_word toolFailures "degraded failing" "ok"
          TITLE="Scheduled check needs review: upstream-health"
          check_word upstreamHealth "degraded failing" "ok"
          # Our own limit passed on one upstream for several callers while
          # others answered (src/unanswered-rule.js): its own neutral title.
          TITLE="Scheduled check needs review: upstream-health (b)"
          check_word upstreamHealth "unanswered" "ok"
          TITLE="Scheduled check needs review: facilitator-funds"
          check_word facilitatorFunds "refused demoted" "ok"
          # A settlement signer short of gas, before any refusal: its own title.
          # A balance our checker could not read reads unknown, which pages
          # under its own title (below) only once it has held for hours.
          TITLE="Scheduled check needs review: facilitator-funds (b)"
          check_word facilitatorFunds "low" "ok"
          # A signer balance our checker could not read pages only once
          # unknown has held past FACILITATOR_UNREAD_PAGE_HOURS (alert=sustained,
          # src/tool-failure-monitor.js); a read balance (ok or low) closes it.
          TITLE="Scheduled check needs review: facilitator-funds (c)"
          FA=$(echo "$GS" | jq -r '.facilitatorFunds.alert // "none"' 2>/dev/null || echo none)
          if [ "$FA" = "sustained" ]; then UNREAD_BAD="unknown"; else UNREAD_BAD="_not-sustained_"; fi
          check_word facilitatorFunds "$UNREAD_BAD" "ok low"
          # Close-only: the issue opened under the title before its rename
          # closes on ok, low or unknown (the two titles above take over those
          # states, so it never stays open beside them). The bad list is a word
          # no status reads, so it never opens.
          TITLE="Scheduled check needs review: facilitator-funds (d)"
          check_word facilitatorFunds "_close-only_" "ok low unknown"
          # The settle breaker refused a buyer that had settled a call in its
          # window (src/gateway-settle-breaker.js): refusing pages, ok closes.
          TITLE="Scheduled check needs review: buyer-refusals"
          check_word buyerRefusals "refusing" "ok"
          # Distinct buyers whose /v1 payments verified and then failed to
          # settle reached the breaker's count inside one window
          # (src/gateway-settle-breaker.js): burst pages, ok closes. No request
          # is refused for it.
          TITLE="Scheduled check needs review: settle-failures"
          check_word settleFailures "burst" "ok" "/api/gateway-status"
          # Report and media runs that spent upstream and then did not settle
          # reached the composite guard's count inside one window
          # (src/composite-spend-guard.js): burst pages, ok closes. No request
          # is refused for it.
          TITLE="Scheduled check needs review: unsettled-reports"
          check_word unsettledReports "burst" "ok" "/api/gateway-status"
          # Our own relayer settling Robinhood Chain sales in the listed
          # facilitator's place for longer than ROBINHOOD_RELAYER_FIRST_ALERT_HOURS
          # (src/robinhood-order.js): relayer pages, ok and off close.
          TITLE="Scheduled check needs review: robinhood-settler"
          check_word robinhoodSettler "relayer" "ok off"
          # A wallet-billed monitor renewal unconfirmed (its send's landing
          # undecided by the chain read) for longer than
          # MPP_SUB_UNCONFIRMED_ALERT_HOURS (src/mpp-subscriptions.js):
          # unconfirmed pages, ok and off close.
          TITLE="Scheduled check needs review: subscription-renewals"
          check_word subscriptionRenewals "unconfirmed" "ok off" "/__operator/monitors.json"
          # The direct upstream (src/gateway-direct-pricebook.js): degraded
          # pages (the reason code is on the operator read only); ok and off
          # close; starting does neither.
          TITLE="Scheduled check needs review: direct-upstream"
          check_word directUpstream "degraded" "ok off" "/__operator/direct-upstream.json"
          # The direct upstream's spend for the UTC day passed
          # DIRECT_UPSTREAM_DAILY_ALERT_USD (src/direct-upstream-spend.js): high
          # pages (an alarm only, every call is still served); ok and off close;
          # unknown (the shared day not read yet) does neither.
          TITLE="Scheduled check needs review: direct-upstream-spend"
          check_word directUpstreamSpend "high" "ok off" "/__operator/direct-upstream.json"
          # Its latest answer was a 402 balance refusal (those calls were served
          # by OpenRouter): exhausted pages; ok and off close; starting (a new
          # process has seen neither outcome) does neither.
          TITLE="Scheduled check needs review: direct-upstream-balance"
          check_word directUpstreamBalance "exhausted" "ok off" "/__operator/direct-upstream.json"

      # Paid 200s whose body is empty or error-shaped (src/answer-shape.js,
      # counted by src/tool-failure-monitor.js): one word on
      # /api/gateway-status. degraded pages, ok closes, unknown does neither.
      # The issue is public: its body carries the word and the operator
      # endpoint only; slugs and reasons stay on /__operator/tool-failures.json.
      # The status Worker runs the same check under the same title.
      # A scheduled turn under contained() (src/contained-turn.js) throwing in
      # each of the last three or more consecutive minutes: one word on
      # /api/gateway-status. repeating pages, ok closes, unknown does neither.
      # The issue is public: its body carries the word and the operator
      # endpoint only; the names and counts stay on /__operator/perf.json.
      # The status Worker runs the same check under the same title.
      - name: Contained turn check (alarm on a scheduled turn throwing every minute)
        if: always()
        continue-on-error: true
        run: |
          # Two words, one issue: a scheduled turn that keeps throwing
          # (containedTurns=repeating) and a seller board whose rebuild is not
          # running (boardRefresh=stalled). Either pages; the issue clears only
          # when both read ok (a build with no boardRefresh word reads ok for
          # it); held and unknown do neither.
          DOC=$(curl -s --max-time 15 "$PROD/api/gateway-status" || true)
          TURNS=$(printf '%s' "$DOC" | jq -r '.containedTurns.status // "unknown"' 2>/dev/null || echo unknown)
          BOARDS=$(printf '%s' "$DOC" | jq -r '.boardRefresh.status // (if has("boardRefresh") then "unknown" else "ok" end)' 2>/dev/null || echo unknown)
          echo "containedTurns: $TURNS boardRefresh: $BOARDS"
          case "$TURNS:$BOARDS" in
            repeating:*|*:stalled) WORD=repeating ;;
            ok:ok) WORD=ok ;;
            *) WORD=unknown ;;
          esac
          TITLE="Scheduled check needs review: contained-turns"
          # The mark counts only on its own line after a blank line, where
          # the status Worker writes and reads it.
          MARK="First ok read at "
          NLMARK=$'\n\n'"$MARK"
          # Only an issue with exactly this title, opened by the workflow bot
          # or the repository owner, is the alarm (the status Worker's rule):
          # an outsider's issue with the title neither suppresses nor is closed.
          OPEN=$(ALARM_NAME="$TITLE" ALARM_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ALARM_NAME) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ALARM_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            repeating)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
                # A bad read after a first ok read starts the count again.
                BODY_NOW=$(gh issue view "$OPEN" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || echo "")
                case "$BODY_NOW" in
                  *"$NLMARK"*) gh issue edit "$OPEN" --repo "$GITHUB_REPOSITORY" --body "${BODY_NOW%%$'\n\n'"$MARK"*}" >/dev/null 2>&1 || true ;;
                esac
              fi
              ;;
            ok)
              # Closes on the second consecutive ok read (this step's or the
              # status Worker's): the word lives in memory, so a restart reads
              # ok at once, and one ok read across a deploy is not a recovery.
              # The first ok read leaves a mark line in the issue body.
              if [ -n "$OPEN" ]; then
                BODY_NOW=$(gh issue view "$OPEN" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || echo "")
                case "$BODY_NOW" in
                  *"$NLMARK"*)
                    gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
                    ;;
                  *)
                    gh issue edit "$OPEN" --repo "$GITHUB_REPOSITORY" --body "${BODY_NOW}"$'\n\n'"${MARK}$(date -u +%FT%TZ); closes on the next ok read." >/dev/null 2>&1 || true
                    ;;
                esac
              fi
              ;;
          esac

      # Seller listings of many distinct origins failing to read inside a
      # rolling window (src/x402-index.js): one word on /api/gateway-status.
      # widespread pages, ok closes, unknown does neither. The issue is
      # public: its body carries the word and the operator endpoint only; the
      # origins and counts stay on /__operator/perf.json.
      # The status Worker runs the same check under the same title.
      - name: Broken listings check (alarm on listings failing across many origins)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.brokenListings.status // "unknown"' 2>/dev/null || echo unknown)
          echo "brokenListings: $WORD"
          TITLE="Scheduled check needs review: seller-listings"
          # The mark counts only on its own line after a blank line, where
          # the status Worker writes and reads it.
          MARK="First ok read at "
          NLMARK=$'\n\n'"$MARK"
          # Only an issue with exactly this title, opened by the workflow bot
          # or the repository owner, is the alarm (the status Worker's rule):
          # an outsider's issue with the title neither suppresses nor is closed.
          OPEN=$(ALARM_NAME="$TITLE" ALARM_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ALARM_NAME) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ALARM_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            widespread)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
                # A bad read after a first ok read starts the count again.
                BODY_NOW=$(gh issue view "$OPEN" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || echo "")
                case "$BODY_NOW" in
                  *"$NLMARK"*) gh issue edit "$OPEN" --repo "$GITHUB_REPOSITORY" --body "${BODY_NOW%%$'\n\n'"$MARK"*}" >/dev/null 2>&1 || true ;;
                esac
              fi
              ;;
            ok)
              # Closes on the second consecutive ok read (this step's or the
              # status Worker's): the word lives in memory, so a restart reads
              # ok at once, and one ok read across a deploy is not a recovery.
              # The first ok read leaves a mark line in the issue body.
              if [ -n "$OPEN" ]; then
                BODY_NOW=$(gh issue view "$OPEN" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || echo "")
                case "$BODY_NOW" in
                  *"$NLMARK"*)
                    gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
                    ;;
                  *)
                    gh issue edit "$OPEN" --repo "$GITHUB_REPOSITORY" --body "${BODY_NOW}"$'\n\n'"${MARK}$(date -u +%FT%TZ); closes on the next ok read." >/dev/null 2>&1 || true
                    ;;
                esac
              fi
              ;;
          esac

      - name: Tool answer shape check (alarm on empty or error-shaped 200s)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.toolAnswers.status // "unknown"' 2>/dev/null || echo unknown)
          echo "toolAnswers: $WORD"
          TITLE="Scheduled check needs review: tool-answers"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            degraded)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Money writes (sales, refund debts, card report records, subscription
      # records, decide writes) kept on the container's local disk because the
      # state database has not taken them (src/ledger-mirror.js): one word on
      # /api/gateway-status. "stuck" means an entry has waited past
      # LEDGER_DEAD_LETTER_STUCK_MINUTES; that disk dies with the container, so
      # a redeploy would lose those rows (the deploy job's quiet gate holds on
      # the same two words). "local" means the journals live in Redis but an
      # entry sits on the container's disk because Redis did not take it (same
      # risk). Two readings 30 s apart, like the state database check.
      # "pending" (the replay is working through them), "none", "off" and
      # "unknown" never page; none and off close.
      - name: Ledger dead-letter check (alarm when money writes wait on local disk)
        if: always()
        continue-on-error: true
        run: |
          read_dl() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.ledgerDeadLetter.status // "unknown"' 2>/dev/null || echo unknown; }
          WORD=$(read_dl)
          if [ "$WORD" = "stuck" ] || [ "$WORD" = "local" ]; then sleep 30; WORD=$(read_dl); fi
          echo "ledger dead-letter: $WORD"
          TITLE="Scheduled check needs review: ledger-rows"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            stuck|local)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            none|off)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Redis persistence (src/redis-persistence.js): one word on
      # /api/gateway-status read from INFO persistence. "off" means the Redis
      # behind REDIS_URL runs without append-only persistence, so anything kept
      # there dies with its process; "degraded" means append-only is on but
      # the last write or rewrite did not finish ok. In both the money journals
      # stay on each container's local disk (the LEDGER_JOURNAL_REDIS switch has
      # no effect until it reads on). Two readings 30 s apart, like the
      # dead-letter check. "on" closes; "unknown" does neither.
      - name: Redis persistence check (alarm when append-only is off or degraded)
        if: always()
        continue-on-error: true
        run: |
          read_rp() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.redisPersistence.status // "unknown"' 2>/dev/null || echo unknown; }
          WORD=$(read_rp)
          if [ "$WORD" = "off" ] || [ "$WORD" = "degraded" ]; then sleep 30; WORD=$(read_rp); fi
          echo "redis persistence: $WORD"
          TITLE="Scheduled check needs review: store-persistence"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            off|degraded)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            on)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Transactional email (src/email.js): one word on /api/gateway-status,
      # recorded from real sends and kept on the volume. exhausted / failing
      # page; ok closes; unknown and unconfigured do neither. Built 2026-10-01
      # after the provider's prepaid credits ran out and every report link,
      # credits key and alert confirmation stopped sending with no trace.
      - name: Email send check (alarm when transactional email is refused)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.email.status // "unknown"' 2>/dev/null || echo unknown)
          echo "email: $WORD"
          TITLE="Scheduled check needs review: transactional-email"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            exhausted|failing)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # The agent402-mcp version the site and server.describe tell people to
      # install must exist on npm. A deploy ships the pin while the [publish]
      # job publishes beside it, so a missing version is "pending" while a main
      # deploy run is still in progress, and an alarm after (2026-11-01). The
      # script re-checks a version npm answers 404 for once (NPM_RECHECK_MS,
      # default 15 s) before it reads missing, so one registry miss opens nothing.
      - name: MCP install pin check (alarm when the served agent402-mcp version is not on npm)
        if: always()
        continue-on-error: true
        run: |
          OUT=$(TARGET_URL="$PROD" node scripts/mcp-pin-on-npm.js 2>/dev/null | tail -1)
          WORD=$(echo "$OUT" | jq -r '.word // "unknown"' 2>/dev/null || echo unknown)
          if [ "$WORD" = "missing" ]; then
            RUNNING=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
            [ "${RUNNING:-0}" -gt 0 ] && WORD=pending
          fi
          echo "mcp pin: $WORD ($OUT)"
          TITLE="Scheduled check needs review: served-package-version"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            missing)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Private credits guards table (src/credits-guards.js). attention while
      # CREDITS_SALES or MCP_OAUTH asks for it and it is missing or lacks a key
      # the loader requires (credit sales and the connector sign-in stay off).
      # One word only, never a value. Two readings 30 s apart, as above.
      - name: Credits guards table check (alarm when a switch asks for it and it is not complete)
        if: always()
        continue-on-error: true
        run: |
          read_cg() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.creditsGuards.status // "unknown"' 2>/dev/null || echo unknown; }
          WORD=$(read_cg)
          if [ "$WORD" = "attention" ]; then sleep 30; WORD=$(read_cg); fi
          case "$WORD" in attention|ok|unknown) ;; *) WORD=unknown ;; esac
          echo "credits guards: $WORD"
          TITLE="Scheduled check needs review: credits-guards"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            attention)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Private upstream-cost table (src/upstream-costs.js). Without it the
      # metered tier, embeddings, images and X reads refuse and the flat
      # tiers price at their caps. "partial" means it loaded without a key some
      # path reads (that path refuses) or with a model row that did not parse.
      # One word only, never a value. Two readings 30 s apart, because a
      # deploy's boot window can read "missing" once.
      - name: Upstream cost table check (alarm when production runs without it)
        if: always()
        continue-on-error: true
        run: |
          read_uc() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamCosts.status // "unknown"' 2>/dev/null || echo unknown; }
          WORD=$(read_uc)
          if [ "$WORD" = "missing" ] || [ "$WORD" = "partial" ]; then sleep 30; WORD=$(read_uc); fi
          echo "upstream costs: $WORD"
          TITLE="Scheduled check needs review: cost-table"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            partial)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            missing)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Serving health: event-loop stalls, 5xx and paid-call error rates, and
      # load shedding by the shared gate, from /__operator/serving-health.json
      # (counts only). Only .status pages; free work refused by its own bounds
      # is an .info word and reaches the run log. Two readings 30 s apart must
      # agree, because a reading taken while a deploy swaps containers can be
      # bad on its own.
      - name: Serving health check (alarm on stalls, slow or failing paid calls, 5xx or shedding)
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          if [ -z "$OP_TOKEN" ]; then echo "no operator token; skipping"; exit 0; fi
          read1() { curl -s --max-time 15 -H "Authorization: Bearer $OP_TOKEN" "$PROD/__operator/serving-health.json"; }
          J=$(read1); S1=$(echo "$J" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
          if [ "$S1" = "degraded" ]; then sleep 30; J=$(read1); fi
          STATUS=$(echo "$J" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
          # The run log keeps the figures; the issue (public) carries the reason words only.
          SUMMARY=$(echo "$J" | jq -r '"reasons=\(.reasons|join(",")) info=\((.info // [])|join(",")) loopP99=\(.loop.p99LastMinuteMs)ms stalls1h=\(.loop.stalls1h) maxStall=\(.loop.maxStall1hMs)ms responses1h=\(.responses1h.total) 5xx=\(.responses1h.s5xx) paid=\(.responses1h.paid) paid5xx=\(.responses1h.paid5xx) shed=\(.shed.shed) shedServing=\(.shed.serving) shedFree=\(.shed.free)"' 2>/dev/null || echo "unreadable")
          REASONS=$(echo "$J" | jq -r '(.reasons // []) | join(", ")' 2>/dev/null || echo "unreadable")
          # What the long stalls were running: route keys and background job
          # names only (never a value, a payer or a figure), so the issue says
          # where to look without anyone reading the log.
          CULPRITS=$(echo "$J" | jq -r '((.stallCulprits.routes // []) + (.stallCulprits.jobs // [] | map("job " + .))) | map(gsub("[^A-Za-z0-9 /:*()._-]"; "") | .[0:60]) | .[0:8] | join(", ")' 2>/dev/null || echo "")
          if [ -n "$CULPRITS" ]; then CULPRIT_NOTE=" Running during the long stalls: $CULPRITS."; else CULPRIT_NOTE=""; fi
          # Whether the long stalls were mostly garbage collection (a word, never a figure).
          STALL_CAUSE=$(echo "$J" | jq -r '.stallCause // ""' 2>/dev/null || echo "")
          case "$STALL_CAUSE" in
            gc) CULPRIT_NOTE="${CULPRIT_NOTE} The long stalls were mostly garbage collection." ;;
            mixed) CULPRIT_NOTE="${CULPRIT_NOTE} Some of the long stalls were mostly garbage collection." ;;
          esac
          # Paid calls whose handler ran past its bound: tool names only, safe
          # characters, never a payer or an amount.
          SLOW_SLUGS=$(echo "$J" | jq -r '(.slowPaid.slugs // []) | map(gsub("[^A-Za-z0-9._-]"; "") | .[0:60]) | map(select(length > 0)) | .[0:8] | join(", ")' 2>/dev/null || echo "")
          if [ -n "$SLOW_SLUGS" ]; then CULPRIT_NOTE="${CULPRIT_NOTE} Slow paid calls: $SLOW_SLUGS."; fi
          echo "serving health: $STATUS ($SUMMARY)"
          echo "stall culprits: ${CULPRITS:-none named} cause: ${STALL_CAUSE:-none}"
          echo "slow paid calls: ${SLOW_SLUGS:-none}"
          TITLE="Scheduled check needs review: serving-health"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "degraded" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          fi

      # Postgres reachability: two probes, `leads` (DATABASE_URL) and `analytics`
      # (ANALYTICS_DATABASE_URL, else DATABASE_URL), which can be one database or
      # two. The databases were DOWN from 2026-07-02 to 2026-08-25 and nothing
      # paged: the app degrades quietly when they are gone, which is right for
      # buyers and exactly why it went unnoticed. "unconfigured"/"unknown" never
      # page; only "unreachable" does.
      - name: Postgres reachability check (alarm when a database is unreachable)
        if: always()
        continue-on-error: true
        run: |
          # SINGLE-RETRY, like every other probe in this file. This leg shipped
          # without one and paged on 2026-08-29 during our own deploy: a reading
          # taken while the containers swapped, when the fresh container's
          # Postgres pools were still re-initializing behind its boot, was
          # reported later as an outage. The boot log showed "[leads-db] ready"
          # three minutes BEFORE the issue was filed. Five merges in a day is
          # five chances to page on nothing, and an alarm that cries wolf is
          # worse than no alarm. A REAL outage (a stopped Postgres container)
          # fails both readings.
          probe_db() {
            local body leads analytics
            body=$(curl -s --max-time 20 "$PROD/api/gateway-status" 2>/dev/null || echo '{}')
            leads=$(echo "$body" | jq -r '.databases.leads.status // "unknown"' 2>/dev/null || echo unknown)
            analytics=$(echo "$body" | jq -r '.databases.analytics.status // "unknown"' 2>/dev/null || echo unknown)
            echo "$leads $analytics"
          }
          read -r LEADS ANALYTICS <<< "$(probe_db)"
          if [ "$LEADS" = "unreachable" ] || [ "$ANALYTICS" = "unreachable" ]; then
            echo "postgres: first read leads=$LEADS analytics=$ANALYTICS - re-probing in 30s before paging"
            sleep 30
            read -r LEADS ANALYTICS <<< "$(probe_db)"
          fi
          echo "postgres: leads=$LEADS analytics=$ANALYTICS"
          TITLE="Scheduled check needs review: analytics-store"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || true)
          if [ "$LEADS" = "unreachable" ] || [ "$ANALYTICS" = "unreachable" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$LEADS" != "unreachable" ] && [ "$ANALYTICS" != "unreachable" ] && [ "$LEADS" != "unknown" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # Daily MPP reconciliation (src/mpp-reconcile.js): chain transfers to our
      # Tempo recipient vs the sales ledger vs the refund ledger, plus the MPP
      # evm leg and Stripe SPT rows. The public field carries status WORDS only;
      # the itemized rows (tx hash, slug, amount, category - never a payer) are
      # read from the operator route when the token is present. Single retry:
      # a reading taken inside our own deploy window is {} and reads unknown,
      # so only a second "mismatch" pages.
      - name: MPP reconciliation check (alarm when the chain and our books disagree)
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          read_rec() { curl -s --max-time 20 "$PROD/api/gateway-status" 2>/dev/null | jq -r '.mppReconcile.status // "unknown"' 2>/dev/null || echo unknown; }
          STATUS=$(read_rec)
          if [ "$STATUS" = "mismatch" ]; then echo "mpp reconcile: first read mismatch - re-reading in 30s before paging"; sleep 30; STATUS=$(read_rec); fi
          echo "mpp reconcile: $STATUS"
          TITLE="Scheduled check needs review: payment-reconciliation"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || true)
          if [ "$STATUS" = "mismatch" ]; then
            CATS=$(curl -s --max-time 20 "$PROD/api/gateway-status" | jq -r '[.mppReconcile.categories // {} | to_entries[] | select(.value=="mismatch") | .key] | join(", ")' 2>/dev/null || echo "")
            DAY=$(curl -s --max-time 20 "$PROD/api/gateway-status" | jq -r '.mppReconcile.day // "?"' 2>/dev/null || echo "?")
            ROWS=""
            if [ -n "$OP_TOKEN" ]; then
              ROWS=$(curl -s --max-time 20 -H "Authorization: Bearer $OP_TOKEN" "$PROD/__operator/mpp-reconcile.json" \
                | jq -r '[.day.mismatches[]? | select(.category != "charged_failed") | .category] | group_by(.) | map("- \(.[0]): \(length)") | .[]' 2>/dev/null || echo "")
            fi
            BODY=$(printf 'The daily MPP reconciliation for %s found records that disagree (categories: %s). Each category is defined in src/mpp-reconcile.js: served_unpaid = booked as settled over Tempo with no transfer on chain; paid_unrecorded = a transfer to our recipient with no sales row; amount_mismatch / wrong_currency / duplicate_tx / missing_tx / evm_unverified / stripe_mismatch as named.\n\n%s\n\nFull detail: GET /__operator/mpp-reconcile.json (operator token). Re-run a day: POST /__operator/mpp-reconcile/run?day=YYYY-MM-DD. Closes when a reconciliation reads ok.' "$DAY" "${CATS:-see the operator route}" "${ROWS:-(counts need the operator token)}")
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # The rolling seven days (mppReconcile.window7d): the seven UTC days
      # ending at the latest reconciled day, reconciled as one range. The daily
      # alarm above closes as soon as the NEXT day reads ok, so a mismatch
      # nobody resolved drops out of sight while it is still in the window.
      # This pages on that gap only: window mismatch while the latest day reads
      # ok. A daily mismatch is the step above (no second issue for one event);
      # an unknown day says nothing about the window's age, so it does neither.
      # Window ok closes. Same single retry. The status Worker runs the same
      # check every five minutes under the same title.
      - name: MPP reconciliation 7-day window check (alarm when a mismatch stays in the window)
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          read_win() { curl -s --max-time 20 "$PROD/api/gateway-status" 2>/dev/null | jq -r '"\(.mppReconcile.window7d // "unknown") \(.mppReconcile.status // "unknown") \(.mppReconcile.day // "?")"' 2>/dev/null || true; }
          read -r WIN DAILY DAY <<< "$(read_win)" || true
          WIN=${WIN:-unknown}; DAILY=${DAILY:-unknown}
          if [ "$WIN" = "mismatch" ] && [ "$DAILY" = "ok" ]; then echo "mpp reconcile window: first read mismatch - re-reading in 30s before paging"; sleep 30; read -r WIN DAILY DAY <<< "$(read_win)" || true; WIN=${WIN:-unknown}; DAILY=${DAILY:-unknown}; fi
          echo "mpp reconcile 7-day window: $WIN (latest day: $DAILY)"
          TITLE="Scheduled check needs review: payment-reconciliation-window"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || true)
          if [ "$WIN" = "mismatch" ] && [ "$DAILY" = "ok" ]; then
            if [ -z "$OPEN" ]; then
              case "$DAY" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) DAY="the latest day" ;; esac
              ROWS=""
              if [ -n "$OP_TOKEN" ]; then
                ROWS=$(curl -s --max-time 20 -H "Authorization: Bearer $OP_TOKEN" "$PROD/__operator/mpp-reconcile.json" \
                  | jq -r '[.window.mismatches[]? | select(.category != "charged_failed") | "\((.at // "?")[0:10]) \(.category)"] | group_by(.) | map("- \(.[0]): \(length)") | .[]' 2>/dev/null || echo "")
              fi
              BODY=$(printf '/api/gateway-status reports mppReconcile.window7d=mismatch while the latest day (%s) reads ok. The window is the seven UTC days ending at that day, reconciled as one range, so it holds a disagreement from any of them: usually a day whose own "Scheduled check needs review: payment-reconciliation" issue closed when the next day read clean, without the disagreement being resolved. One class only the window sees: one settlement booked on two rows more than an hour apart across a day boundary (duplicate_tx).\n\n%s\n\nRead /__operator/mpp-reconcile.json: window.mismatches lists each item with its time and category. Resolve or explain each one. Closes when the window reads ok, which also happens once the mismatched day leaves the seven-day window.' "$DAY" "${ROWS:-(the day and category of each item need the operator token)}")
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            fi
          elif [ "$WIN" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # A paid-but-failed MPP call: settle succeeded and the response was not a
      # 200, so the refund ledger holds a debt. Read LIVE from the refund ledger
      # (last 24 h), not from the daily run. Same single retry.
      - name: MPP paid-but-failed check (alarm on any charged-but-failed MPP call in the last day)
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          read_cf() { curl -s --max-time 20 "$PROD/api/gateway-status" 2>/dev/null | jq -r '.mppReconcile.chargedFailedStatus // "unknown"' 2>/dev/null || echo unknown; }
          CF=$(read_cf)
          if [ "$CF" = "charged_failed" ]; then echo "mpp charged-failed: first read positive - re-reading in 30s before paging"; sleep 30; CF=$(read_cf); fi
          echo "mpp charged-failed: $CF"
          TITLE="Scheduled check needs review: payment-call-outcome"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || true)
          if [ "$CF" = "charged_failed" ]; then
            ROWS=""
            if [ -n "$OP_TOKEN" ]; then
              ROWS=$(curl -s --max-time 20 -H "Authorization: Bearer $OP_TOKEN" "$PROD/__operator/mpp-reconcile.json" \
                | jq -r '"last 24h: \(.status.chargedFailed24h.total // "?") (\(.status.chargedFailed24h.external // "?") external, \(.status.chargedFailed24h.internal // "?") internal)"' 2>/dev/null || echo "")
            fi
            BODY=$(printf 'An MPP call (Tempo, Stripe SPT or the MPP evm wire) settled and was then answered with a non-200 in the last 24 hours, so the buyer paid and did not get their answer. The debt is on the refund ledger; see GET /__operator/refunds.json and the [mpp-tempo]/[mpp-stripe] CHARGED-BUT-NOT-SERVED log line for the cause.\n\n%s\n\nCloses when the 24-hour count is back to zero.' "${ROWS:-(counts need the operator token)}")
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$CF" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # The spending wallet should never go DOWN, so a fall is worth more than
      # a floor. Everything that spends from it also settles into it
      # (SELF_FUNDING_SLUGS), and every execution tier charges more than it can
      # spend, so barring a manual withdrawal the balance only rises. A
      # low-water alarm fires after the money is gone; this fires on the first
      # unexplained dollar. A withdrawal trips it too, deliberately: the alarm's
      # job is to say "this wallet fell and nobody told me". The operator who
      # withdrew acknowledges it (POST /__operator/upstream-buyer/acknowledge),
      # which re-baselines the stored high-water mark, so the next read is ok
      # and the issue closes here; closing the issue by hand does not, since
      # the trend still reads draining and the next run opens it again.
      - name: Upstream buyer wallet trend (a self-funding wallet that FALLS is unexplained)
        if: always()
        continue-on-error: true
        run: |
          TREND=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyer.trend // "unknown"' 2>/dev/null || echo unknown)
          echo "upstream buyer trend: $TREND"
          TITLE="Scheduled check needs review: buyer-wallet-trend"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$TREND" = "draining" ]; then
            if [ -z "$OPEN" ]; then
              # Single-quoted heredoc: the curl line below is text for the
              # reader, and $AGENT402_OPERATOR_TOKEN is never expanded here.
              read -r -d '' BODY <<'EOF_BODY' || true
          The x402 upstream spending wallet has fallen below its high-water mark across several consecutive reads.

          The route-execute tiers are SELF-FUNDING: they settle into this wallet and each charges more than it can spend, so their traffic can only raise the balance. A sustained fall means one of:

          1. A manual withdrawal. If that was you, acknowledge it: this re-baselines the stored high-water mark to the current balance, the next read is ok, and the next heartbeat run closes this issue. Closing the issue by hand does not clear the alarm; the next run opens it again.

             curl -s -X POST -H "X-Operator-Token: $AGENT402_OPERATOR_TOKEN" https://agent402.tools/__operator/upstream-buyer/acknowledge

             Export the token from your own secret store first; never paste it into this issue. The answer names when it was acknowledged and whether the state store kept it (a 503 means it did not: send it again).
          2. seller-payability or attest, which spend from this wallet without settling into it (seller-payability probes external sellers; attest pays Base gas in ETH). A slow trickle from those is expected and sits inside the tolerance; a sustained fall is not.
          3. Upstream spend whose revenue never arrived: a buyer's payment verified and then failed to settle, which is the drain the per-payer ceiling in src/external-spend-guard.js bounds. Check /__operator/stats and the route-execute receipts.
          4. Something we do not understand, which is why this alarm exists. Do not acknowledge a fall you cannot explain.

          Balances are deliberately not published on /api/gateway-status; read the wallet directly to see the number.
          EOF_BODY
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$TREND" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # Settlement freshness — the alarm that did not exist on 2026-08-07.
      #
      # The daily paid canary stopped buying on 2026-08-02 and reported success
      # every time, because its gate keyed on "last successful RUN" and a run
      # that SKIPS the buy also concludes successfully, so each skip refreshed
      # the window the next gate read. Nothing paged, because skipping is not a
      # failure. The only thing that noticed was /status, which showed the
      # settlement component stale — and that only surfaced because a human
      # happened to read the page five days later.
      #
      # So this watches the OBSERVATION, not the workflow. A run that claims
      # success while buying nothing leaves no observation, and an absent
      # observation is exactly what this pages on. It cannot be fooled by the
      # monitor's own green.
      #
      # SELF-HEAL, once per episode: on the FIRST detection (no issue open yet)
      # it dispatches the canary, which always buys because the freshness gate
      # applies to scheduled runs only. If that purchase settles, the next
      # heartbeat closes the issue and nobody is woken. Bounded deliberately to
      # the issue-opening branch: a dispatch spends real USDC across the rails,
      # and if buying is genuinely broken we must page, not retry in a loop.
      # "outage" is NOT handled here — a canary that ran and failed opens its
      # own issue, and two alarms for one event is noise.
      - name: Settlement freshness (the daily canary must actually BUY, not just conclude green)
        if: always()
        continue-on-error: true
        run: |
          SNAP=$(curl -s --max-time 20 "$PROD/api/status" || true)
          STATE=$(printf '%s' "$SNAP" | jq -r '(.components[]? | select(.key=="settlement") | .current.state) // "unreadable"' 2>/dev/null || echo unreadable)
          AGEH=$(printf '%s' "$SNAP" | jq -r '((.components[]? | select(.key=="settlement") | .current.ageMs) // 0) / 3600000 | floor' 2>/dev/null || echo 0)
          echo "settlement observation: state=$STATE age=${AGEH}h"
          # An unreadable page is not evidence of a stale canary - it is
          # evidence we could not look. The prod-down alarm above owns that.
          [ "$STATE" = "unreadable" ] && exit 0
          TITLE="Scheduled check needs review: settlement-age"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$STATE" = "unknown" ]; then
            if [ -z "$OPEN" ]; then
              gh workflow run paid-canary.yml --repo "$GITHUB_REPOSITORY" --ref main \
                && HEAL="A canary run has been dispatched automatically (a dispatch always buys - the freshness gate applies to scheduled runs only). If it settles, this issue closes itself on the next heartbeat." \
                || HEAL="Automatic dispatch FAILED, so nothing is retrying on its own."
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATE" = "operational" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Alert (open issue) or clear (close issue)
        run: |
          OPEN=$(ISSUE_TITLE='Scheduled check needs review: availability' ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Scheduled check needs review: availability"' --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "${{ steps.probe.outputs.status }}" = "down" ]; then
            BODY="Heartbeat failed 3 consecutive probes (checks:${{ steps.probe.outputs.fails }}).
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Railway dashboard: https://railway.app (check the agent402 service). Re-deploy with a [deploy] commit or the deploy workflow_dispatch."
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Scheduled check needs review: availability" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            fi
            exit 1
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # GitHub delivers this workflow's "*/15" schedule roughly ONCE AN HOUR
      # (measured 2026-07-27: gaps of 60-72 min, plus one 3.3h stall), while
      # /status marks these components stale after 45 minutes. The result was a
      # page reporting "degraded" while production was perfectly healthy -- the
      # exact threshold-vs-cadence mismatch src/status.js warns about.
      #
      # The honest fix is more observations, not a looser alarm, so spread
      # further real probes across the rest of the hour. This runs LAST on
      # purpose: the authoritative probe and every issue open/close above have
      # already completed, so nothing that can page is delayed by it. A failure
      # here is recorded like any other observation and never fails the run.
      - name: Keep status observations fresh until the next run
        if: always()
        continue-on-error: true
        env:
          POW_SECRET: ${{ secrets.POW_SECRET }}
          ROBINHOOD_FACILITATOR_URL: ${{ secrets.ROBINHOOD_FACILITATOR_URL }}
          ARC_RAIL_INTENDED: ${{ secrets.CIRCLE_FACILITATOR_API_KEY != '' }}
          # "true" when the Ink facilitator list secret is set: the operator
          # intends the Ink rail, so the rails check requires eip155:57073.
          INK_RAIL_INTENDED: ${{ secrets.INK_FACILITATOR_URL != '' }}
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          # Narrow credential for POST /api/status/probe; falls back to OP_TOKEN.
          PROBE_TOKEN: ${{ secrets.STATUS_PROBE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$OP_TOKEN" ] || { echo "no operator token - skipping freshness loop"; exit 0; }
          . scripts/heartbeat-probe.sh
          for i in 1 2 3 4; do
            sleep 720
            if probe; then
              echo "refresh $i: healthy"
              record_observation up ""
            else
              echo "refresh $i: FAILS=$FAILS"
              record_observation down "$FAILS"
            fi
          done
