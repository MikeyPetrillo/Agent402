name: Heartbeat

# Production telemetry, fully automated:
#   • every 15 min — is agent402.tools actually serving? (health, catalog,
#     a real proof-of-work paid call, the MCP connector). Persistent failure
#     opens a GitHub issue; recovery closes it.
#
# Revenue tracking lives elsewhere now — the /__operator dashboard, /api/stats,
# and on-chain history at https://basescan.org/address/0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0#tokentxns
# are the canonical sources. The old "external customer payments" issue-comment
# loop was useful as a first-customer alarm but doesn't scale — every new buy
# became a new comment on one issue, which becomes unreadable at volume.
on:
  schedule:
    # Asked for every 15 minutes; DELIVERED every 4-7 hours (measured
    # 2026-08-30 and again 2026-10-02 - GitHub throttles high-frequency
    # schedules). "9,39" was tried 2026-08-30 and did not help, and the wallet
    # balance, credits, drain and Postgres alarms moved to the Cloudflare status
    # Worker (5-minute cron, issues-only token) the same day, which is why the
    # schedule went back to */15. The Worker now also runs every check that
    # reads a word on /api/gateway-status, plus production DOWN and settlement
    # freshness. The checks that live ONLY here page at this workflow's real
    # cadence, hours late: the rail offer (/api/rails), Bazaar validation, the
    # canary burner, the PayAI and CDP quota watches and serving health
    # (operator token). Re-measure before trusting any number in this comment.
    - cron: "*/15 * * * *"
  push:
    branches:
      - "main"
      - "claude/sweet-brown-i99jl3"
    paths:
      - ".github/trigger-heartbeat"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  # For the settlement-freshness step's one self-healing `gh workflow run`.
  # Nothing else here dispatches anything.
  actions: write

env:
  PROD: https://agent402.tools

jobs:
  health:
    runs-on: ubuntu-24.04
    # Raised for the freshness loop in the final step (4 x 12 min of extra
    # observations). Everything that can page has already run by then.
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Probe production (3 attempts before declaring an outage)
        id: probe
        env:
          # Needed so the probe can mint the same X-Heartbeat-Token the server
          # verifies — keeps internal probe traffic out of the external PoW rail
          # on the operator dashboard. Without it the probe still works but its
          # successful PoW call is counted as real external demand. The paywall
          # read carries the same token, so the unpaid-quote budget never counts
          # or refuses it (a caller spending that budget from a shared runner
          # address cannot keep the paywall unobserved).
          POW_SECRET: ${{ secrets.POW_SECRET }}
          # Presence of this secret is the "operator intends the Robinhood/USDG
          # rail" signal — the rails check below only requires eip155:4663 in
          # the live 402 accepts when it is set, so intentionally disabling the
          # rail (removing the secret) never pages.
          ROBINHOOD_FACILITATOR_URL: ${{ secrets.ROBINHOOD_FACILITATOR_URL }}
          # "true" when the Circle facilitator key secret is set: the operator
          # intends the Arc rail, so the rails check requires eip155:5042. Only
          # the comparison reaches the job, never the key.
          ARC_RAIL_INTENDED: ${{ secrets.CIRCLE_FACILITATOR_API_KEY != '' }}
          # "true" when the Ink facilitator list secret is set: the operator
          # intends the Ink rail, so the rails check requires eip155:57073.
          INK_RAIL_INTENDED: ${{ secrets.INK_FACILITATOR_URL != '' }}
        run: |
          . scripts/heartbeat-probe.sh
          for attempt in 1 2 3; do
            if probe; then echo "status=up" >> "$GITHUB_OUTPUT"; echo "paywall_unknown=$PAYWALL_UNKNOWN" >> "$GITHUB_OUTPUT"; echo "production healthy (attempt $attempt)"; exit 0; fi
            echo "attempt $attempt failed:$FAILS — retrying in 60s"
            sleep 60
          done
          echo "status=down" >> "$GITHUB_OUTPUT"
          echo "fails=$FAILS" >> "$GITHUB_OUTPUT"
          echo "paywall_unknown=$PAYWALL_UNKNOWN" >> "$GITHUB_OUTPUT"

      # Record what this probe observed, so /status can show availability
      # measured from OUTSIDE production rather than production's opinion of
      # itself. Best-effort by design: never `-e`-fails the job, because a
      # status-page write must not turn a healthy heartbeat red. When prod is
      # down this POST cannot land either — that absence is the evidence, and
      # /status renders a missing observation as a gap rather than as uptime.
      - name: Record the probe on /status
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          # Narrow credential for POST /api/status/probe; falls back to OP_TOKEN.
          PROBE_TOKEN: ${{ secrets.STATUS_PROBE_TOKEN }}
          STATUS: ${{ steps.probe.outputs.status }}
          FAILS: ${{ steps.probe.outputs.fails }}
          # "1" when the unpaid-quote budget refused the paywall read twice (the
          # fallback for a read sent without POW_SECRET):
          # paywall and rails were not observed and are left out of the record.
          PAYWALL_UNKNOWN: ${{ steps.probe.outputs.paywall_unknown }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          . scripts/heartbeat-probe.sh
          record_observation "$STATUS" "$FAILS"

      # An open issue this check filed under a previous title gets the current
      # one, so the lookups below find it (scripts/adopt-issue-titles.js).
      - name: Adopt an open issue filed under a previous title
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/adopt-issue-titles.js

      # Paywall not observed (the fallback): this run's paywall read is signed
      # with X-Heartbeat-Token, so the unpaid-quote budget never refuses it;
      # paywall_unknown=1 means it was refused anyway (POW_SECRET missing, or a
      # server that does not honor the token), and the paywall went unchecked
      # by this observer. Opens only: the status Worker owns this title and
      # closes it on its next observed paywall read (a close here, while the
      # Worker is the one refused, would reopen every few runs).
      - name: Paywall observation check (alarm on an unobserved paywall read)
        if: always()
        continue-on-error: true
        env:
          PAYWALL_UNKNOWN: ${{ steps.probe.outputs.paywall_unknown }}
        run: |
          TITLE="Scheduled check needs review: paywall-read"
          [ "$PAYWALL_UNKNOWN" = "1" ] || { echo "paywall observed by this run"; exit 0; }
          # Only an issue with exactly this title, opened by the workflow bot
          # or the repository owner (the account the status Worker posts as),
          # is the alarm: an open one gets a comment, so a run after run of
          # refused reads (a mismatched POW_SECRET) keeps one issue.
          OPEN=$(ALARM_NAME="$TITLE" ALARM_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ALARM_NAME) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ALARM_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
            echo "already tracked in #$OPEN"; exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."

      # Gateway credits: /v1 tiers settle the buyer's USDC before the handler
      # runs, so an empty OpenRouter balance turns every gateway call into
      # "charged but failed". Alarm on "low" BEFORE that happens. Separate
      # issue from "production DOWN" (prod is serving fine); never fails the
      # heartbeat run itself, and "unknown"/"unconfigured" never page.
      # A rail can be down for DAYS without anyone knowing.
      #
      # payments.js drops a rail whose facilitator is unreachable so the other
      # chains keep settling - correct, and the reason a dead Celo facilitator
      # costs one chain instead of every paid route. But the drop is quiet by
      # design: paid revenue keeps flowing, /health stays 200, and the only
      # trace is a boot log. Celo sat dropped for days and surfaced only because
      # someone happened to ask why the revenue page looked short.
      #
      # Deliberately an ISSUE, not a page. A degraded rail is not an outage -
      # the other chains are still earning - so it sits at the same severity as
      # "burner LOW": visible, tracked, auto-closing, nobody woken.
      - name: Rail check (alarm on a configured rail that is not being offered)
        if: always()
        continue-on-error: true
        run: |
          RAILS=$(curl -s --max-time 15 "$PROD/api/rails" || echo '{}')
          DEGRADED=$(echo "$RAILS" | jq -r '.degraded // empty' 2>/dev/null || echo "")
          TITLE="Scheduled check needs review: rail-offers"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          # An unreadable surface is NOT evidence of health: say so and stop,
          # rather than closing a real issue on the back of a failed curl.
          if [ -z "$DEGRADED" ]; then
            echo "rails: /api/rails unreadable - not treating that as healthy; leaving any open issue alone"
            exit 0
          fi
          # The Circle Gateway batched option, when switched on, counts too: a
          # network it was asked for and does not offer for a failure (its
          # reason word, e.g. probe-timeout or read-failed) is listed beside the
          # rails. not-in-offer (the network's plain rail is not configured) and
          # probe-skipped (the boot probe is switched off) are configuration
          # facts and never page. Absent field = 0.
          BATCHED=$(echo "$RAILS" | jq -r '[.gatewayBatched.dropped // [] | .[] | select(.reason != "not-in-offer" and .reason != "probe-skipped")] | length' 2>/dev/null || echo 0)
          case "$BATCHED" in ''|*[!0-9]*) BATCHED=0;; esac
          echo "rails: degraded=$DEGRADED batched-dropped=$BATCHED"
          if [ "$DEGRADED" -gt 0 ] || [ "$BATCHED" -gt 0 ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              echo "already tracked in #$OPEN"
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Gateway credits check (alarm on low OpenRouter balance)
        if: always()
        continue-on-error: true
        run: |
          BODY=$(curl -s --max-time 15 "$PROD/api/gateway-status" || echo '{}')
          STATUS=$(echo "$BODY" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
          UNKNOWN_MIN=$(echo "$BODY" | jq -r '.unknownForMinutes // 0' 2>/dev/null || echo 0)
          echo "gateway credits: $STATUS (credits leg: $(echo "$BODY" | jq -r '.credits // "-"' 2>/dev/null), key-limit leg: $(echo "$BODY" | jq -r '.keyLimit // "-"' 2>/dev/null), unknown for ${UNKNOWN_MIN}m)"
          TITLE="Scheduled check needs review: gateway-credits"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          # A balance we cannot READ is its own alarm once it persists: "unknown"
          # never paged, which is exactly how a dead alarm stays dead. 180 min =
          # several heartbeat runs, well past any OpenRouter blip (server caches
          # the read for 5 min and only goes unknown when BOTH legs are unreadable).
          TITLE2="Scheduled check needs review: gateway-credits-read"
          OPEN2=$(ISSUE_TITLE="$TITLE2" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE2\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$STATUS" = "unknown" ] && [ "${UNKNOWN_MIN:-0}" -ge 180 ] 2>/dev/null; then
            if [ -z "$OPEN2" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE2" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            fi
          elif [ "$STATUS" != "unknown" ] && [ -n "$OPEN2" ]; then
            gh issue close "$OPEN2" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # (The direct facilitator /health XLM check that lived here duplicated the
      # gateway-status leg below under a second issue title; removed 2026-10-02.)

      # Bazaar listing validation - Coinbase's keyless, read-only
      # POST /platform/v2/x402/validate probes our checked routes (the flagship
      # set and every listing whose content type is not JSON, up to 12) the way the
      # Bazaar crawler does (402 shape, PAYMENT-REQUIRED, accepts, bazaar
      # extension, simulated accept, index membership). Never called before
      # 2026-08-19; a broken 402 on one route could silently drop its listing
      # for weeks. Exit 1 = a route is INVALID (our defect) -> issue; exit 2 =
      # the validator itself unreadable (CDP-side) -> loud warning, no issue.
      # The FAIL and unreadable rows print first, so the tail never hides one;
      # the run ends at the script's own deadline (8 minutes) at the latest.
      # A non-JSON listing that is valid but not in the index is a warning and
      # a job-summary line on every run (no issue: the index lags the
      # validator); an INVALID non-JSON listing adds the listing switch to the
      # issue body.
      # The streak of runs whose validator was unreadable, kept in the Actions
      # cache between runs (the step after the validation reads and writes it).
      - name: Restore the validator unreadable streak
        if: always()
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bazaar-validate-streak
          key: bazaar-validate-streak-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bazaar-validate-streak-
      - name: Bazaar listing validation (checked routes vs CDP validate)
        id: bazaar_validate
        if: always()
        continue-on-error: true
        run: |
          set +e
          OUT=$(TARGET_URL="$PROD" node scripts/bazaar-validate.js 2>&1); CODE=$?
          set -e
          if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "code=$CODE" >> "$GITHUB_OUTPUT"; fi
          echo "$OUT" | grep -E '^(FAIL|\?\?) |INVALID|UNREADABLE' || true
          echo "$OUT" | tail -40
          echo "$OUT" | grep '^WARN not-indexed ' | while IFS= read -r LINE; do echo "::warning::Bazaar: $LINE"; echo "- Bazaar: $LINE" >> "$GITHUB_STEP_SUMMARY"; done || true
          TITLE="Scheduled check needs review: listing-validation"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$CODE" = "1" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$CODE" = "2" ]; then
            echo "::warning::CDP validate endpoint UNREADABLE for at least one checked route - not silently skipping; the listing check is blind this run"
          elif [ "$CODE" = "0" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # The validator itself unreadable (exit 2) only warns on one run. Three
      # unreadable runs in a row, or two in a row half a day or more apart,
      # open one issue: the listing check has been blind that long. The
      # streak is kept in the Actions cache; the open issue holds the page and
      # gets no comments; the next readable run (exit 0 or 1, whatever its
      # verdict) closes it and starts the streak again. A validation step that
      # did not finish leaves the streak as it was.
      - name: Bazaar validator unreadable streak (page when the listing check stays blind)
        if: always()
        continue-on-error: true
        env:
          CODE: ${{ steps.bazaar_validate.outputs.code }}
          STREAK_FILE: .bazaar-validate-streak/state.json
        run: |
          mkdir -p "$(dirname "$STREAK_FILE")"
          NOW=$(date -u +%s)
          PREV_N=$(jq -r '.streak // 0' "$STREAK_FILE" 2>/dev/null || echo 0)
          PREV_SINCE=$(jq -r '.since // 0' "$STREAK_FILE" 2>/dev/null || echo 0)
          case "$PREV_N" in ''|*[!0-9]*) PREV_N=0 ;; esac
          case "$PREV_SINCE" in ''|*[!0-9]*) PREV_SINCE=0 ;; esac
          TITLE="Scheduled check needs review: listing-validation-read"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$CODE" in
            2)
              N=$((PREV_N + 1))
              SINCE=$PREV_SINCE
              if [ "$PREV_N" -eq 0 ] || [ "$SINCE" -eq 0 ]; then SINCE=$NOW; fi
              printf '{"streak":%s,"since":%s}\n' "$N" "$SINCE" > "$STREAK_FILE"
              echo "validator unreadable on $N run(s) in a row"
              if [ "$N" -ge 3 ] || { [ "$N" -ge 2 ] && [ $((NOW - SINCE)) -ge 43200 ]; }; then
                if [ -z "$OPEN" ]; then
                  gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
                fi
              fi
              ;;
            0|1)
              printf '{"streak":0,"since":0}\n' > "$STREAK_FILE"
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            *)
              echo "the validation step did not finish; the streak is left as it was"
              [ -f "$STREAK_FILE" ] || printf '{"streak":0,"since":0}\n' > "$STREAK_FILE"
              ;;
          esac
      - name: Save the validator unreadable streak
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bazaar-validate-streak
          key: bazaar-validate-streak-${{ github.run_id }}-${{ github.run_attempt }}

      # Security advisories waiting in triage: a private report waits on a
      # maintainer, and nothing else pages on one. The built-in token cannot
      # read advisories, so the read uses ADVISORY_READ_TOKEN (fine-grained,
      # this repository, Security advisories read), passed to the script only.
      # The issue is public: one fixed body that points to the Security tab (no
      # GHSA id, age or count; those go to the job log), opened once and never
      # commented on while it stays open, closed when clear. An id listed in
      # repo var ADVISORY_TRIAGE_ACK (comma list) does not page; the limit is
      # repo var ADVISORY_TRIAGE_MAX_HOURS (default 24). A read that fails (no
      # token, 401/403/5xx) opens its own fixed-text issue, never a pass, and
      # leaves the triage issue as it was.
      - name: Security advisory triage check (alarm on a report in triage past the limit)
        if: always()
        continue-on-error: true
        env:
          ADVISORY_READ_TOKEN: ${{ secrets.ADVISORY_READ_TOKEN }}
          ADVISORY_TRIAGE_ACK: ${{ vars.ADVISORY_TRIAGE_ACK }}
          ADVISORY_TRIAGE_MAX_HOURS: ${{ vars.ADVISORY_TRIAGE_MAX_HOURS }}
        run: |
          TITLE="Scheduled check needs review: security-advisory"
          TITLE2="Scheduled check needs review: security-advisory-read"
          BODY_FILE="$RUNNER_TEMP/advisory-triage-body.md"
          rm -f "$BODY_FILE"
          CODE=0
          ADVISORY_BODY_FILE="$BODY_FILE" node scripts/advisory-triage-check.js || CODE=$?
          # Only an open issue with exactly this title, opened by the workflow
          # bot, is the alarm.
          find_open() {
            ALARM_NAME="$1" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$1\"" --json number,title,author --jq '[.[] | select(.title == env.ALARM_NAME) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions")][0].number // empty' 2>/dev/null || echo ""
          }
          OPEN=$(find_open "$TITLE")
          OPEN2=$(find_open "$TITLE2")
          if [ "$CODE" = "0" ]; then
            [ -z "$OPEN" ] || gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            [ -z "$OPEN2" ] || gh issue close "$OPEN2" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          elif [ "$CODE" = "1" ] && [ -s "$BODY_FILE" ]; then
            [ -z "$OPEN2" ] || gh issue close "$OPEN2" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            # Open once; a repeat run posts nothing while the issue stays open.
            [ -n "$OPEN" ] || gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
          else
            echo "::warning::security advisory triage check UNREADABLE (exit $CODE) - not silently passing"
            [ -s "$BODY_FILE" ] || printf 'The heartbeat could not run the security advisory triage check. The heartbeat job log names the error. Auto-closes on the next readable check.\n' > "$BODY_FILE"
            [ -n "$OPEN2" ] || gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE2" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
          fi

      # Canary burner balance watch: an empty burner once read as a settlement
      # outage on the status page. Warn before it runs dry. Public RPC, no keys;
      # an unreadable balance warns loudly rather than silently passing.
      # The mark is one full keep-alive pass above the ceiling plus a margin
      # (scripts/keepalive-plan.js low-water, from the live catalog), never
      # under the repo var CANARY_BURNER_LOW_USD, which is also the mark when
      # the catalog cannot be read. An open LOW issue gets at most one comment
      # a day, and a read on that stand-in mark never closes it (the derived
      # mark it was opened on may sit above the floor).
      - name: Canary burner balance watch (Base USDC)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BURNER: "0x902dCf34E53695bDEA2fFB354b1a2e58bD598256"
          FLOOR_USD: ${{ vars.CANARY_BURNER_LOW_USD || '1' }}
          # The MCP listings pass counts toward the mark only while its schedule is on.
          BAZAAR_MCP_KEEPALIVE: ${{ vars.BAZAAR_MCP_KEEPALIVE }}
        run: |
          WARN_USD=$(TARGET_URL=https://agent402.tools GH_TOKEN="" node scripts/keepalive-plan.js low-water 2>/dev/null | grep -E '^[0-9]+(\.[0-9]+)?$' | tail -1)
          FALLBACK=0
          [ -n "$WARN_USD" ] || { WARN_USD="$FLOOR_USD"; FALLBACK=1; echo "::warning::keep-alive pass total unreadable; burner low-water is the repo var alone"; }
          DATA="0x70a08231000000000000000000000000${BURNER#0x}"
          BAL=$(curl -s --max-time 15 https://mainnet.base.org -H 'Content-Type: application/json'             -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_call\",\"params\":[{\"to\":\"0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913\",\"data\":\"$DATA\"},\"latest\"]}"             | jq -re '.result' 2>/dev/null) || { echo "::warning::burner balance UNREADABLE — not silently skipping, investigate"; exit 0; }
          USD=$(node -e "console.log((parseInt('$BAL',16)/1e6).toFixed(4))")
          echo "canary burner Base USDC read"
          TITLE="Scheduled check needs review: canary-wallet"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          LOW=$(node -e "console.log($USD < $WARN_USD ? 1 : 0)")
          if [ "$LOW" = "1" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              LAST=$(gh issue view "$OPEN" --repo "$GITHUB_REPOSITORY" --json createdAt,comments --jq '[.createdAt, (.comments[]?.createdAt)] | max // empty' 2>/dev/null)
              if [ -n "$LAST" ] && node -e "process.exit(Date.now() - Date.parse(process.argv[1]) >= 86400000 ? 0 : 1)" "$LAST"; then
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              else
                echo "burner still low; the open issue was noted within the last day"
              fi
            fi
          elif [ -n "$OPEN" ] && [ "$FALLBACK" = "1" ]; then
            echo "burner above the stand-in mark only; the open issue stays open until the derived mark reads"
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # PayAI credit watch. PayAI bills settlements in credits weighted per
      # chain against an allowance per receiving wallet that does not reset.
      # PayAI is first-tried only for Avalanche and Sei, so those rails draw it
      # down; fallback hops onto PayAI are not visible here (a lower bound).
      # Counted from the on-chain ledger since the pricing start. A missing or
      # unparseable field is logged loudly, never treated as "fine".
      - name: PayAI credit watch (allowance per receiving wallet)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          THRESH: ${{ vars.PAYAI_QUOTA_WARN || 800 }}
          # Credits per exact settlement, by rail. Read live from PayAI's own
          # published table (facilitator.payai.network/pricing) on every run.
          # When it is unreadable the step uses the repo variable
          # PAYAI_FALLBACK_WEIGHTS (JSON {"avalanche":n,"sei":n}); vendor rates
          # are never committed. With neither, it warns and skips the watch.
          PAYAI_FALLBACK_WEIGHTS: ${{ vars.PAYAI_FALLBACK_WEIGHTS }}
        run: |
          CUT=2026-09-21
          # CAIP-2 ids of the two rails PayAI is first-tried on.
          LIVE=$(curl -s --max-time 15 -H 'Accept: application/json' https://facilitator.payai.network/pricing | jq -ce \
            '[.rates[]? | select(.scheme=="exact" and (.transferMethod // "eip3009")=="eip3009")] as $r
             | {avalanche: ($r[] | select(.network=="eip155:43114") | .credits | tonumber),
                sei: ($r[] | select(.network=="eip155:1329") | .credits | tonumber)}
             | select(.avalanche != null and .sei != null and .avalanche > 0 and .sei > 0)' 2>/dev/null | head -1 || true)
          if [ -n "$LIVE" ]; then WEIGHTS="$LIVE"; SRC=live
          elif [ -n "$PAYAI_FALLBACK_WEIGHTS" ] && echo "$PAYAI_FALLBACK_WEIGHTS" | jq -e '(.avalanche > 0) and (.sei > 0)' >/dev/null 2>&1; then WEIGHTS="$PAYAI_FALLBACK_WEIGHTS"; SRC=fallback; echo "::warning::PayAI live pricing table unreadable - using the PAYAI_FALLBACK_WEIGHTS repo variable"
          else echo "::warning::PayAI credit watch skipped - the live pricing table is unreadable and no PAYAI_FALLBACK_WEIGHTS repo variable is set. Investigate."; exit 0; fi
          echo "PayAI credit weights ($SRC): read"
          CREDITS=$(curl -s --max-time 20 "$PROD/api/revenue/daily" | jq -e --arg cut "$CUT" --argjson w "$WEIGHTS" \
            '[.days[] | select(.day >= $cut) | select(.chain=="avalanche" or .chain=="sei") | (.extTx + .intTx) * $w[.chain]] | add // 0 | . * 100 | round / 100') \
            || { echo "::warning::PayAI credit watch UNREADABLE - /api/revenue/daily missing or unparseable. NOT skipping silently: investigate."; exit 0; }
          if awk -v c="$CREDITS" -v t="$THRESH" 'BEGIN { exit !(c >= t) }'; then echo "PayAI weighted credits since $CUT: at or over the warn mark"; else echo "PayAI weighted credits since $CUT: under the warn mark"; fi
          TITLE="Scheduled check needs review: facilitator-allowance"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if awk -v c="$CREDITS" -v t="$THRESH" 'BEGIN { exit !(c >= t) }'; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # CDP settlement metering watch. CDP's billing gate answers
      # `payment-method-required` on /settle when an account cannot be charged,
      # which would take Base down. Informational at CDP_METERED_WARN; the real
      # alarm for a billing lapse is the paid canary failing a rail leg.
      - name: CDP settlement metering watch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          THRESH: ${{ vars.CDP_METERED_WARN || 20000 }}
        run: |
          CUT=$(date -u -d '30 days ago' +%F)
          COUNT=$(curl -s --max-time 20 "$PROD/api/revenue/daily" | jq -e --arg cut "$CUT" \
            '[.days[] | select(.day >= $cut) | select(.chain=="base" or .chain=="solana" or .chain=="polygon" or .chain=="arbitrum") | (.extTx + .intTx)] | add // 0' 2>/dev/null || echo "unreadable")
          if [ "$COUNT" = "unreadable" ]; then
            echo "WARNING: CDP metering count unreadable from /api/revenue/daily - not treating that as fine"
            exit 0
          fi
          if [ "$COUNT" -ge "$THRESH" ] 2>/dev/null; then echo "CDP-first-chain settles, rolling 30d: at or over the warn mark"; else echo "CDP-first-chain settles, rolling 30d: under the warn mark"; fi
          TITLE="Scheduled check needs review: facilitator-metering"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$COUNT" -ge "$THRESH" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # x402 spending-wallet check - same pattern as gateway credits above:
      # when the upstream buyer wallet (src/upstream-buyer-status.js) runs dry
      # the paths that spend from it refuse quietly (x402 buyers not charged), so
      # alarm on "low" first.
      # "unknown"/"unconfigured" never page.
      - name: Upstream buyer wallet check (alarm on low x402 spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyer.status // "unknown"' 2>/dev/null || echo unknown)
          echo "upstream buyer wallet: $STATUS"
          TITLE="Scheduled check needs review: buyer-wallet"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # Algorand spending-wallet check — same pattern as the Base wallet above:
      # this wallet pays external Algorand sellers for the SOR (route-execute
      # settles to the TREASURY, so this wallet only drains). optedIn:false
      # also buckets as "low" — an un-opted-in wallet can't pay at all.
      # "unknown"/"unconfigured" never page.
      - name: Upstream call budget elevated
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Counts OUR outbound calls per paid upstream against a daily budget.
          # Not a balance - most of these publish none. Catches a step change
          # (a loop, a sweep that started buying) before the bill or the quota
          # does, in both directions: a quota that lapses refuses a product,
          # and a pay-as-you-go host bills without earning.
          BODY=$(curl -s --max-time 15 "$PROD/api/gateway-status" || echo '{}')
          STATUS=$(echo "$BODY" | jq -r '.upstreamBudgets.status // "unknown"' 2>/dev/null || echo unknown)
          TITLE="Scheduled check needs review: upstream-call-budget"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "elevated" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            fi
          elif [ -n "$EXISTING" ] && [ "$STATUS" = "ok" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      - name: Upstream hard ceiling reached
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A pay-as-you-go upstream reached its hard daily ceiling, so calls
          # to it are being refused (not charged on x402) until 00:00 UTC.
          BODY=$(curl -s --max-time 15 "$PROD/api/gateway-status" || echo '{}')
          STATUS=$(echo "$BODY" | jq -r '.upstreamHardCaps.status // "unknown"' 2>/dev/null || echo unknown)
          TITLE="Scheduled check needs review: upstream-ceiling"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "capped" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            fi
          elif [ -n "$EXISTING" ] && [ "$STATUS" = "ok" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # X data daily spend (src/tools/x-data-kit.js): over = past the alarm
      # ceiling and still serving; capped = the hard ceiling refuses, or
      # refused a call within the last hour. off is the switch and never pages.
      - name: X data daily spend over its ceiling
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.xDataSpend.status // "unknown"' 2>/dev/null || echo unknown)
          echo "x data spend: $STATUS"
          TITLE="Scheduled check needs review: post-data-spend"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "over" ] || [ "$STATUS" = "capped" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            fi
          elif { [ "$STATUS" = "ok" ] || [ "$STATUS" = "off" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # Our Circle Gateway balance (src/gateway-nanopayments.js): withdraw holds
      # from the read that reaches GATEWAY_WITHDRAW_ALERT_USD until an operator
      # moves the balance, so it pages at once. ok and off close; unknown does
      # neither. The status Worker runs the same check under the same title.
      - name: Gateway balance check (alarm when it is ready to withdraw)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ROW=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '(.gatewayBalance.status // "unknown") + " none"' 2>/dev/null || echo "unknown unknown")
          STATUS=${ROW%% *}; ALERT=${ROW##* }
          echo "gateway balance: $STATUS (alert $ALERT)"
          TITLE="Scheduled check needs review: gateway-balance"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "withdraw" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif { [ "$STATUS" = "ok" ] || [ "$STATUS" = "off" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # A top outside payer's verified paid calls are failing
      # (src/top-buyer-failures.js): alert pages once, ok closes; unknown, off
      # and a blind read do neither. The payer, tools and our error text are
      # on the operator view only; this issue names none of them.
      - name: Top buyer failures check (alarm when a top paying buyer gets failed answers)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.topBuyerFailures.status // "unknown"' 2>/dev/null || echo unknown)
          echo "top buyer failures: $STATUS"
          TITLE="Scheduled check needs review: top-buyer-failures"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "alert" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # A top outside payer got onchain-sql's busy refusal (onchainSqlBusy,
      # src/top-buyer-failures.js): alert pages once, ok closes; unknown, off
      # and a blind read do neither. The payer and times are on the operator
      # view only; this issue names none of them.
      - name: Onchain SQL busy check (alarm when a top paying buyer gets a busy refusal)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.onchainSqlBusy.status // "unknown"' 2>/dev/null || echo unknown)
          echo "onchain sql busy: $STATUS"
          TITLE="Scheduled check needs review: query-service"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "alert" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # The shared limits store (src/shared-limits.js): status reads degraded for
      # a minute after any one failed command, so this pages on the second
      # word, alert=sustained (degraded held ten minutes without a break). on
      # and memory close; degraded inside the grace period does neither.
      - name: Shared limits store check (alarm on a sustained degraded Redis)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ROW=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '(.sharedLimits.status // "unknown") + " " + (.sharedLimits.alert // "unknown")' 2>/dev/null || echo "unknown unknown")
          STATUS=${ROW%% *}; ALERT=${ROW##* }
          echo "shared limits: $STATUS (alert $ALERT)"
          TITLE="Scheduled check needs review: shared-limits-store"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$ALERT" = "sustained" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif { [ "$STATUS" = "on" ] || [ "$STATUS" = "memory" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # Consumed marks the shared store missed (src/replay-guard.js): status
      # reads pending until the next retry pass lands the mark, so this pages
      # on alert=sustained (pending held ten minutes without a break). ok
      # closes; pending inside the grace period does neither.
      - name: Replay store check (alarm on consumed marks pending past the grace period)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ROW=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '(.replayStore.status // "unknown") + " " + (.replayStore.alert // "unknown")' 2>/dev/null || echo "unknown unknown")
          STATUS=${ROW%% *}; ALERT=${ROW##* }
          echo "replay store: $STATUS (alert $ALERT)"
          TITLE="Scheduled check needs review: replay-store-marks"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$ALERT" = "sustained" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # The route judgment's daily token ceiling (jevSpend, src/tool-judge.js):
      # capped pages, ok clears; unknown and absent do neither. The UTC day
      # rolling reads ok again.
      # The status Worker runs the same check under the same title.
      - name: Route judgment ceiling check (alarm when the day's tokens are capped)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.jevSpend.status // "unknown"' 2>/dev/null || echo unknown)
          echo "jevSpend: $STATUS"
          TITLE="Scheduled check needs review: route-judgment-budget"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "capped" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif { [ "$STATUS" = "ok" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # The global unsettled external-spend ceiling (externalSpendGlobal,
      # src/external-spend-guard.js): refusing pages (at the ceiling, or a
      # purchase was refused on it inside the hold), ok and off clear; near is
      # a forecast and does neither, as do unknown and absent.
      # The status Worker runs the same check under the same title.
      - name: External spend global ceiling check (alarm while it refuses)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.externalSpendGlobal.status // "unknown"' 2>/dev/null || echo unknown)
          echo "externalSpendGlobal: $STATUS"
          TITLE="Scheduled check needs review: external-spend"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "refusing" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif { [ "$STATUS" = "ok" ] || [ "$STATUS" = "off" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # Solana transaction-history reads (solanaHistory,
      # src/solana-history-rpc.js): failing pages (most recent reads failed on
      # every lane), publics and fallback clear; idle (no read since restart),
      # unknown and absent do neither.
      # The status Worker runs the same check under the same title.
      - name: Solana history reads check (alarm when every lane fails)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.solanaHistory.status // "unknown"' 2>/dev/null || echo unknown)
          echo "solanaHistory: $STATUS"
          TITLE="Scheduled check needs review: history-reads"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "failing" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif { [ "$STATUS" = "publics" ] || [ "$STATUS" = "fallback" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # EVM log reads (evmLogs, src/evm-logs-rpc.js): failing pages (most
      # recent reads failed on every lane), publics and fallback clear; idle,
      # unknown and absent do neither.
      # The status Worker runs the same check under the same title.
      - name: EVM log reads check (alarm when every lane fails)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.evmLogs.status // "unknown"' 2>/dev/null || echo unknown)
          echo "evmLogs: $STATUS"
          TITLE="Scheduled check needs review: log-reads"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "failing" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif { [ "$STATUS" = "publics" ] || [ "$STATUS" = "fallback" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # The primary speech link's breaker on /api/tts and /api/tts-hd
      # (speechUpstream, src/tools/tts-kit.js): cooling pages (the breaker is
      # open and calls go to the backup voices); ok and probing clear (probing:
      # the cool-down ended and the next call tests the primary link, so the
      # page's claim no longer holds), but only on the second such read in a
      # row: a dead primary with sparse traffic reads probing, then cooling
      # again on its next failed probe, and one probing read between two
      # cool-downs is not a recovery. Unknown and absent do neither.
      # The status Worker runs the same check under the same title.
      - name: Speech upstream check (alarm while the breaker cools)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.speechUpstream.status // "unknown"' 2>/dev/null || echo unknown)
          echo "speechUpstream: $STATUS"
          TITLE="Scheduled check needs review: speech-upstream"
          # The mark counts only on its own line after a blank line, where
          # the status Worker writes and reads it.
          MARK="First ok read at "
          NLMARK=$'\n\n'"$MARK"
          # Only an issue with exactly this title, opened by the workflow bot
          # or the repository owner, is the alarm (the status Worker's rule).
          EXISTING=$(ALARM_NAME="$TITLE" ALARM_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ALARM_NAME) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ALARM_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$STATUS" in
            cooling)
              if [ -z "$EXISTING" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                  --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
              else
                # A bad read after a first ok read starts the count again.
                BODY_NOW=$(gh issue view "$EXISTING" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || echo "")
                case "$BODY_NOW" in
                  *"$NLMARK"*) gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "${BODY_NOW%%$'\n\n'"$MARK"*}" >/dev/null 2>&1 || true ;;
                esac
              fi
              ;;
            ok|probing)
              # Closes on the second such read in a row (this step's or the
              # status Worker's); the first leaves a mark line in the body.
              if [ -n "$EXISTING" ]; then
                BODY_NOW=$(gh issue view "$EXISTING" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || echo "")
                case "$BODY_NOW" in
                  *"$NLMARK"*)
                    gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
                    ;;
                  *)
                    gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "${BODY_NOW}"$'\n\n'"${MARK}$(date -u +%FT%TZ); closes on the next ok read." >/dev/null 2>&1 || true
                    ;;
                esac
              fi
              ;;
          esac

      # The first-call allowance (firstCallAllowance, src/first-call-allowance.js),
      # present only while FIRST_CALL_ALLOWANCE=on: unavailable pages (its
      # reads of the shared store failed, so no first call is granted and the
      # trial measures nothing), on and spent clear (spent is the day's cap
      # working as set); unknown and absent do neither.
      # The status Worker runs the same check under the same title.
      - name: First-call allowance check (alarm while its store is unavailable)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.firstCallAllowance.status // "unknown"' 2>/dev/null || echo unknown)
          echo "firstCallAllowance: $STATUS"
          TITLE="Scheduled check needs review: first-call-allowance"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "unavailable" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif { [ "$STATUS" = "on" ] || [ "$STATUS" = "spent" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # x-search-recent's expanded-author reads today (xSearchAuthors,
      # src/x-search-stats.js): alert pages past X_SEARCH_AUTHOR_DAILY_ALERT,
      # ok clears; unknown and absent do neither. An alarm only.
      # The status Worker runs the same check under the same title.
      - name: X search author reads check (alarm past the daily alert)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.xSearchAuthors.status // "unknown"' 2>/dev/null || echo unknown)
          echo "xSearchAuthors: $STATUS"
          TITLE="Scheduled check needs review: post-author-reads"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "alert" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif { [ "$STATUS" = "ok" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # The referral gate's settlements (referralSettlement, src/referral-gate.js):
      # attention pages once, ok closes; unknown and absent (the gate not
      # mounted) do neither. The reasons are on the operator view only.
      - name: Referral settlement check (alarm when a referral settlement needs an operator)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          # Keys the public reasons mark below; it has no other role.
          MARK_KEY: ${{ secrets.REFERRAL_MARK_KEY }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.referralSettlement.status // "unknown"' 2>/dev/null || echo unknown)
          echo "referralSettlement: $STATUS"
          TITLE="Scheduled check needs review: referral-settlement"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "attention" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
            # One issue covers every reason, so a NEW reason arriving while it is
            # open is said on it. The operator view's tag is a digest of which
            # reasons hold; what is posted is that tag keyed with a DEDICATED
            # key that has no other role (MARK_KEY, HMAC-SHA256, 24 hex), so
            # nobody without that key can map a mark back to reasons, and the
            # mark verifies nothing about any credential. The operator token
            # reads the operator view and is never given to the hashing
            # command. A mark the issue has not carried yet gets one comment.
            # With no mark key set, one fixed comment is posted per issue, with
            # no mark. The tag itself is printed nowhere: not on the issue and
            # not in this job's log, which is as public as the issue is.
            EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
            if [ -n "$EXISTING" ] && [ -n "$OP_TOKEN" ]; then
              TAG=$(curl -s --max-time 15 -H "Authorization: Bearer $OP_TOKEN" "$PROD/__operator/referral.json" | jq -r '.status.tag // ""' 2>/dev/null || echo "")
              if printf '%s' "$TAG" | grep -Eq '^[0-9a-f]{8}$'; then
                if [ -n "$MARK_KEY" ]; then
                  MARK=$(printf '%s' "$TAG" | openssl dgst -sha256 -hmac "$MARK_KEY" 2>/dev/null | sed 's/^.*= *//' | cut -c1-24)
                  if printf '%s' "$MARK" | grep -Eq '^[0-9a-f]{24}$'; then
                    SEEN=$(gh issue view "$EXISTING" --repo "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body] | join(" ")' 2>/dev/null || echo "unreadable reasons mark $MARK")
                    if ! printf '%s' "$SEEN" | grep -q "reasons mark $MARK"; then
                      gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID reasons mark $MARK" >/dev/null 2>&1 || true
                    fi
                  fi
                else
                  SEEN=$(gh issue view "$EXISTING" --repo "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body] | join(" ")' 2>/dev/null || echo "unreadable state: unmarked")
                  if ! printf '%s' "$SEEN" | grep -q "state: unmarked"; then
                    gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID state: unmarked" >/dev/null 2>&1 || true
                  fi
                fi
              fi
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # Balance reads behind the in-flight coverage check (coverageReads,
      # src/inflight-cover.js): status reads degraded for ten minutes after any
      # one paid call judged without a balance read, so this pages on the
      # second word, alert=sustained (such calls in three or more separate
      # minutes of the last ten, for three or more wallets). The issue means
      # sustained, so it closes on what ends that: alert=ok whatever status
      # reads (one wallet keeps status degraded and holds nothing open), or
      # status off (or ok, on a build without the second word), on the second
      # such read in a row. Unknown and absent do neither.
      # The status Worker runs the same check under the same title.
      - name: Coverage balance reads check (alarm on sustained calls judged without a balance read)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ROW=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '(.coverageReads.status // "unknown") + " " + (.coverageReads.alert // "unknown")' 2>/dev/null || echo "unknown unknown")
          STATUS=${ROW%% *}; ALERT=${ROW##* }
          echo "coverageReads: $STATUS (alert $ALERT)"
          TITLE="Scheduled check needs review: coverage-balance-reads"
          # The mark counts only on its own line after a blank line, where
          # the status Worker writes and reads it.
          MARK="First ok read at "
          NLMARK=$'\n\n'"$MARK"
          # Only an issue with exactly this title, opened by the workflow bot
          # or the repository owner, is the alarm (the status Worker's rule).
          EXISTING=$(ALARM_NAME="$TITLE" ALARM_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ALARM_NAME) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ALARM_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          CLEAR=no
          if [ "$ALERT" = "ok" ] || [ "$STATUS" = "ok" ] || [ "$STATUS" = "off" ]; then CLEAR=yes; fi
          if [ "$ALERT" = "sustained" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            else
              # A sustained read after a first clear read starts the count again.
              BODY_NOW=$(gh issue view "$EXISTING" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || echo "")
              case "$BODY_NOW" in
                *"$NLMARK"*) gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "${BODY_NOW%%$'\n\n'"$MARK"*}" >/dev/null 2>&1 || true ;;
              esac
            fi
          elif [ "$CLEAR" = "yes" ] && [ -n "$EXISTING" ]; then
            # Closes on the second clear read in a row (this step's or the
            # status Worker's); the first leaves a mark line in the body.
            BODY_NOW=$(gh issue view "$EXISTING" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || echo "")
            case "$BODY_NOW" in
              *"$NLMARK"*)
                gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
                ;;
              *)
                gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "${BODY_NOW}"$'\n\n'"${MARK}$(date -u +%FT%TZ); closes on the next ok read." >/dev/null 2>&1 || true
                ;;
            esac
          fi

      # The MPP subscription engine (mppSubscriptions, server.js): failed
      # pages (configured, but it did not build at boot); on and off clear;
      # unknown and absent do neither.
      # The status Worker runs the same check under the same title.
      - name: MPP subscription engine check (alarm when it failed to start)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.mppSubscriptions.status // "unknown"' 2>/dev/null || echo unknown)
          echo "mppSubscriptions: $STATUS"
          TITLE="Scheduled check needs review: subscription-engine"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "failed" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif { [ "$STATUS" = "on" ] || [ "$STATUS" = "off" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # The weather kit's Open-Meteo reads (openMeteo, server.js): refused
      # pages (the last keyed outcome was a refusal); ok and off
      # clear; unknown and absent do neither.
      # The status Worker runs the same check under the same title.
      - name: Open-Meteo keyed reads check (alarm when a keyed request is refused)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.openMeteo.status // "unknown"' 2>/dev/null || echo unknown)
          echo "openMeteo: $STATUS"
          TITLE="Scheduled check needs review: weather-keyed-reads"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "refused" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif { [ "$STATUS" = "ok" ] || [ "$STATUS" = "off" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # The MPP reconciler's own run word (mppReconcile.run,
      # src/mpp-reconcile.js): stale pages (no run has finished inside its
      # gap, so the mismatch words read unknown and page nothing); ok and
      # off clear; unknown (no run yet) and absent do neither.
      # The status Worker runs the same check under the same title.
      - name: MPP reconciliation run check (alarm when the daily reconciliation stops running)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.mppReconcile.run // "unknown"' 2>/dev/null || echo unknown)
          echo "mppReconcile.run: $STATUS"
          TITLE="Scheduled check needs review: payment-reconciliation-run"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "stale" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif { [ "$STATUS" = "ok" ] || [ "$STATUS" = "off" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      # The router's per-minute holds for outside sellers
      # (src/router-spend-window.js): over = a minute passed the alarm ceiling
      # and every purchase was made; capped = a purchase was refused at the
      # stop. Each word holds an hour. off is the switch and never pages. The
      # status Worker runs the same check under the same title.
      - name: Router spend per minute over its ceiling
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.routerSpendWindow.status // "unknown"' 2>/dev/null || echo unknown)
          echo "router spend window: $STATUS"
          TITLE="Scheduled check needs review: router-spend"
          EXISTING=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "over" ] || [ "$STATUS" = "capped" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." || true
            fi
          elif { [ "$STATUS" = "ok" ] || [ "$STATUS" = "off" ]; } && [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi

      - name: Algorand upstream buyer wallet check (alarm on low AVM spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyerAvm.status // "unknown"' 2>/dev/null || echo unknown)
          echo "algorand upstream buyer wallet: $STATUS"
          TITLE="Scheduled check needs review: algorand-buyer-wallet"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # Solana (SVM) spending-wallet check - same pattern: this wallet pays
      # Solana x402 sellers for the SOR's external leg (src/solana-buyer.js).
      # "unknown"/"unconfigured" never page.
      - name: Solana upstream buyer wallet check (alarm on low SVM spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyerSvm.status // "unknown"' 2>/dev/null || echo unknown)
          echo "solana upstream buyer wallet: $STATUS"
          TITLE="Scheduled check needs review: solana-buyer-wallet"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # EVM spending wallet on the other chains SOR_EVM_CHAINS enables - the
      # same key as the Base wallet, one balance per chain. "low" pages. A
      # balance unreadable for 60 minutes or more (unknownForMinutes, about
      # two heartbeat runs) opens its own UNREADABLE issue, so a dead RPC never
      # silences the low alarm. "off" (no chain enabled) and "unconfigured"
      # never page and close the LOW issue; an unreadable gateway-status read
      # changes nothing.
      - name: EVM chains upstream buyer wallet check (alarm on low balance on an enabled chain)
        if: always()
        continue-on-error: true
        run: |
          BODY=$(curl -s --max-time 15 "$PROD/api/gateway-status" || echo '{}')
          STATUS=$(echo "$BODY" | jq -r '.upstreamBuyerEvm.status // "unknown"' 2>/dev/null || echo unknown)
          LOW=$(echo "$BODY" | jq -r '[.upstreamBuyerEvm.chains // {} | to_entries[] | select(.value.status == "low") | .key] | join(", ")' 2>/dev/null || echo "")
          echo "evm chains upstream buyer wallet: $STATUS ${LOW:+(low: $LOW)}"
          TITLE="Scheduled check needs review: evm-buyer-wallets"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATUS" = "ok" ] || [ "$STATUS" = "off" ] || [ "$STATUS" = "unconfigured" ]; then
            if [ -n "$OPEN" ]; then
              if [ "$STATUS" = "ok" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              else
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              fi
            fi
          fi
          UNKNOWN_MIN=$(echo "$BODY" | jq -r '.upstreamBuyerEvm.unknownForMinutes // 0' 2>/dev/null || echo 0)
          TITLE2="Scheduled check needs review: evm-buyer-wallets-read"
          OPEN2=$(ISSUE_TITLE="$TITLE2" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE2\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$STATUS" = "unknown" ] && [ "${UNKNOWN_MIN:-0}" -ge 60 ] 2>/dev/null; then
            if [ -z "$OPEN2" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE2" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            fi
          elif [ -n "$OPEN2" ] && { [ "$STATUS" = "ok" ] || [ "$STATUS" = "low" ] || [ "$STATUS" = "off" ] || [ "$STATUS" = "unconfigured" ]; }; then
            gh issue close "$OPEN2" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # Tempo (MPP) spending-wallet check - same pattern: this wallet pays MPP
      # sellers on Tempo for the SOR's external leg (src/tempo-buyer.js), in
      # USDC.e. "unknown"/"unconfigured" never page.
      - name: Tempo upstream buyer wallet check (alarm on low MPP spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyerTempo.status // "unknown"' 2>/dev/null || echo unknown)
          echo "tempo upstream buyer wallet: $STATUS"
          TITLE="Scheduled check needs review: tempo-buyer-wallet"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # The state database (src/state-db.js): the stores that left the /data
      # volume and the leases every scheduled loop runs under. "degraded" is a
      # connection-class failure (refused, reset, hung, timed out), a failed
      # schema setup, or a store whose first load has not landed since boot;
      # "off" (variable unset), "idle" and "on" never page. While it lasts the
      # moved stores cannot be written and loops with external effects skip
      # their ticks (only internal loops on a long-lived container run without
      # the lease). Two readings 30 s apart, because a deploy's boot window
      # can read degraded once.
      - name: State database check (alarm on a degraded Postgres)
        if: always()
        continue-on-error: true
        run: |
          read_sdb() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.stateDb.status // "unknown"' 2>/dev/null || echo unknown; }
          STATUS=$(read_sdb)
          if [ "$STATUS" = "degraded" ]; then sleep 30; STATUS=$(read_sdb); fi
          echo "state database: $STATUS"
          TITLE="Scheduled check needs review: state-database"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$STATUS" = "degraded" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATUS" = "on" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # The nightly offsite backup (src/backup.js): one word on
      # /api/gateway-status. held (a state table, or the whole database
      # snapshot, did not go up), failed (the run threw, or the encryption
      # key does not parse), stale (no successful run in 26 h while
      # configured), unencrypted (no encryption key in production) and
      # unconfigured (no bucket variables in production with a state
      # database, so no backup runs) page; ok closes; off (no bucket on a boot
      # that is not production or has no state database) and
      # unknown do neither. Two readings 30 s apart, because a boot can read
      # stale once before the persisted status has loaded.
      - name: Offsite backup check (alarm on a held, failed, stale, unencrypted or unconfigured backup)
        if: always()
        continue-on-error: true
        run: |
          read_bk() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.backup.status // "unknown"' 2>/dev/null || echo unknown; }
          WORD=$(read_bk)
          case "$WORD" in held|failed|stale|unencrypted|unconfigured) sleep 30; WORD=$(read_bk) ;; esac
          echo "offsite backup: $WORD"
          TITLE="Scheduled check needs review: offsite-backup"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            held|failed|stale|unencrypted|unconfigured)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # The Stellar facilitator's own fee-paying account. It pays the
      # transaction fee on EVERY Stellar settlement, and until 2026-08-31 it
      # was the one spending wallet we run with no alarm on it. This is a slow
      # alarm: it exists because an empty fee account does not look like an outage - settlements simply
      # stop landing and the rail reads as a payment failure - not because the
      # balance is ever close. "unknown"/"unconfigured" never page - the
      # facilitator URL can point at a third party whose /health is not this.
      - name: Stellar facilitator fee account check (alarm on low XLM)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.stellarFacilitator.status // "unknown"' 2>/dev/null || echo unknown)
          echo "stellar facilitator fee account: $STATUS"
          TITLE="Scheduled check needs review: stellar-fee-account"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # Sanctions lists (OFAC SDN) behind sanctions-wallet, sanctions-name and the
      # router's payout screen. A list that never loads refuses every call, which
      # is loud; a list whose refresh keeps failing keeps ANSWERING from an old
      # copy, which is not. "stale" and "unloaded" page; "loading" (boot grace)
      # and "unknown" never do.
      - name: Sanctions list check (alarm on stale or unloaded)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.sanctions.status // "unknown"' 2>/dev/null || echo unknown)
          echo "sanctions lists: $STATUS"
          TITLE="Scheduled check needs review: screening-lists"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || true)
          if [ "$STATUS" = "stale" ] || [ "$STATUS" = "unloaded" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # The payment-party screen (src/sanctions-screen.js) of Tempo direct mode
      # and of x402 payers (src/x402-payer-screen.js): the EVM set of the same
      # OFAC SDN.XML load. The field is present while either is on; absent
      # means nothing to check. "stale" (refreshes failing, still screening
      # against the last good set) and "missing" (no list: direct mode offers
      # no tempo challenge, x402 payments are served unscreened) page; "fresh"
      # closes; "unknown" does neither. The title search (case-insensitive)
      # also matches the older "Tempo payment-party screen ..." title, so an
      # issue opened under it is still found and closed.
      - name: Payment-party screen check (alarm on stale or missing)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.sanctionsScreen.status // "absent"' 2>/dev/null || echo unknown)
          echo "payment-party screen: $STATUS"
          TITLE="Scheduled check needs review: payment-party-screen"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || true)
          if [ "$STATUS" = "stale" ] || [ "$STATUS" = "missing" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATUS" = "fresh" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # Subscription gas sponsor - watches PATHUSD, not USDC.e. A sponsored
      # Tempo transaction pays its fee in the default token, so a sponsor full
      # of USDC.e and empty of PathUSD is EMPTY for this purpose and the chain
      # says "insufficient funds ... have 0". Funding the wrong token looks
      # exactly like having no wallet, which is why this alarm names the token.
      # It matters more than it looks: an empty sponsor fails ACTIVATIONS loudly
      # (402, nobody charged) but silently sends RENEWALS past_due, so existing
      # subscribers keep being served for free until their grace window ends.
      - name: Subscription gas sponsor check (alarm on low PathUSD)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.subscriptionFeePayer.status // "unknown"' 2>/dev/null || echo unknown)
          echo "subscription gas sponsor: $STATUS"
          TITLE="Scheduled check needs review: subscription-gas-sponsor"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || true)
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # Subscription gas sponsor ceiling (src/tempo-sponsor-ceiling.js): our own
      # rolling 24 h count and fee ceiling on sponsored sends. While it reads
      # reached, renewals are refused before broadcast and go past_due.
      - name: Subscription gas sponsor ceiling check (alarm while reached)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.subscriptionFeePayer.ceiling // "unknown"' 2>/dev/null || echo unknown)
          echo "subscription gas sponsor ceiling: $WORD"
          TITLE="Scheduled check needs review: subscription-gas-sponsor-limit"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || true)
          if [ "$WORD" = "reached" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ "$WORD" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      # Operator-token guessing: the per-IP limiter caps one source; this is the
      # aggregate. "elevated" = OPERATOR_AUTH_FAIL_ALERT (default 100) wrong
      # operator credentials in the last hour. The public word only: the count
      # and the threshold are operator-only (a live counter on a public surface
      # is a tuning aid for a slow guess), so neither is read or printed here.
      # Rotate the token if it persists. "ok"/"unknown" never page.
      - name: Operator token guessing check (alarm when wrong-credential rate is elevated)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.operatorAuth.status // "unknown"' 2>/dev/null || echo unknown)
          echo "operator auth: $STATUS"
          TITLE="Scheduled check needs review: operator-auth"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "elevated" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          fi

      # Server tweet queue (src/tweet-queue.js): one word on /api/gateway-status.
      # halted / no_credentials / refused / in_doubt page; ok and off close;
      # retrying and unknown do neither. The status Worker runs the same check
      # every five minutes under the same title, so the two never duplicate.
      - name: Tweet queue check (alarm when the server poster needs attention)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.tweetQueue.status // "unknown"' 2>/dev/null || echo unknown)
          echo "tweet queue: $WORD"
          TITLE="Scheduled check needs review: post-queue"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            halted|no_credentials|refused|in_doubt)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            ok|off)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Our own upstream caps (src/upstream-cap-refusals.js): one word on
      # /api/gateway-status. reached (a cap refused a call within the last hour)
      # pages; ok closes; unknown does neither. The status Worker runs the same
      # check under the same title.
      - name: Upstream caps check (alarm when a cap refused a call)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamCaps // "unknown"' 2>/dev/null || echo unknown)
          echo "upstream caps: $WORD"
          TITLE="Scheduled check needs review: upstream-caps"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            reached)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Closed by the scheduled check at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Arc settlements Circle left pending (src/circle-pending.js): one word on
      # /api/gateway-status. unresolved / full page; ok and off close;
      # near_capacity and unknown do neither.
      - name: Arc pending settlements check (alarm when one needs an operator)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.circlePending.status // "unknown"' 2>/dev/null || echo unknown)
          echo "circle pending: $WORD"
          TITLE="Scheduled check needs review: arc-settlements"
          OPEN=$(ISSUE_TITLE="$TITLE" ISSUE_OWNER="${GITHUB_REPOSITORY%%/*}" gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title,author --jq '[.[] | select(.title == env.ISSUE_TITLE) | select((.author.login // "" | ascii_downcase) as $a | $a == "github-actions[bot]" or $a == "app/github-actions" or $a == (env.ISSUE_OWNER | ascii_downcase))][0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            unresolved|full)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A scheduled check reported a result that needs review. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This issue closes when the check next passes, or by hand after review." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still needs review at $(date -u +%FT%TZ). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
              fi
