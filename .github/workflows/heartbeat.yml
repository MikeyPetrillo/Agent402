name: Heartbeat

# Production telemetry, fully automated:
#   • every 15 min — is agent402.tools actually serving? (health, catalog,
#     a real proof-of-work paid call, the MCP connector). Persistent failure
#     opens a GitHub issue; recovery closes it.
#
# Revenue tracking lives elsewhere now — the /__operator dashboard, /api/stats,
# and on-chain history at https://basescan.org/address/0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0#tokentxns
# are the canonical sources. The old "external customer payments" issue-comment
# loop was useful as a first-customer alarm but doesn't scale — every new buy
# became a new comment on one issue, which becomes unreadable at volume.
on:
  schedule:
    # Asked for every 15 minutes; DELIVERED every 4-7 hours (measured
    # 2026-08-30 and again 2026-10-02 - GitHub throttles high-frequency
    # schedules). "9,39" was tried 2026-08-30 and did not help, and the wallet
    # balance, credits, drain and Postgres alarms moved to the Cloudflare status
    # Worker (5-minute cron, issues-only token) the same day, which is why the
    # schedule went back to */15. The Worker now also runs every check that
    # reads a word on /api/gateway-status, plus production DOWN and settlement
    # freshness. The checks that live ONLY here page at this workflow's real
    # cadence, hours late: the rail offer (/api/rails), Bazaar validation, the
    # canary burner, the PayAI and CDP quota watches and serving health
    # (operator token). Re-measure before trusting any number in this comment.
    - cron: "*/15 * * * *"
  push:
    branches:
      - "main"
      - "claude/sweet-brown-i99jl3"
    paths:
      - ".github/trigger-heartbeat"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  # For the settlement-freshness step's one self-healing `gh workflow run`.
  # Nothing else here dispatches anything.
  actions: write

env:
  PROD: https://agent402.tools

jobs:
  health:
    runs-on: ubuntu-24.04
    # Raised for the freshness loop in the final step (4 x 12 min of extra
    # observations). Everything that can page has already run by then.
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Probe production (3 attempts before declaring an outage)
        id: probe
        env:
          # Needed so the probe can mint the same X-Heartbeat-Token the server
          # verifies — keeps internal probe traffic out of the external PoW rail
          # on the operator dashboard. Without it the probe still works but its
          # successful PoW call is counted as real external demand.
          POW_SECRET: ${{ secrets.POW_SECRET }}
          # Presence of this secret is the "operator intends the Robinhood/USDG
          # rail" signal — the rails check below only requires eip155:4663 in
          # the live 402 accepts when it is set, so intentionally disabling the
          # rail (removing the secret) never pages.
          ROBINHOOD_FACILITATOR_URL: ${{ secrets.ROBINHOOD_FACILITATOR_URL }}
          # "true" when the Circle facilitator key secret is set: the operator
          # intends the Arc rail, so the rails check requires eip155:5042. Only
          # the comparison reaches the job, never the key.
          ARC_RAIL_INTENDED: ${{ secrets.CIRCLE_FACILITATOR_API_KEY != '' }}
        run: |
          . scripts/heartbeat-probe.sh
          for attempt in 1 2 3; do
            if probe; then echo "status=up" >> "$GITHUB_OUTPUT"; echo "production healthy (attempt $attempt)"; exit 0; fi
            echo "attempt $attempt failed:$FAILS — retrying in 60s"
            sleep 60
          done
          echo "status=down" >> "$GITHUB_OUTPUT"
          echo "fails=$FAILS" >> "$GITHUB_OUTPUT"

      # Record what this probe observed, so /status can show availability
      # measured from OUTSIDE production rather than production's opinion of
      # itself. Best-effort by design: never `-e`-fails the job, because a
      # status-page write must not turn a healthy heartbeat red. When prod is
      # down this POST cannot land either — that absence is the evidence, and
      # /status renders a missing observation as a gap rather than as uptime.
      - name: Record the probe on /status
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          # Narrow credential for POST /api/status/probe; falls back to OP_TOKEN.
          PROBE_TOKEN: ${{ secrets.STATUS_PROBE_TOKEN }}
          STATUS: ${{ steps.probe.outputs.status }}
          FAILS: ${{ steps.probe.outputs.fails }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          . scripts/heartbeat-probe.sh
          record_observation "$STATUS" "$FAILS"

      # Gateway credits: /v1 tiers settle the buyer's USDC before the handler
      # runs, so an empty OpenRouter balance turns every gateway call into
      # "charged but failed". Alarm on "low" BEFORE that happens. Separate
      # issue from "production DOWN" (prod is serving fine); never fails the
      # heartbeat run itself, and "unknown"/"unconfigured" never page.
      # A rail can be down for DAYS without anyone knowing.
      #
      # payments.js drops a rail whose facilitator is unreachable so the other
      # chains keep settling - correct, and the reason a dead Celo facilitator
      # costs one chain instead of every paid route. But the drop is quiet by
      # design: paid revenue keeps flowing, /health stays 200, and the only
      # trace is a boot log. Celo sat dropped for days and surfaced only because
      # someone happened to ask why the revenue page looked short.
      #
      # Deliberately an ISSUE, not a page. A degraded rail is not an outage -
      # the other chains are still earning - so it sits at the same severity as
      # "burner LOW": visible, tracked, auto-closing, nobody woken.
      - name: Rail check (alarm on a configured rail that is not being offered)
        if: always()
        continue-on-error: true
        run: |
          RAILS=$(curl -s --max-time 15 "$PROD/api/rails" || echo '{}')
          DEGRADED=$(echo "$RAILS" | jq -r '.degraded // empty' 2>/dev/null || echo "")
          TITLE="Settlement rail DEGRADED"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          # An unreadable surface is NOT evidence of health: say so and stop,
          # rather than closing a real issue on the back of a failed curl.
          if [ -z "$DEGRADED" ]; then
            echo "rails: /api/rails unreadable - not treating that as healthy; leaving any open issue alone"
            exit 0
          fi
          echo "rails: degraded=$DEGRADED"
          if [ "$DEGRADED" -gt 0 ]; then
            if [ -z "$OPEN" ]; then
              echo "$RAILS" | jq -r '[.rails[] | select(.offered==false) | "- **\(.network)** - \(.reason)"] | join("\n")' > /tmp/rail-body.md
              {
                echo ""
                echo "Revenue is unaffected on the other rails: a rail nobody can settle is dropped deliberately so the rest keep earning. This is a notice, not an outage."
                echo ""
                echo "It closes itself when the rail returns - rail-selfheal.yml restarts the service once that rail's own facilitator answers again, and this check closes the issue on the next heartbeat."
                echo ""
                echo "Live state: $PROD/api/rails"
              } >> /tmp/rail-body.md
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/rail-body.md
            else
              echo "already tracked in #$OPEN"
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: every configured rail is being offered again at $(date -u +%FT%TZ)."
          fi

      - name: Gateway credits check (alarm on low OpenRouter balance)
        if: always()
        continue-on-error: true
        run: |
          BODY=$(curl -s --max-time 15 "$PROD/api/gateway-status" || echo '{}')
          STATUS=$(echo "$BODY" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
          UNKNOWN_MIN=$(echo "$BODY" | jq -r '.unknownForMinutes // 0' 2>/dev/null || echo 0)
          echo "gateway credits: $STATUS (credits leg: $(echo "$BODY" | jq -r '.credits // "-"' 2>/dev/null), key-limit leg: $(echo "$BODY" | jq -r '.keyLimit // "-"' 2>/dev/null), unknown for ${UNKNOWN_MIN}m)"
          TITLE="Gateway credits LOW (OpenRouter)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The OpenRouter balance behind the /v1 gateway is below its configured low-water mark (OPENROUTER_LOW_CREDITS_USD) OR the production key's own monthly limit is nearly used (OPENROUTER_LOW_KEY_LIMIT_FRACTION). Either ceiling stops the gateway: upstream refuses, we answer 502, settlement is cancelled, so buyers are NOT charged but every /v1 sale is lost until it is topped up. Auto top-up is on for this account, so a low balance means a refill did not land (declined card, or auto top-up switched off): check https://openrouter.ai/settings/credits. Raise the key limit: https://openrouter.ai/settings/keys (key: Agent402)."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi
          # A balance we cannot READ is its own alarm once it persists: "unknown"
          # never paged, which is exactly how a dead alarm stays dead. 180 min =
          # several heartbeat runs, well past any OpenRouter blip (server caches
          # the read for 5 min and only goes unknown when BOTH legs are unreadable).
          TITLE2="Gateway balance UNREADABLE (OpenRouter)"
          OPEN2=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE2\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "unknown" ] && [ "${UNKNOWN_MIN:-0}" -ge 180 ] 2>/dev/null; then
            if [ -z "$OPEN2" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE2" --body "/api/gateway-status has reported status=unknown for ${UNKNOWN_MIN} minutes: neither OpenRouter /credits nor /key answered readably with the production key. The low-balance alarm is blind while this lasts. Check the key (https://openrouter.ai/settings/keys), OpenRouter status, and the server log for fetch errors."
            fi
          elif [ "$STATUS" != "unknown" ] && [ -n "$OPEN2" ]; then
            gh issue close "$OPEN2" --repo "$GITHUB_REPOSITORY" --comment "Balance readable again at $(date -u +%FT%TZ)."
          fi

      # (The direct facilitator /health XLM check that lived here duplicated the
      # gateway-status leg below under a second issue title; removed 2026-10-02.)

      # Bazaar listing validation - Coinbase's keyless, read-only
      # POST /platform/v2/x402/validate probes our flagship routes the way the
      # Bazaar crawler does (402 shape, PAYMENT-REQUIRED, accepts, bazaar
      # extension, simulated accept, index membership). Never called before
      # 2026-08-19; a broken 402 on one route could silently drop its listing
      # for weeks. Exit 1 = a route is INVALID (our defect) -> issue; exit 2 =
      # the validator itself unreadable (CDP-side) -> loud warning, no issue.
      - name: Bazaar listing validation (flagship routes vs CDP validate)
        if: always()
        continue-on-error: true
        run: |
          set +e
          OUT=$(TARGET_URL="$PROD" node scripts/bazaar-validate.js 2>&1); CODE=$?
          set -e
          echo "$OUT" | tail -20
          TITLE="Bazaar listing validation FAILED"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          DETAIL=$(echo "$OUT" | grep -E '^(FAIL|\?\?) ' | head -20 || true)
          if [ "$CODE" = "1" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$(printf 'Coinbase CDP'"'"'s x402 validate endpoint reports at least one flagship route INVALID - its 402 no longer passes the Bazaar crawler'"'"'s preflight (shape, PAYMENT-REQUIRED header, accepts, bazaar extension) or the index dropped it. Buyers discovering through the Bazaar / AgentCore will not see that route until it validates again.\n\n```\n%s\n```\n\nReproduce: `node scripts/bazaar-validate.js` (read-only, keyless). A green run closes this.' "$DETAIL")"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$(printf 'Still failing at %s\n\n```\n%s\n```' "$(date -u +%FT%TZ)" "$DETAIL")"
            fi
          elif [ "$CODE" = "2" ]; then
            echo "::warning::CDP validate endpoint UNREADABLE for every flagship route - not silently skipping; the listing check is blind this run"
          elif [ "$CODE" = "0" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: every flagship route validates again at $(date -u +%FT%TZ)."
          fi

      # Canary burner balance watch: an empty burner once read as a settlement
      # outage on the status page. Warn before it runs dry. Public RPC, no keys;
      # an unreadable balance warns loudly rather than silently passing.
      - name: Canary burner balance watch (Base USDC)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BURNER: "0x902dCf34E53695bDEA2fFB354b1a2e58bD598256"
          WARN_USD: ${{ vars.CANARY_BURNER_LOW_USD || '1' }}
        run: |
          DATA="0x70a08231000000000000000000000000${BURNER#0x}"
          BAL=$(curl -s --max-time 15 https://mainnet.base.org -H 'Content-Type: application/json'             -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_call\",\"params\":[{\"to\":\"0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913\",\"data\":\"$DATA\"},\"latest\"]}"             | jq -re '.result' 2>/dev/null) || { echo "::warning::burner balance UNREADABLE — not silently skipping, investigate"; exit 0; }
          USD=$(node -e "console.log((parseInt('$BAL',16)/1e6).toFixed(4))")
          echo "canary burner Base USDC read"
          TITLE="Canary burner LOW (Base)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          LOW=$(node -e "console.log($USD < $WARN_USD ? 1 : 0)")
          if [ "$LOW" = "1" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The paid canary's Base burner ($BURNER) is below its configured low-water mark (repo var CANARY_BURNER_LOW_USD). Top up before it runs dry: an empty burner now files as a funding issue rather than an outage, but a funded one is better."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # PayAI credit watch. PayAI bills settlements in credits weighted per
      # chain against an allowance per receiving wallet that does not reset.
      # PayAI is first-tried only for Avalanche and Sei, so those rails draw it
      # down; fallback hops onto PayAI are not visible here (a lower bound).
      # Counted from the on-chain ledger since the pricing start. A missing or
      # unparseable field is logged loudly, never treated as "fine".
      - name: PayAI credit watch (allowance per receiving wallet)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          THRESH: ${{ vars.PAYAI_QUOTA_WARN || 800 }}
          # Credits per exact settlement, by rail. Read live from PayAI's own
          # published table (facilitator.payai.network/pricing) on every run.
          # When it is unreadable the step uses the repo variable
          # PAYAI_FALLBACK_WEIGHTS (JSON {"avalanche":n,"sei":n}); vendor rates
          # are never committed. With neither, it warns and skips the watch.
          PAYAI_FALLBACK_WEIGHTS: ${{ vars.PAYAI_FALLBACK_WEIGHTS }}
        run: |
          CUT=2026-09-21
          # CAIP-2 ids of the two rails PayAI is first-tried on.
          LIVE=$(curl -s --max-time 15 -H 'Accept: application/json' https://facilitator.payai.network/pricing | jq -ce \
            '[.rates[]? | select(.scheme=="exact" and (.transferMethod // "eip3009")=="eip3009")] as $r
             | {avalanche: ($r[] | select(.network=="eip155:43114") | .credits | tonumber),
                sei: ($r[] | select(.network=="eip155:1329") | .credits | tonumber)}
             | select(.avalanche != null and .sei != null and .avalanche > 0 and .sei > 0)' 2>/dev/null | head -1 || true)
          if [ -n "$LIVE" ]; then WEIGHTS="$LIVE"; SRC=live
          elif [ -n "$PAYAI_FALLBACK_WEIGHTS" ] && echo "$PAYAI_FALLBACK_WEIGHTS" | jq -e '(.avalanche > 0) and (.sei > 0)' >/dev/null 2>&1; then WEIGHTS="$PAYAI_FALLBACK_WEIGHTS"; SRC=fallback; echo "::warning::PayAI live pricing table unreadable - using the PAYAI_FALLBACK_WEIGHTS repo variable"
          else echo "::warning::PayAI credit watch skipped - the live pricing table is unreadable and no PAYAI_FALLBACK_WEIGHTS repo variable is set. Investigate."; exit 0; fi
          echo "PayAI credit weights ($SRC): $WEIGHTS"
          CREDITS=$(curl -s --max-time 20 "$PROD/api/revenue/daily" | jq -e --arg cut "$CUT" --argjson w "$WEIGHTS" \
            '[.days[] | select(.day >= $cut) | select(.chain=="avalanche" or .chain=="sei") | (.extTx + .intTx) * $w[.chain]] | add // 0 | . * 100 | round / 100') \
            || { echo "::warning::PayAI credit watch UNREADABLE - /api/revenue/daily missing or unparseable. NOT skipping silently: investigate."; exit 0; }
          echo "PayAI weighted credits since $CUT: $CREDITS (warn at $THRESH)"
          TITLE="PayAI credit allowance HIGH"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if awk -v c="$CREDITS" -v t="$THRESH" 'BEGIN { exit !(c >= t) }'; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Weighted PayAI credits spent on Avalanche + Sei settlements since $CUT reached the warn threshold (repo var PAYAI_QUOTA_WARN). Past the allowance the facilitator bills its prepaid credits when PAYAI_API_KEY_ID/SECRET are set (top up in its merchant console) and refuses settlement when they are not. Fallback hops onto PayAI are not counted here - this is a lower bound."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still high at $(date -u +%FT%TZ)."
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: weighted PayAI credits back below the threshold at $(date -u +%FT%TZ)."
          fi

      # CDP settlement metering watch. CDP's billing gate answers
      # `payment-method-required` on /settle when an account cannot be charged,
      # which would take Base down. Informational at CDP_METERED_WARN; the real
      # alarm for a billing lapse is the paid canary failing a rail leg.
      - name: CDP settlement metering watch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          THRESH: ${{ vars.CDP_METERED_WARN || 20000 }}
        run: |
          CUT=$(date -u -d '30 days ago' +%F)
          COUNT=$(curl -s --max-time 20 "$PROD/api/revenue/daily" | jq -e --arg cut "$CUT" \
            '[.days[] | select(.day >= $cut) | select(.chain=="base" or .chain=="solana" or .chain=="polygon" or .chain=="arbitrum") | (.extTx + .intTx)] | add // 0' 2>/dev/null || echo "unreadable")
          if [ "$COUNT" = "unreadable" ]; then
            echo "WARNING: CDP metering count unreadable from /api/revenue/daily - not treating that as fine"
            exit 0
          fi
          echo "CDP-first-chain settles, rolling 30d: $COUNT (warn at $THRESH)"
          TITLE="CDP settlement metering HIGH"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$COUNT" -ge "$THRESH" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Rolling 30-day settlements on CDP-first chains (Base/Solana/Polygon/Arbitrum): $COUNT. Check the CDP account has a working payment method: a billing lapse answers payment-method-required on /settle and takes the Base rail down. Threshold: repo var CDP_METERED_WARN."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still high: $COUNT settles at $(date -u +%FT%TZ)."
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: rolling 30-day count back to $COUNT at $(date -u +%FT%TZ)."
          fi

      # x402 spending-wallet check - same pattern as gateway credits above:
      # when the upstream buyer wallet (src/upstream-buyer-status.js) runs dry
      # the paths that spend from it refuse quietly (buyers never charged), so
      # alarm on "low" first.
      # "unknown"/"unconfigured" never page.
      - name: Upstream buyer wallet check (alarm on low x402 spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyer.status // "unknown"' 2>/dev/null || echo unknown)
          echo "upstream buyer wallet: $STATUS"
          TITLE="Upstream buyer wallet LOW (x402)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The x402 upstream spending wallet (X402_UPSTREAM_BUYER_KEY) is below the low-water mark (UPSTREAM_BUYER_LOW_USD). When it empties, route-execute external buys and seller-payability refuse (buyers are never charged, but those paths go dark). attest signs from the same wallet but pays Base gas in ETH, which this alarm reads nothing about. Top up: send USDC on Base to the upstream buyer address."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Algorand spending-wallet check — same pattern as the Base wallet above:
      # this wallet pays external Algorand sellers for the SOR (route-execute
      # settles to the TREASURY, so this wallet only drains). optedIn:false
      # also buckets as "low" — an un-opted-in wallet can't pay at all.
      # "unknown"/"unconfigured" never page.
      - name: Upstream call budget elevated
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Counts OUR outbound calls per paid upstream against a daily budget.
          # Not a balance - most of these publish none. Catches a step change
          # (a loop, a sweep that started buying) before the bill or the quota
          # does, in both directions: a quota that lapses refuses a product,
          # and a pay-as-you-go host bills without earning.
          BODY=$(curl -s --max-time 15 "$PROD/api/gateway-status" || echo '{}')
          STATUS=$(echo "$BODY" | jq -r '.upstreamBudgets.status // "unknown"' 2>/dev/null || echo unknown)
          TITLE="Upstream call budget ELEVATED"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ "$STATUS" = "elevated" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "\`/api/gateway-status.upstreamBudgets\` reports **elevated**: at least one upstream's daily call budget is reached. These are our outbound call counts against a daily budget, not a vendor balance; the per-upstream rows are on the operator view of the same endpoint. Check whether a loop, a new sweep or real demand is behind it, then either fix the cause or raise that upstream's budget variable. The counter is daily and resets on deploy, so the real figure is at or above what the operator view shows."
            fi
          elif [ -n "$EXISTING" ] && [ "$STATUS" = "ok" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "upstreamBudgets is ok; closing." || true
          fi

      - name: Upstream hard ceiling reached
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A pay-as-you-go upstream reached its hard daily ceiling, so calls
          # to it are being refused (uncharged) until 00:00 UTC.
          BODY=$(curl -s --max-time 15 "$PROD/api/gateway-status" || echo '{}')
          STATUS=$(echo "$BODY" | jq -r '.upstreamHardCaps.status // "unknown"' 2>/dev/null || echo unknown)
          TITLE="Upstream hard ceiling REACHED"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ "$STATUS" = "capped" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "\`/api/gateway-status.upstreamHardCaps\` reports **capped**: at least one pay-as-you-go upstream reached its hard daily ceiling, and the tools behind it answer 503 (uncharged) until 00:00 UTC. The per-upstream rows are on the operator view. Find what drove the volume, then fix the cause or raise that ceiling's variable."
            fi
          elif [ -n "$EXISTING" ] && [ "$STATUS" = "ok" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "upstreamHardCaps is ok; closing." || true
          fi

      - name: Exa prepaid allowance low
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Exa publishes NO balance endpoint (42 endpoints in their public
          # OpenAPI, none for credits), so this alarms on OUR OWN cumulative
          # spend against EXA_CREDITS_USD. The count is in memory and resets on
          # deploy, so it under-reports - which is why the threshold is a
          # fraction remaining and not "near zero".
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.exaAllowance.status // "unknown"' 2>/dev/null || echo unknown)
          TITLE="Exa prepaid allowance LOW"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ "$STATUS" = "low" ]; then
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                --body "\`/api/gateway-status.exaAllowance\` reports **low**: cumulative spend on that upstream has passed the configured share of its funded total. Top up in the upstream's console and raise \`EXA_CREDITS_USD\` on Railway to the new funded total. Note the counter is in memory and resets on deploy, so real remaining credit is at or below what is reported."
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "exaAllowance is ${STATUS}; closing." || true
          fi

      - name: Algorand upstream buyer wallet check (alarm on low AVM spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyerAvm.status // "unknown"' 2>/dev/null || echo unknown)
          echo "algorand upstream buyer wallet: $STATUS"
          TITLE="Algorand upstream buyer wallet LOW (x402)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The Algorand x402 spending wallet (ALGORAND_UPSTREAM_BUYER_MNEMONIC) behind the SOR's Algorand external routing is below the low-water mark (ALGORAND_UPSTREAM_BUYER_LOW_USD), or not yet opted in to USDC ASA 31566704 (check /api/gateway-status upstreamBuyerAvm.optedIn). When it empties, Algorand external routing fails 502 (buyers are never charged, but the path goes dark). Top up: send USDC on Algorand to the AVM spending wallet address."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Solana (SVM) spending-wallet check - same pattern: this wallet pays
      # Solana x402 sellers for the SOR's external leg (src/solana-buyer.js).
      # "unknown"/"unconfigured" never page.
      - name: Solana upstream buyer wallet check (alarm on low SVM spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyerSvm.status // "unknown"' 2>/dev/null || echo unknown)
          echo "solana upstream buyer wallet: $STATUS"
          TITLE="Solana upstream buyer wallet LOW (x402)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The Solana x402 spending wallet (SOLANA_UPSTREAM_BUYER_KEY) behind the SOR's Solana external routing is below the low-water mark (SOLANA_UPSTREAM_BUYER_LOW_USD). When it empties, Solana external routing fails 502 (buyers are never charged, but the path goes dark). Top up: send USDC on Solana to the SVM spending wallet address."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Tempo (MPP) spending-wallet check - same pattern: this wallet pays MPP
      # sellers on Tempo for the SOR's external leg (src/tempo-buyer.js), in
      # USDC.e. "unknown"/"unconfigured" never page.
      - name: Tempo upstream buyer wallet check (alarm on low MPP spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyerTempo.status // "unknown"' 2>/dev/null || echo unknown)
          echo "tempo upstream buyer wallet: $STATUS"
          TITLE="Tempo upstream buyer wallet LOW (MPP)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The Tempo spending wallet (TEMPO_UPSTREAM_BUYER_KEY) behind the SOR's MPP external routing is below the low-water mark (TEMPO_UPSTREAM_BUYER_LOW_USD) in USDC.e on Tempo. When it empties, MPP external routing fails (buyers are never charged, but the path goes dark). Top up: send USDC on Tempo (0x20C0...8b50) to the Tempo spending wallet address."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # The state database (src/state-db.js): the stores that left the /data
      # volume and the leases every scheduled loop runs under. "degraded" is a
      # connection-class failure (refused, reset, hung, timed out), a failed
      # schema setup, or a store whose first load has not landed since boot;
      # "off" (variable unset), "idle" and "on" never page. While it lasts the
      # moved stores cannot be written and loops with external effects skip
      # their ticks (only internal loops on a long-lived container run without
      # the lease). Two readings 30 s apart, because a deploy's boot window
      # can read degraded once.
      - name: State database check (alarm on a degraded Postgres)
        if: always()
        continue-on-error: true
        run: |
          read_sdb() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.stateDb.status // "unknown"' 2>/dev/null || echo unknown; }
          STATUS=$(read_sdb)
          if [ "$STATUS" = "degraded" ]; then sleep 30; STATUS=$(read_sdb); fi
          echo "state database: $STATUS"
          TITLE="State database DEGRADED (Postgres)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "degraded" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status.stateDb reports **degraded** on two readings 30 s apart: the Postgres behind STATE_DATABASE_URL refused, dropped or hung on a statement, its schema setup failed, or a moved store has not loaded since boot. The moved stores (subscriptions, alerts, monitor runs, listings, leaderboards, logs) cannot be written while it lasts; loops with external effects skip their ticks, internal loops on a container up for more than ten minutes keep running without their lease. Check the Postgres service on Railway and the boot log ([state-db] lines). Auto-closes when the status reads on."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still degraded at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "on" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the state database reads on at $(date -u +%FT%TZ)."
          fi

      # The nightly offsite backup (src/backup.js): one word on
      # /api/gateway-status. held (a state table, or the whole database
      # snapshot, did not go up), failed (the run threw) and stale (no
      # successful run in 26 h while configured) page; ok closes; off and
      # unknown do neither. Two readings 30 s apart, because a boot can read
      # stale once before the persisted status has loaded.
      - name: Offsite backup check (alarm on a held, failed or stale backup)
        if: always()
        continue-on-error: true
        run: |
          read_bk() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.backup.status // "unknown"' 2>/dev/null || echo unknown; }
          WORD=$(read_bk)
          case "$WORD" in held|failed|stale) sleep 30; WORD=$(read_bk) ;; esac
          echo "offsite backup: $WORD"
          TITLE="Offsite backup is not current"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            held|failed|stale)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports backup.status=$WORD on two readings 30 s apart. held: the last run left a state table, or the whole database snapshot, without an offsite copy (older days are kept, not pruned, while this lasts). failed: the last run threw (bucket unreachable, bill guard, unreadable data dir). stale: no successful run in 26 h. Read /__operator/backup.json (lastError, lastHeld, lastHeldState) and the [backup] log line; POST /__operator/backup/run retries. Auto-closes when the word is ok." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the offsite backup reads ok at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # The Stellar facilitator's own fee-paying account. It pays the
      # transaction fee on EVERY Stellar settlement, and until 2026-08-31 it
      # was the one spending wallet we run with no alarm on it. This is a slow
      # alarm: it exists because an empty fee account does not look like an outage - settlements simply
      # stop landing and the rail reads as a payment failure - not because the
      # balance is ever close. "unknown"/"unconfigured" never page - the
      # facilitator URL can point at a third party whose /health is not this.
      - name: Stellar facilitator fee account check (alarm on low XLM)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.stellarFacilitator.status // "unknown"' 2>/dev/null || echo unknown)
          echo "stellar facilitator fee account: $STATUS"
          TITLE="Stellar facilitator fee account LOW (XLM)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The self-hosted Stellar facilitator's signing account is below its low-water mark (FACILITATOR_LOW_BALANCE_XLM on the agent402-facilitator service). That account pays the transaction fee on every Stellar settlement, so when it empties, Stellar settlements stop landing - buyers are never charged, but the rail goes dark and the paid canary reports it as a rail failure rather than as an empty wallet. Top up: send XLM to the address on the facilitator's GET /health (signerAddress). Auto-closes when the balance recovers."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Sanctions lists (OFAC SDN) behind sanctions-wallet, sanctions-name and the
      # router's payout screen. A list that never loads refuses every call, which
      # is loud; a list whose refresh keeps failing keeps ANSWERING from an old
      # copy, which is not. "stale" and "unloaded" page; "loading" (boot grace)
      # and "unknown" never do.
      - name: Sanctions list check (alarm on stale or unloaded)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.sanctions.status // "unknown"' 2>/dev/null || echo unknown)
          echo "sanctions lists: $STATUS"
          TITLE="Sanctions lists STALE or UNLOADED (OFAC SDN)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ "$STATUS" = "stale" ] || [ "$STATUS" = "unloaded" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The OFAC SDN list behind sanctions-wallet, sanctions-name and the router's payout screen reads $STATUS on /api/gateway-status. stale: the 12-hourly refresh has failed for over a day and screening is answering from an old copy. unloaded: it never loaded after boot and every screening call is refused 503. The operator view of /api/gateway-status carries the last error; the source is OFAC's SDN.XML export, loaded by src/ofac-sdn.js for src/tools/sanctions-kit.js. Auto-closes when it reads ok."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still $STATUS at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the list reads ok at $(date -u +%FT%TZ)."
          fi

      # The payment-party screen (src/sanctions-screen.js) of Tempo direct mode
      # and of x402 payers (src/x402-payer-screen.js): the EVM set of the same
      # OFAC SDN.XML load. The field is present while either is on; absent
      # means nothing to check. "stale" (refreshes failing, still screening
      # against the last good set) and "missing" (no list: direct mode offers
      # no tempo challenge, x402 payments are served unscreened) page; "fresh"
      # closes; "unknown" does neither. The title search (case-insensitive)
      # also matches the older "Tempo payment-party screen ..." title, so an
      # issue opened under it is still found and closed.
      - name: Payment-party screen check (alarm on stale or missing)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.sanctionsScreen.status // "absent"' 2>/dev/null || echo unknown)
          echo "payment-party screen: $STATUS"
          TITLE="Payment-party screen STALE or MISSING (OFAC SDN)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ "$STATUS" = "stale" ] || [ "$STATUS" = "missing" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The payment-party screen reads $STATUS on /api/gateway-status (sanctionsScreen.status). stale: no successful refresh in two refresh periods (12 h by default) and the screen is checking payments against the last good set. missing: no list is loaded, so Tempo direct mode offers no tempo challenge and x402 payments are served unscreened until one loads. The operator view of /api/gateway-status carries lastError and lastAttemptAt; the source is OFAC's SDN.XML export (src/ofac-sdn.js, read by src/sanctions-screen.js). Auto-closes when it reads fresh."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still $STATUS at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "fresh" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the screen reads fresh at $(date -u +%FT%TZ)."
          fi

      # Subscription gas sponsor - watches PATHUSD, not USDC.e. A sponsored
      # Tempo transaction pays its fee in the default token, so a sponsor full
      # of USDC.e and empty of PathUSD is EMPTY for this purpose and the chain
      # says "insufficient funds ... have 0". Funding the wrong token looks
      # exactly like having no wallet, which is why this alarm names the token.
      # It matters more than it looks: an empty sponsor fails ACTIVATIONS loudly
      # (402, nobody charged) but silently sends RENEWALS past_due, so existing
      # subscribers keep being served for free until their grace window ends.
      - name: Subscription gas sponsor check (alarm on low PathUSD)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.subscriptionFeePayer.status // "unknown"' 2>/dev/null || echo unknown)
          echo "subscription gas sponsor: $STATUS"
          TITLE="Subscription gas sponsor LOW (PathUSD)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The Tempo subscription gas sponsor (TEMPO_SUBSCRIPTION_FEE_PAYER_KEY) is low on PathUSD. Gas on this rail is paid in PathUSD, NOT the USDC.e the products are priced in, so topping up the wrong token will not fix it. While it is empty, activations fail 402 (nobody is charged) but renewals go past_due, which means existing subscribers are served for free until their grace window ends. Top up via the fund-tempo-fee-payer workflow with token=pathusd."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: PathUSD back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Operator-token guessing: the per-IP limiter caps one source; this is the
      # aggregate. "elevated" = OPERATOR_AUTH_FAIL_ALERT (default 100) wrong
      # operator credentials in the last hour. Counts only; rotate the token if
      # it persists. "ok"/"unknown" never page.
      - name: Operator token guessing check (alarm when wrong-credential rate is elevated)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.operatorAuth.status // "unknown"' 2>/dev/null || echo unknown)
          FAILS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.operatorAuth.failures1h // "?"' 2>/dev/null || echo "?")
          echo "operator auth: $STATUS ($FAILS wrong credentials in the last hour)"
          TITLE="Operator token guessing ELEVATED"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "elevated" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports operatorAuth.status=elevated: $FAILS wrong operator credentials in the last hour (threshold OPERATOR_AUTH_FAIL_ALERT). The per-IP limiter caps each source; this is the aggregate. If it persists, rotate AGENT402_OPERATOR_TOKEN on Railway and in Actions secrets. Auto-closes when the rate drops." >/dev/null 2>&1 || echo "issue create failed"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still elevated at $(date -u +%FT%TZ): $FAILS in the last hour." >/dev/null 2>&1 || true
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: wrong-credential rate back under the threshold at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
          fi

      # Server tweet queue (src/tweet-queue.js): one word on /api/gateway-status.
      # halted / no_credentials / refused / in_doubt page; ok and off close;
      # retrying and unknown do neither. The status Worker runs the same check
      # every five minutes under the same title, so the two never duplicate.
      - name: Tweet queue check (alarm when the server poster needs attention)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.tweetQueue.status // "unknown"' 2>/dev/null || echo unknown)
          echo "tweet queue: $WORD"
          TITLE="Tweet queue needs attention (server poster)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            halted|no_credentials|refused|in_doubt)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports tweetQueue.status=$WORD. in_doubt: a post may not have reached X and its one retry is used - read /__operator/tweet-queue.json for the ids, check X, re-queue a missing post under a new id and remove the old id from TWEET_QUEUE. refused: X answered 401/402/403 (credentials or API balance). no_credentials: an X_* key is missing on Railway. halted: TWEET_QUEUE is not a JSON array, the state file on /data cannot be read, or there is no volume. Auto-closes when the word is ok." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
            ok|off)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: tweet queue reads $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Arc settlements Circle left pending (src/circle-pending.js): one word on
      # /api/gateway-status. unresolved / full page; ok and off close;
      # near_capacity and unknown do neither.
      - name: Arc pending settlements check (alarm when one needs an operator)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.circlePending.status // "unknown"' 2>/dev/null || echo unknown)
          echo "circle pending: $WORD"
          TITLE="Arc pending settlements need attention"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            unresolved|full)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports circlePending.status=$WORD. unresolved: an Arc settlement Circle reported as pending could not be resolved from its /status after repeated reads or within seven days; it is kept, never dropped. Look its paymentId up with Circle and on the Arc explorer, then book a refund if it settled. full: the pending book reached its bound and refused a new entry (the server log names it). Auto-closes when the word is ok." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
            ok|off)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: circlePending reads $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Circle Gateway batched settlements Gateway answered settlement_pending
      # (src/gateway-nanopayments.js): one word on /api/gateway-status. The
      # resolver books a settled, unserved entry as an owed debt (refundsOwed
      # covers it). unresolved / full page; ok and off close; pending,
      # near_capacity and unknown do neither.
      - name: Gateway pending settlements check (alarm when one needs an operator)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.gatewayPending.status // "unknown"' 2>/dev/null || echo unknown)
          echo "gateway pending: $WORD"
          TITLE="Gateway pending settlements need attention"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            unresolved|full)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports gatewayPending.status=$WORD. unresolved: a batched payment Circle Gateway answered as pending is still waiting past its bound; the resolver reads it every ten minutes and keeps it until Gateway reports it settled or failed. Read it on /__operator/gateway-pending.json and look its nonce up in Gateway's transfer history. full: the pending book reached its bound and refused a new entry (the server log names it). A settled, unserved entry becomes an owed refund (refundsOwed). Auto-closes when the word is ok." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
            ok|off)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: gatewayPending reads $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Refunds owed (src/refund-ledger.js): one word on /api/gateway-status.
      # owed (any buyer's debt past a 15 min grace) / aging / stuck page; ok
      # closes; unknown does neither. The status Worker runs the same check
      # every five minutes under the same title. The issue carries counts only
      # (rows, distinct buyers, read from the operator view): never an address
      # or an amount.
      - name: Refunds owed check (alarm when a debt to a buyer is waiting)
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          GW=$(curl -s --max-time 15 -H "Authorization: Bearer $OP_TOKEN" "$PROD/api/gateway-status" || echo '{}')
          WORD=$(printf '%s' "$GW" | jq -r '.refundsOwed.status // "unknown"' 2>/dev/null || echo unknown)
          case "$WORD" in owed|aging|stuck|ok|unknown) ;; *) WORD=unknown ;; esac
          echo "refunds owed: $WORD"
          WF="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/refund.yml"
          TITLE="Refunds owed to a buyer are waiting"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            owed|aging|stuck)
              BODY="/api/gateway-status reports refundsOwed.status=$WORD at $(date -u +%FT%TZ). The counts are on /__operator/refunds.json, never in this public issue. owed: a buyer's debt is in the refund ledger - read /__operator/refunds.json, then run the refund workflow ($WF): dry run first, then live (include_repeat_hangups for hang-up debts held for review; void a debt that should not be paid, with a note). aging: a debt has been owed longer than REFUND_OWED_ALARM_HOURS (default 48). stuck: a row has been in sending for over 30 minutes - check the refund wallet on chain, then mark it paid with the tx or release it back to owed. Auto-closes when nothing is owed."
              # A debt can stay owed for days (held for review), so an open
              # issue is updated in place rather than commented every run.
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue edit "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$BODY" >/dev/null 2>&1 || true
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: refunds owed reads ok at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Recipients our spending wallets paid for the first time
      # (src/outbound-destinations.js): one word on /api/gateway-status.
      # burst pages (more first-time recipients inside the window than the
      # threshold); ok and new close (a first buy from a newly proven seller is
      # expected); unknown does neither. Two readings 30 s apart, like the
      # dead-letter check. The status Worker runs the same check every five
      # minutes under the same title.
      - name: Outbound destinations check (alarm on a burst of first-time recipients)
        if: always()
        continue-on-error: true
        run: |
          read_od() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.outboundDestinations.status // "unknown"' 2>/dev/null || echo unknown; }
          WORD=$(read_od)
          if [ "$WORD" = "burst" ]; then sleep 30; WORD=$(read_od); fi
          echo "outbound destinations: $WORD"
          TITLE="Outbound payments reached a burst of NEW destinations"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            burst)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports outboundDestinations.status=burst on two readings 30 s apart: inside the last OUTBOUND_NEW_DEST_WINDOW_H hours (default 24) our spending wallets paid more recipients for the first time than OUTBOUND_NEW_DEST_BURST (default 10). A normal day reaches a few at most (a seller the router has just proven, a payability probe, the unproven lane). Read /__operator/outbound-destinations.json for the chain, recipient, origin and time of each first sighting, and match them against the proven-seller pool and the route-execute receipts of the same hours; a run of recipients no seller in the pool names is a wallet or a router being steered. The operator read of /api/gateway-status has the counts. Auto-closes when the word is ok or new." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
            ok|new)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: outbound destinations read $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Tool and upstream failures (src/tool-failure-monitor.js): four words
      # on /api/gateway-status. toolFailures and upstreamHealth page on
      # degraded / failing; facilitatorFunds pages on low / refused / demoted;
      # buyerRefusals pages on refusing; ok closes; unknown does neither. The issues are public, so a body carries
      # the word and the operator endpoint only: slugs, upstreams, facilitators
      # and reasons stay on /__operator/tool-failures.json. The status Worker
      # runs the same checks every five minutes under the same titles.
      - name: Tool, upstream and facilitator failure checks (alarm on a failing tool or upstream)
        if: always()
        continue-on-error: true
        run: |
          GS=$(curl -s --max-time 15 "$PROD/api/gateway-status" || echo '{}')
          # TITLE is set before each call (the Worker test reads it as written).
          check_word() {
            FIELD="$1"; BAD="$2"; GOOD="$3"
            WORD=$(echo "$GS" | jq -r ".${FIELD}.status // \"unknown\"" 2>/dev/null || echo unknown)
            echo "$FIELD: $WORD"
            OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
            if echo " $BAD " | grep -q " $WORD "; then
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports ${FIELD}.status=$WORD. The detail is on the operator endpoint, /__operator/tool-failures.json (operator token). Auto-closes when the word is ok." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
            elif echo " $GOOD " | grep -q " $WORD "; then
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: ${FIELD} reads $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
            fi
          }
          TITLE="toolFailures: a tool is answering 5xx to buyers"
          check_word toolFailures "degraded failing" "ok"
          TITLE="upstreamHealth: an upstream is timing out or failing"
          check_word upstreamHealth "degraded failing" "ok"
          TITLE="facilitatorFunds: a facilitator refused settlement"
          check_word facilitatorFunds "refused demoted" "ok"
          # A settlement signer short of gas, before any refusal: its own title.
          TITLE="facilitatorFunds: a facilitator's settlement gas is running low or could not be read"
          check_word facilitatorFunds "low" "ok"
          # The settle breaker refused a buyer that had settled a call in its
          # window (src/gateway-settle-breaker.js): refusing pages, ok closes.
          TITLE="buyerRefusals: a paying buyer was refused by the settle breaker"
          check_word buyerRefusals "refusing" "ok"

      # Paid 200s whose body is empty or error-shaped (src/answer-shape.js,
      # counted by src/tool-failure-monitor.js): one word on
      # /api/gateway-status. degraded pages, ok closes, unknown does neither.
      # The issue is public: its body carries the word and the operator
      # endpoint only; slugs and reasons stay on /__operator/tool-failures.json.
      # The status Worker runs the same check under the same title.
      - name: Tool answer shape check (alarm on empty or error-shaped 200s)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.toolAnswers.status // "unknown"' 2>/dev/null || echo unknown)
          echo "toolAnswers: $WORD"
          TITLE="toolAnswers: a tool is answering empty or error-shaped 200s"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            degraded)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports toolAnswers.status=degraded. The detail is on the operator endpoint, /__operator/tool-failures.json (operator token). Auto-closes when the word is ok." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still degraded at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: toolAnswers reads ok at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Money writes (sales, refund debts, card report records, subscription
      # records, decide writes) kept on the container's local disk because the
      # state database has not taken them (src/ledger-mirror.js): one word on
      # /api/gateway-status. "stuck" means an entry has waited past
      # LEDGER_DEAD_LETTER_STUCK_MINUTES; that disk dies with the container, so
      # a redeploy would lose those rows (the deploy job's quiet gate holds on
      # the same two words). "local" means the journals live in Redis but an
      # entry sits on the container's disk because Redis did not take it (same
      # risk). Two readings 30 s apart, like the state database check.
      # "pending" (the replay is working through them), "none", "off" and
      # "unknown" never page; none and off close.
      - name: Ledger dead-letter check (alarm when money writes wait on local disk)
        if: always()
        continue-on-error: true
        run: |
          read_dl() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.ledgerDeadLetter.status // "unknown"' 2>/dev/null || echo unknown; }
          WORD=$(read_dl)
          if [ "$WORD" = "stuck" ] || [ "$WORD" = "local" ]; then sleep 30; WORD=$(read_dl); fi
          echo "ledger dead-letter: $WORD"
          TITLE="Ledger rows waiting on local disk (dead-letter stuck)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            stuck|local)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports ledgerDeadLetter.status=$WORD on two readings 30 s apart. local: the journals live in Redis but a money write sits on the container's local disk because Redis did not take it (check the Redis service). stuck: a money write (a sale, a refund debt, a card report's final record, a subscription record, a decide write or an outbound payment record) has waited on the container's local disk for the state database longer than LEDGER_DEAD_LETTER_STUCK_MINUTES (default 20). Each journal's replay retries on a timer; while it cannot land them they exist only on that container, so do not redeploy or restart it until they land. Check stateDb on the same endpoint, the Postgres service on Railway, and the [sales-ledger] / [refund-ledger] / [human-checkout] / [subscriptions] / [decide] / [outbound-ledger] log lines (a row the database refuses is named there). The operator read of /api/gateway-status has the counts per journal. Auto-closes when the word is none." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
            none|off)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the ledger dead-letter reads $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Redis persistence (src/redis-persistence.js): one word on
      # /api/gateway-status read from INFO persistence. "off" means the Redis
      # behind REDIS_URL runs without append-only persistence, so anything kept
      # there dies with its process; "degraded" means append-only is on but
      # the last write or rewrite did not finish ok. In both the money journals
      # stay on each container's local disk (the LEDGER_JOURNAL_REDIS switch has
      # no effect until it reads on). Two readings 30 s apart, like the
      # dead-letter check. "on" closes; "unknown" does neither.
      - name: Redis persistence check (alarm when append-only is off or degraded)
        if: always()
        continue-on-error: true
        run: |
          read_rp() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.redisPersistence.status // "unknown"' 2>/dev/null || echo unknown; }
          WORD=$(read_rp)
          if [ "$WORD" = "off" ] || [ "$WORD" = "degraded" ]; then sleep 30; WORD=$(read_rp); fi
          echo "redis persistence: $WORD"
          TITLE="Redis append-only persistence is not on"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            off|degraded)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports redisPersistence.status=$WORD on two readings 30 s apart. off: the Redis behind REDIS_URL runs without append-only persistence (aof_enabled:0), so anything kept there dies with its process. degraded: append-only is on but the last AOF write or rewrite did not finish ok (aof_last_write_status / aof_last_bgrewrite_status), which usually means the disk behind it is full or unwritable. While either lasts the money journals stay on each container's local disk (LEDGER_JOURNAL_REDIS has no effect until it reads on) and an entry waiting there reads local on ledgerDeadLetter. Check the Redis service's start command on Railway (redis-server --appendonly yes --appendfsync everysec), run INFO persistence against it (aof_enabled, aof_last_write_status, aof_last_bgrewrite_status, rdb_last_bgsave_status) and its disk; the operator read of /api/gateway-status carries the same fields. The server log has one [ledger-journal] line naming why the journals are held and one more when Redis takes them again. Auto-closes when the word is on." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
            on)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: redis persistence reads on at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Transactional email (src/email.js): one word on /api/gateway-status,
      # recorded from real sends and kept on the volume. exhausted / failing
      # page; ok closes; unknown and unconfigured do neither. Built 2026-10-01
      # after the provider's prepaid credits ran out and every report link,
      # credits key and alert confirmation stopped sending with no trace.
      - name: Email send check (alarm when transactional email is refused)
        if: always()
        continue-on-error: true
        run: |
          WORD=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.email.status // "unknown"' 2>/dev/null || echo unknown)
          echo "email: $WORD"
          TITLE="Transactional email is not sending"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            exhausted|failing)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports email.status=$WORD. exhausted: the provider refused the last send for credits or quota - top up the email provider's prepaid credits. failing: another refusal; the provider's error code is on the operator read of /api/gateway-status and in the [email] log line. Report links, credits keys, alert confirmations and monitor emails do not reach buyers while this is open. Auto-closes when a send is delivered." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still $WORD at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: email reads ok at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Private upstream-cost table (src/upstream-costs.js). Without it the
      # metered tier, embeddings, images, Exa and X reads refuse and the flat
      # tiers price at their caps. "partial" means it loaded without a key some
      # path reads (that path refuses) or with a model row that did not parse.
      # One word only, never a value. Two readings 30 s apart, because a
      # deploy's boot window can read "missing" once.
      - name: Upstream cost table check (alarm when production runs without it)
        if: always()
        continue-on-error: true
        run: |
          read_uc() { curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamCosts.status // "unknown"' 2>/dev/null || echo unknown; }
          WORD=$(read_uc)
          if [ "$WORD" = "missing" ] || [ "$WORD" = "partial" ]; then sleep 30; WORD=$(read_uc); fi
          echo "upstream costs: $WORD"
          TITLE="Upstream cost table missing or incomplete in production"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          case "$WORD" in
            partial)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports upstreamCosts.status=partial on two readings 30 s apart. The private cost table loaded but lacks a key a serving path reads (that path refuses with 503, nobody is charged) or has a model row that did not parse. The boot log line [upstream-costs] names what is missing. Update the UPSTREAM_COSTS_JSON variable on Railway (and the Actions secret). Auto-closes when it reads ok." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still partial at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
            missing)
              if [ -z "$OPEN" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports upstreamCosts.status=missing on two readings 30 s apart. Production is running without the private cost table: the metered tier, embeddings, images, video, Exa and X reads refuse (503, nobody is charged) and the flat chat tiers price at their caps, so some large requests are refused. Set the UPSTREAM_COSTS_JSON variable on Railway (same value as the Actions secret) and check the boot log line [upstream-costs]. Auto-closes when it reads ok." >/dev/null 2>&1 || echo "issue create failed"
              else
                gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still missing at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
            ok)
              if [ -n "$OPEN" ]; then
                gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the cost table reads ok at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
              fi
              ;;
          esac

      # Serving health: event-loop stalls, 5xx and paid-call error rates, and
      # load shedding by the shared gate, from /__operator/serving-health.json
      # (counts only). Only .status pages; free work refused by its own bounds
      # is an .info word and reaches the run log. Two readings 30 s apart must
      # agree, because a reading taken while a deploy swaps containers can be
      # bad on its own.
      - name: Serving health check (alarm on stalls, slow or failing paid calls, 5xx or shedding)
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          if [ -z "$OP_TOKEN" ]; then echo "no operator token; skipping"; exit 0; fi
          read1() { curl -s --max-time 15 -H "Authorization: Bearer $OP_TOKEN" "$PROD/__operator/serving-health.json"; }
          J=$(read1); S1=$(echo "$J" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
          if [ "$S1" = "degraded" ]; then sleep 30; J=$(read1); fi
          STATUS=$(echo "$J" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
          # The run log keeps the figures; the issue (public) carries the reason words only.
          SUMMARY=$(echo "$J" | jq -r '"reasons=\(.reasons|join(",")) info=\((.info // [])|join(",")) loopP99=\(.loop.p99LastMinuteMs)ms stalls1h=\(.loop.stalls1h) maxStall=\(.loop.maxStall1hMs)ms responses1h=\(.responses1h.total) 5xx=\(.responses1h.s5xx) paid=\(.responses1h.paid) paid5xx=\(.responses1h.paid5xx) shed=\(.shed.shed) shedServing=\(.shed.serving) shedFree=\(.shed.free)"' 2>/dev/null || echo "unreadable")
          REASONS=$(echo "$J" | jq -r '(.reasons // []) | join(", ")' 2>/dev/null || echo "unreadable")
          # What the long stalls were running: route keys and background job
          # names only (never a value, a payer or a figure), so the issue says
          # where to look without anyone reading the log.
          CULPRITS=$(echo "$J" | jq -r '((.stallCulprits.routes // []) + (.stallCulprits.jobs // [] | map("job " + .))) | map(gsub("[^A-Za-z0-9 /:*()._-]"; "") | .[0:60]) | .[0:8] | join(", ")' 2>/dev/null || echo "")
          if [ -n "$CULPRITS" ]; then CULPRIT_NOTE=" Running during the long stalls: $CULPRITS."; else CULPRIT_NOTE=""; fi
          # Whether the long stalls were mostly garbage collection (a word, never a figure).
          STALL_CAUSE=$(echo "$J" | jq -r '.stallCause // ""' 2>/dev/null || echo "")
          case "$STALL_CAUSE" in
            gc) CULPRIT_NOTE="${CULPRIT_NOTE} The long stalls were mostly garbage collection." ;;
            mixed) CULPRIT_NOTE="${CULPRIT_NOTE} Some of the long stalls were mostly garbage collection." ;;
          esac
          # Paid calls whose handler ran past its bound: tool names only, safe
          # characters, never a payer or an amount.
          SLOW_SLUGS=$(echo "$J" | jq -r '(.slowPaid.slugs // []) | map(gsub("[^A-Za-z0-9._-]"; "") | .[0:60]) | map(select(length > 0)) | .[0:8] | join(", ")' 2>/dev/null || echo "")
          if [ -n "$SLOW_SLUGS" ]; then CULPRIT_NOTE="${CULPRIT_NOTE} Slow paid calls: $SLOW_SLUGS."; fi
          echo "serving health: $STATUS ($SUMMARY)"
          echo "stall culprits: ${CULPRITS:-none named} cause: ${STALL_CAUSE:-none}"
          echo "slow paid calls: ${SLOW_SLUGS:-none}"
          TITLE="Serving health DEGRADED"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "degraded" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/__operator/serving-health.json reported degraded on two readings 30 s apart (reasons: ${REASONS:-none given}).${CULPRIT_NOTE} The figures and thresholds are in the operator response and this run's log. Check [loop-stats], [loop-lag], [stall-profile] and [paid-timing] lines in the Railway log. Auto-closes when it reads ok." >/dev/null 2>&1 || echo "issue create failed"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still degraded at $(date -u +%FT%TZ) (reasons: ${REASONS:-none given}).${CULPRIT_NOTE}" >/dev/null 2>&1 || true
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
          fi

      # Postgres reachability (DATABASE_URL, reported as `leads`, + analytics). Both databases were DOWN from
      # 2026-07-02 to 2026-08-25 and nothing paged: the app degrades quietly when
      # they are gone, which is right for buyers and exactly why it went
      # unnoticed. "unconfigured"/"unknown" never page; only "unreachable" does.
      - name: Postgres reachability check (alarm when a database is unreachable)
        if: always()
        continue-on-error: true
        run: |
          # SINGLE-RETRY, like every other probe in this file. This leg shipped
          # without one and paged on 2026-08-29 during our own deploy: a reading
          # taken while the containers swapped, when the fresh container's
          # Postgres pools were still re-initializing behind its boot, was
          # reported later as an outage. The boot log showed "[leads-db] ready"
          # three minutes BEFORE the issue was filed. Five merges in a day is
          # five chances to page on nothing, and an alarm that cries wolf is
          # worse than no alarm. A REAL outage (a stopped Postgres container)
          # fails both readings.
          probe_db() {
            local body leads analytics
            body=$(curl -s --max-time 20 "$PROD/api/gateway-status" 2>/dev/null || echo '{}')
            leads=$(echo "$body" | jq -r '.databases.leads.status // "unknown"' 2>/dev/null || echo unknown)
            analytics=$(echo "$body" | jq -r '.databases.analytics.status // "unknown"' 2>/dev/null || echo unknown)
            echo "$leads $analytics"
          }
          read -r LEADS ANALYTICS <<< "$(probe_db)"
          if [ "$LEADS" = "unreachable" ] || [ "$ANALYTICS" = "unreachable" ]; then
            echo "postgres: first read leads=$LEADS analytics=$ANALYTICS - re-probing in 30s before paging"
            sleep 30
            read -r LEADS ANALYTICS <<< "$(probe_db)"
          fi
          echo "postgres: leads=$LEADS analytics=$ANALYTICS"
          TITLE="Postgres UNREACHABLE (leads/analytics)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ "$LEADS" = "unreachable" ] || [ "$ANALYTICS" = "unreachable" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A Postgres database is unreachable from production (leads=$LEADS, analytics=$ANALYTICS, per /api/gateway-status). The app keeps serving - the tool-call analytics simply stop being recorded - so this does not show as an outage anywhere else. Check the Postgres services in the Railway project (a stopped container looks exactly like this; the platform's own image updates restart them). The app boot log carries a [leads-db]/[analytics-db] probe line naming the failing family/port."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still unreachable at $(date -u +%FT%TZ): leads=$LEADS analytics=$ANALYTICS."
            fi
          elif [ "$LEADS" != "unreachable" ] && [ "$ANALYTICS" != "unreachable" ] && [ "$LEADS" != "unknown" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: leads=$LEADS analytics=$ANALYTICS at $(date -u +%FT%TZ)."
          fi

      # Daily MPP reconciliation (src/mpp-reconcile.js): chain transfers to our
      # Tempo recipient vs the sales ledger vs the refund ledger, plus the MPP
      # evm leg and Stripe SPT rows. The public field carries status WORDS only;
      # the itemized rows (tx hash, slug, amount, category - never a payer) are
      # read from the operator route when the token is present. Single retry:
      # a reading taken inside our own deploy window is {} and reads unknown,
      # so only a second "mismatch" pages.
      - name: MPP reconciliation check (alarm when the chain and our books disagree)
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          read_rec() { curl -s --max-time 20 "$PROD/api/gateway-status" 2>/dev/null | jq -r '.mppReconcile.status // "unknown"' 2>/dev/null || echo unknown; }
          STATUS=$(read_rec)
          if [ "$STATUS" = "mismatch" ]; then echo "mpp reconcile: first read mismatch - re-reading in 30s before paging"; sleep 30; STATUS=$(read_rec); fi
          echo "mpp reconcile: $STATUS"
          TITLE="MPP reconciliation MISMATCH"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ "$STATUS" = "mismatch" ]; then
            CATS=$(curl -s --max-time 20 "$PROD/api/gateway-status" | jq -r '[.mppReconcile.categories // {} | to_entries[] | select(.value=="mismatch") | .key] | join(", ")' 2>/dev/null || echo "")
            DAY=$(curl -s --max-time 20 "$PROD/api/gateway-status" | jq -r '.mppReconcile.day // "?"' 2>/dev/null || echo "?")
            ROWS=""
            if [ -n "$OP_TOKEN" ]; then
              ROWS=$(curl -s --max-time 20 -H "Authorization: Bearer $OP_TOKEN" "$PROD/__operator/mpp-reconcile.json" \
                | jq -r '[.day.mismatches[]? | select(.category != "charged_failed") | .category] | group_by(.) | map("- \(.[0]): \(length)") | .[]' 2>/dev/null || echo "")
            fi
            BODY=$(printf 'The daily MPP reconciliation for %s found records that disagree (categories: %s). Each category is defined in src/mpp-reconcile.js: served_unpaid = booked as settled over Tempo with no transfer on chain; paid_unrecorded = a transfer to our recipient with no sales row; amount_mismatch / wrong_currency / duplicate_tx / missing_tx / evm_unverified / stripe_mismatch as named.\n\n%s\n\nFull detail: GET /__operator/mpp-reconcile.json (operator token). Re-run a day: POST /__operator/mpp-reconcile/run?day=YYYY-MM-DD. Closes when a reconciliation reads ok.' "$DAY" "${CATS:-see the operator route}" "${ROWS:-(counts need the operator token)}")
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still mismatched at $(date -u +%FT%TZ) (day $DAY; categories: ${CATS:-?})."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the MPP reconciliation reads ok at $(date -u +%FT%TZ)."
          fi

      # The rolling seven days (mppReconcile.window7d): the seven UTC days
      # ending at the latest reconciled day, reconciled as one range. The daily
      # alarm above closes as soon as the NEXT day reads ok, so a mismatch
      # nobody resolved drops out of sight while it is still in the window.
      # This pages on that gap only: window mismatch while the latest day reads
      # ok. A daily mismatch is the step above (no second issue for one event);
      # an unknown day says nothing about the window's age, so it does neither.
      # Window ok closes. Same single retry. The status Worker runs the same
      # check every five minutes under the same title.
      - name: MPP reconciliation 7-day window check (alarm when a mismatch stays in the window)
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          read_win() { curl -s --max-time 20 "$PROD/api/gateway-status" 2>/dev/null | jq -r '"\(.mppReconcile.window7d // "unknown") \(.mppReconcile.status // "unknown") \(.mppReconcile.day // "?")"' 2>/dev/null || true; }
          read -r WIN DAILY DAY <<< "$(read_win)" || true
          WIN=${WIN:-unknown}; DAILY=${DAILY:-unknown}
          if [ "$WIN" = "mismatch" ] && [ "$DAILY" = "ok" ]; then echo "mpp reconcile window: first read mismatch - re-reading in 30s before paging"; sleep 30; read -r WIN DAILY DAY <<< "$(read_win)" || true; WIN=${WIN:-unknown}; DAILY=${DAILY:-unknown}; fi
          echo "mpp reconcile 7-day window: $WIN (latest day: $DAILY)"
          TITLE="MPP reconciliation 7-day window MISMATCH"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ "$WIN" = "mismatch" ] && [ "$DAILY" = "ok" ]; then
            if [ -z "$OPEN" ]; then
              case "$DAY" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) DAY="the latest day" ;; esac
              ROWS=""
              if [ -n "$OP_TOKEN" ]; then
                ROWS=$(curl -s --max-time 20 -H "Authorization: Bearer $OP_TOKEN" "$PROD/__operator/mpp-reconcile.json" \
                  | jq -r '[.window.mismatches[]? | select(.category != "charged_failed") | "\((.at // "?")[0:10]) \(.category)"] | group_by(.) | map("- \(.[0]): \(length)") | .[]' 2>/dev/null || echo "")
              fi
              BODY=$(printf '/api/gateway-status reports mppReconcile.window7d=mismatch while the latest day (%s) reads ok. The window is the seven UTC days ending at that day, reconciled as one range, so it holds a disagreement from any of them: usually a day whose own "MPP reconciliation MISMATCH" issue closed when the next day read clean, without the disagreement being resolved. One class only the window sees: one settlement booked on two rows more than an hour apart across a day boundary (duplicate_tx).\n\n%s\n\nRead /__operator/mpp-reconcile.json: window.mismatches lists each item with its time and category. Resolve or explain each one. Closes when the window reads ok, which also happens once the mismatched day leaves the seven-day window.' "$DAY" "${ROWS:-(the day and category of each item need the operator token)}")
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            fi
          elif [ "$WIN" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the 7-day MPP reconciliation window reads ok at $(date -u +%FT%TZ)."
          fi

      # A paid-but-failed MPP call: settle succeeded and the response was not a
      # 200, so the refund ledger holds a debt. Read LIVE from the refund ledger
      # (last 24 h), not from the daily run. Same single retry.
      - name: MPP paid-but-failed check (alarm on any charged-but-failed MPP call in the last day)
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
        run: |
          read_cf() { curl -s --max-time 20 "$PROD/api/gateway-status" 2>/dev/null | jq -r '.mppReconcile.chargedFailedStatus // "unknown"' 2>/dev/null || echo unknown; }
          CF=$(read_cf)
          if [ "$CF" = "charged_failed" ]; then echo "mpp charged-failed: first read positive - re-reading in 30s before paging"; sleep 30; CF=$(read_cf); fi
          echo "mpp charged-failed: $CF"
          TITLE="MPP paid-but-failed call"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ "$CF" = "charged_failed" ]; then
            ROWS=""
            if [ -n "$OP_TOKEN" ]; then
              ROWS=$(curl -s --max-time 20 -H "Authorization: Bearer $OP_TOKEN" "$PROD/__operator/mpp-reconcile.json" \
                | jq -r '"last 24h: \(.status.chargedFailed24h.total // "?") (\(.status.chargedFailed24h.external // "?") external, \(.status.chargedFailed24h.internal // "?") internal)"' 2>/dev/null || echo "")
            fi
            BODY=$(printf 'An MPP call (Tempo, Stripe SPT or the MPP evm wire) settled and was then answered with a non-200 in the last 24 hours, so the buyer paid and did not get their answer. The debt is on the refund ledger; see GET /__operator/refunds.json and the [mpp-tempo]/[mpp-stripe] CHARGED-BUT-NOT-SERVED log line for the cause.\n\n%s\n\nCloses when the 24-hour count is back to zero.' "${ROWS:-(counts need the operator token)}")
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still present at $(date -u +%FT%TZ). ${ROWS}"
            fi
          elif [ "$CF" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: no charged-but-failed MPP call in the last 24 hours at $(date -u +%FT%TZ)."
          fi

      # The spending wallet should never go DOWN, so a fall is worth more than
      # a floor. Everything that spends from it also settles into it
      # (SELF_FUNDING_SLUGS), and every execution tier charges more than it can
      # spend, so barring a manual withdrawal the balance only rises. A
      # low-water alarm fires after the money is gone; this fires on the first
      # unexplained dollar. A withdrawal trips it too, deliberately: the alarm's
      # job is to say "this wallet fell and nobody told me", and a human who
      # withdrew can close the issue in one click.
      - name: Upstream buyer wallet trend (a self-funding wallet that FALLS is unexplained)
        if: always()
        continue-on-error: true
        run: |
          TREND=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyer.trend // "unknown"' 2>/dev/null || echo unknown)
          echo "upstream buyer trend: $TREND"
          TITLE="Upstream buyer wallet is DRAINING (unexplained fall)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$TREND" = "draining" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The x402 upstream spending wallet has fallen below its high-water mark across several consecutive reads.

          The route-execute tiers are SELF-FUNDING: they settle into this wallet and each charges more than it can spend, so their traffic can only raise the balance. A sustained fall means one of:

          1. A manual withdrawal - close this issue if that was you.
          2. seller-payability or attest, which spend from this wallet without settling into it (seller-payability probes external sellers; attest pays Base gas in ETH). A slow trickle from those is expected and sits inside the tolerance; a sustained fall is not.
          3. Upstream spend whose revenue never arrived: a buyer's payment verified and then failed to settle, which is the drain the per-payer ceiling in src/external-spend-guard.js bounds. Check /__operator/stats and the route-execute receipts.
          4. Something we do not understand, which is why this alarm exists.

          Balances are deliberately not published on /api/gateway-status; read the wallet directly to see the number."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still falling at $(date -u +%FT%TZ)."
            fi
          elif [ "$TREND" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the wallet set a new high-water mark at $(date -u +%FT%TZ)."
          fi

      # Settlement freshness — the alarm that did not exist on 2026-08-07.
      #
      # The daily paid canary stopped buying on 2026-08-02 and reported success
      # every time, because its gate keyed on "last successful RUN" and a run
      # that SKIPS the buy also concludes successfully, so each skip refreshed
      # the window the next gate read. Nothing paged, because skipping is not a
      # failure. The only thing that noticed was /status, which showed the
      # settlement component stale — and that only surfaced because a human
      # happened to read the page five days later.
      #
      # So this watches the OBSERVATION, not the workflow. A run that claims
      # success while buying nothing leaves no observation, and an absent
      # observation is exactly what this pages on. It cannot be fooled by the
      # monitor's own green.
      #
      # SELF-HEAL, once per episode: on the FIRST detection (no issue open yet)
      # it dispatches the canary, which always buys because the freshness gate
      # applies to scheduled runs only. If that purchase settles, the next
      # heartbeat closes the issue and nobody is woken. Bounded deliberately to
      # the issue-opening branch: a dispatch spends real USDC across the rails,
      # and if buying is genuinely broken we must page, not retry in a loop.
      # "outage" is NOT handled here — a canary that ran and failed opens its
      # own issue, and two alarms for one event is noise.
      - name: Settlement freshness (the daily canary must actually BUY, not just conclude green)
        if: always()
        continue-on-error: true
        run: |
          SNAP=$(curl -s --max-time 20 "$PROD/api/status" || true)
          STATE=$(printf '%s' "$SNAP" | jq -r '(.components[]? | select(.key=="settlement") | .current.state) // "unreadable"' 2>/dev/null || echo unreadable)
          AGEH=$(printf '%s' "$SNAP" | jq -r '((.components[]? | select(.key=="settlement") | .current.ageMs) // 0) / 3600000 | floor' 2>/dev/null || echo 0)
          echo "settlement observation: state=$STATE age=${AGEH}h"
          # An unreadable page is not evidence of a stale canary - it is
          # evidence we could not look. The prod-down alarm above owns that.
          [ "$STATE" = "unreadable" ] && exit 0
          TITLE="Settlement stale - the paid canary is not buying"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATE" = "unknown" ]; then
            if [ -z "$OPEN" ]; then
              gh workflow run paid-canary.yml --repo "$GITHUB_REPOSITORY" --ref main \
                && HEAL="A canary run has been dispatched automatically (a dispatch always buys - the freshness gate applies to scheduled runs only). If it settles, this issue closes itself on the next heartbeat." \
                || HEAL="Automatic dispatch FAILED, so nothing is retrying on its own."
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "No canary has proven a real USDC purchase in ${AGEH}h, so /status reports the settlement component as \`unknown\` and the public page reads \"Degraded\".

          This means the daily proof that BUYING works is not running. It does not by itself mean buying is broken - the 2026-08-02 case was a gate that skipped every scheduled attempt while the workflow reported success, which is why this alarm watches the observation rather than the workflow's own conclusion.

          Check, in order: the recent runs of \`paid-canary.yml\` and whether the \`canary\` job was SKIPPED rather than run; then the gate step's log, which prints the observation age it read; then the burner balances.

          $HEAL"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still stale at $(date -u +%FT%TZ) (${AGEH}h since the last proven purchase). The automatic dispatch did not resolve it, so this needs a human."
            fi
          elif [ "$STATE" = "operational" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: a canary proved a real purchase at $(date -u +%FT%TZ) (observation is ${AGEH}h old). /status is measuring settlement again."
          fi

      - name: Alert (open issue) or clear (close issue)
        run: |
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Heartbeat: production DOWN"' --json number --jq '.[0].number // empty')
          if [ "${{ steps.probe.outputs.status }}" = "down" ]; then
            BODY="Heartbeat failed 3 consecutive probes (checks:${{ steps.probe.outputs.fails }}).
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Railway dashboard: https://railway.app (check the agent402 service). Re-deploy with a [deploy] commit or the deploy workflow_dispatch."
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still down at $(date -u +%FT%TZ).${{ steps.probe.outputs.fails }}"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Heartbeat: production DOWN" --body "$BODY"
            fi
            exit 1
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: all probes passing at $(date -u +%FT%TZ)."
          fi

      # GitHub delivers this workflow's "*/15" schedule roughly ONCE AN HOUR
      # (measured 2026-07-27: gaps of 60-72 min, plus one 3.3h stall), while
      # /status marks these components stale after 45 minutes. The result was a
      # page reporting "degraded" while production was perfectly healthy -- the
      # exact threshold-vs-cadence mismatch src/status.js warns about.
      #
      # The honest fix is more observations, not a looser alarm, so spread
      # further real probes across the rest of the hour. This runs LAST on
      # purpose: the authoritative probe and every issue open/close above have
      # already completed, so nothing that can page is delayed by it. A failure
      # here is recorded like any other observation and never fails the run.
      - name: Keep status observations fresh until the next run
        if: always()
        continue-on-error: true
        env:
          POW_SECRET: ${{ secrets.POW_SECRET }}
          ROBINHOOD_FACILITATOR_URL: ${{ secrets.ROBINHOOD_FACILITATOR_URL }}
          ARC_RAIL_INTENDED: ${{ secrets.CIRCLE_FACILITATOR_API_KEY != '' }}
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          # Narrow credential for POST /api/status/probe; falls back to OP_TOKEN.
          PROBE_TOKEN: ${{ secrets.STATUS_PROBE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$OP_TOKEN" ] || { echo "no operator token - skipping freshness loop"; exit 0; }
          . scripts/heartbeat-probe.sh
          for i in 1 2 3 4; do
            sleep 720
            if probe; then
              echo "refresh $i: healthy"
              record_observation up ""
            else
              echo "refresh $i: FAILS=$FAILS"
              record_observation down "$FAILS"
            fi
          done
