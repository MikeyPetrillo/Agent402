name: Heartbeat

# Production telemetry, fully automated:
#   • every 15 min — is agent402.tools actually serving? (health, catalog,
#     a real proof-of-work paid call, the MCP connector). Persistent failure
#     opens a GitHub issue; recovery closes it.
#
# Revenue tracking lives elsewhere now — the /__operator dashboard, /api/stats,
# and on-chain history at https://basescan.org/address/0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0#tokentxns
# are the canonical sources. The old "external customer payments" issue-comment
# loop was useful as a first-customer alarm but doesn't scale — every new buy
# became a new comment on one issue, which becomes unreadable at volume.
on:
  schedule:
    # MEASURED 2026-08-30, and the reason this is not "*/15": GitHub delivered
    # that schedule with gaps of 2h02, 2h18, 2h32, 3h16, 5h22, 7h00, 7h01,
    # 7h57, 9h58 and 12h29 over the preceding twelve runs. Eighteen alarm
    # checks ride this workflow - every wallet balance, the settlement
    # freshness check, Postgres reachability, the quota watches - so at that
    # cadence a drained wallet or a dead database can go unseen for half a day,
    # and a resolved alarm (the credits issue on 08-30) stays open for hours
    # after the operator has fixed it.
    #
    # GitHub throttles high-frequency schedules first, and "*/15" with its
    # :00-aligned ticks is both the most aggressive ask and the most contended
    # minute. Asking for less, on uncontended offsets, is the documented way to
    # get MORE actual delivery. This is a mitigation, not a cure: re-measure
    # the real gaps here before trusting any number in this comment.
    #
    # The structural fix, if this is still bad: trigger it from the Cloudflare
    # status worker, which already runs every 5 minutes reliably on separate
    # infra - it needs a GitHub token there, which is a blast-radius decision.
    - cron: "*/15 * * * *"
  push:
    branches:
      - "main"
      - "claude/sweet-brown-i99jl3"
    paths:
      - ".github/trigger-heartbeat"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  # For the settlement-freshness step's one self-healing `gh workflow run`.
  # Nothing else here dispatches anything.
  actions: write

env:
  PROD: https://agent402.tools

jobs:
  health:
    runs-on: ubuntu-latest
    # Raised for the freshness loop in the final step (4 x 12 min of extra
    # observations). Everything that can page has already run by then.
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Probe production (3 attempts before declaring an outage)
        id: probe
        env:
          # Needed so the probe can mint the same X-Heartbeat-Token the server
          # verifies — keeps internal probe traffic out of the external PoW rail
          # on the operator dashboard. Without it the probe still works but its
          # successful PoW call is counted as real external demand.
          POW_SECRET: ${{ secrets.POW_SECRET }}
          # Presence of this secret is the "operator intends the Robinhood/USDG
          # rail" signal — the rails check below only requires eip155:4663 in
          # the live 402 accepts when it is set, so intentionally disabling the
          # rail (removing the secret) never pages.
          ROBINHOOD_FACILITATOR_URL: ${{ secrets.ROBINHOOD_FACILITATOR_URL }}
        run: |
          . scripts/heartbeat-probe.sh
          for attempt in 1 2 3; do
            if probe; then echo "status=up" >> "$GITHUB_OUTPUT"; echo "production healthy (attempt $attempt)"; exit 0; fi
            echo "attempt $attempt failed:$FAILS — retrying in 60s"
            sleep 60
          done
          echo "status=down" >> "$GITHUB_OUTPUT"
          echo "fails=$FAILS" >> "$GITHUB_OUTPUT"

      # Record what this probe observed, so /status can show availability
      # measured from OUTSIDE production rather than production's opinion of
      # itself. Best-effort by design: never `-e`-fails the job, because a
      # status-page write must not turn a healthy heartbeat red. When prod is
      # down this POST cannot land either — that absence is the evidence, and
      # /status renders a missing observation as a gap rather than as uptime.
      - name: Record the probe on /status
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          # Narrow credential for POST /api/status/probe; falls back to OP_TOKEN.
          PROBE_TOKEN: ${{ secrets.STATUS_PROBE_TOKEN }}
          STATUS: ${{ steps.probe.outputs.status }}
          FAILS: ${{ steps.probe.outputs.fails }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          . scripts/heartbeat-probe.sh
          record_observation "$STATUS" "$FAILS"

      # Gateway credits: /v1 tiers settle the buyer's USDC before the handler
      # runs, so an empty OpenRouter balance turns every gateway call into
      # "charged but failed". Alarm on "low" BEFORE that happens. Separate
      # issue from "production DOWN" (prod is serving fine); never fails the
      # heartbeat run itself, and "unknown"/"unconfigured" never page.
      # A rail can be down for DAYS without anyone knowing.
      #
      # payments.js drops a rail whose facilitator is unreachable so the other
      # chains keep settling - correct, and the reason a dead Celo facilitator
      # costs one chain instead of every paid route. But the drop is quiet by
      # design: paid revenue keeps flowing, /health stays 200, and the only
      # trace is a boot log. Celo sat dropped for days and surfaced only because
      # someone happened to ask why the revenue page looked short.
      #
      # Deliberately an ISSUE, not a page. A degraded rail is not an outage -
      # the other chains are still earning - so it sits at the same severity as
      # "burner LOW": visible, tracked, auto-closing, nobody woken.
      - name: Rail check (alarm on a configured rail that is not being offered)
        if: always()
        continue-on-error: true
        run: |
          RAILS=$(curl -s --max-time 15 "$PROD/api/rails" || echo '{}')
          DEGRADED=$(echo "$RAILS" | jq -r '.degraded // empty' 2>/dev/null || echo "")
          TITLE="Settlement rail DEGRADED"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          # An unreadable surface is NOT evidence of health: say so and stop,
          # rather than closing a real issue on the back of a failed curl.
          if [ -z "$DEGRADED" ]; then
            echo "rails: /api/rails unreadable - not treating that as healthy; leaving any open issue alone"
            exit 0
          fi
          echo "rails: degraded=$DEGRADED"
          if [ "$DEGRADED" -gt 0 ]; then
            if [ -z "$OPEN" ]; then
              echo "$RAILS" | jq -r '[.rails[] | select(.offered==false) | "- **\(.network)** - \(.reason)"] | join("\n")' > /tmp/rail-body.md
              {
                echo ""
                echo "Revenue is unaffected on the other rails: a rail nobody can settle is dropped deliberately so the rest keep earning. This is a notice, not an outage."
                echo ""
                echo "It closes itself when the rail returns - rail-selfheal.yml restarts the service once that rail's own facilitator answers again, and this check closes the issue on the next heartbeat."
                echo ""
                echo "Live state: $PROD/api/rails"
              } >> /tmp/rail-body.md
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/rail-body.md
            else
              echo "already tracked in #$OPEN"
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: every configured rail is being offered again at $(date -u +%FT%TZ)."
          fi

      - name: Gateway credits check (alarm on low OpenRouter balance)
        if: always()
        continue-on-error: true
        run: |
          BODY=$(curl -s --max-time 15 "$PROD/api/gateway-status" || echo '{}')
          STATUS=$(echo "$BODY" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
          UNKNOWN_MIN=$(echo "$BODY" | jq -r '.unknownForMinutes // 0' 2>/dev/null || echo 0)
          echo "gateway credits: $STATUS (credits leg: $(echo "$BODY" | jq -r '.credits // "-"' 2>/dev/null), key-limit leg: $(echo "$BODY" | jq -r '.keyLimit // "-"' 2>/dev/null), unknown for ${UNKNOWN_MIN}m)"
          TITLE="Gateway credits LOW (OpenRouter)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The OpenRouter balance behind the /v1 gateway is below the low-water mark (OPENROUTER_LOW_CREDITS_USD, default \$15) OR the production key's own monthly USD limit has under 25% left (OPENROUTER_LOW_KEY_LIMIT_FRACTION). Either ceiling stops the gateway: upstream refuses, we answer 502, settlement is cancelled, so buyers are NOT charged but every /v1 sale is lost until it is topped up. Top up credits: https://openrouter.ai/settings/credits (manual - the programmatic top-up API is gone). Raise the key limit: https://openrouter.ai/settings/keys (key: Agent402)."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi
          # A balance we cannot READ is its own alarm once it persists: "unknown"
          # never paged, which is exactly how a dead alarm stays dead. 180 min =
          # several heartbeat runs, well past any OpenRouter blip (server caches
          # the read for 5 min and only goes unknown when BOTH legs are unreadable).
          TITLE2="Gateway balance UNREADABLE (OpenRouter)"
          OPEN2=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE2\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "unknown" ] && [ "${UNKNOWN_MIN:-0}" -ge 180 ] 2>/dev/null; then
            if [ -z "$OPEN2" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE2" --body "/api/gateway-status has reported status=unknown for ${UNKNOWN_MIN} minutes: neither OpenRouter /credits nor /key answered readably with the production key. The low-balance alarm is blind while this lasts. Check the key (https://openrouter.ai/settings/keys), OpenRouter status, and the server log for fetch errors."
            fi
          elif [ "$STATUS" != "unknown" ] && [ -n "$OPEN2" ]; then
            gh issue close "$OPEN2" --repo "$GITHUB_REPOSITORY" --comment "Balance readable again at $(date -u +%FT%TZ)."
          fi

      # Stellar facilitator XLM balance watch. This signer pays the network
      # fee on every settlement it handles, so an empty balance means real
      # settlement failures, not just a degraded feature. /health is
      # deliberately unauthenticated (a public address + a balance number,
      # nothing sensitive), so this needs no facilitator token.
      - name: Stellar facilitator balance check (alarm on low XLM)
        if: always()
        continue-on-error: true
        run: |
          RESP=$(curl -s --max-time 15 "https://agent402-facilitator-production.up.railway.app/health" 2>/dev/null || echo '{}')
          LOW=$(echo "$RESP" | jq -r '.low // "unknown"' 2>/dev/null || echo unknown)
          BALANCE=$(echo "$RESP" | jq -r '.xlmBalance // "unknown"' 2>/dev/null || echo unknown)
          echo "facilitator XLM balance: $BALANCE (low=$LOW)"
          # Unreadable is logged LOUDLY, never silently treated as "fine" -
          # a silent skip is exactly what kept the charged-failure alarm dead
          # for months (same doctrine as the canary burner watch below).
          if [ "$LOW" = "unknown" ]; then
            echo "::warning::facilitator /health UNREADABLE or missing .low - not silently skipping, investigate"
          fi
          TITLE="Stellar facilitator XLM LOW"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$LOW" = "true" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The standalone Stellar facilitator's signer (facilitator/) is below its low-balance mark (FACILITATOR_LOW_BALANCE_XLM, default 5 XLM). It pays the network fee on every settlement it handles, so an empty balance means real settlement failures. Balance: $BALANCE XLM. Top up the signer address at \`/health\` on the facilitator service."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ) ($BALANCE XLM)."
            fi
          elif [ "$LOW" = "false" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ) ($BALANCE XLM)."
          fi

      # Bazaar listing validation - Coinbase's keyless, read-only
      # POST /platform/v2/x402/validate probes our flagship routes the way the
      # Bazaar crawler does (402 shape, PAYMENT-REQUIRED, accepts, bazaar
      # extension, simulated accept, index membership). Never called before
      # 2026-08-19; a broken 402 on one route could silently drop its listing
      # for weeks. Exit 1 = a route is INVALID (our defect) -> issue; exit 2 =
      # the validator itself unreadable (CDP-side) -> loud warning, no issue.
      - name: Bazaar listing validation (flagship routes vs CDP validate)
        if: always()
        continue-on-error: true
        run: |
          set +e
          OUT=$(TARGET_URL="$PROD" node scripts/bazaar-validate.js 2>&1); CODE=$?
          set -e
          echo "$OUT" | tail -20
          TITLE="Bazaar listing validation FAILED"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          DETAIL=$(echo "$OUT" | grep -E '^(FAIL|\?\?) ' | head -20 || true)
          if [ "$CODE" = "1" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$(printf 'Coinbase CDP'"'"'s x402 validate endpoint reports at least one flagship route INVALID - its 402 no longer passes the Bazaar crawler'"'"'s preflight (shape, PAYMENT-REQUIRED header, accepts, bazaar extension) or the index dropped it. Buyers discovering through the Bazaar / AgentCore will not see that route until it validates again.\n\n```\n%s\n```\n\nReproduce: `node scripts/bazaar-validate.js` (read-only, keyless). A green run closes this.' "$DETAIL")"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$(printf 'Still failing at %s\n\n```\n%s\n```' "$(date -u +%FT%TZ)" "$DETAIL")"
            fi
          elif [ "$CODE" = "2" ]; then
            echo "::warning::CDP validate endpoint UNREADABLE for every flagship route - not silently skipping; the listing check is blind this run"
          elif [ "$CODE" = "0" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: every flagship route validates again at $(date -u +%FT%TZ)."
          fi

      # Canary burner balance watch — the 2026-07-27 lesson: the Base burner
      # hit $0.000 mid-sweep, the canary filed it as a settlement outage, and
      # the public status page said OUTAGE while buyers settled fine. The
      # canary now classifies that correctly, but the better outcome is never
      # getting there: warn while there is still a week of runway. Public RPC,
      # no keys; unreadable balance warns loudly rather than silently passing.
      - name: Canary burner balance watch (Base USDC)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BURNER: "0x902dCf34E53695bDEA2fFB354b1a2e58bD598256"
          WARN_USD: ${{ vars.CANARY_BURNER_LOW_USD || '1' }}
        run: |
          DATA="0x70a08231000000000000000000000000${BURNER#0x}"
          BAL=$(curl -s --max-time 15 https://mainnet.base.org -H 'Content-Type: application/json'             -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_call\",\"params\":[{\"to\":\"0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913\",\"data\":\"$DATA\"},\"latest\"]}"             | jq -re '.result' 2>/dev/null) || { echo "::warning::burner balance UNREADABLE — not silently skipping, investigate"; exit 0; }
          USD=$(node -e "console.log((parseInt('$BAL',16)/1e6).toFixed(4))")
          echo "canary burner Base USDC: \$$USD (warn under \$$WARN_USD)"
          TITLE="Canary burner LOW (Base)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          LOW=$(node -e "console.log($USD < $WARN_USD ? 1 : 0)")
          if [ "$LOW" = "1" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The paid canary's Base burner ($BURNER) is at \$$USD USDC, under the \$$WARN_USD low-water mark (repo var CANARY_BURNER_LOW_USD). The daily tools sweep spends ~\$0.15-0.30/run; top up before it runs dry — an empty burner now files as a funding issue rather than an outage, but a funded one is better."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low: \$$USD at $(date -u +%FT%TZ)."
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: \$$USD on Base at $(date -u +%FT%TZ)."
          fi

      # PayAI settlement quota watch — PayAI is the PRIMARY facilitator for
      # Solana/Polygon/Arbitrum/Avalanche (free tier: 10k settlements/month).
      # Solana is our #2 revenue chain, so hitting the cap silently would be
      # the CDP-billing-gate incident class all over again: PayAI rejects
      # settles and a top rail goes dark. Counted from the on-chain ledger
      # (/api/revenue/daily, ext+int — the canary consumes quota too); this is
      # a LOWER bound since rejected settles may also meter. Same issue
      # open/close pattern as the gateway-credits alarm. A missing/unparseable
      # field is logged LOUDLY and never silently treated as "fine" — a silent
      # skip is exactly what kept the charged-failure alarm dead for months.
      - name: PayAI settlement quota watch (1k/month free tier)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          THRESH: ${{ vars.PAYAI_QUOTA_WARN || 800 }}
        run: |
          CUT=$(date -u -d '30 days ago' +%F)
          COUNT=$(curl -s --max-time 20 "$PROD/api/revenue/daily" | jq -e --arg cut "$CUT"             '[.days[] | select(.day >= $cut) | select(.chain=="solana" or .chain=="polygon" or .chain=="arbitrum" or .chain=="avalanche") | (.extTx + .intTx)] | add // 0')             || { echo "::warning::PayAI quota watch UNREADABLE — /api/revenue/daily missing or unparseable. NOT skipping silently: investigate."; exit 0; }
          echo "PayAI-chain settles, rolling 30d: $COUNT / 1000 free (warn at $THRESH)"
          TITLE="PayAI settlement quota HIGH"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$COUNT" -ge "$THRESH" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Rolling 30-day settlements on PayAI-settled chains (Solana/Polygon/Arbitrum/Avalanche) reached $COUNT of the 10,000/month free tier (warn threshold $THRESH). If the cap is hit, PayAI rejects settles and those rails go dark — the settle-fallback chain (Solvador) catches clean rejections, but the durable fixes are PAYAI_API_KEY_ID/SECRET (authenticated tier, merchant.payai.network) or shifting canary volume. Count is on-chain settles (ext+int) from /api/revenue/daily — a lower bound, rejected settles may also meter."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still high: $COUNT / 1000 free at $(date -u +%FT%TZ)."
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: rolling 30-day count back to $COUNT (below $THRESH) at $(date -u +%FT%TZ)."
          fi

      # CDP settlement metering watch. Measured 2026-08-28: 3,677 settlements
      # in 30 days on the chains CDP is tried FIRST for (Base, Solana, Polygon,
      # Arbitrum) against a documented 1,000/month free tier, so the account is
      # metered and has been for a while. That is a few dollars a month, not a
      # problem, but nothing was watching the BIG rail while a step watched the
      # small one, and CDP's billing gate answers `payment-method-required` on
      # /settle when an account cannot be charged - which would take Base down.
      # Informational at CDP_METERED_WARN (default 20,000 = ~$20/month); the
      # real alarm for a billing lapse is the paid canary failing a rail leg.
      - name: CDP settlement metering watch (1k/month free, then $0.001/tx)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          THRESH: ${{ vars.CDP_METERED_WARN || 20000 }}
        run: |
          CUT=$(date -u -d '30 days ago' +%F)
          COUNT=$(curl -s --max-time 20 "$PROD/api/revenue/daily" | jq -e --arg cut "$CUT" \
            '[.days[] | select(.day >= $cut) | select(.chain=="base" or .chain=="solana" or .chain=="polygon" or .chain=="arbitrum") | (.extTx + .intTx)] | add // 0' 2>/dev/null || echo "unreadable")
          if [ "$COUNT" = "unreadable" ]; then
            echo "WARNING: CDP metering count unreadable from /api/revenue/daily - not treating that as fine"
            exit 0
          fi
          BILLED=$(( COUNT > 1000 ? COUNT - 1000 : 0 ))
          echo "CDP-first-chain settles, rolling 30d: $COUNT (1000 free, ~$BILLED billed at \$0.001 = \$$(( BILLED / 1000 )).$(printf '%03d' $(( BILLED % 1000 ))))"
          TITLE="CDP settlement metering HIGH"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$COUNT" -ge "$THRESH" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Rolling 30-day settlements on CDP-first chains (Base/Solana/Polygon/Arbitrum): $COUNT, of which ~$BILLED are billed at \$0.001 each beyond the 1,000/month free tier. Check the CDP account has a working payment method: a billing lapse answers payment-method-required on /settle and takes the Base rail down. Threshold: repo var CDP_METERED_WARN."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still high: $COUNT settles, ~$BILLED billed, at $(date -u +%FT%TZ)."
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: rolling 30-day count back to $COUNT at $(date -u +%FT%TZ)."
          fi

      # x402 spending-wallet check — same pattern as gateway credits above:
      # when the upstream buyer wallet (blockscout-kit) runs dry the tools go
      # dark quietly (502s, buyers never charged), so alarm on "low" first.
      # "unknown"/"unconfigured" never page.
      - name: Upstream buyer wallet check (alarm on low x402 spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyer.status // "unknown"' 2>/dev/null || echo unknown)
          echo "upstream buyer wallet: $STATUS"
          TITLE="Upstream buyer wallet LOW (x402)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The x402 upstream spending wallet (X402_UPSTREAM_BUYER_KEY) behind the blockscout-kit tools is below the low-water mark (UPSTREAM_BUYER_LOW_USD, default \$0.50). When it empties, contract-inspect/address-profile fail 502 (buyers are never charged, but the tools go dark). Top up: send USDC on Base to the upstream buyer address (see CLAUDE.md env docs)."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Algorand spending-wallet check — same pattern as the Base wallet above:
      # this wallet pays external Algorand sellers for the SOR (route-execute
      # settles to the TREASURY during the challenge window, so the float is a
      # one-way drain until self-funding flips on post-October). optedIn:false
      # also buckets as "low" — an un-opted-in wallet can't pay at all.
      # "unknown"/"unconfigured" never page.
      - name: Algorand upstream buyer wallet check (alarm on low AVM spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyerAvm.status // "unknown"' 2>/dev/null || echo unknown)
          echo "algorand upstream buyer wallet: $STATUS"
          TITLE="Algorand upstream buyer wallet LOW (x402)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The Algorand x402 spending wallet (ALGORAND_UPSTREAM_BUYER_MNEMONIC) behind the SOR's Algorand external routing is below the low-water mark (ALGORAND_UPSTREAM_BUYER_LOW_USD, default \$0.50) — or not yet opted in to USDC ASA 31566704 (check /api/gateway-status upstreamBuyerAvm.optedIn). When it empties, Algorand external routing fails 502 (buyers are never charged, but the path goes dark). Top up: send USDC on Algorand to the AVM spending wallet address (see CLAUDE.md env docs)."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Solana (SVM) spending-wallet check - same pattern: this wallet pays
      # Solana x402 sellers for the SOR's external leg (src/solana-buyer.js).
      # "unknown"/"unconfigured" never page.
      - name: Solana upstream buyer wallet check (alarm on low SVM spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyerSvm.status // "unknown"' 2>/dev/null || echo unknown)
          echo "solana upstream buyer wallet: $STATUS"
          TITLE="Solana upstream buyer wallet LOW (x402)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The Solana x402 spending wallet (SOLANA_UPSTREAM_BUYER_KEY) behind the SOR's Solana external routing is below the low-water mark (SOLANA_UPSTREAM_BUYER_LOW_USD, default \$0.50). When it empties, Solana external routing fails 502 (buyers are never charged, but the path goes dark). Top up: send USDC on Solana to the SVM spending wallet address (see CLAUDE.md env docs)."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Tempo (MPP) spending-wallet check - same pattern: this wallet pays MPP
      # sellers on Tempo for the SOR's external leg (src/tempo-buyer.js), in
      # USDC.e. "unknown"/"unconfigured" never page.
      - name: Tempo upstream buyer wallet check (alarm on low MPP spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyerTempo.status // "unknown"' 2>/dev/null || echo unknown)
          echo "tempo upstream buyer wallet: $STATUS"
          TITLE="Tempo upstream buyer wallet LOW (MPP)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The Tempo spending wallet (TEMPO_UPSTREAM_BUYER_KEY) behind the SOR's MPP external routing is below the low-water mark (TEMPO_UPSTREAM_BUYER_LOW_USD, default \$0.50) in USDC.e on Tempo. When it empties, MPP external routing fails (buyers are never charged, but the path goes dark). Top up: send USDC on Tempo (0x20C0...8b50) to the Tempo spending wallet address (see CLAUDE.md env docs)."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # The Stellar facilitator's own fee-paying account. It pays the
      # transaction fee on EVERY Stellar settlement, and until 2026-08-31 it
      # was the one spending wallet we run with no alarm on it. Settlement is
      # cheap (0.00235 XLM each), so this is a slow alarm: it exists because an
      # empty fee account does not look like an outage - settlements simply
      # stop landing and the rail reads as a payment failure - not because the
      # balance is ever close. "unknown"/"unconfigured" never page - the
      # facilitator URL can point at a third party whose /health is not this.
      - name: Stellar facilitator fee account check (alarm on low XLM)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.stellarFacilitator.status // "unknown"' 2>/dev/null || echo unknown)
          echo "stellar facilitator fee account: $STATUS"
          TITLE="Stellar facilitator fee account LOW (XLM)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The self-hosted Stellar facilitator's signing account is below its low-water mark (FACILITATOR_LOW_BALANCE_XLM on the agent402-facilitator service, default 1 XLM, roughly 425 settlements at the observed 0.00235 XLM each). That account pays the transaction fee on every Stellar settlement, so when it empties, Stellar settlements stop landing - buyers are never charged, but the rail goes dark and the paid canary reports it as a rail failure rather than as an empty wallet. Top up: send XLM to the address on the facilitator's GET /health (signerAddress). Auto-closes when the balance recovers."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Subscription gas sponsor - watches PATHUSD, not USDC.e. A sponsored
      # Tempo transaction pays its fee in the default token, so a sponsor full
      # of USDC.e and empty of PathUSD is EMPTY for this purpose and the chain
      # says "insufficient funds ... have 0". Funding the wrong token looks
      # exactly like having no wallet, which is why this alarm names the token.
      # It matters more than it looks: an empty sponsor fails ACTIVATIONS loudly
      # (402, nobody charged) but silently sends RENEWALS past_due, so existing
      # subscribers keep being served for free until their grace window ends.
      - name: Subscription gas sponsor check (alarm on low PathUSD)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.subscriptionFeePayer.status // "unknown"' 2>/dev/null || echo unknown)
          echo "subscription gas sponsor: $STATUS"
          TITLE="Subscription gas sponsor LOW (PathUSD)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The Tempo subscription gas sponsor (TEMPO_SUBSCRIPTION_FEE_PAYER_KEY) is low on PathUSD. Gas on this rail is paid in PathUSD, NOT the USDC.e the products are priced in, so topping up the wrong token will not fix it. While it is empty, activations fail 402 (nobody is charged) but renewals go past_due, which means existing subscribers are served for free until their grace window ends. Top up via the fund-tempo-fee-payer workflow with token=pathusd."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: PathUSD back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Operator-token guessing: the per-IP limiter caps one source; this is the
      # aggregate. "elevated" = OPERATOR_AUTH_FAIL_ALERT (default 100) wrong
      # operator credentials in the last hour. Counts only; rotate the token if
      # it persists. "ok"/"unknown" never page.
      - name: Operator token guessing check (alarm when wrong-credential rate is elevated)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.operatorAuth.status // "unknown"' 2>/dev/null || echo unknown)
          FAILS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.operatorAuth.failures1h // "?"' 2>/dev/null || echo "?")
          echo "operator auth: $STATUS ($FAILS wrong credentials in the last hour)"
          TITLE="Operator token guessing ELEVATED"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ "$STATUS" = "elevated" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "/api/gateway-status reports operatorAuth.status=elevated: $FAILS wrong operator credentials in the last hour (threshold OPERATOR_AUTH_FAIL_ALERT). The per-IP limiter caps each source; this is the aggregate. If it persists, rotate AGENT402_OPERATOR_TOKEN on Railway and in Actions secrets. Auto-closes when the rate drops." >/dev/null 2>&1 || echo "issue create failed"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still elevated at $(date -u +%FT%TZ): $FAILS in the last hour." >/dev/null 2>&1 || true
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: wrong-credential rate back under the threshold at $(date -u +%FT%TZ)." >/dev/null 2>&1 || true
          fi

      # Postgres reachability (leads + analytics). Both databases were DOWN from
      # 2026-07-02 to 2026-08-25 and nothing paged: the app degrades quietly when
      # they are gone, which is right for buyers and exactly why it went
      # unnoticed. "unconfigured"/"unknown" never page; only "unreachable" does.
      - name: Postgres reachability check (alarm when a database is unreachable)
        if: always()
        continue-on-error: true
        run: |
          # SINGLE-RETRY, like every other probe in this file. This leg shipped
          # without one and paged on 2026-08-29 during our own deploy: the
          # service is volume-backed, so each deploy has a ~60-90s window with
          # no container, and the app's Postgres pools re-init behind a ~10-18s
          # boot stall after that. The boot log showed "[leads-db] ready" three
          # minutes BEFORE the issue was filed - a reading taken in that window,
          # reported later. Five merges in a day is five chances to page on
          # nothing, and an alarm that cries wolf is worse than no alarm.
          # A REAL outage (a stopped Postgres container) fails both readings.
          probe_db() {
            local body leads analytics
            body=$(curl -s --max-time 20 "$PROD/api/gateway-status" 2>/dev/null || echo '{}')
            leads=$(echo "$body" | jq -r '.databases.leads.status // "unknown"' 2>/dev/null || echo unknown)
            analytics=$(echo "$body" | jq -r '.databases.analytics.status // "unknown"' 2>/dev/null || echo unknown)
            echo "$leads $analytics"
          }
          read -r LEADS ANALYTICS <<< "$(probe_db)"
          if [ "$LEADS" = "unreachable" ] || [ "$ANALYTICS" = "unreachable" ]; then
            echo "postgres: first read leads=$LEADS analytics=$ANALYTICS - re-probing in 30s before paging"
            sleep 30
            read -r LEADS ANALYTICS <<< "$(probe_db)"
          fi
          echo "postgres: leads=$LEADS analytics=$ANALYTICS"
          TITLE="Postgres UNREACHABLE (leads/analytics)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ "$LEADS" = "unreachable" ] || [ "$ANALYTICS" = "unreachable" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A Postgres database is unreachable from production (leads=$LEADS, analytics=$ANALYTICS, per /api/gateway-status). The app keeps serving - tollbooth leads and the tool-call analytics simply stop being recorded - so this does not show as an outage anywhere else. Check the Postgres services in the Railway project (a stopped container looks exactly like this; the platform's own image updates restart them). The app boot log carries a [leads-db]/[analytics-db] probe line naming the failing family/port."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still unreachable at $(date -u +%FT%TZ): leads=$LEADS analytics=$ANALYTICS."
            fi
          elif [ "$LEADS" != "unreachable" ] && [ "$ANALYTICS" != "unreachable" ] && [ "$LEADS" != "unknown" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: leads=$LEADS analytics=$ANALYTICS at $(date -u +%FT%TZ)."
          fi

      # The spending wallet should never go DOWN, so a fall is worth more than
      # a floor. Everything that spends from it also settles into it
      # (SELF_FUNDING_SLUGS), and every execution tier charges more than it can
      # spend, so barring a manual withdrawal the balance only rises. A
      # low-water alarm fires after the money is gone; this fires on the first
      # unexplained dollar. A withdrawal trips it too, deliberately: the alarm's
      # job is to say "this wallet fell and nobody told me", and a human who
      # withdrew can close the issue in one click.
      - name: Upstream buyer wallet trend (a self-funding wallet that FALLS is unexplained)
        if: always()
        continue-on-error: true
        run: |
          TREND=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyer.trend // "unknown"' 2>/dev/null || echo unknown)
          echo "upstream buyer trend: $TREND"
          TITLE="Upstream buyer wallet is DRAINING (unexplained fall)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$TREND" = "draining" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The x402 upstream spending wallet has fallen below its high-water mark across several consecutive reads.

          That wallet is SELF-FUNDING: every tool that spends from it also settles into it, and every execution tier charges more than it can spend (worst case +\$0.005 / +\$0.01 / +\$0.05 / +\$0.30 per call). Its balance should only rise. A sustained fall means one of:

          1. A manual withdrawal - close this issue if that was you.
          2. Upstream spend whose revenue never arrived: a buyer's payment verified and then failed to settle, which is the drain the per-payer ceiling in src/external-spend-guard.js bounds. Check /__operator/stats and the route-execute receipts.
          3. Something we do not understand, which is why this alarm exists.

          Balances are deliberately not published on /api/gateway-status; read the wallet directly to see the number."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still falling at $(date -u +%FT%TZ)."
            fi
          elif [ "$TREND" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the wallet set a new high-water mark at $(date -u +%FT%TZ)."
          fi

      # Settlement freshness — the alarm that did not exist on 2026-08-07.
      #
      # The daily paid canary stopped buying on 2026-08-02 and reported success
      # every time, because its gate keyed on "last successful RUN" and a run
      # that SKIPS the buy also concludes successfully, so each skip refreshed
      # the window the next gate read. Nothing paged, because skipping is not a
      # failure. The only thing that noticed was /status, which showed the
      # settlement component stale — and that only surfaced because a human
      # happened to read the page five days later.
      #
      # So this watches the OBSERVATION, not the workflow. A run that claims
      # success while buying nothing leaves no observation, and an absent
      # observation is exactly what this pages on. It cannot be fooled by the
      # monitor's own green.
      #
      # SELF-HEAL, once per episode: on the FIRST detection (no issue open yet)
      # it dispatches the canary, which always buys because the freshness gate
      # applies to scheduled runs only. If that purchase settles, the next
      # heartbeat closes the issue and nobody is woken. Bounded deliberately to
      # the issue-opening branch: a dispatch spends real USDC across the rails,
      # and if buying is genuinely broken we must page, not retry in a loop.
      # "outage" is NOT handled here — a canary that ran and failed opens its
      # own issue, and two alarms for one event is noise.
      - name: Settlement freshness (the daily canary must actually BUY, not just conclude green)
        if: always()
        continue-on-error: true
        run: |
          SNAP=$(curl -s --max-time 20 "$PROD/api/status" || true)
          STATE=$(printf '%s' "$SNAP" | jq -r '(.components[]? | select(.key=="settlement") | .current.state) // "unreadable"' 2>/dev/null || echo unreadable)
          AGEH=$(printf '%s' "$SNAP" | jq -r '((.components[]? | select(.key=="settlement") | .current.ageMs) // 0) / 3600000 | floor' 2>/dev/null || echo 0)
          echo "settlement observation: state=$STATE age=${AGEH}h"
          # An unreadable page is not evidence of a stale canary - it is
          # evidence we could not look. The prod-down alarm above owns that.
          [ "$STATE" = "unreadable" ] && exit 0
          TITLE="Settlement stale - the paid canary is not buying"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATE" = "unknown" ]; then
            if [ -z "$OPEN" ]; then
              gh workflow run paid-canary.yml --repo "$GITHUB_REPOSITORY" --ref main \
                && HEAL="A canary run has been dispatched automatically (a dispatch always buys - the freshness gate applies to scheduled runs only). If it settles, this issue closes itself on the next heartbeat." \
                || HEAL="Automatic dispatch FAILED, so nothing is retrying on its own."
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "No canary has proven a real USDC purchase in ${AGEH}h, so /status reports the settlement component as \`unknown\` and the public page reads \"Degraded\".

          This means the daily proof that BUYING works is not running. It does not by itself mean buying is broken - the 2026-08-02 case was a gate that skipped every scheduled attempt while the workflow reported success, which is why this alarm watches the observation rather than the workflow's own conclusion.

          Check, in order: the recent runs of \`paid-canary.yml\` and whether the \`canary\` job was SKIPPED rather than run; then the gate step's log, which prints the observation age it read; then the burner balances.

          $HEAL"
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still stale at $(date -u +%FT%TZ) (${AGEH}h since the last proven purchase). The automatic dispatch did not resolve it, so this needs a human."
            fi
          elif [ "$STATE" = "operational" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: a canary proved a real purchase at $(date -u +%FT%TZ) (observation is ${AGEH}h old). /status is measuring settlement again."
          fi

      # Solvador registry watch — their /discovery/resources speaks the
      # standard Bazaar shape but is EMPTY (total: 0, probed 2026-07-21). The
      # day it fills, it becomes the only discovery home for x402 sellers on
      # Optimism/Unichain/World Chain/Linea, and we want to be the first
      # aggregator to ingest it (one-line DISCOVERY_SOURCES entry, PayAI
      # shape). One-shot informational signal: opens a single issue the first
      # time total > 0, never re-opens, never alarms, never fails the run.
      - name: Solvador registry watch (one-shot signal when it goes non-empty)
        if: always()
        continue-on-error: true
        run: |
          TOTAL=$(curl -s --max-time 15 "https://api.solvador.com/discovery/resources?limit=1" | jq -r '.pagination.total // 0' 2>/dev/null || echo 0)
          echo "solvador registry total: $TOTAL"
          [ "$TOTAL" -gt 0 ] 2>/dev/null || exit 0
          TITLE="Solvador x402 registry is live (sellers detected)"
          ANY=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          [ -n "$ANY" ] && exit 0
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Solvador's discovery registry (https://api.solvador.com/discovery/resources) now reports $TOTAL resource(s) — it was empty when the watch was added (2026-07-21). Their facilitator uniquely covers Optimism, Unichain, World Chain, Linea, NEAR, and XRPL, so this registry is the discovery home for sellers on those chains. Action: add it to DISCOVERY_SOURCES in src/x402-index.js (same shape as the PayAI entry: paginate + synthesizeTools + strict) and consider the Tier 2 facilitator key (see the x402-chain-expansion-research memory)."

      - name: Alert (open issue) or clear (close issue)
        run: |
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Heartbeat: production DOWN"' --json number --jq '.[0].number // empty')
          if [ "${{ steps.probe.outputs.status }}" = "down" ]; then
            BODY="Heartbeat failed 3 consecutive probes (checks:${{ steps.probe.outputs.fails }}).
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Railway dashboard: https://railway.app — check the agent402 service. Re-deploy with a [deploy] commit or the deploy workflow_dispatch."
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still down at $(date -u +%FT%TZ).${{ steps.probe.outputs.fails }}"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Heartbeat: production DOWN" --body "$BODY"
            fi
            exit 1
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: all probes passing at $(date -u +%FT%TZ)."
          fi

      # GitHub delivers this workflow's "*/15" schedule roughly ONCE AN HOUR
      # (measured 2026-07-27: gaps of 60-72 min, plus one 3.3h stall), while
      # /status marks these components stale after 45 minutes. The result was a
      # page reporting "degraded" while production was perfectly healthy -- the
      # exact threshold-vs-cadence mismatch src/status.js warns about.
      #
      # The honest fix is more observations, not a looser alarm, so spread
      # further real probes across the rest of the hour. This runs LAST on
      # purpose: the authoritative probe and every issue open/close above have
      # already completed, so nothing that can page is delayed by it. A failure
      # here is recorded like any other observation and never fails the run.
      - name: Keep status observations fresh until the next run
        if: always()
        continue-on-error: true
        env:
          POW_SECRET: ${{ secrets.POW_SECRET }}
          ROBINHOOD_FACILITATOR_URL: ${{ secrets.ROBINHOOD_FACILITATOR_URL }}
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          # Narrow credential for POST /api/status/probe; falls back to OP_TOKEN.
          PROBE_TOKEN: ${{ secrets.STATUS_PROBE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$OP_TOKEN" ] || { echo "no operator token - skipping freshness loop"; exit 0; }
          . scripts/heartbeat-probe.sh
          for i in 1 2 3 4; do
            sleep 720
            if probe; then
              echo "refresh $i: healthy"
              record_observation up ""
            else
              echo "refresh $i: FAILS=$FAILS"
              record_observation down "$FAILS"
            fi
          done
