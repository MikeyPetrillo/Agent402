name: Heartbeat

# Production telemetry, fully automated:
#   • every 15 min — is agent402.tools actually serving? (health, catalog,
#     a real proof-of-work paid call, the MCP connector). Persistent failure
#     opens a GitHub issue; recovery closes it.
#
# Revenue tracking lives elsewhere now — the /__operator dashboard, /api/stats,
# and on-chain history at https://basescan.org/address/0xaBF4FAbd7c416fB67202E5f9002389Fc75e2a9D0#tokentxns
# are the canonical sources. The old "external customer payments" issue-comment
# loop was useful as a first-customer alarm but doesn't scale — every new buy
# became a new comment on one issue, which becomes unreadable at volume.
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - "main"
      - "claude/sweet-brown-i99jl3"
    paths:
      - ".github/trigger-heartbeat"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  PROD: https://agent402.tools

jobs:
  health:
    runs-on: ubuntu-latest
    # Raised for the freshness loop in the final step (4 x 12 min of extra
    # observations). Everything that can page has already run by then.
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Probe production (3 attempts before declaring an outage)
        id: probe
        env:
          # Needed so the probe can mint the same X-Heartbeat-Token the server
          # verifies — keeps internal probe traffic out of the external PoW rail
          # on the operator dashboard. Without it the probe still works but its
          # successful PoW call is counted as real external demand.
          POW_SECRET: ${{ secrets.POW_SECRET }}
          # Presence of this secret is the "operator intends the Robinhood/USDG
          # rail" signal — the rails check below only requires eip155:4663 in
          # the live 402 accepts when it is set, so intentionally disabling the
          # rail (removing the secret) never pages.
          ROBINHOOD_FACILITATOR_URL: ${{ secrets.ROBINHOOD_FACILITATOR_URL }}
        run: |
          . scripts/heartbeat-probe.sh
          for attempt in 1 2 3; do
            if probe; then echo "status=up" >> "$GITHUB_OUTPUT"; echo "production healthy (attempt $attempt)"; exit 0; fi
            echo "attempt $attempt failed:$FAILS — retrying in 60s"
            sleep 60
          done
          echo "status=down" >> "$GITHUB_OUTPUT"
          echo "fails=$FAILS" >> "$GITHUB_OUTPUT"

      # Record what this probe observed, so /status can show availability
      # measured from OUTSIDE production rather than production's opinion of
      # itself. Best-effort by design: never `-e`-fails the job, because a
      # status-page write must not turn a healthy heartbeat red. When prod is
      # down this POST cannot land either — that absence is the evidence, and
      # /status renders a missing observation as a gap rather than as uptime.
      - name: Record the probe on /status
        if: always()
        continue-on-error: true
        env:
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          STATUS: ${{ steps.probe.outputs.status }}
          FAILS: ${{ steps.probe.outputs.fails }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          . scripts/heartbeat-probe.sh
          record_observation "$STATUS" "$FAILS"

      # Gateway credits: /v1 tiers settle the buyer's USDC before the handler
      # runs, so an empty OpenRouter balance turns every gateway call into
      # "charged but failed". Alarm on "low" BEFORE that happens. Separate
      # issue from "production DOWN" (prod is serving fine); never fails the
      # heartbeat run itself, and "unknown"/"unconfigured" never page.
      - name: Gateway credits check (alarm on low OpenRouter balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
          echo "gateway credits: $STATUS"
          TITLE="Gateway credits LOW (OpenRouter)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The OpenRouter balance behind the /v1 gateway is below the low-water mark (OPENROUTER_LOW_CREDITS_USD, default \$5). Paid gateway calls settle BEFORE the upstream call, so an empty balance charges buyers for 503s. Top up: https://openrouter.ai/settings/credits (USDC accepted; auto-top-up available)."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Canary burner balance watch — the 2026-07-27 lesson: the Base burner
      # hit $0.000 mid-sweep, the canary filed it as a settlement outage, and
      # the public status page said OUTAGE while buyers settled fine. The
      # canary now classifies that correctly, but the better outcome is never
      # getting there: warn while there is still a week of runway. Public RPC,
      # no keys; unreadable balance warns loudly rather than silently passing.
      - name: Canary burner balance watch (Base USDC)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BURNER: "0x902dCf34E53695bDEA2fFB354b1a2e58bD598256"
          WARN_USD: ${{ vars.CANARY_BURNER_LOW_USD || '1' }}
        run: |
          DATA="0x70a08231000000000000000000000000${BURNER#0x}"
          BAL=$(curl -s --max-time 15 https://mainnet.base.org -H 'Content-Type: application/json'             -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_call\",\"params\":[{\"to\":\"0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913\",\"data\":\"$DATA\"},\"latest\"]}"             | jq -re '.result' 2>/dev/null) || { echo "::warning::burner balance UNREADABLE — not silently skipping, investigate"; exit 0; }
          USD=$(node -e "console.log((parseInt('$BAL',16)/1e6).toFixed(4))")
          echo "canary burner Base USDC: \$$USD (warn under \$$WARN_USD)"
          TITLE="Canary burner LOW (Base)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          LOW=$(node -e "console.log($USD < $WARN_USD ? 1 : 0)")
          if [ "$LOW" = "1" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The paid canary's Base burner ($BURNER) is at \$$USD USDC, under the \$$WARN_USD low-water mark (repo var CANARY_BURNER_LOW_USD). The daily tools sweep spends ~\$0.15-0.30/run; top up before it runs dry — an empty burner now files as a funding issue rather than an outage, but a funded one is better."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low: \$$USD at $(date -u +%FT%TZ)."
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: \$$USD on Base at $(date -u +%FT%TZ)."
          fi

      # PayAI settlement quota watch — PayAI is the PRIMARY facilitator for
      # Solana/Polygon/Arbitrum/Avalanche (free tier: 10k settlements/month).
      # Solana is our #2 revenue chain, so hitting the cap silently would be
      # the CDP-billing-gate incident class all over again: PayAI rejects
      # settles and a top rail goes dark. Counted from the on-chain ledger
      # (/api/revenue/daily, ext+int — the canary consumes quota too); this is
      # a LOWER bound since rejected settles may also meter. Same issue
      # open/close pattern as the gateway-credits alarm. A missing/unparseable
      # field is logged LOUDLY and never silently treated as "fine" — a silent
      # skip is exactly what kept the charged-failure alarm dead for months.
      - name: PayAI settlement quota watch (10k/month free tier)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          THRESH: ${{ vars.PAYAI_QUOTA_WARN || 8000 }}
        run: |
          CUT=$(date -u -d '30 days ago' +%F)
          COUNT=$(curl -s --max-time 20 "$PROD/api/revenue/daily" | jq -e --arg cut "$CUT"             '[.days[] | select(.day >= $cut) | select(.chain=="solana" or .chain=="polygon" or .chain=="arbitrum" or .chain=="avalanche") | (.extTx + .intTx)] | add // 0')             || { echo "::warning::PayAI quota watch UNREADABLE — /api/revenue/daily missing or unparseable. NOT skipping silently: investigate."; exit 0; }
          echo "PayAI-chain settles, rolling 30d: $COUNT / 10000 (warn at $THRESH)"
          TITLE="PayAI settlement quota HIGH"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$COUNT" -ge "$THRESH" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Rolling 30-day settlements on PayAI-settled chains (Solana/Polygon/Arbitrum/Avalanche) reached $COUNT of the 10,000/month free tier (warn threshold $THRESH). If the cap is hit, PayAI rejects settles and those rails go dark — the settle-fallback chain (Solvador) catches clean rejections, but the durable fixes are PAYAI_API_KEY_ID/SECRET (authenticated tier, merchant.payai.network) or shifting canary volume. Count is on-chain settles (ext+int) from /api/revenue/daily — a lower bound, rejected settles may also meter."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still high: $COUNT / 10000 at $(date -u +%FT%TZ)."
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: rolling 30-day count back to $COUNT (below $THRESH) at $(date -u +%FT%TZ)."
          fi

      # x402 spending-wallet check — same pattern as gateway credits above:
      # when the upstream buyer wallet (blockscout-kit) runs dry the tools go
      # dark quietly (502s, buyers never charged), so alarm on "low" first.
      # "unknown"/"unconfigured" never page.
      - name: Upstream buyer wallet check (alarm on low x402 spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyer.status // "unknown"' 2>/dev/null || echo unknown)
          echo "upstream buyer wallet: $STATUS"
          TITLE="Upstream buyer wallet LOW (x402)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The x402 upstream spending wallet (X402_UPSTREAM_BUYER_KEY) behind the blockscout-kit tools is below the low-water mark (UPSTREAM_BUYER_LOW_USD, default \$0.50). When it empties, contract-inspect/address-profile fail 502 (buyers are never charged, but the tools go dark). Top up: send USDC on Base to the upstream buyer address (see CLAUDE.md env docs)."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Algorand spending-wallet check — same pattern as the Base wallet above:
      # this wallet pays external Algorand sellers for the SOR (route-execute
      # settles to the TREASURY during the challenge window, so the float is a
      # one-way drain until self-funding flips on post-October). optedIn:false
      # also buckets as "low" — an un-opted-in wallet can't pay at all.
      # "unknown"/"unconfigured" never page.
      - name: Algorand upstream buyer wallet check (alarm on low AVM spending balance)
        if: always()
        continue-on-error: true
        run: |
          STATUS=$(curl -s --max-time 15 "$PROD/api/gateway-status" | jq -r '.upstreamBuyerAvm.status // "unknown"' 2>/dev/null || echo unknown)
          echo "algorand upstream buyer wallet: $STATUS"
          TITLE="Algorand upstream buyer wallet LOW (x402)"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$STATUS" = "low" ]; then
            if [ -z "$OPEN" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "The Algorand x402 spending wallet (ALGORAND_UPSTREAM_BUYER_MNEMONIC) behind the SOR's Algorand external routing is below the low-water mark (ALGORAND_UPSTREAM_BUYER_LOW_USD, default \$0.50) — or not yet opted in to USDC ASA 31566704 (check /api/gateway-status upstreamBuyerAvm.optedIn). When it empties, Algorand external routing fails 502 (buyers are never charged, but the path goes dark). Top up: send USDC on Algorand to the AVM spending wallet address (see CLAUDE.md env docs)."
            else
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still low at $(date -u +%FT%TZ)."
            fi
          elif [ "$STATUS" = "ok" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: balance back above the low-water mark at $(date -u +%FT%TZ)."
          fi

      # Solvador registry watch — their /discovery/resources speaks the
      # standard Bazaar shape but is EMPTY (total: 0, probed 2026-07-21). The
      # day it fills, it becomes the only discovery home for x402 sellers on
      # Optimism/Unichain/World Chain/Linea, and we want to be the first
      # aggregator to ingest it (one-line DISCOVERY_SOURCES entry, PayAI
      # shape). One-shot informational signal: opens a single issue the first
      # time total > 0, never re-opens, never alarms, never fails the run.
      - name: Solvador registry watch (one-shot signal when it goes non-empty)
        if: always()
        continue-on-error: true
        run: |
          TOTAL=$(curl -s --max-time 15 "https://api.solvador.com/discovery/resources?limit=1" | jq -r '.pagination.total // 0' 2>/dev/null || echo 0)
          echo "solvador registry total: $TOTAL"
          [ "$TOTAL" -gt 0 ] 2>/dev/null || exit 0
          TITLE="Solvador x402 registry is live (sellers detected)"
          ANY=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          [ -n "$ANY" ] && exit 0
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "Solvador's discovery registry (https://api.solvador.com/discovery/resources) now reports $TOTAL resource(s) — it was empty when the watch was added (2026-07-21). Their facilitator uniquely covers Optimism, Unichain, World Chain, Linea, NEAR, and XRPL, so this registry is the discovery home for sellers on those chains. Action: add it to DISCOVERY_SOURCES in src/x402-index.js (same shape as the PayAI entry: paginate + synthesizeTools + strict) and consider the Tier 2 facilitator key (see the x402-chain-expansion-research memory)."

      - name: Alert (open issue) or clear (close issue)
        run: |
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Heartbeat: production DOWN"' --json number --jq '.[0].number // empty')
          if [ "${{ steps.probe.outputs.status }}" = "down" ]; then
            BODY="Heartbeat failed 3 consecutive probes (checks:${{ steps.probe.outputs.fails }}).
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Railway dashboard: https://railway.app — check the agent402 service. Re-deploy with a [deploy] commit or the deploy workflow_dispatch."
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Still down at $(date -u +%FT%TZ).${{ steps.probe.outputs.fails }}"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Heartbeat: production DOWN" --body "$BODY"
            fi
            exit 1
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Recovered: all probes passing at $(date -u +%FT%TZ)."
          fi

      # GitHub delivers this workflow's "*/15" schedule roughly ONCE AN HOUR
      # (measured 2026-07-27: gaps of 60-72 min, plus one 3.3h stall), while
      # /status marks these components stale after 45 minutes. The result was a
      # page reporting "degraded" while production was perfectly healthy -- the
      # exact threshold-vs-cadence mismatch src/status.js warns about.
      #
      # The honest fix is more observations, not a looser alarm, so spread
      # further real probes across the rest of the hour. This runs LAST on
      # purpose: the authoritative probe and every issue open/close above have
      # already completed, so nothing that can page is delayed by it. A failure
      # here is recorded like any other observation and never fails the run.
      - name: Keep status observations fresh until the next run
        if: always()
        continue-on-error: true
        env:
          POW_SECRET: ${{ secrets.POW_SECRET }}
          ROBINHOOD_FACILITATOR_URL: ${{ secrets.ROBINHOOD_FACILITATOR_URL }}
          OP_TOKEN: ${{ secrets.AGENT402_OPERATOR_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$OP_TOKEN" ] || { echo "no operator token - skipping freshness loop"; exit 0; }
          . scripts/heartbeat-probe.sh
          for i in 1 2 3 4; do
            sleep 720
            if probe; then
              echo "refresh $i: healthy"
              record_observation up ""
            else
              echo "refresh $i: FAILS=$FAILS"
              record_observation down "$FAILS"
            fi
          done
